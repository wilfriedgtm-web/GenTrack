<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenTrack — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
:root{
  --bx:#8B1A2E;--bx-pale:rgba(139,26,46,0.07);--bx-mid:rgba(139,26,46,0.15);
  --or:#C9A96E;--or-pale:rgba(201,169,110,0.10);
  --surface:#FDFAF5;--surface2:#F5EFE6;--surface3:#EDE3D4;
  --bordure:#DDD0BC;--texte:#2C1810;--texte2:#7A6855;--texte3:#B5A090;
  --vert:#2D7A4F;--vert-pale:rgba(45,122,79,0.08);
  --rouge:#C0392B;--rouge-pale:rgba(192,57,43,0.07);--rouge-bordure:rgba(192,57,43,0.25);
  --orange:#D4761E;--orange-pale:rgba(212,118,30,0.07);--orange-bordure:rgba(212,118,30,0.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--surface);color:var(--texte);font-family:'Inter',sans-serif;min-height:100vh}
.header{background:var(--bx);color:white}
.header-top{display:flex;justify-content:space-between;align-items:center;padding:20px 36px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.logo-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-top:2px}
.header-right{text-align:right}
.header-date{font-size:11px;color:rgba(255,255,255,0.5)}
.header-title{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--or);margin-top:3px}
.site-nav{background:rgba(0,0,0,0.2);padding:0 36px;display:flex;overflow-x:auto}
.site-btn{padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:rgba(255,255,255,0.5);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.site-btn.active{color:white;border-bottom-color:var(--or)}
.container{max-width:960px;margin:0 auto;padding:28px 36px 60px}

/* ALERT BANNER */
.alert-banner{background:var(--rouge-pale);border:1px solid var(--rouge-bordure);border-left:3px solid var(--rouge);border-radius:6px;padding:12px 16px;display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.alert-banner.warn{background:var(--orange-pale);border-color:var(--orange-bordure);border-left-color:var(--orange)}
.ab-body{flex:1}
.ab-titre{font-size:13px;font-weight:600;color:var(--rouge)}
.alert-banner.warn .ab-titre{color:var(--orange)}
.ab-sub{font-size:12px;color:var(--texte2);margin-top:2px}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.kpi{background:white;border:1px solid var(--bordure);border-radius:6px;padding:14px 16px}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--texte2);font-weight:600;margin-bottom:6px}
.kpi-value{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--texte);line-height:1}
.kpi-trend{font-size:11px;color:var(--texte2);margin-top:5px}

/* SECTION */
.section-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600}
.section-count{font-size:11px;color:var(--texte2)}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--texte2);font-weight:600;margin-bottom:10px}

/* EQUIP CARDS */
.equip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
.equip-card{background:white;border:1px solid var(--bordure);border-radius:6px;overflow:hidden}
.equip-card-header{padding:12px 14px;border-bottom:1px solid var(--surface3);display:flex;align-items:center;gap:10px;background:var(--surface2);cursor:pointer}
.equip-icon{width:32px;height:32px;background:var(--bx-pale);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.equip-name{font-size:13px;font-weight:600;color:var(--texte);flex:1}
.equip-sub{font-size:11px;color:var(--texte2);margin-top:1px}
.equip-chev{color:var(--texte3);font-size:11px;flex-shrink:0;transition:transform 0.2s}
.equip-card.open .equip-chev{transform:rotate(180deg)}
.equip-body{padding:12px 14px}
.equip-stat{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--surface3)}
.equip-stat:last-child{border-bottom:none}
.equip-stat-label{color:var(--texte2)}
.equip-stat-val{font-weight:600;color:var(--texte)}
.equip-drill{display:none;border-top:1px solid var(--surface3)}
.equip-card.open .equip-drill{display:block}
.drill-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--surface3)}
.drill-row:last-child{border-bottom:none}
.drill-nom{font-size:12px;font-weight:600}
.drill-meta{font-size:11px;color:var(--texte2);margin-top:2px}

/* PILL */
.pill{padding:3px 9px;border-radius:2px;font-size:10px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;display:inline-block}
.pill-ok{background:var(--vert-pale);color:var(--vert)}
.pill-warn{background:var(--orange-pale);color:var(--orange)}
.pill-danger{background:var(--rouge-pale);color:var(--rouge)}

/* CUVE CARD */
.cuve-card{background:white;border:1px solid var(--bordure);border-top:3px solid var(--or);border-radius:6px;padding:16px;margin-bottom:24px}
.cuve-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.cuve-title{font-size:14px;font-weight:600}
.cuve-sub{font-size:11px;color:var(--texte2);margin-top:3px}
.auto-val{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1;text-align:right}
.auto-unit{font-size:11px;color:var(--texte2);margin-top:2px;text-align:right}
.cuve-bar{height:7px;background:var(--surface3);border-radius:4px;margin:8px 0;overflow:hidden}
.cuve-bar-fill{height:100%;border-radius:4px}
.cuve-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--texte2);margin-bottom:10px}
.cuve-meta strong{color:var(--texte)}
.ge-chips{display:flex;gap:6px;flex-wrap:wrap}
.ge-chip{padding:4px 10px;border-radius:3px;font-size:11px;font-weight:600;border:1px solid var(--bordure);background:var(--surface2);color:var(--texte2)}
.ge-chip.actif{border-color:rgba(45,122,79,0.35);background:var(--vert-pale);color:var(--vert)}
.cuve-note{font-size:11px;color:var(--texte3);margin-top:10px;padding-top:10px;border-top:1px solid var(--surface3);font-style:italic}

/* PANNES */
.panne-open{background:var(--rouge-pale);border:1px solid var(--rouge-bordure);border-radius:6px;padding:14px;margin-bottom:8px}
.panne-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.panne-nom{font-size:13px;font-weight:600;flex:1}
.panne-dt{font-size:11px;color:var(--texte3)}
.panne-desc{font-size:12px;color:var(--texte2);margin-bottom:10px}
.panne-ftr{display:flex;justify-content:space-between;align-items:center}
.panne-cout{font-size:11px;color:var(--texte2)}
.resolve-btn{background:var(--vert);color:white;border:none;padding:6px 14px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer}

/* TABLES */
.table-card{border:1px solid var(--bordure);border-radius:6px;overflow:hidden;background:white;margin-bottom:10px}
.table-hdr{padding:10px 14px;border-bottom:1px solid var(--bordure);background:var(--surface2);display:flex;justify-content:space-between;align-items:center}
.table-hdr-title{font-size:13px;font-weight:600}
.table-hdr-sub{font-size:11px;color:var(--texte2)}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th{text-align:left;padding:8px 12px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--texte2);border-bottom:1px solid var(--bordure);background:var(--surface2);font-weight:600}
table.data td{padding:8px 12px;border-bottom:1px solid var(--surface3);color:var(--texte)}
table.data tr:last-child td{border-bottom:none}
table.data tr:hover td{background:var(--surface2)}

/* CHART */
.chart-card{border:1px solid var(--bordure);border-radius:6px;overflow:hidden;background:white;margin-bottom:18px}
.chart-hdr{padding:11px 14px;border-bottom:1px solid var(--bordure);display:flex;justify-content:space-between;align-items:center;background:var(--surface2)}
.chart-hdr-title{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600}
.chart-body{padding:14px}
.chart-insight{margin-top:8px;padding-top:8px;border-top:1px solid var(--surface3);font-size:11px;color:var(--texte2)}

/* SAISIES TOGGLE */
.saisies-toggle{width:100%;text-align:left;background:var(--surface2);border:1px solid var(--bordure);border-radius:6px;padding:12px 16px;font-size:12px;font-weight:600;color:var(--texte2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.saisies-body{display:none}
.saisies-body.open{display:block}

/* VUE CONSOLIDÉE */
.site-card{border:1px solid var(--bordure);border-radius:6px;background:white;margin-bottom:10px;overflow:hidden;cursor:pointer}
.site-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.sc-hdr{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-bottom:1px solid var(--bordure)}
.sc-nom{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600}
.sc-sub{font-size:11px;color:var(--texte2);margin-top:2px}
.sc-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.sc-kpi{padding:12px 16px;border-right:1px solid var(--bordure);text-align:center}
.sc-kpi:last-child{border-right:none}
.sc-kpi-val{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600}
.sc-kpi-label{font-size:10px;color:var(--texte2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.sc-detail{display:none;padding:16px;border-top:1px solid var(--bordure)}
.sc-detail.open{display:block}

/* MISC */
.footer{background:var(--bx);color:rgba(255,255,255,0.4);text-align:center;padding:16px;font-size:11px;letter-spacing:1px;margin-top:40px}
.footer strong{color:var(--or)}
.loading{padding:40px;text-align:center;color:var(--texte2);font-size:13px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--bordure);border-top-color:var(--bx);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:24px;text-align:center;color:var(--texte2);font-size:12px}
.error-page{max-width:400px;margin:80px auto;text-align:center;padding:40px}
.error-page h2{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:12px}
.error-page p{font-size:13px;color:var(--texte2);line-height:1.6}
@media(max-width:700px){.container{padding:16px}.kpi-grid{grid-template-columns:1fr 1fr}.equip-grid{grid-template-columns:1fr}.header-top{padding:14px 16px}.sc-kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="loading" style="padding:80px"><span class="spinner"></span>Chargement...</div></div>
<script>
var SUPA_URL = 'https://zbpoxjlkqxnqjzxohasq.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicG94amxrcXhucWp6eG9oYXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjM3ODAsImV4cCI6MjA5NzA5OTc4MH0.9-QyWgon93jGDo5QKMIh_-QbQZ_P9rQrYJnVxegJe7M';
var _chartInst = null;

function api(table, q) {
  if (!q) q = '';
  return fetch(SUPA_URL + '/rest/v1/' + table + '?select=*' + q, {
    headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY}
  }).then(function(r) { return r.ok ? r.json() : []; });
}

function fmtNum(n) { return Math.round(n || 0).toLocaleString('fr-FR'); }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateShort(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('fr-FR', {day:'2-digit',month:'short'}); }
function fmtHeure(d) { if (!d) return ''; return new Date(d).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit',timeZone:'Africa/Dakar'}); }
function carbColor(n) { return n < 25 ? 'var(--rouge)' : n < 50 ? 'var(--orange)' : 'var(--vert)'; }
function autoColor(j) { return j < 2 ? 'var(--rouge)' : j < 5 ? 'var(--orange)' : 'var(--vert)'; }
function huileColor(h) { return h === 'critique' ? 'var(--rouge)' : h === 'bas' ? 'var(--orange)' : 'var(--vert)'; }

function retardLabel(date, today) {
  if (!date) return {label: 'Aucune saisie', color: 'var(--rouge)', jours: null};
  var j = Math.round((new Date(today) - new Date(date)) / 86400000);
  if (j === 0) return {label: "Saisi aujourd'hui", color: 'var(--vert)', jours: 0};
  if (j === 1) return {label: 'Saisi hier', color: 'var(--orange)', jours: 1};
  return {label: 'Saisi il y a ' + j + ' jours', color: 'var(--rouge)', jours: j};
}

function applyBrandColor(hex) {
  if (!hex) return;
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  document.documentElement.style.setProperty('--bx', hex);
  document.documentElement.style.setProperty('--bx-pale', 'rgba('+r+','+g+','+b+',0.07)');
  document.documentElement.style.setProperty('--bx-mid', 'rgba('+r+','+g+','+b+',0.15)');
}

function showError(titre, msg) {
  document.getElementById('app').innerHTML = '<div class="error-page"><div style="font-size:48px;margin-bottom:20px">&#128274;</div><h2>'+titre+'</h2><p>'+msg+'</p></div>';
}

// ── ROUTING ──
function init() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token'), clientId = params.get('id');
  if (token) loadByToken(token);
  else if (clientId) loadClientView(clientId, {});
  else showError('Lien invalide', "Ce lien ne contient pas d'identifiant valide.");
}

function loadByToken(token) {
  api('tokens', '&token=eq.' + token + '&actif=eq.true').then(function(rows) {
    if (!rows.length) { showError('Lien expiré', "Ce lien n'est plus valide."); return; }
    var tok = rows[0];
    if (tok.expire_at && new Date(tok.expire_at) < new Date()) { showError('Lien expiré', "Ce lien a expiré."); return; }
    var role = tok.role || null;
    var raw = tok.site_ids || [];
    var siteIds = typeof raw === 'string' ? JSON.parse(raw || '[]') : raw;
    if (role === 'dir_ops') { loadClientView(tok.client_id, {role:'dir_ops'}); }
    else if (role === 'dir_tech') { loadClientView(tok.client_id, {role:'dir_tech', siteIds:siteIds}); }
    else if (role === 'resp_tech') { var s=siteIds.length?siteIds[0]:(tok.site_id||null); loadSiteView(tok.client_id, s, {role:'resp_tech'}); }
    else if (role === 'tech' || role === 'technicien') { var s2=siteIds.length?siteIds[0]:(tok.site_id||null); loadSiteView(tok.client_id, s2, {role:'technicien'}); }
    else if (tok.site_id) { loadSiteView(tok.client_id, tok.site_id, {role:'technicien'}); }
    else { loadClientView(tok.client_id, {}); }
  });
}

function loadClientView(clientId, access) {
  if (!access) access = {};
  api('clients', '&id=eq.' + clientId).then(function(clients) {
    if (!clients.length) { showError('Client introuvable', ''); return; }
    var client = clients[0];
    applyBrandColor(client.couleur_marque);
    api('sites', '&client_id=eq.' + clientId + '&actif=eq.true&order=nom').then(function(sites) {
      if (access.role === 'dir_tech' && access.siteIds && access.siteIds.length)
        sites = sites.filter(function(s) { return access.siteIds.indexOf(s.id) >= 0; });
      if (sites.length > 1 && (access.role === 'dir_ops' || access.role === 'dir_tech')) {
        renderGroupeView(client, sites, access.role === 'dir_ops');
      } else {
        var siteId = sites.length ? sites[0].id : null;
        var siteNom = sites.length ? sites[0].nom : null;
        renderHotelView(client, siteId, siteNom, {role: access.role || 'resp_tech'}, null);
      }
    });
  });
}

function loadSiteView(clientId, siteId, access) {
  if (!access) access = {};
  api('clients', '&id=eq.' + clientId).then(function(clients) {
    if (!clients.length) { showError('Client introuvable', ''); return; }
    var client = clients[0];
    applyBrandColor(client.couleur_marque);
    if (siteId) {
      api('sites', '&id=eq.' + siteId).then(function(sites) {
        var siteNom = sites.length ? sites[0].nom : null;
        renderHotelView(client, siteId, siteNom, {role: access.role || 'technicien'}, null);
      });
    } else {
      renderHotelView(client, null, null, {role: access.role || 'technicien'}, null);
    }
  });
}

// ════════════════════════════════════════
// VUE HÔTEL — single scroll page
// ════════════════════════════════════════
function renderHotelView(client, siteId, siteName, opts, containerId) {
  if (!opts) opts = {};
  var role = opts.role || 'resp_tech';
  var showFull = role !== 'technicien';
  var rootEl = containerId ? document.getElementById(containerId) : document.getElementById('app');
  if (!rootEl) return;
  rootEl.innerHTML = '<div class="loading" style="padding:60px"><span class="spinner"></span>Chargement...</div>';

  var now = new Date();
  var today = now.toISOString().split('T')[0];
  var debut30 = new Date(Date.now() - 30*86400000).toISOString().split('T')[0];
  var debutAnnee = new Date(now.getFullYear(), 0, 1).toISOString().split('T')[0];

  Promise.all([
    api('groupes', '&client_id=eq.' + client.id + (siteId ? '&site_id=eq.' + siteId : '') + '&actif=eq.true&order=nom'),
    api('saisies', '&client_id=eq.' + client.id + '&date=gte.' + debut30 + '&order=date.desc,created_at.desc&limit=200'),
    api('alertes', '&client_id=eq.' + client.id + '&resolue=eq.false'),
    api('pannes',  '&client_id=eq.' + client.id + '&resolue=eq.false&order=date_panne.desc'),
    showFull ? api('pannes', '&client_id=eq.' + client.id + '&resolue=eq.true&order=date_resolution.desc&limit=20') : Promise.resolve([]),
    api('cuves',   '&client_id=eq.' + client.id + (siteId ? '&site_id=eq.' + siteId : '') + '&actif=eq.true')
  ]).then(function(res) {
    var groupes=res[0], saisies30=res[1], alertes=res[2], pannesOuv=res[3], pannesRes=res[4], cuves=res[5];

    var dernSaisie = {};
    saisies30.forEach(function(s) { if (!dernSaisie[s.groupe_id]) dernSaisie[s.groupe_id] = s; });
    var saisiesJour = []; for (var k in dernSaisie) saisiesJour.push(dernSaisie[k]);

    var cuve = cuves.length ? cuves[0] : null;
    var fCuve30 = cuve ? api('saisies_cuve', '&cuve_id=eq.'+cuve.id+'&date=gte.'+debut30+'&order=date.desc,created_at.desc') : Promise.resolve([]);
    var fCuveAn = cuve && showFull ? api('saisies_cuve', '&cuve_id=eq.'+cuve.id+'&date=gte.'+debutAnnee) : Promise.resolve([]);

    Promise.all([fCuve30, fCuveAn]).then(function(cr) {
      var sCuve30=cr[0], sCuveAn=cr[1];
      var saisieCuve = sCuve30.length ? sCuve30[0] : null;
      var ravits = sCuve30.filter(function(s){ return (s.litres_ajoutes||0) > 0; });

      var prixLitre = client.prix_litre_fcfa || 695;
      var litres30 = ravits.reduce(function(a,s){return a+(s.litres_ajoutes||0);},0);
      var coutCarb30 = Math.round(litres30 * prixLitre);
      var coutMaint = showFull ? pannesRes.filter(function(p){return p.date_resolution>=debut30;}).reduce(function(a,p){return a+(p.cout_reparation||0);},0) : 0;

      var capCuve = cuve ? (cuve.capacite_litres||500) : 500;
      var niveauCuve = saisieCuve ? saisieCuve.niveau_litres : null;
      var pctCuve = niveauCuve!=null ? Math.round(niveauCuve/capCuve*100) : null;
      var consoLh = (groupes.length && groupes[0].conso_theorique_lh) ? parseFloat(groupes[0].conso_theorique_lh) : 65;
      var autoJours = niveauCuve!=null ? Math.round((niveauCuve/(consoLh*8))*10)/10 : null;

      var groupeMap = {}; groupes.forEach(function(g){ groupeMap[g.id]=g.nom; });
      var panneLabels = {ne_demarre_pas:'Ne démarre pas',arret_inopin:'Arrêt inopiné',bruit_anormal:'Bruit anormal',surchauffe:'Surchauffe',fuite:'Fuite carburant',autre:'Autre'};

      // Nom affiché
      var nom = siteName || client.nom;
      var dateStr = now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      var roleLabel = role==='resp_tech'?'Responsable technique':role==='dir_ops'?'Directeur des opérations':role==='dir_tech'?'Directeur technique':'Technicien';

      // Saisies OK aujourd'hui
      var saisiesOkCount = 0;
      groupes.forEach(function(g) {
        var s=null; for(var i=0;i<saisiesJour.length;i++){if(saisiesJour[i].groupe_id===g.id){s=saisiesJour[i];break;}}
        if (s && retardLabel(s.date, today).jours === 0) saisiesOkCount++;
      });

      // BANNIÈRE urgences
      var urgences = [];
      if (autoJours!==null && autoJours<3) urgences.push('Autonomie cuve critique ('+autoJours+'j)');
      pannesOuv.forEach(function(p){ urgences.push('Panne : '+(groupeMap[p.groupe_id]||'équipement')); });
      alertes.filter(function(a){return a.severite==='danger';}).forEach(function(a){ urgences.push(a.message); });
      var bannerHtml = '';
      if (urgences.length) {
        bannerHtml = '<div class="alert-banner"><div class="ab-body">' +
          '<div class="ab-titre">'+(urgences.length===1?'1 action requise':urgences.length+' actions requises')+'</div>' +
          '<div class="ab-sub">'+urgences.join(' · ')+'</div></div></div>';
      }

      // KPI couleurs
      var kSaisieColor = saisiesOkCount===groupes.length?'var(--vert)':saisiesOkCount>0?'var(--orange)':'var(--rouge)';
      var kAutoColor = autoJours!=null?autoColor(autoJours):'var(--texte2)';
      var kPanneColor = pannesOuv.length?'var(--rouge)':'var(--vert)';
      var kPanneTrend = showFull ? (pannesRes.length+' résolue'+(pannesRes.length>1?'s':'')+' · '+fmtNum(coutMaint)+' F') : (pannesOuv.length?'action requise':'OK');
      var kAutoTrend = pctCuve!=null?(pctCuve+'% · '+fmtNum(niveauCuve||0)+'L'):'Pas de relevé';

      // ÉQUIPEMENTS CARDS
      var equipHtml = buildEquipCards(groupes, saisiesJour, saisies30, pannesOuv, today);

      // CUVE CARD
      var cuveHtml = buildCuveCard(cuve, saisieCuve, niveauCuve, pctCuve, capCuve, autoJours, consoLh, groupes, saisiesJour, today);

      // PANNES
      var pannesHtml = buildPannesSection(pannesOuv, showFull?pannesRes:[], groupes, groupeMap, panneLabels, showFull);

      // RAVITS
      var ravitHtml = (showFull && ravits.length) ? buildRavitsSection(ravits, litres30, coutCarb30, prixLitre) : '';

      // SAISIES LOG
      var saisiesLogHtml = buildSaisiesLog(saisies30, groupeMap);

      // CHART DATA
      var dates14 = [];
      for (var di=0;di<14;di++){var dd=new Date();dd.setDate(dd.getDate()-(13-di));dates14.push(dd.toISOString().split('T')[0]);}
      var carbData = dates14.map(function(d){
        var sc=null; for(var i=0;i<sCuve30.length;i++){if(sCuve30[i].date===d){sc=sCuve30[i];break;}}
        return (sc&&sc.niveau_litres!=null)?Math.round(sc.niveau_litres/capCuve*100):null;
      });

      var headerHtml = containerId ? '' :
        '<div class="header"><div class="header-top"><div>' +
          '<div class="logo">'+nom+'</div>' +
          '<div class="logo-sub">'+roleLabel+'</div>' +
        '</div><div class="header-right">' +
          '<div class="header-date">'+dateStr+'</div>' +
          '<div class="header-title">Tableau de bord</div>' +
        '</div></div></div>';
      var footerHtml = containerId ? '' : '<div class="footer">Powered by <strong>GenTrack</strong> · '+nom+'</div>';

      rootEl.innerHTML = headerHtml +
        '<div class="container">' +
          bannerHtml +
          '<div class="kpi-grid">' +
            '<div class="kpi"><div class="kpi-label">Saisies aujourd\'hui</div>' +
              '<div class="kpi-value" style="color:'+kSaisieColor+'">'+saisiesOkCount+' / '+groupes.length+'</div>' +
              '<div class="kpi-trend">'+groupes.length+' groupe'+(groupes.length>1?'s':'')+'</div></div>' +
            '<div class="kpi"><div class="kpi-label">Carburant — 30j</div>' +
              '<div class="kpi-value">'+(coutCarb30>0?fmtNum(coutCarb30):'—')+'</div>' +
              '<div class="kpi-trend">'+(litres30>0?'FCFA · '+fmtNum(litres30)+'L':'Aucun ravitaillement')+'</div></div>' +
            '<div class="kpi"><div class="kpi-label">Autonomie cuve</div>' +
              '<div class="kpi-value" style="color:'+kAutoColor+'">'+(autoJours!=null?autoJours+'j':'—')+'</div>' +
              '<div class="kpi-trend">'+kAutoTrend+'</div></div>' +
            '<div class="kpi"><div class="kpi-label">Pannes en cours</div>' +
              '<div class="kpi-value" style="color:'+kPanneColor+'">'+(pannesOuv.length||'&#10003;')+'</div>' +
              '<div class="kpi-trend">'+kPanneTrend+'</div></div>' +
          '</div>' +
          '<div class="section-hdr"><div class="section-title">Equipements</div>' +
            '<div class="section-count">'+groupes.length+' unité'+(groupes.length>1?'s':'')+'</div></div>' +
          '<div class="equip-grid" style="margin-bottom:24px">'+(equipHtml||'<div class="empty">Aucun groupe configuré</div>')+'</div>' +
          cuveHtml +
          pannesHtml +
          ravitHtml +
          '<div class="chart-card"><div class="chart-hdr">' +
            '<div class="chart-hdr-title">Evolution cuve — 14 jours</div>' +
            '<div style="font-size:11px;color:var(--texte2)">'+(cuve?'Cuve '+fmtNum(capCuve)+'L':'')+'</div>' +
          '</div><div class="chart-body"><canvas id="cuve-chart" height="120"></canvas>' +
            '<div class="chart-insight" id="chart-insight"></div></div></div>' +
          saisiesLogHtml +
        '</div>' + footerHtml;

      // CHART
      setTimeout(function() {
        var ctx = document.getElementById('cuve-chart'); if (!ctx) return;
        if (_chartInst) _chartInst.destroy();
        var bx = getComputedStyle(document.documentElement).getPropertyValue('--bx').trim()||'#8B1A2E';
        var valides = carbData.filter(function(v){return v!==null;});
        var delta = valides.length>=2 ? valides[valides.length-1]-valides[0] : null;
        var trendTxt = delta===null ? 'Pas assez de données.' : delta>=0 ? 'Niveau stable ou en hausse (+'+delta+' pts).' : 'Baisse de '+Math.abs(delta)+' pts — surveiller les pleins.';
        var ins = document.getElementById('chart-insight'); if(ins) ins.textContent = trendTxt;
        _chartInst = new Chart(ctx.getContext('2d'),{
          type:'line',
          data:{labels:dates14.map(fmtDateShort),datasets:[{data:carbData,borderColor:bx,backgroundColor:bx+'15',borderWidth:1.5,tension:0.3,fill:true,spanGaps:true,pointRadius:3,pointBackgroundColor:bx}]},
          options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#EDE3D4'},ticks:{color:'#7A6855',font:{size:10}}},y:{grid:{color:'#EDE3D4'},ticks:{color:'#7A6855',font:{size:10},callback:function(v){return v+'%';}},min:0,max:100}}}
        });
      }, 80);
    });
  });
}

// ── EQUIP CARDS ──
function buildEquipCards(groupes, saisiesJour, saisies30, pannesOuv, today) {
  if (!groupes.length) return '';
  var html = '';
  groupes.forEach(function(g) {
    var s=null; for(var i=0;i<saisiesJour.length;i++){if(saisiesJour[i].groupe_id===g.id){s=saisiesJour[i];break;}}
    var rd = retardLabel(s?s.date:null, today);
    var pctV = (g.heures_total&&g.seuil_vidange_heures) ? Math.round(g.heures_total/g.seuil_vidange_heures*100) : null;
    var hasPanne = pannesOuv.some(function(p){return p.groupe_id===g.id;});
    var pillClass = hasPanne?'pill-danger':!s?'pill-warn':rd.jours===0?'pill-ok':rd.jours===1?'pill-warn':'pill-danger';
    var pillTxt = hasPanne?'Panne':!s?'Pas de saisie':rd.jours===0?'OK ✓':rd.jours===1?'Hier':'J-'+rd.jours;
    var vColor = pctV!=null?(pctV>=100?'var(--rouge)':pctV>=80?'var(--orange)':'var(--vert)'):'var(--texte2)';
    var hMarche = (s&&s.heures_marche!=null)?s.heures_marche+'h':'—';
    var huileVal = (s&&s.niveau_huile)?s.niveau_huile:'—';
    var huileCoul = huileColor(s?s.niveau_huile:null);
    var operateur = (s&&s.operateur)?s.operateur:'—';
    var saisiesG = saisies30.filter(function(x){return x.groupe_id===g.id;}).length;
    var cardId = 'ec-' + g.id.replace(/-/g,'');
    html += '<div class="equip-card open" id="'+cardId+'">' +
      '<div class="equip-card-header" onclick="toggleEquipCard(\''+cardId+'\')">' +
        '<div class="equip-icon">&#9889;</div>' +
        '<div><div class="equip-name">'+g.nom+'</div>' +
        '<div class="equip-sub">'+(g.marque||'')+' '+(g.puissance_kva||'')+'kVA · '+consoStr(g)+'</div></div>' +
        '<span class="pill '+pillClass+'" style="margin-right:8px">'+pillTxt+'</span>' +
        '<span class="equip-chev">&#9660;</span>' +
      '</div>' +
      '<div class="equip-drill">' +
        '<div class="drill-row"><div>' +
          '<div class="drill-nom">Dernière saisie</div>' +
          '<div class="drill-meta" style="color:'+rd.color+'">'+rd.label+'</div>' +
        '</div><div style="text-align:right">' +
          '<div style="font-size:12px;font-weight:600">'+hMarche+'</div>' +
          '<div style="font-size:11px;color:var(--texte2)">compteur</div>' +
        '</div></div>' +
        '<div class="drill-row"><div>' +
          '<div class="drill-nom">Niveau huile</div>' +
          '<div class="drill-meta" style="color:'+huileCoul+'">'+huileVal+'</div>' +
        '</div><div style="text-align:right">' +
          '<div style="font-size:12px;font-weight:600">'+operateur+'</div>' +
          '<div style="font-size:11px;color:var(--texte2)">opérateur</div>' +
        '</div></div>' +
        '<div class="drill-row"><div>' +
          '<div class="drill-nom">Vidange</div>' +
          '<div class="drill-meta" style="color:'+vColor+'">'+(pctV!=null?pctV+'% du seuil ('+fmtNum(g.seuil_vidange_heures||250)+'h)':'—')+'</div>' +
        '</div><div style="text-align:right">' +
          '<div style="font-size:12px;font-weight:600">'+saisiesG+'</div>' +
          '<div style="font-size:11px;color:var(--texte2)">saisies 30j</div>' +
        '</div></div>' +
      '</div></div>';
  });
  return html;
}

function consoStr(g) { return g.conso_theorique_lh ? g.conso_theorique_lh+' L/h' : '65 L/h'; }

function toggleEquipCard(id) {
  var card = document.getElementById(id); if (!card) return;
  card.classList.toggle('open');
}

// ── CUVE CARD ──
function buildCuveCard(cuve, saisieCuve, niveauCuve, pctCuve, capCuve, autoJours, consoLh, groupes, saisiesJour, today) {
  if (!cuve) return '';
  var barColor = pctCuve!=null?(pctCuve<25?'var(--rouge)':pctCuve<50?'var(--orange)':'var(--or)'):'var(--or)';
  var autoStr = autoJours!=null?autoJours+'j':'—';
  var autoC = autoJours!=null?autoColor(autoJours):'var(--texte2)';
  var rd = retardLabel(saisieCuve?saisieCuve.date:null, today);
  var barHtml = pctCuve!=null?'<div class="cuve-bar"><div class="cuve-bar-fill" style="width:'+pctCuve+'%;background:'+barColor+'"></div></div>':'';
  var chips = '';
  groupes.forEach(function(g) {
    var s=null; for(var i=0;i<saisiesJour.length;i++){if(saisiesJour[i].groupe_id===g.id){s=saisiesJour[i];break;}}
    var actif = s && s.demarre===true;
    chips += '<span class="ge-chip'+(actif?' actif':'')+'">'+g.nom+' — '+(actif?'actif':'standby')+'</span>';
  });
  var note = groupes.length>1?'<div class="cuve-note">Autonomie calculée sur '+consoLh+' L/h × 8h/j. En alternance : le second groupe prend le relais si nécessaire.</div>':'';
  var cuveNom = cuve.nom?' — '+cuve.nom:'';
  return '<div class="cuve-card">' +
    '<div class="cuve-header"><div>' +
      '<div class="cuve-title">&#128730; Cuve commune'+cuveNom+'</div>' +
      '<div class="cuve-sub">Capacité '+fmtNum(capCuve)+'L · '+rd.label+'</div>' +
    '</div><div>' +
      '<div class="auto-val" style="color:'+autoC+'">'+autoStr+'</div>' +
      '<div class="auto-unit">autonomie estimée</div>' +
    '</div></div>' +
    barHtml +
    '<div class="cuve-meta">' +
      '<span><strong>'+(niveauCuve!=null?fmtNum(niveauCuve)+'L':'—')+'</strong> niveau actuel</span>' +
      '<span><strong>'+(pctCuve!=null?pctCuve+'%':'—')+'</strong> du réservoir</span>' +
      '<span><strong>'+consoLh+' L/h</strong> conso théorique</span>' +
      (saisieCuve?'<span><strong>'+fmtDate(saisieCuve.date)+'</strong> dernier relevé</span>':'') +
    '</div>' +
    '<div class="ge-chips">'+chips+'</div>' +
    note +
  '</div>';
}

// ── PANNES ──
function buildPannesSection(pannesOuv, pannesRes, groupes, groupeMap, panneLabels, showFull) {
  var gids = {}; groupes.forEach(function(g){gids[g.id]=true;});
  var panneFilt = pannesOuv.filter(function(p){return gids[p.groupe_id];});
  var resFilt = pannesRes.filter(function(p){return gids[p.groupe_id];});
  var ouvertesHtml = '';
  if (panneFilt.length) {
    panneFilt.forEach(function(p) {
      var gNom = groupeMap[p.groupe_id]||'Equipement';
      var pb = p.description||(panneLabels[p.type]||p.type||'Panne');
      var cout = p.cout_reparation?fmtNum(p.cout_reparation)+' FCFA estimé':'Coût non défini';
      ouvertesHtml += '<div class="panne-open">' +
        '<div class="panne-hdr"><span class="pill pill-danger">'+gNom+'</span>' +
        '<div class="panne-nom">'+pb+'</div>' +
        '<div class="panne-dt">'+fmtDate(p.date_panne)+'</div></div>' +
        '<div class="panne-ftr"><span class="panne-cout">'+cout+'</span>' +
        '<button class="resolve-btn" onclick="resoudrePanne(\''+p.id+'\',event)">&#10003; Résolu</button></div></div>';
    });
  } else {
    ouvertesHtml = '<div class="empty" style="background:white;border:1px solid var(--bordure);border-radius:6px;margin-bottom:8px">Aucune panne en cours &#10003;</div>';
  }
  var historHtml = '';
  if (showFull && resFilt.length) {
    var rows = ''; resFilt.forEach(function(p) {
      rows += '<tr><td>'+fmtDate(p.date_resolution||p.date_panne)+'</td>' +
        '<td>'+(groupeMap[p.groupe_id]||'—')+'</td>' +
        '<td>'+(p.description||(panneLabels[p.type]||p.type)||'—')+'</td>' +
        '<td>'+(p.intervenant||'—')+'</td>' +
        '<td><strong>'+(p.cout_reparation?fmtNum(p.cout_reparation)+' F':'—')+'</strong></td></tr>';
    });
    historHtml = '<div class="table-card"><div class="table-hdr">' +
      '<div class="table-hdr-title">Historique résolu</div>' +
      '<div class="table-hdr-sub">'+resFilt.length+' panne'+(resFilt.length>1?'s':'')+'</div></div>' +
      '<table class="data"><thead><tr><th>Résolu le</th><th>Equipement</th><th>Problème</th><th>Intervenant</th><th>Coût</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table></div>';
  }
  return '<div style="margin-bottom:24px">' +
    '<div class="section-hdr"><div class="section-title">Pannes &amp; maintenance</div>' +
    '<div class="section-count">'+panneFilt.length+' en cours</div></div>' +
    ouvertesHtml + historHtml + '</div>';
}

// ── RAVITAILLEMENTS ──

}

// ── SAISIES LOG ──
function buildSaisiesLog(saisies30, groupeMap) {
  var saisies = saisies30.slice().sort(function(a,b){
    return (b.date+((b.created_at||'').slice(11))).localeCompare(a.date+((a.created_at||'').slice(11)));
  }).slice(0,50);
  if (!saisies.length) return '';
  var rows = ''; saisies.forEach(function(s) {
    rows += '<tr><td>'+fmtDate(s.date)+'</td>' +
      '<td style="color:var(--texte2)">'+(fmtHeure(s.created_at)||'—')+'</td>' +
      '<td>'+(groupeMap[s.groupe_id]||'—')+'</td>' +
      '<td>'+(s.heures_marche!=null?s.heures_marche+'h':'—')+'</td>' +
      '<td style="color:'+huileColor(s.niveau_huile)+'">'+(s.niveau_huile||'—')+'</td>' +
      '<td>'+(s.operateur||'—')+'</td></tr>';
  });
  return '<button class="saisies-toggle" onclick="toggleSaisies(this)">' +
    '<span>Journal des saisies ('+saisies.length+' entrées)</span><span>&#9660;</span></button>' +
    '<div class="saisies-body" id="saisies-body">' +
    '<div class="table-card" style="margin-top:6px">' +
    '<table class="data"><thead><tr><th>Date</th><th>Heure</th><th>Groupe</th><th>Compteur</th><th>Huile</th><th>Opérateur</th></tr></thead>' +
    '<tbody>'+rows+'</tbody></table></div></div>';
}

function toggleSaisies(btn) {
  var body = document.getElementById('saisies-body');
  if (body) body.classList.toggle('open');
}

// VUE GROUPE (dir_ops / dir_tech)
// ════════════════════════════════════════
function renderGroupeView(client, sites, opsOnly) {
  var now = new Date();
  var today = now.toISOString().split('T')[0];
  var debut30 = new Date(Date.now()-30*86400000).toISOString().split('T')[0];
  var dateStr = now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  Promise.all([
    api('groupes', '&client_id=eq.' + client.id + '&actif=eq.true'),
    api('saisies', '&client_id=eq.' + client.id + '&date=eq.' + today),
    api('alertes', '&client_id=eq.' + client.id + '&resolue=eq.false'),
    api('pannes',  '&client_id=eq.' + client.id + '&resolue=eq.false'),
    api('cuves',   '&client_id=eq.' + client.id + '&actif=eq.true'),
    api('saisies_cuve', '&client_id=eq.' + client.id + '&date=gte.' + debut30 + '&order=date.desc')
  ]).then(function(res) {
    var tousGroupes=res[0], toutesSaisies=res[1], toutesAlertes=res[2], toutesPannes=res[3], toutesCuves=res[4], toutesSaisiesCuve=res[5];
    var saisiesOk = toutesSaisies.filter(function(s){return s.heures_marche!=null;}).length;
    var alertesDanger = toutesAlertes.filter(function(a){return a.severite==='danger';}).length;

    var sitesHtml = sites.map(function(s) {
      var sGroupes = tousGroupes.filter(function(g){return g.site_id===s.id;});
      var sSaisies = toutesSaisies.filter(function(x){return sGroupes.some(function(g){return g.id===x.groupe_id;});});
      var sAlertes = toutesAlertes.filter(function(a){return sGroupes.some(function(g){return g.id===a.groupe_id;})||a.site_id===s.id;});
      var sCuve=null; for(var ci=0;ci<toutesCuves.length;ci++){if(toutesCuves[ci].site_id===s.id){sCuve=toutesCuves[ci];break;}}
      var sSaisieCuve=null; if(sCuve){for(var sci=0;sci<toutesSaisiesCuve.length;sci++){if(toutesSaisiesCuve[sci].cuve_id===sCuve.id){sSaisieCuve=toutesSaisiesCuve[sci];break;}}}
      var pctCuve = (sSaisieCuve&&sCuve)?Math.round(sSaisieCuve.niveau_litres/sCuve.capacite_litres*100):null;
      var cLh = (sGroupes.length&&sGroupes[0].conso_theorique_lh)?parseFloat(sGroupes[0].conso_theorique_lh):65;
      var autoJ = sSaisieCuve?Math.round((sSaisieCuve.niveau_litres/(cLh*8))*10)/10:null;
      var sPannes = toutesPannes.filter(function(p){return sGroupes.some(function(g){return g.id===p.groupe_id;});});
      var hasDanger = sAlertes.some(function(a){return a.severite==='danger';});
      var pillClass = (hasDanger||sPannes.length)?'pill-danger':sAlertes.length?'pill-warn':'pill-ok';
      var pillTxt = (hasDanger||sPannes.length)?'Action requise':sAlertes.length?'Attention':'Normal';
      var taux = sGroupes.length?Math.round(sSaisies.length/sGroupes.length*100):0;
      return '<div class="site-card" id="site-card-'+s.id+'" onclick="toggleSiteDetail(\''+s.id+'\',event)">' +
        '<div class="sc-hdr"><div><div class="sc-nom">&#127968; '+s.nom+'</div>' +
        '<div class="sc-sub">'+(s.ville||'')+' · '+sGroupes.length+' groupe'+(sGroupes.length>1?'s':'')+'</div></div>' +
        '<span class="pill '+pillClass+'">'+pillTxt+'</span></div>' +
        '<div class="sc-kpis">' +
          '<div class="sc-kpi"><div class="sc-kpi-val" style="color:'+(taux===100?'var(--vert)':taux>0?'var(--orange)':'var(--rouge)')+'">'+sSaisies.length+'/'+sGroupes.length+'</div><div class="sc-kpi-label">Saisies</div></div>' +
          '<div class="sc-kpi"><div class="sc-kpi-val" style="color:'+(pctCuve!=null?carbColor(pctCuve):'var(--texte2)')+'">'+( pctCuve!=null?pctCuve+'%':'—')+'</div><div class="sc-kpi-label">Cuve</div></div>' +
          '<div class="sc-kpi"><div class="sc-kpi-val" style="color:'+(autoJ!=null?autoColor(autoJ):'var(--texte2)')+'">'+( autoJ!=null?autoJ+'j':'—')+'</div><div class="sc-kpi-label">Autonomie</div></div>' +
          '<div class="sc-kpi"><div class="sc-kpi-val" style="color:'+(sPannes.length?'var(--rouge)':'var(--vert)')+'">'+( sPannes.length||'&#10003;')+'</div><div class="sc-kpi-label">Pannes</div></div>' +
        '</div>' +
        '<div class="sc-detail" id="sc-detail-'+s.id+'"><div class="loading"><span class="spinner"></span>Chargement...</div></div>' +
      '</div>';
    }).join('');

    var subtitleLabel = opsOnly?'Directeur des opérations':'Directeur technique';
    var kSaisieColor = saisiesOk===tousGroupes.length?'var(--vert)':saisiesOk>0?'var(--orange)':'var(--rouge)';
    var kAlertColor = alertesDanger>0?'var(--rouge)':toutesAlertes.length?'var(--orange)':'var(--vert)';

    document.getElementById('app').innerHTML =
      '<div class="header"><div class="header-top"><div>' +
        '<div class="logo">'+client.nom+'</div>' +
        '<div class="logo-sub">'+subtitleLabel+' · '+sites.length+' sites</div>' +
      '</div><div class="header-right">' +
        '<div class="header-date">'+dateStr+'</div>' +
        '<div class="header-title">Vue consolidée</div>' +
      '</div></div></div>' +
      '<div class="container">' +
        '<div class="kpi-grid">' +
          '<div class="kpi"><div class="kpi-label">Saisies aujourd\'hui</div><div class="kpi-value" style="color:'+kSaisieColor+'">'+saisiesOk+' / '+tousGroupes.length+'</div><div class="kpi-trend">'+sites.length+' site'+(sites.length>1?'s':'')+'</div></div>' +
          '<div class="kpi"><div class="kpi-label">Alertes actives</div><div class="kpi-value" style="color:'+kAlertColor+'">'+(toutesAlertes.length||'&#10003;')+'</div><div class="kpi-trend">'+alertesDanger+' critique'+(alertesDanger>1?'s':'')+'</div></div>' +
          '<div class="kpi"><div class="kpi-label">Pannes en cours</div><div class="kpi-value" style="color:'+(toutesPannes.length?'var(--rouge)':'var(--vert)')+'">'+(toutesPannes.length||'&#10003;')+'</div><div class="kpi-trend">'+(toutesPannes.length?'intervention requise':'Tout est résolu')+'</div></div>' +
          '<div class="kpi"><div class="kpi-label">Equipements</div><div class="kpi-value">'+tousGroupes.length+'</div><div class="kpi-trend">'+sites.length+' site'+(sites.length>1?'s':'')+'</div></div>' +
        '</div>' +
        '<div class="section-label">Etablissements</div>' +
        sitesHtml +
      '</div>' +
      '<div class="footer">Powered by <strong>GenTrack</strong> · '+client.nom+'</div>';

    window._groupeData = {client:client, sites:sites, tousGroupes:tousGroupes, toutesSaisies:toutesSaisies, toutesAlertes:toutesAlertes, toutesPannes:toutesPannes, toutesCuves:toutesCuves, toutesSaisiesCuve:toutesSaisiesCuve, today:today};
  });
}

var _openSiteId = null;
function toggleSiteDetail(siteId, evt) {
  if (evt) evt.stopPropagation();
  var el = document.getElementById('sc-detail-'+siteId); if (!el) return;
  if (_openSiteId===siteId && el.classList.contains('open')) { el.classList.remove('open'); _openSiteId=null; return; }
  document.querySelectorAll('.sc-detail.open').forEach(function(d){d.classList.remove('open');});
  _openSiteId = siteId; el.classList.add('open');
  var d = window._groupeData; if (!d) return;
  var site=null; for(var si=0;si<d.sites.length;si++){if(d.sites[si].id===siteId){site=d.sites[si];break;}}
  var sGroupes = d.tousGroupes.filter(function(g){return g.site_id===siteId;});
  var sSaisies = d.toutesSaisies.filter(function(x){return sGroupes.some(function(g){return g.id===x.groupe_id;});});
  var sCuve=null; for(var ci=0;ci<d.toutesCuves.length;ci++){if(d.toutesCuves[ci].site_id===siteId){sCuve=d.toutesCuves[ci];break;}}
  var sSaisieCuve=null; if(sCuve){for(var sci=0;sci<d.toutesSaisiesCuve.length;sci++){if(d.toutesSaisiesCuve[sci].cuve_id===sCuve.id){sSaisieCuve=d.toutesSaisiesCuve[sci];break;}}}

  var cLh=(sGroupes.length&&sGroupes[0].conso_theorique_lh)?parseFloat(sGroupes[0].conso_theorique_lh):65;
  var niv=sSaisieCuve?sSaisieCuve.niveau_litres:null;
  var cap=sCuve?(sCuve.capacite_litres||500):500;
  var pctC=niv!=null?Math.round(niv/cap*100):null;
  var autoJ=niv!=null?Math.round((niv/(cLh*8))*10)/10:null;

  var cuveHtml2='';
  if(sCuve){
    cuveHtml2='<div style="background:var(--or-pale);border:1px solid rgba(201,169,110,0.3);border-radius:6px;padding:10px 14px;margin-bottom:10px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px">' +
      '<span>&#128730; Cuve <strong>'+fmtNum(cap)+'L</strong></span>' +
      (pctC!=null?'<span>Niveau <strong style="color:'+carbColor(pctC)+'">'+pctC+'%</strong></span>':'') +
      (autoJ!=null?'<span>Autonomie <strong style="color:'+autoColor(autoJ)+'">'+autoJ+'j</strong></span>':'') +
    '</div>';
  }

  var gHtml=''; sGroupes.forEach(function(g){
    var s=null; for(var i=0;i<sSaisies.length;i++){if(sSaisies[i].groupe_id===g.id){s=sSaisies[i];break;}}
    var rd=retardLabel(s?s.date:null, d.today);
    var pctV=(g.heures_total&&g.seuil_vidange_heures)?Math.round(g.heures_total/g.seuil_vidange_heures*100):null;
    var vColor=pctV!=null?(pctV>=100?'var(--rouge)':pctV>=80?'var(--orange)':'var(--vert)'):'var(--vert)';
    gHtml+='<div style="border:1px solid var(--bordure);border-radius:6px;overflow:hidden;margin-bottom:8px;background:white">' +
      '<div style="padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--bordure);display:flex;justify-content:space-between;align-items:center">' +
        '<div><div style="font-size:13px;font-weight:600">&#9881; '+g.nom+' — '+(g.marque||'')+' '+(g.puissance_kva||'')+'kVA</div>' +
        '<div style="font-size:11px;color:'+rd.color+'">'+rd.label+'</div></div>' +
        '<span class="pill '+(rd.jours===0?'pill-ok':rd.jours===1?'pill-warn':'pill-danger')+'">'+(rd.jours===0?'OK ✓':rd.jours===1?'Hier':'J-'+rd.jours)+'</span>' +
      '</div>' +
      '<div style="padding:10px 12px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px">' +
        '<span><span style="color:var(--texte2)">Compteur</span> <strong>'+(s&&s.heures_marche!=null?s.heures_marche+'h':'—')+'</strong></span>' +
        '<span><span style="color:var(--texte2)">Vidange</span> <strong style="color:'+vColor+'">'+(pctV!=null?pctV+'%':'—')+'</strong></span>' +
        '<span><span style="color:var(--texte2)">Huile</span> <strong style="color:'+huileColor(s?s.niveau_huile:null)+'">'+(s&&s.niveau_huile?s.niveau_huile:'—')+'</strong></span>' +
        '<span><span style="color:var(--texte2)">Opérateur</span> <strong>'+(s&&s.operateur?s.operateur:'—')+'</strong></span>' +
      '</div></div>';
  });
  el.innerHTML = cuveHtml2+(gHtml||'<div class="empty">Aucun groupe configuré</div>');
}

// ── RÉSOUDRE PANNE ──
function resoudrePanne(id, evt) {
  if (evt) evt.stopPropagation();
  if (!confirm('Marquer cette panne comme résolue ?')) return;
  fetch(SUPA_URL + '/rest/v1/pannes?id=eq.' + id, {
    method:'PATCH',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify({resolue:true, date_resolution:new Date().toISOString().split('T')[0], resolu_via:'Dashboard client'})
  }).then(function(res){ if(res.ok){alert('Panne résolue');location.reload();}else{alert('Erreur lors de la résolution');} });
}

init();
</script>
