<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenTrack — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
:root{
  --bx:#8B1A2E;--bx-pale:rgba(139,26,46,0.08);--bx-mid:rgba(139,26,46,0.15);
  --or:#C9A96E;--or-pale:rgba(201,169,110,0.12);
  --surface:#FDFAF5;--surface2:#F5EFE6;--surface3:#EDE3D4;
  --bordure:#DDD0BC;--texte:#2C1810;--texte2:#7A6855;--texte3:#B5A090;
  --vert:#2D7A4F;--vert-pale:rgba(45,122,79,0.08);
  --rouge:#C0392B;--rouge-pale:rgba(192,57,43,0.08);--rouge-bordure:rgba(192,57,43,0.3);
  --orange:#D4761E;--orange-pale:rgba(212,118,30,0.08);--orange-bordure:rgba(212,118,30,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--surface);color:var(--texte);font-family:'Inter',sans-serif;min-height:100vh}
.header{background:var(--bx);color:white}
.header-top{display:flex;justify-content:space-between;align-items:center;padding:20px 36px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.logo-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-top:2px}
.header-right{text-align:right}
.header-date{font-size:11px;color:rgba(255,255,255,0.5)}
.header-title{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--or);margin-top:3px}
.site-nav{background:rgba(0,0,0,0.2);padding:0 36px;display:flex;gap:0;overflow-x:auto}
.site-btn{padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:rgba(255,255,255,0.5);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.site-btn:hover{color:rgba(255,255,255,0.8)}
.site-btn.active{color:white;border-bottom-color:var(--or)}
.container{max-width:960px;margin:0 auto;padding:32px 36px 60px}
.tabs{display:flex;gap:4px;margin-bottom:28px;border-bottom:1px solid var(--bordure)}
.tab{padding:11px 20px;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--texte2);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--bx);border-bottom-color:var(--bx)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.action-banner{background:var(--rouge-pale);border:1px solid var(--rouge-bordure);border-radius:6px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.action-banner.warn{background:var(--orange-pale);border-color:var(--orange-bordure)}
.ab-icon{font-size:20px;flex-shrink:0}
.ab-body{flex:1}
.ab-titre{font-size:13px;font-weight:600;color:var(--rouge)}
.ab-sub{font-size:12px;color:var(--texte2);margin-top:2px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--texte);margin-bottom:4px}
.section-sub{font-size:11px;color:var(--texte2);letter-spacing:0.5px;margin-bottom:16px}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--texte2);font-weight:600;margin-bottom:10px}
.biz-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.bm{border-radius:6px;border:1px solid var(--bordure);padding:16px 18px}
.bm.normal{background:var(--surface2)}
.bm.danger{background:var(--rouge-pale);border-color:var(--rouge-bordure)}
.bm.warn{background:var(--orange-pale);border-color:var(--orange-bordure)}
.bm-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--texte2);margin-bottom:8px;font-weight:600}
.bm-val{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1;letter-spacing:-0.5px}
.bm-sub{font-size:11px;color:var(--texte2);margin-top:5px}
.couts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.cout-card{background:white;border-radius:6px;border:1px solid var(--bordure);padding:14px 16px}
.cout-card.maint{border-top:3px solid var(--orange)}
.cout-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--texte2);font-weight:500;margin-bottom:8px}
.cout-val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--texte)}
.cout-sub{font-size:11px;color:var(--texte2);margin-top:4px}
.groupe-detail{border:1px solid var(--bordure);border-radius:6px;overflow:hidden;margin-bottom:10px;background:white}
.gd-header{padding:12px 14px;border-bottom:1px solid var(--bordure);display:flex;justify-content:space-between;align-items:center;background:var(--surface2)}
.gd-nom{font-size:13px;font-weight:600}
.gd-saisie{font-size:11px;color:var(--texte2);margin-top:2px}
.gd-body{padding:12px 14px}
.gd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.gd-stat-label{font-size:11px;color:var(--texte2)}
.gd-stat-val{font-size:14px;font-weight:600;margin-top:2px}
.gd-bar{height:4px;background:var(--bordure);border-radius:2px;overflow:hidden}
.gd-bar-fill{height:100%;border-radius:2px}
.site-card{border:1px solid var(--bordure);border-radius:6px;background:white;margin-bottom:10px;overflow:hidden;cursor:pointer}
.site-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.sc-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-bottom:1px solid var(--bordure)}
.sc-nom{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600}
.sc-sub{font-size:11px;color:var(--texte2);margin-top:2px}
.sc-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.sc-kpi{padding:12px 16px;border-right:1px solid var(--bordure);text-align:center}
.sc-kpi:last-child{border-right:none}
.sc-kpi-val{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600}
.sc-kpi-label{font-size:10px;color:var(--texte2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.sc-detail{display:none;padding:16px;border-top:1px solid var(--bordure)}
.sc-detail.open{display:block}
.chart-card{border:1px solid var(--bordure);border-radius:6px;overflow:hidden;margin-bottom:18px;background:white}
.chart-head{padding:12px 16px;border-bottom:1px solid var(--bordure);display:flex;justify-content:space-between;align-items:center;background:var(--surface2)}
.chart-head-title{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600}
.chart-body{padding:16px}
.chart-insight{margin-top:10px;padding-top:10px;border-top:1px solid var(--bordure);font-size:12px;color:var(--texte2)}
.table-card{border:1px solid var(--bordure);border-radius:6px;overflow:hidden;margin-bottom:22px;background:white}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th{text-align:left;padding:9px 14px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--texte2);border-bottom:1px solid var(--bordure);background:var(--surface2);font-weight:600}
table.data td{padding:9px 14px;border-bottom:1px solid var(--surface3);color:var(--texte)}
table.data tr:last-child td{border-bottom:none}
table.data tr:hover td{background:var(--surface2)}
.pill{padding:3px 10px;border-radius:2px;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;display:inline-block}
.pill-ok{background:var(--vert-pale);color:var(--vert)}
.pill-warn{background:var(--orange-pale);color:var(--orange)}
.pill-danger{background:var(--rouge-pale);color:var(--rouge)}
.divider{height:1px;background:var(--bordure);margin:28px 0;position:relative}
.divider::after{content:'◆';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);padding:0 12px;color:var(--or);font-size:9px}
.footer{background:var(--bx);color:rgba(255,255,255,0.4);text-align:center;padding:18px;font-size:11px;letter-spacing:1px;margin-top:40px}
.footer strong{color:var(--or)}
.loading{padding:40px;text-align:center;color:var(--texte2);font-size:13px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--bordure);border-top-color:var(--bx);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:30px;text-align:center;color:var(--texte2);font-size:12px}
.error-page{max-width:400px;margin:80px auto;text-align:center;padding:40px}
.error-page h2{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:12px;color:var(--texte)}
.error-page p{font-size:13px;color:var(--texte2);line-height:1.6}
@media(max-width:700px){
  .container{padding:20px}
  .biz-metrics{grid-template-columns:1fr}.couts-grid{grid-template-columns:1fr}
  .gd-stats{grid-template-columns:repeat(2,1fr)}
  .sc-kpis{grid-template-columns:repeat(2,1fr)}
  .header-top{padding:16px 20px}
  table.data{font-size:11px}
  table.data th,table.data td{padding:7px 8px}
}
</style>
</head>
<body>
<div id="app"><div class="loading" style="padding:80px"><span class="spinner"></span>Chargement...</div></div>
<script>
var SUPA_URL = 'https://zbpoxjlkqxnqjzxohasq.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicG94amxrcXhucWp6eG9oYXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjM3ODAsImV4cCI6MjA5NzA5OTc4MH0.9-QyWgon93jGDo5QKMIh_-QbQZ_P9rQrYJnVxegJe7M';
var _chartOp = null, _chartTech = null;

function api(table, q) {
  if (!q) q = '';
  return fetch(SUPA_URL + '/rest/v1/' + table + '?select=*' + q, {
    headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY}
  }).then(function(r) { return r.ok ? r.json() : []; });
}

function fmtNum(n) { return Math.round(n || 0).toLocaleString('fr-FR'); }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateShort(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('fr-FR', {day:'2-digit',month:'short'}); }
function fmtHeure(d) { if (!d) return null; return new Date(d).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit',timeZone:'Africa/Dakar'}); }
function carbColor(n) { return n < 25 ? 'var(--rouge)' : n < 50 ? 'var(--orange)' : 'var(--vert)'; }
function autoColor(j) { return j < 2 ? 'var(--rouge)' : j < 5 ? 'var(--orange)' : 'var(--vert)'; }
function huileColor(h) { return h === 'critique' ? 'var(--rouge)' : h === 'bas' ? 'var(--orange)' : 'var(--vert)'; }

function retardLabel(date, heure, today) {
  if (!date) return {label: 'Aucune saisie', color: 'var(--rouge)', jours: null};
  var j = Math.round((new Date(today) - new Date(date)) / 86400000);
  var hs = heure ? ' à ' + heure : '';
  if (j === 0) return {label: "Saisi aujourd'hui" + hs, color: 'var(--texte2)', jours: 0};
  if (j === 1) return {label: 'Saisi hier' + hs, color: 'var(--orange)', jours: 1};
  return {label: 'Saisi il y a ' + j + ' jours', color: 'var(--rouge)', jours: j};
}

function applyBrandColor(hex) {
  if (!hex) return;
  var r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
  document.documentElement.style.setProperty('--bx', hex);
  document.documentElement.style.setProperty('--bx-pale', 'rgba(' + r + ',' + g + ',' + b + ',0.08)');
  document.documentElement.style.setProperty('--bx-mid', 'rgba(' + r + ',' + g + ',' + b + ',0.15)');
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === name); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  var panel = document.getElementById('panel-' + name);
  if (panel) panel.classList.add('active');
}

function showError(titre, msg) {
  document.getElementById('app').innerHTML = '<div class="error-page"><div style="font-size:48px;margin-bottom:20px">&#128274;</div><h2>' + titre + '</h2><p>' + msg + '</p></div>';
}

// ── ROUTING ──
function init() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var clientId = params.get('id');
  if (token) { loadByToken(token); }
  else if (clientId) { loadClientView(clientId, {}); }
  else { showError('Lien invalide', "Ce lien ne contient pas d'identifiant valide."); }
}

function loadByToken(token) {
  api('tokens', '&token=eq.' + token + '&actif=eq.true').then(function(rows) {
    if (!rows.length) { showError('Lien expiré', "Ce lien d'accès n'est plus valide."); return; }
    var tok = rows[0];
    if (tok.expire_at && new Date(tok.expire_at) < new Date()) { showError('Lien expiré', "Ce lien a expiré."); return; }
    var role = tok.role || null;
    var rawSiteIds = tok.site_ids || [];
    var siteIds = typeof rawSiteIds === 'string' ? JSON.parse(rawSiteIds || '[]') : rawSiteIds;
    if (role === 'dir_ops') {
      loadClientView(tok.client_id, {role: 'dir_ops'});
    } else if (role === 'dir_tech') {
      loadClientView(tok.client_id, {role: 'dir_tech', siteIds: siteIds});
    } else if (role === 'resp_tech') {
      var sid = siteIds.length ? siteIds[0] : (tok.site_id || null);
      loadSiteView(tok.client_id, sid, {role: 'resp_tech'});
    } else if (role === 'tech' || role === 'technicien') {
      var sid2 = siteIds.length ? siteIds[0] : (tok.site_id || null);
      loadSiteView(tok.client_id, sid2, {role: 'technicien'});
    } else if (tok.site_id) {
      loadSiteView(tok.client_id, tok.site_id, {role: 'technicien'});
    } else {
      loadClientView(tok.client_id, {role: null});
    }
  });
}

function loadClientView(clientId, access) {
  if (!access) access = {};
  api('clients', '&id=eq.' + clientId).then(function(clients) {
    if (!clients.length) { showError('Client introuvable', ''); return; }
    var client = clients[0];
    applyBrandColor(client.couleur_marque);
    api('sites', '&client_id=eq.' + clientId + '&actif=eq.true&order=nom').then(function(sites) {
      if (access.role === 'dir_tech' && access.siteIds && access.siteIds.length) {
        sites = sites.filter(function(s) { return access.siteIds.indexOf(s.id) >= 0; });
      }
      if ((client.groupe_hotelier || sites.length > 1) && access.role === 'dir_ops') {
        renderGroupeView(client, sites);
      } else if (sites.length > 1 && access.role === 'dir_tech') {
        renderMultiSiteView(client, sites);
      } else {
        var siteId = sites.length ? sites[0].id : null;
        var siteNom = sites.length ? sites[0].nom : null;
        var showTech = access.role !== 'dir_ops';
        renderHotelView(client, siteId, siteNom, {showTechnique: showTech}, null);
      }
    });
  });
}

function loadSiteView(clientId, siteId, access) {
  if (!access) access = {};
  api('clients', '&id=eq.' + clientId).then(function(clients) {
    if (!clients.length) { showError('Client introuvable', ''); return; }
    var client = clients[0];
    applyBrandColor(client.couleur_marque);
    var showTech = access.role !== 'technicien';
    if (siteId) {
      api('sites', '&id=eq.' + siteId).then(function(sites) {
        var siteNom = sites.length ? sites[0].nom : null;
        renderHotelView(client, siteId, siteNom, {showTechnique: showTech}, null);
      });
    } else {
      renderHotelView(client, null, null, {showTechnique: showTech}, null);
    }
  });
}

function renderMultiSiteView(client, sites) {
  var now = new Date();
  var dateStr = now.toLocaleDateString('fr-FR', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var navHtml = sites.map(function(s, i) {
    return '<div class="site-btn' + (i === 0 ? ' active' : '') + '" onclick="window._msShow(' + i + ')">' + s.nom + '</div>';
  }).join('');
  document.getElementById('app').innerHTML =
    '<div class="header"><div class="header-top"><div>' +
      '<div class="logo">' + client.nom + '</div>' +
      '<div class="logo-sub">Directeur technique &middot; ' + sites.length + ' sites</div>' +
    '</div><div class="header-right">' +
      '<div class="header-date">' + dateStr + '</div>' +
      '<div class="header-title">Groupes &#233;lectrog&#232;nes</div>' +
    '</div></div><div class="site-nav">' + navHtml + '</div></div>' +
    '<div id="ms-main"><div class="loading" style="padding:60px"><span class="spinner"></span>Chargement...</div></div>' +
    '<div class="footer">Powered by <strong>GenTrack</strong> &middot; ' + client.nom + '</div>';
  window._msShow = function(idx) {
    document.querySelectorAll('.site-btn').forEach(function(b, i) { b.classList.toggle('active', i === idx); });
    document.getElementById('ms-main').innerHTML = '<div class="loading" style="padding:60px"><span class="spinner"></span>Chargement...</div>';
    renderHotelView(client, sites[idx].id, sites[idx].nom, {showTechnique: true}, 'ms-main');
  };
  renderHotelView(client, sites[0].id, sites[0].nom, {showTechnique: true}, 'ms-main');
}

function renderGroupeView(client, sites) {
  var today = new Date().toISOString().split('T')[0];
  var dateDebut30 = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];
  var now = new Date();
  var dateStr = now.toLocaleDateString('fr-FR', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  Promise.all([
    api('groupes', '&client_id=eq.' + client.id + '&actif=eq.true'),
    api('saisies', '&client_id=eq.' + client.id + '&date=eq.' + today),
    api('alertes', '&client_id=eq.' + client.id + '&resolue=eq.false'),
    api('pannes',  '&client_id=eq.' + client.id + '&resolue=eq.false'),
    api('cuves',   '&client_id=eq.' + client.id + '&actif=eq.true'),
    api('saisies_cuve', '&client_id=eq.' + client.id + '&date=gte.' + dateDebut30 + '&order=date.desc')
  ]).then(function(res) {
    var tousGroupes=res[0], toutesSaisies=res[1], toutesAlertes=res[2], toutesPannes=res[3], toutesCuves=res[4], toutesSaisiesCuve=res[5];
    var totalGroupes = tousGroupes.length;
    var saisiesOk = toutesSaisies.filter(function(s) { return s.heures_marche != null; }).length;
    var alertesDanger = toutesAlertes.filter(function(a) { return a.severite === 'danger'; }).length;
    var pannesOuvertes = toutesPannes.length;
    var sitesHtml = sites.map(function(s) {
      var sGroupes = tousGroupes.filter(function(g) { return g.site_id === s.id; });
      var sSaisies = toutesSaisies.filter(function(x) { return sGroupes.some(function(g) { return g.id === x.groupe_id; }); });
      var sAlertes = toutesAlertes.filter(function(a) { return sGroupes.some(function(g) { return g.id === a.groupe_id; }) || a.site_id === s.id; });
      var sCuve = null; for (var ci=0;ci<toutesCuves.length;ci++){if(toutesCuves[ci].site_id===s.id){sCuve=toutesCuves[ci];break;}}
      var sSaisieCuve = null; if(sCuve){for(var sci=0;sci<toutesSaisiesCuve.length;sci++){if(toutesSaisiesCuve[sci].cuve_id===sCuve.id){sSaisieCuve=toutesSaisiesCuve[sci];break;}}}
      var pctCuve = (sSaisieCuve && sCuve) ? Math.round(sSaisieCuve.niveau_litres / sCuve.capacite_litres * 100) : null;
      var tauxSaisies = sGroupes.length ? Math.round(sSaisies.length / sGroupes.length * 100) : 0;
      var hasDanger = sAlertes.some(function(a) { return a.severite === 'danger'; });
      var pillClass = hasDanger ? 'pill-danger' : sAlertes.length ? 'pill-warn' : 'pill-ok';
      var pillTxt = hasDanger ? 'Critique' : sAlertes.length ? 'Attention' : 'Normal';
      var sPannes = toutesPannes.filter(function(p) { return sGroupes.some(function(g) { return g.id === p.groupe_id; }); });
      return '<div class="site-card" id="site-card-' + s.id + '" onclick="toggleSiteDetail(\'' + s.id + '\')">' +
        '<div class="sc-header"><div><div class="sc-nom">&#127968; ' + s.nom + '</div>' +
        '<div class="sc-sub">' + (s.ville||'') + ' &middot; ' + sGroupes.length + ' groupe' + (sGroupes.length>1?'s':'') + '</div></div>' +
        '<span class="pill ' + pillClass + '">' + pillTxt + '</span></div>' +
        '<div class="sc-kpis">' +
          '<div class="sc-kpi"><div class="sc-kpi-val" style="color:' + (tauxSaisies===100?'var(--vert)':tauxSaisies>0?'var(--orange)':'var(--rouge)') + '">' + sSaisies.length + '/' + sGroupes.length + '</div><div class="sc-kpi-label">Saisies</div></div>' +

var _openSiteId = null;
function toggleSiteDetail(siteId) {
  var el = document.getElementById('sc-detail-' + siteId);
  if (!el) return;
  if (_openSiteId === siteId && el.classList.contains('open')) { el.classList.remove('open'); _openSiteId = null; return; }
  document.querySelectorAll('.sc-detail.open').forEach(function(d) { d.classList.remove('open'); });
  _openSiteId = siteId; el.classList.add('open');
  var d = window._groupeData; if (!d) return;
  var site=null; for(var si=0;si<d.sites.length;si++){if(d.sites[si].id===siteId){site=d.sites[si];break;}}
  var sGroupes = d.tousGroupes.filter(function(g){return g.site_id===siteId;});
  var sSaisies = d.toutesSaisies.filter(function(x){return sGroupes.some(function(g){return g.id===x.groupe_id;});});
  var sAlertes = d.toutesAlertes.filter(function(a){return sGroupes.some(function(g){return g.id===a.groupe_id;});});
  var sCuve=null; for(var ci=0;ci<d.toutesCuves.length;ci++){if(d.toutesCuves[ci].site_id===siteId){sCuve=d.toutesCuves[ci];break;}}
  var sSaisieCuve=null; if(sCuve){for(var sci=0;sci<d.toutesSaisiesCuve.length;sci++){if(d.toutesSaisiesCuve[sci].cuve_id===sCuve.id){sSaisieCuve=d.toutesSaisiesCuve[sci];break;}}}
  el.innerHTML = buildSiteDetailHtml(d.client, site, sGroupes, sSaisies, sAlertes, sCuve, sSaisieCuve, d.today);
}

function buildSiteDetailHtml(client, site, groupes, saisiesJour, alertes, cuve, saisieCuve, today) {
  var cuveHtml = buildCuveHtml(cuve, saisieCuve, today);

    var vColor = pctV>=100?'var(--rouge)':pctV>=80?'var(--orange)':'var(--vert)';

function buildCuveHtml(cuve, saisieCuve, today) {
  if (!cuve) return '';

  var pctCuve = niveauCuve != null ? Math.round(niveauCuve / capCuve * 100) : null;
  var autoJours = niveauCuve != null ? Math.round((niveauCuve / (65 * 8)) * 10) / 10 : null;
  var heureCuve = saisieCuve ? fmtHeure(saisieCuve.created_at) : null;
  var rd = retardLabel(saisieCuve?saisieCuve.date:null, heureCuve, today);
  var pillClass2 = !saisieCuve?'pill-warn':pctCuve<30?'pill-danger':pctCuve<50?'pill-warn':'pill-ok';
  var pillContent = !saisieCuve ? 'Pas de relev&#233;' : niveauCuve + 'L / ' + capCuve + 'L (' + pctCuve + '%)';
  var barHtml = pctCuve!=null ? '<div class="gd-bar"><div class="gd-bar-fill" style="width:'+pctCuve+'%;background:'+carbColor(pctCuve)+'"></div></div>' : '';
  return '<div class="groupe-detail" style="border-top:3px solid var(--or);margin-bottom:10px">' +
    '<div class="gd-header" style="background:var(--or-pale)"><div>' +
      '<div class="gd-nom">&#128730;&#65039; Cuve commune' + (cuve.nom?' &middot; '+cuve.nom:'') + '</div>' +
      '<div class="gd-saisie" style="color:' + rd.color + '">Capacit&#233; ' + fmtNum(capCuve) + 'L &middot; ' + rd.label + '</div>' +
    '</div><div class="pill ' + pillClass2 + '">' + pillContent + '</div></div>' +
    '<div class="gd-body"><div class="gd-stats">' +
      '<div><div class="gd-stat-label">Niveau actuel</div><div class="gd-stat-val" style="color:' + (pctCuve!=null?carbColor(pctCuve):'var(--texte2)') + '">' + (niveauCuve!=null?niveauCuve+'L':'—') + '</div></div>' +
      '<div><div class="gd-stat-label">Capacit&#233;</div><div class="gd-stat-val">' + fmtNum(capCuve) + 'L</div></div>' +
      '<div><div class="gd-stat-label">Autonomie</div><div class="gd-stat-val" style="color:' + (autoJours!=null?autoColor(autoJours):'var(--texte2)') + '">' + (autoJours!=null?autoJours+'j':'—') + '</div></div>' +
      '<div><div class="gd-stat-label">Taux</div><div class="gd-stat-val">' + (pctCuve!=null?pctCuve+'%':'—') + '</div></div>' +
    '</div>' + barHtml + '</div></div>';

function renderHotelView(client, siteId, siteName, opts, containerId) {
  if (!opts) opts = {};
  var showTechnique = opts.showTechnique !== false;
  var now = new Date();
  var today = now.toISOString().split('T')[0];
  var dateDebut30 = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];
  var dateDebutAnnee = new Date(now.getFullYear(), 0, 1).toISOString().split('T')[0];
  var rootEl = containerId ? document.getElementById(containerId) : document.getElementById('app');
  if (!rootEl) return;
  rootEl.innerHTML = '<div class="loading" style="padding:60px"><span class="spinner"></span>Chargement...</div>';

  Promise.all([
    api('groupes', '&client_id=eq.' + client.id + (siteId ? '&site_id=eq.' + siteId : '') + '&actif=eq.true&order=nom'),
    api('saisies', '&client_id=eq.' + client.id + '&date=gte.' + dateDebut30 + '&order=date.desc,created_at.desc&limit=100'),
    api('alertes', '&client_id=eq.' + client.id + '&resolue=eq.false'),
    api('pannes',  '&client_id=eq.' + client.id + '&resolue=eq.false&order=date_panne.desc'),
    api('pannes',  '&client_id=eq.' + client.id + '&resolue=eq.true&order=date_resolution.desc&limit=20'),
    api('cuves',   '&client_id=eq.' + client.id + (siteId ? '&site_id=eq.' + siteId : '') + '&actif=eq.true')
  ]).then(function(res) {
    var groupes=res[0], saisiesRecentes=res[1], alertes=res[2], pannesOuvertes=res[3], pannesResolues=res[4], cuves=res[5];
    var derniereSaisieParGroupe = {};
    saisiesRecentes.forEach(function(s) { if (!derniereSaisieParGroupe[s.groupe_id]) derniereSaisieParGroupe[s.groupe_id] = s; });
    var saisiesJour = []; for (var gid in derniereSaisieParGroupe) { saisiesJour.push(derniereSaisieParGroupe[gid]); }
    var cuve = cuves.length ? cuves[0] : null;
    var fetchCuve30 = cuve ? api('saisies_cuve', '&cuve_id=eq.' + cuve.id + '&date=gte.' + dateDebut30 + '&order=date.desc,created_at.desc') : Promise.resolve([]);
    var fetchCuveAnnee = cuve ? api('saisies_cuve', '&cuve_id=eq.' + cuve.id + '&date=gte.' + dateDebutAnnee) : Promise.resolve([]);
    Promise.all([fetchCuve30, fetchCuveAnnee]).then(function(cuveRes) {
      var saisiesCuve30 = cuveRes[0], saisiesCuveAnnee = cuveRes[1];

      var prixLitre = client.prix_litre_fcfa || 695;
      var coutCarburantAnnee = Math.round(saisiesCuveAnnee.reduce(function(a,s){return a+(s.litres_ajoutes||0);},0)*prixLitre);
      var coutMaintenanceAnnee = pannesResolues.filter(function(p){return p.date_resolution>=dateDebutAnnee;}).reduce(function(a,p){return a+(p.cout_reparation||0);},0);

      // FIX : utiliser siteName (nom du site), pas client.nom
      var nom = siteName || client.nom;
      var dateStr = now.toLocaleDateString('fr-FR', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
      var capCuve = cuve ? (cuve.capacite_litres || 500) : 500;

      var headerHtml = containerId ? '' :
        '<div class="header"><div class="header-top"><div>' +
          '<div class="logo">' + nom + '</div>' +
          '<div class="logo-sub">Pilote GenTrack</div>' +
        '</div><div class="header-right">' +
          '<div class="header-date">' + dateStr + '</div>' +
          '<div class="header-title">Groupes &#233;lectrog&#232;nes</div>' +

      var techTab = showTechnique ? '<div class="tab" data-tab="technique" onclick="switchTab(\'technique\')">Technique</div>' : '';
      var cuveTitle = cuve ? 'Cuve &mdash; ' + fmtNum(cuve.capacite_litres) + 'L' : 'Cuve commune';

        '<div class="couts-grid" id="tech-couts"></div>' +

        '<div style="font-size:11px;color:var(--texte2)" id="tech-chart-insight"></div></div>' +

      ) : '';

      rootEl.innerHTML = headerHtml +
        '<div class="container">' +

              '<div style="font-size:11px;color:var(--texte2)" id="op-chart-sub"></div></div>' +

      renderOperations(client, groupes, saisiesJour, saisiesCuve30, alertes, pannesOuvertes, coutCarburantAnnee, coutMaintenanceAnnee, prixLitre, cuve, saisieCuveJour, today, now);
      if (showTechnique) renderTechnique(client, groupes, saisiesRecentes, saisiesCuve30, pannesOuvertes, pannesResolues, coutCarburantAnnee, coutMaintenanceAnnee, cuve, today);
    });
  });
}

function renderOperations(client, groupes, saisiesJour, saisiesCuve30, alertes, pannesOuvertes, coutCarburantAnnee, coutMaintenanceAnnee, prixLitre, cuve, saisieCuveJour, today, now) {
  var capCuve = cuve ? (cuve.capacite_litres || 500) : 500;

  var autoJours = niveauCuve != null ? Math.round((niveauCuve / (consoLh * 8)) * 10) / 10 : null;

    '<div class="bm ' + statusCuve + '"><div class="bm-label">Autonomie cuve</div>' +

    '<div class="bm-sub">' + (niveauCuve!=null?niveauCuve+'L / '+capCuve+'L ('+pctCuve+'%)':'Pas de relev&#233;') + '</div></div>';

  var yr = now.getFullYear();
  document.getElementById('op-couts').innerHTML =
    '<div class="cout-card"><div class="cout-label">&#9981; Carburant &mdash; ' + yr + '</div><div class="cout-val">' + (coutCarburantAnnee>0?fmtNum(coutCarburantAnnee):'—') + '</div><div class="cout-sub">FCFA</div></div>' +
    '<div class="cout-card maint"><div class="cout-label">&#128295; Maintenance &mdash; ' + yr + '</div><div class="cout-val" style="color:' + (coutMaintenanceAnnee>0?'var(--orange)':'var(--vert)') + '">' + fmtNum(coutMaintenanceAnnee) + '</div><div class="cout-sub">FCFA</div></div>';

  var groupesHtml = '';
  groupes.forEach(function(g) {
    var s=null; for(var i=0;i<saisiesJour.length;i++){if(saisiesJour[i].groupe_id===g.id){s=saisiesJour[i];break;}}
    var heure = s ? fmtHeure(s.created_at) : null;
    var rd = retardLabel(s?s.date:null, heure, today);
    var pctV = (g.heures_total&&g.seuil_vidange_heures) ? Math.round(g.heures_total/g.seuil_vidange_heures*100) : null;
    var pillClass = !s?'pill-warn':rd.jours===0?'pill-ok':rd.jours===1?'pill-warn':'pill-danger';
    var pillTxt = !s?'Pas de saisie':rd.jours===0?'Saisi &#10003;':rd.jours===1?'Hier':'J-'+rd.jours;
    var vColor = pctV>=100?'var(--rouge)':pctV>=80?'var(--orange)':'var(--vert)';
    groupesHtml += '<div class="groupe-detail">' +
      '<div class="gd-header"><div><div class="gd-nom">&#9881;&#65039; ' + g.nom + ' &mdash; ' + (g.marque||'') + ' ' + (g.puissance_kva||'') + 'kVA</div>' +
      '<div class="gd-saisie" style="color:' + rd.color + '">' + rd.label + '</div></div>' +
      '<span class="pill ' + pillClass + '">' + pillTxt + '</span></div>' +
      '<div class="gd-body"><div class="gd-stats">' +
        '<div><div class="gd-stat-label">Compteur moteur</div><div class="gd-stat-val">' + (s&&s.heures_marche!=null?s.heures_marche+'h':'—') + '</div></div>' +
        '<div><div class="gd-stat-label">Seuil vidange</div><div class="gd-stat-val" style="color:' + vColor + '">' + (pctV!=null?pctV+'%':'—') + '</div></div>' +
        '<div><div class="gd-stat-label">Huile</div><div class="gd-stat-val" style="color:' + huileColor(s?s.niveau_huile:null) + '">' + (s&&s.niveau_huile?s.niveau_huile:'—') + '</div></div>' +
        '<div><div class="gd-stat-label">Op&#233;rateur</div><div class="gd-stat-val">' + (s&&s.operateur?s.operateur:'—') + '</div></div>' +
      '</div></div></div>';
  });
  document.getElementById('op-groupes').innerHTML = buildCuveHtml(cuve, saisieCuveJour, today) + groupesHtml;

  var alHtml = '';
  if (alertes.length) {
    alHtml = '<div style="margin:14px 0"><div class="section-label">Alertes actives</div>';
    alertes.forEach(function(a) {
      alHtml += '<div class="action-banner" style="margin-bottom:8px"><div class="ab-icon">' + (a.severite==='danger'?'&#128308;':'&#128993;') + '</div>' +
        '<div class="ab-body"><div class="ab-titre" style="color:' + (a.severite==='danger'?'var(--rouge)':'var(--orange)') + '">' + a.message + '</div></div></div>';
    });
    alHtml += '</div>';
  }
  document.getElementById('op-alertes').innerHTML = alHtml;

  var dates14 = []; for(var di=0;di<14;di++){var dd=new Date();dd.setDate(dd.getDate()-(13-di));dates14.push(dd.toISOString().split('T')[0]);}
  var carbData = dates14.map(function(d){var sc=null;for(var i=0;i<saisiesCuve30.length;i++){if(saisiesCuve30[i].date===d){sc=saisiesCuve30[i];break;}}return(sc&&sc.niveau_litres!=null)?Math.round(sc.niveau_litres/capCuve*100):null;});
  var valides = carbData.filter(function(v){return v!==null;});
  var delta = valides.length >= 2 ? valides[valides.length-1] - valides[0] : null;
  var trendTxt = delta===null ? 'Pas assez de données.' : delta>=0 ? 'Niveau stable ou en hausse (+'+delta+' pts).' : 'Baisse de '+Math.abs(delta)+' pts — surveiller les pleins.';
  var insEl = document.getElementById('op-chart-insight'); if(insEl) insEl.textContent = trendTxt;
  var subEl = document.getElementById('op-chart-sub'); if(subEl) subEl.textContent = cuve?'Cuve '+fmtNum(capCuve)+'L':'';
  setTimeout(function() {
    if (_chartOp) _chartOp.destroy();
    var ctx = document.getElementById('op-chart'); if(!ctx) return;
    var bx = getComputedStyle(document.documentElement).getPropertyValue('--bx').trim()||'#8B1A2E';
    _chartOp = new Chart(ctx.getContext('2d'),{type:'line',data:{labels:dates14.map(fmtDateShort),datasets:[{data:carbData,borderColor:bx,backgroundColor:bx+'18',borderWidth:1.5,tension:0.3,fill:true,spanGaps:true,pointRadius:3,pointBackgroundColor:bx}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#EDE3D4'},ticks:{color:'#7A6855',font:{size:10}}},y:{grid:{color:'#EDE3D4'},ticks:{color:'#7A6855',font:{size:10},callback:function(v){return v+'%';}},min:0,max:100}}}});
  }, 50);
}

function renderTechnique(client, groupes, saisies30, saisiesCuve30, pannesOuvertes, pannesResolues, coutCarburantAnnee, coutMaintenanceAnnee, cuve, today) {
  var capCuve = cuve ? (cuve.capacite_litres||500) : 500;
  var groupeMap = {}; groupes.forEach(function(g){groupeMap[g.id]=g.nom;});
  var panneLabels = {ne_demarre_pas:'Ne d&#233;marre pas',arret_inopin:'Arr&#234;t inopin&#233;',bruit_anormal:'Bruit anormal',surchauffe:'Surchauffe',fuite:'Fuite',autre:'Autre'};
  var derniereCuve = saisiesCuve30.length ? saisiesCuve30[0] : null;
  var cuveCardTech = buildCuveHtml(cuve, derniereCuve, today);
  var groupesTechHtml = '';
  groupes.forEach(function(g) {
    var heuresTotal = g.heures_total||0, seuil = g.seuil_vidange_heures||250;
    var pct = Math.min(100, Math.round((heuresTotal/seuil)*100));
    var barColor = pct>=100?'var(--rouge)':pct>=80?'var(--orange)':'var(--vert)';
    var pillClass = pct>=100?'pill-danger':pct>=80?'pill-warn':'pill-ok';
    var reservoirHtml = g.capacite_reservoir_litres ?
      '<div><div class="gd-stat-label">R&#233;servoir</div><div class="gd-stat-val">'+fmtNum(g.capacite_reservoir_litres)+'L</div></div>' :
      '<div><div class="gd-stat-label">R&#233;servoir</div><div class="gd-stat-val" style="color:var(--texte2);font-size:12px">Cuve commune</div></div>';
    groupesTechHtml += '<div class="groupe-detail">' +
      '<div class="gd-header"><div><div class="gd-nom">'+g.nom+' &mdash; '+(g.marque||'')+' '+(g.puissance_kva||'')+'kVA</div>' +
      '<div class="gd-saisie">Conso th&#233;orique '+(g.conso_theorique_lh||'—')+' L/h</div></div>' +
      '<span class="pill '+pillClass+'">'+(pct>=100?'Vidange requise':pct>=80?'Vidange bient&#244;t':'OK')+'</span></div>' +
      '<div class="gd-body"><div class="gd-stats">' +
        '<div><div class="gd-stat-label">Heures totales</div><div class="gd-stat-val">'+fmtNum(heuresTotal)+'h</div></div>' +
        '<div><div class="gd-stat-label">Seuil vidange</div><div class="gd-stat-val">'+fmtNum(seuil)+'h</div></div>' +
        '<div><div class="gd-stat-label">Progression</div><div class="gd-stat-val" style="color:'+barColor+'">'+pct+'%</div></div>' +
        reservoirHtml +
      '</div><div class="gd-bar"><div class="gd-bar-fill" style="width:'+pct+'%;background:'+barColor+'"></div></div></div></div>';
  });
  document.getElementById('tech-groupes').innerHTML = cuveCardTech + groupesTechHtml;

  var yr = new Date().getFullYear();
  document.getElementById('tech-couts').innerHTML =
    '<div class="cout-card"><div class="cout-label">&#9981; Carburant &mdash; '+yr+'</div><div class="cout-val">'+(coutCarburantAnnee>0?fmtNum(coutCarburantAnnee):'—')+'</div><div class="cout-sub">FCFA</div></div>' +
    '<div class="cout-card maint"><div class="cout-label">&#128295; Maintenance &mdash; '+yr+'</div><div class="cout-val" style="color:'+(coutMaintenanceAnnee>0?'var(--orange)':'var(--vert)')+'">'+fmtNum(coutMaintenanceAnnee)+'</div><div class="cout-sub">FCFA</div></div>';

  var elOuv = document.getElementById('tech-pannes-ouvertes');
  if (pannesOuvertes.length) {
    var rowsO = ''; pannesOuvertes.forEach(function(p){rowsO+='<tr><td>'+fmtDate(p.date_panne)+'</td><td>'+(groupeMap[p.groupe_id]||'—')+'</td><td>'+(p.description||panneLabels[p.type]||p.type||'—')+'</td><td><button onclick="resoudrePanne(\''+p.id+'\')" style="background:var(--vert-pale);color:var(--vert);border:1px solid rgba(45,122,79,0.3);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:600">&#10003; R&#233;soudre</button></td></tr>';});
    elOuv.innerHTML = '<table class="data"><thead><tr><th>Date</th><th>Groupe</th><th>Probl&#232;me</th><th>Action</th></tr></thead><tbody>'+rowsO+'</tbody></table>';
  } else { elOuv.innerHTML = '<div class="empty">Aucune panne en cours &#10003;</div>'; }

  var elRes = document.getElementById('tech-pannes-resolues');
  if (pannesResolues.length) {
    var rowsR = ''; pannesResolues.forEach(function(p){rowsR+='<tr><td>'+fmtDate(p.date_resolution||p.date_panne)+'</td><td>'+(groupeMap[p.groupe_id]||'—')+'</td><td>'+(p.description||panneLabels[p.type]||p.type||'—')+'</td><td>'+(p.resolution_note||'—')+'</td><td>'+(p.intervenant||'—')+'</td><td>'+(p.cout_reparation?fmtNum(p.cout_reparation)+' FCFA':'—')+'</td></tr>';});
    elRes.innerHTML = '<table class="data"><thead><tr><th>Date</th><th>Groupe</th><th>Probl&#232;me</th><th>R&#233;solution</th><th>Intervenant</th><th>Co&#251;t</th></tr></thead><tbody>'+rowsR+'</tbody></table>';
  } else { elRes.innerHTML = '<div class="empty">Aucune panne r&#233;solue enregistr&#233;e</div>'; }

  var dates14t=[]; for(var di=0;di<14;di++){var ddt=new Date();ddt.setDate(ddt.getDate()-(13-di));dates14t.push(ddt.toISOString().split('T')[0]);}
  var carbDataTech = dates14t.map(function(d){var sc=null;for(var i=0;i<saisiesCuve30.length;i++){if(saisiesCuve30[i].date===d){sc=saisiesCuve30[i];break;}}return(sc&&sc.niveau_litres!=null)?Math.round(sc.niveau_litres/capCuve*100):null;});
  var validesTech = carbDataTech.filter(function(v){return v!==null;});
  var deltaTech = validesTech.length>=2 ? validesTech[validesTech.length-1]-validesTech[0] : null;
  var tInsEl = document.getElementById('tech-chart-insight');
  if (tInsEl) tInsEl.textContent = deltaTech===null?'Pas assez de données.':deltaTech>=0?'Stable ou en hausse (+'+deltaTech+' pts).':'Baisse de '+Math.abs(deltaTech)+' pts.';
  setTimeout(function(){
    if (_chartTech) _chartTech.destroy();
    var ctx=document.getElementById('tech-chart'); if(!ctx)return;
    var bx=getComputedStyle(document.documentElement).getPropertyValue('--bx').trim()||'#8B1A2E';
    _chartTech=new Chart(ctx.getContext('2d'),{type:'line',data:{labels:dates14t.map(fmtDateShort),datasets:[{data:carbDataTech,borderColor:bx,backgroundColor:bx+'18',borderWidth:1.5,tension:0.3,fill:true,spanGaps:true,pointRadius:3,pointBackgroundColor:bx}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#EDE3D4'},ticks:{color:'#7A6855',font:{size:10}}},y:{grid:{color:'#EDE3D4'},ticks:{color:'#7A6855',font:{size:10},callback:function(v){return v+'%';}},min:0,max:100}}}});
  },100);

  var saisiesMoteur = saisies30.filter(function(s){return s.heures_marche!=null||s.niveau_huile!=null;})
    .sort(function(a,b){return(b.date+((b.created_at||'').slice(11))).localeCompare(a.date+((a.created_at||'').slice(11)));}).slice(0,30);
  var elSai = document.getElementById('tech-saisies');
  if (saisiesMoteur.length) {
    var rowsS=''; saisiesMoteur.forEach(function(s){rowsS+='<tr><td>'+fmtDate(s.date)+'</td><td style="color:var(--texte2)">'+(fmtHeure(s.created_at)||'—')+'</td><td>'+(groupeMap[s.groupe_id]||'—')+'</td><td>'+(s.heures_marche!=null?s.heures_marche+'h':'—')+'</td><td style="color:'+huileColor(s.niveau_huile)+'">'+(s.niveau_huile||'—')+'</td><td>'+(s.operateur||'—')+'</td></tr>';});
    elSai.innerHTML='<table class="data"><thead><tr><th>Date</th><th>Heure</th><th>Groupe</th><th>Compteur</th><th>Huile</th><th>Op&#233;rateur</th></tr></thead><tbody>'+rowsS+'</tbody></table>';
  } else { elSai.innerHTML='<div class="empty">Aucune saisie moteur sur 30 jours</div>'; }

  var cuveTriees = saisiesCuve30.slice().sort(function(a,b){return(b.date+((b.created_at||'').slice(11))).localeCompare(a.date+((a.created_at||'').slice(11)));}).slice(0,30);
  var elCuve = document.getElementById('tech-saisies-cuve');
  if (cuveTriees.length) {
    var rowsC=''; cuveTriees.forEach(function(s){var pctC=s.niveau_litres!=null?Math.round(s.niveau_litres/capCuve*100):null;rowsC+='<tr><td>'+fmtDate(s.date)+'</td><td style="color:var(--texte2)">'+(fmtHeure(s.created_at)||'—')+'</td><td style="color:'+(pctC!=null?carbColor(pctC):'var(--texte2)')+'">'+( s.niveau_litres!=null?s.niveau_litres+'L / '+capCuve+'L ('+pctC+'%)':'—')+'</td><td>'+(s.litres_ajoutes>0?'+'+s.litres_ajoutes+'L':'—')+'</td><td>'+(s.operateur||'—')+'</td></tr>';});
    elCuve.innerHTML='<table class="data"><thead><tr><th>Date</th><th>Heure</th><th>Niveau</th><th>Litres ajout&#233;s</th><th>Op&#233;rateur</th></tr></thead><tbody>'+rowsC+'</tbody></table>';
  } else { elCuve.innerHTML='<div class="empty">Aucun relev&#233; cuve sur 30 jours</div>'; }
}

function resoudrePanne(id) {
  if (!confirm('Marquer cette panne comme résolue ?')) return;
  fetch(SUPA_URL + '/rest/v1/pannes?id=eq.' + id, {
    method: 'PATCH',
    headers: {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body: JSON.stringify({resolue:true, date_resolution:new Date().toISOString().split('T')[0], resolu_via:'Dashboard client'})
  }).then(function(res) {
    if (res.ok) { alert('Panne résolue'); location.reload(); }
    else { alert('Erreur lors de la résolution'); }
  });
}

init();
</script>
