<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>GenTrack · Équipe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --dark:#12151E;--dark2:#1E2332;
  --text:#1A1D28;--text2:#5A5F78;--text3:#9AA0B8;
  --border:#E4E6EF;--bg:#F4F5FA;--white:#FFFFFF;
  --amber:#E8A020;--amber-dark:#B87A10;--amber-pale:#FFF6E0;--amber-border:#F5D080;
  --vert:#1B7A4A;--vert-pale:#E8F7EE;--vert-border:#A8DEC0;
  --rouge:#C0392B;--rouge-pale:#FDF0EE;--rouge-border:#F0B8B2;
  --orange:#D46B0A;--orange-pale:#FEF3E5;--orange-border:#F5C89A;
  --radius:14px;--radius-sm:10px;
  --shadow:0 2px 12px rgba(18,21,30,.07);
}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── Spinner ── */
.eq-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;color:var(--text2);font-size:14px}
.eq-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Header ── */
.eq-header{
  background:linear-gradient(145deg,var(--dark) 0%,var(--dark2) 100%);
  padding:calc(env(safe-area-inset-top,0px)+16px) 18px 18px;
  position:sticky;top:0;z-index:10;
  box-shadow:0 2px 16px rgba(0,0,0,.3);
}
.eq-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.eq-logo{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--amber);text-transform:uppercase}
.eq-site-name{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.01em}
.eq-user-row{display:flex;align-items:center;justify-content:space-between}
.eq-user-name{font-size:13px;color:rgba(255,255,255,.7)}
.eq-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid;cursor:default}
.eq-badge-tech{background:rgba(27,122,74,.25);border-color:rgba(168,222,192,.35);color:#7EE8A2}
.eq-badge-resp{background:rgba(232,160,32,.2);border-color:rgba(245,208,128,.35);color:var(--amber)}
.eq-change-link{font-size:11px;color:rgba(255,255,255,.4);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0}

/* ── KPIs ── */
.eq-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px 16px 0}
.eq-kpi{background:var(--white);border-radius:var(--radius-sm);padding:11px 10px;text-align:center;box-shadow:var(--shadow);border:1.5px solid var(--border)}
.eq-kpi-num{font-size:22px;font-weight:800;line-height:1}
.eq-kpi-label{font-size:10px;color:var(--text3);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;line-height:1.3}
.eq-kpi-num.rouge{color:var(--rouge)}
.eq-kpi-num.orange{color:var(--orange)}
.eq-kpi-num.vert{color:var(--vert)}

/* ── Section header ── */
.eq-section-head{
  display:flex;align-items:center;gap:8px;
  padding:18px 16px 8px;
}
.eq-section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.eq-section-dot.rouge{background:var(--rouge)}
.eq-section-dot.orange{background:var(--orange)}
.eq-section-dot.vert{background:var(--vert)}
.eq-section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.eq-section-label.rouge{color:var(--rouge)}
.eq-section-label.orange{color:var(--orange)}
.eq-section-label.vert{color:var(--vert)}
.eq-section-count{margin-left:auto;font-size:11px;font-weight:700;color:var(--text3)}

/* ── Card signalement ── */
.eq-card{
  background:var(--white);border-radius:var(--radius);
  margin:0 12px 10px;
  box-shadow:var(--shadow);overflow:hidden;
  border:1.5px solid var(--border);
}
.eq-card-body{padding:13px 14px}
.eq-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.eq-card-ref{font-size:11px;font-weight:700;color:var(--amber-dark);background:var(--amber-pale);border:1px solid var(--amber-border);border-radius:5px;padding:2px 7px}
.eq-card-time{font-size:11px;color:var(--text3)}
.eq-card-type{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:3px}
.eq-card-desc{font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:5px}
.eq-card-loc{font-size:12px;color:var(--text3)}
.eq-card-assigned{display:flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--orange-pale);border:1px solid var(--orange-border)}
.eq-card-assigned-prest{background:var(--amber-pale);border-color:var(--amber-border)}
.eq-card-assigned-icon{font-size:14px}
.eq-card-assigned-text{font-size:12px;font-weight:600;color:var(--orange)}
.eq-card-assigned-prest .eq-card-assigned-text{color:var(--amber-dark)}

/* Résolu card */
.eq-card.eq-card-done{opacity:.65;border-color:#D1FAE5;background:#F0FDF4}
.eq-card.eq-card-done .eq-card-desc{color:var(--text2)}

/* ── Actions footer ── */
.eq-card-action{
  border-top:1.5px solid var(--border);
  display:flex;
}
.eq-btn-pec{
  flex:1;padding:12px 10px;border:none;cursor:pointer;
  background:var(--vert-pale);color:var(--vert);
  font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s;
}
.eq-btn-pec:active{background:#C6F0D8}
.eq-btn-aff{
  flex:1;padding:12px 10px;border:none;border-left:1.5px solid var(--border);cursor:pointer;
  background:#F0F7FF;color:#1D4ED8;
  font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s;
}
.eq-btn-aff:active{background:#DBEAFE}

/* ── Identification screen ── */
.eq-id-screen{padding:0 0 calc(env(safe-area-inset-bottom,0px)+24px)}
.eq-id-hero{
  background:linear-gradient(145deg,var(--dark) 0%,var(--dark2) 100%);
  padding:calc(env(safe-area-inset-top,0px)+28px) 24px 32px;
  text-align:center;
}
.eq-id-logo{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--amber);text-transform:uppercase;margin-bottom:16px}
.eq-id-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;letter-spacing:-.02em}
.eq-id-site{font-size:14px;color:rgba(255,255,255,.55);margin-bottom:0}
.eq-id-body{padding:24px 16px 0}
.eq-id-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:10px}
.eq-id-search{
  width:100%;padding:13px 16px 13px 44px;
  border:2px solid var(--border);border-radius:var(--radius-sm);
  font-size:16px;color:var(--text);background:var(--white);outline:none;
  font-family:inherit;transition:border-color .15s;position:relative;
}
.eq-id-search:focus{border-color:var(--amber)}
.eq-id-search-wrap{position:relative;margin-bottom:16px}
.eq-id-search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.eq-id-list{display:flex;flex-direction:column;gap:8px}
.eq-id-item{
  display:flex;align-items:center;gap:12px;
  background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 16px;cursor:pointer;transition:all .15s;
}
.eq-id-item:active{background:var(--amber-pale);border-color:var(--amber-border)}
.eq-id-avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--dark2);color:var(--amber);
  font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.eq-id-avatar.resp{background:var(--amber);color:var(--dark)}
.eq-id-nom{font-size:14px;font-weight:600;color:var(--text)}
.eq-id-role{font-size:11px;color:var(--text3);margin-top:1px}
.eq-id-empty{text-align:center;padding:28px 16px;color:var(--text3);font-size:14px}

/* ── Modal ── */
.eq-modal-overlay{
  position:fixed;inset:0;background:rgba(18,21,30,.55);
  display:none;align-items:flex-end;justify-content:center;z-index:100;
}
.eq-modal-overlay.show{display:flex}
.eq-modal{
  background:var(--white);border-radius:20px 20px 0 0;
  width:100%;max-width:520px;
  padding:0 0 calc(env(safe-area-inset-bottom,0px)+16px);
  max-height:88vh;overflow-y:auto;
}
.eq-modal-handle{width:38px;height:4px;border-radius:2px;background:var(--border);margin:12px auto 0}
.eq-modal-header{padding:16px 18px 12px}
.eq-modal-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:3px}
.eq-modal-sub{font-size:12px;color:var(--text3)}
.eq-modal-section{padding:0 18px}
.eq-modal-section-label{
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text3);padding:10px 0 8px;
  border-top:1.5px solid var(--border);margin-top:8px;
}
.eq-modal-section-label:first-child{border-top:none;margin-top:0}
.eq-pick-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  margin-bottom:7px;cursor:pointer;background:var(--white);transition:all .15s;
}
.eq-pick-item:active{background:var(--bg);border-color:var(--amber)}
.eq-pick-avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--dark2);color:var(--amber);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.eq-pick-avatar.prest{background:#EEF2FF;color:#3730A3}
.eq-pick-nom{font-size:13px;font-weight:600;color:var(--text)}
.eq-pick-info{font-size:11px;color:var(--text3);margin-top:1px}
.eq-pick-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:auto;flex-shrink:0}
.eq-pick-badge.wa{background:var(--vert-pale);color:var(--vert)}
.eq-pick-badge.email{background:#EEF2FF;color:#3730A3}
.eq-modal-cancel{
  display:block;width:calc(100% - 36px);margin:12px 18px 0;
  padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;
}

/* ── Toast ── */
.eq-toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+20px);left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--dark);color:#fff;font-size:13px;font-weight:600;
  padding:10px 20px;border-radius:40px;white-space:nowrap;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:200;pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.eq-toast.show{transform:translateX(-50%) translateY(0)}

/* ── Vide ── */
.eq-empty-section{text-align:center;padding:16px;color:var(--text3);font-size:13px}

/* ── Rafraîchir ── */
.eq-refresh-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px 0;color:var(--text3);font-size:11px}
.eq-refresh-btn{background:none;border:none;color:var(--amber);font-size:11px;font-weight:700;cursor:pointer;padding:0}
.eq-refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--vert);flex-shrink:0}

/* ── Bottom padding ── */
.eq-bottom{height:calc(env(safe-area-inset-bottom,0px)+32px)}

/* ── Invalid ── */
.eq-invalid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
.eq-invalid-icon{font-size:52px;margin-bottom:16px}
.eq-invalid-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px}
.eq-invalid-sub{font-size:14px;color:var(--text2);line-height:1.6}
</style>
</head>
<body>

<div id="eq-loading" class="eq-loading">
  <div class="eq-spinner"></div>
  <span>Chargement…</span>
</div>

<div id="eq-invalid" class="eq-invalid" style="display:none">
  <div class="eq-invalid-icon">⚠️</div>
  <div class="eq-invalid-title">Site introuvable</div>
  <div class="eq-invalid-sub">Ce lien est invalide ou le site n'existe pas.<br>Contactez votre responsable.</div>
</div>

<!-- ── Identification ── -->
<div id="eq-id-screen" class="eq-id-screen" style="display:none">
  <div class="eq-id-hero">
    <div class="eq-id-logo">GenTrack</div>
    <div class="eq-id-title" id="eq-id-site-title">Équipe technique</div>
    <div class="eq-id-site" id="eq-id-site-sub">Choisissez votre nom pour continuer</div>
  </div>
  <div class="eq-id-body">
    <div class="eq-id-label">Qui êtes-vous ?</div>
    <div class="eq-id-search-wrap">
      <span class="eq-id-search-icon">🔍</span>
      <input id="eq-id-search" class="eq-id-search" type="text" placeholder="Tapez votre nom…" oninput="_filterContacts(this.value)" autocomplete="off"/>
    </div>
    <div id="eq-id-list" class="eq-id-list"></div>
  </div>
</div>

<!-- ── Main view ── -->
<div id="eq-main" style="display:none">
  <!-- Header -->
  <div class="eq-header">
    <div class="eq-header-top">
      <div class="eq-logo">GenTrack</div>
      <button class="eq-change-link" onclick="_resetUser()">Changer ↩</button>
    </div>
    <div class="eq-site-name" id="eq-main-site"></div>
    <div class="eq-user-row" style="margin-top:6px">
      <span class="eq-user-name" id="eq-main-user"></span>
      <span class="eq-badge" id="eq-main-badge"></span>
    </div>
  </div>

  <!-- KPIs -->
  <div class="eq-kpis">
    <div class="eq-kpi">
      <div class="eq-kpi-num rouge" id="kpi-ouvert">—</div>
      <div class="eq-kpi-label">Non pris en charge</div>
    </div>
    <div class="eq-kpi">
      <div class="eq-kpi-num orange" id="kpi-en-cours">—</div>
      <div class="eq-kpi-label">En cours</div>
    </div>
    <div class="eq-kpi">
      <div class="eq-kpi-num vert" id="kpi-resolu">—</div>
      <div class="eq-kpi-label">Résolus aujourd'hui</div>
    </div>
  </div>

  <!-- Refresh row -->
  <div class="eq-refresh-row">
    <span class="eq-refresh-dot" id="eq-live-dot"></span>
    <span id="eq-last-update">Mise à jour…</span>
    <button class="eq-refresh-btn" onclick="_loadSignalements()">↻ Actualiser</button>
  </div>

  <!-- Signalements -->
  <div id="eq-sigs-container" style="padding-top:4px">
    <!-- rendered by JS -->
  </div>

  <div class="eq-bottom"></div>
</div>

<!-- ── Modal Affecter ── -->
<div id="eq-modal" class="eq-modal-overlay" onclick="_closeModalOutside(event)">
  <div class="eq-modal" id="eq-modal-box">
    <div class="eq-modal-handle"></div>
    <div class="eq-modal-header">
      <div class="eq-modal-title" id="eq-modal-title">Affecter le signalement</div>
      <div class="eq-modal-sub" id="eq-modal-sub"></div>
    </div>
    <div class="eq-modal-section" id="eq-modal-content"></div>
    <div class="eq-modal-section">
      <button class="eq-modal-cancel" onclick="_closeModal()">Annuler</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="eq-toast" id="eq-toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
var SUPA_URL='https://zbpoxjlkqxnqjzxohasq.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicG94amxrcXhucWp6eG9oYXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjM3ODAsImV4cCI6MjA5NzA5OTc4MH0.9-QyWgon93jGDo5QKMIh_-QbQZ_P9rQrYJnVxegJe7M';
var APP_URL='https://gen-track.vercel.app';

var TYPE_LABELS={panne:'⚡ Panne',anomalie:'👁 Anomalie',bruit:'🔊 Bruit anormal',odeur:'💨 Odeur suspecte',fuite:'💧 Fuite',seuil:'📈 Seuil dépassé',autre:'📝 Autre'};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
var _siteId=null;
var _siteNom='';
var _user=null; // {id, nom, role, whatsapp}
var _contacts=[]; // all contacts for site
var _prestataires=[]; // prestataires for site
var _sigs=[]; // current signalements
var _modalSgId=null;
var _modalRef=null;
var _refreshTimer=null;

// ═══════════════════════════════════════════════════════════
// SUPABASE HELPERS
// ═══════════════════════════════════════════════════════════
function supa(table,query){
  return fetch(SUPA_URL+'/rest/v1/'+table+'?'+query,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Accept':'application/json'}
  }).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];});
}
function supaPatch(table,id,data){
  return fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id,{
    method:'PATCH',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify(data)
  });
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function _esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function _initials(nom){
  if(!nom)return '?';
  var parts=nom.trim().split(/\s+/);
  if(parts.length>=2)return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
  return nom.slice(0,2).toUpperCase();
}
function _timeAgo(isoStr){
  var d=new Date(isoStr);
  var now=new Date();
  var mins=Math.floor((now-d)/60000);
  if(mins<1)return 'À l\'instant';
  if(mins<60)return mins+'min';
  var hrs=Math.floor(mins/60);
  if(hrs<24)return hrs+'h';
  return Math.floor(hrs/24)+'j';
}
function _today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function _toast(msg,duration){
  var t=document.getElementById('eq-toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},duration||2500);
}
function _show(id){document.getElementById(id).style.display='';}
function _hide(id){document.getElementById(id).style.display='none';}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init(){
  var params=new URLSearchParams(location.search);
  _siteId=params.get('site');
  if(!_siteId){_hide('eq-loading');_show('eq-invalid');return;}

  // Load site info
  var sites=await supa('sites','id=eq.'+_siteId+'&select=id,nom');
  if(!sites||!sites[0]){_hide('eq-loading');_show('eq-invalid');return;}
  _siteNom=sites[0].nom||'';

  // Load contacts + prestataires in parallel
  var [contacts,prests]=await Promise.all([
    supa('contacts','site_id=eq.'+_siteId+'&actif=eq.true&role=in.(technicien,resp_tech)&order=nom.asc&select=id,nom,role,whatsapp'),
    supa('prestataires','site_id=eq.'+_siteId+'&actif=eq.true&order=nom.asc&select=id,nom,telephone,specialite,email')
  ]);
  _contacts=contacts||[];
  _prestataires=prests||[];

  _hide('eq-loading');

  // Check localStorage for saved user
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem('eq_user_'+_siteId)||'null');}catch(e){}
  if(saved&&saved.id&&_contacts.find(function(c){return c.id===saved.id;})){
    _user=saved;
    _showMain();
  } else {
    _showId();
  }
}

// ═══════════════════════════════════════════════════════════
// IDENTIFICATION SCREEN
// ═══════════════════════════════════════════════════════════
function _showId(){
  document.getElementById('eq-id-site-title').textContent=_siteNom;
  document.getElementById('eq-id-site-sub').textContent='Choisissez votre nom pour continuer';
  _renderContactList('');
  _show('eq-id-screen');
}

function _filterContacts(q){
  _renderContactList(q);
}

function _renderContactList(q){
  var list=document.getElementById('eq-id-list');
  var filtered=_contacts.filter(function(c){
    return !q||c.nom.toLowerCase().includes(q.toLowerCase());
  });
  if(!filtered.length){
    list.innerHTML='<div class="eq-id-empty">Aucun technicien trouvé</div>';
    return;
  }
  list.innerHTML=filtered.map(function(c){
    var ini=_initials(c.nom);
    var isResp=c.role==='resp_tech';
    var roleLabel=isResp?'Responsable technique':'Technicien';
    return '<div class="eq-id-item" onclick="_selectUser(\''+c.id+'\')">'+
      '<div class="eq-id-avatar'+(isResp?' resp':'')+'">'+_esc(ini)+'</div>'+
      '<div>'+
        '<div class="eq-id-nom">'+_esc(c.nom)+'</div>'+
        '<div class="eq-id-role">'+_esc(roleLabel)+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function _selectUser(contactId){
  var c=_contacts.find(function(x){return x.id===contactId;});
  if(!c)return;
  _user=c;
  try{localStorage.setItem('eq_user_'+_siteId,JSON.stringify(c));}catch(e){}
  _hide('eq-id-screen');
  _showMain();
}

function _resetUser(){
  _user=null;
  try{localStorage.removeItem('eq_user_'+_siteId);}catch(e){}
  _hide('eq-main');
  if(_refreshTimer)clearInterval(_refreshTimer);
  document.getElementById('eq-id-search').value='';
  _renderContactList('');
  _show('eq-id-screen');
}

// ═══════════════════════════════════════════════════════════
// MAIN VIEW
// ═══════════════════════════════════════════════════════════
function _showMain(){
  var isResp=_user&&_user.role==='resp_tech';
  document.getElementById('eq-main-site').textContent=_siteNom;
  document.getElementById('eq-main-user').textContent=_user?_user.nom:'';
  var badge=document.getElementById('eq-main-badge');
  badge.textContent=isResp?'Resp. Tech':'Technicien';
  badge.className='eq-badge '+(isResp?'eq-badge-resp':'eq-badge-tech');
  _show('eq-main');
  _loadSignalements();
  // Auto-refresh every 30s
  if(_refreshTimer)clearInterval(_refreshTimer);
  _refreshTimer=setInterval(_loadSignalements,30000);
}

async function _loadSignalements(){
  var today=_today();
  // Load open + en_cours + resolu today
  var [ouvert,enCours,resolus]=await Promise.all([
    supa('signalements',
      'site_id=eq.'+_siteId+
      '&statut=eq.ouvert'+
      '&select=id,ref_code,type,description,lieu,statut,assigne_a,pris_en_charge_par,created_at,prestataire_id'+
      '&order=created_at.desc'
    ),
    supa('signalements',
      'site_id=eq.'+_siteId+
      '&statut=eq.en_cours'+
      '&select=id,ref_code,type,description,lieu,statut,assigne_a,pris_en_charge_par,created_at,prestataire_id'+
      '&order=created_at.desc'
    ),
    supa('signalements',
      'site_id=eq.'+_siteId+
      '&statut=eq.resolu'+
      '&resolved_at=gte.'+today+'T00:00:00'+
      '&select=id,ref_code,type,description,lieu,statut,assigne_a,resolved_at,created_at'+
      '&order=resolved_at.desc&limit=20'
    )
  ]);
  _sigs={ouvert:ouvert||[],enCours:enCours||[],resolus:resolus||[]};

  // KPIs
  document.getElementById('kpi-ouvert').textContent=_sigs.ouvert.length;
  document.getElementById('kpi-en-cours').textContent=_sigs.enCours.length;
  document.getElementById('kpi-resolu').textContent=_sigs.resolus.length;

  // Refresh timestamp
  var now=new Date();
  document.getElementById('eq-last-update').textContent=
    'Mis à jour à '+now.getHours()+'h'+String(now.getMinutes()).padStart(2,'0');

  _renderSignalements();
}

function _renderSignalements(){
  var isResp=_user&&_user.role==='resp_tech';
  var html='';

  // ── OUVERT ──
  html+=_sectionHead('rouge','Non pris en charge',_sigs.ouvert.length);
  if(_sigs.ouvert.length){
    html+=_sigs.ouvert.map(function(sg){return _cardHtml(sg,'ouvert',isResp);}).join('');
  } else {
    html+='<div class="eq-empty-section">✅ Aucun signalement en attente</div>';
  }

  // ── EN COURS ──
  html+=_sectionHead('orange','En cours',_sigs.enCours.length);
  if(_sigs.enCours.length){
    html+=_sigs.enCours.map(function(sg){return _cardHtml(sg,'en_cours',isResp);}).join('');
  } else {
    html+='<div class="eq-empty-section">Aucun signalement en cours</div>';
  }

  // ── RÉSOLUS ──
  if(_sigs.resolus.length){
    html+=_sectionHead('vert','Résolus aujourd\'hui',_sigs.resolus.length);
    html+=_sigs.resolus.map(function(sg){return _cardHtml(sg,'resolu',isResp);}).join('');
  }

  document.getElementById('eq-sigs-container').innerHTML=html;
}

function _sectionHead(color,label,count){
  return '<div class="eq-section-head">'+
    '<span class="eq-section-dot '+color+'"></span>'+
    '<span class="eq-section-label '+color+'">'+_esc(label)+'</span>'+
    '<span class="eq-section-count">'+count+'</span>'+
  '</div>';
}

function _cardHtml(sg,status,isResp){
  var typeLabel=TYPE_LABELS[sg.type]||sg.type||'Signalement';
  var ref=sg.ref_code||'';
  var ago=_timeAgo(sg.created_at);
  var desc=sg.description||'';
  var lieu=sg.lieu||'';

  var bodyHtml=
    '<div class="eq-card-body">'+
      '<div class="eq-card-header">'+
        (ref?'<span class="eq-card-ref">'+_esc(ref)+'</span>':'<span></span>')+
        '<span class="eq-card-time">'+_esc(ago)+'</span>'+
      '</div>'+
      '<div class="eq-card-type">'+_esc(typeLabel)+'</div>'+
      '<div class="eq-card-desc">'+_esc(desc)+'</div>'+
      (lieu?'<div class="eq-card-loc">📍 '+_esc(lieu)+'</div>':'')+
    '</div>';

  // Assigned badge
  if(status==='en_cours'){
    var assignedNom=sg.pris_en_charge_par||sg.assigne_a||'';
    var isPrest=!!sg.prestataire_id;
    if(assignedNom){
      bodyHtml+=
        '<div class="eq-card-body" style="padding-top:0">'+
          '<div class="eq-card-assigned'+(isPrest?' eq-card-assigned-prest':'')+'">'+
            '<span class="eq-card-assigned-icon">'+(isPrest?'🔧':'👷')+'</span>'+
            '<span class="eq-card-assigned-text">'+_esc(assignedNom)+(isPrest?' (prestataire)':' — en cours')+'</span>'+
          '</div>'+
        '</div>';
    }
  }

  // Action footer
  var actionHtml='';
  if(status==='ouvert'){
    if(isResp){
      // resp_tech: both PEC and Affecter
      actionHtml='<div class="eq-card-action">'+
        '<button class="eq-btn-pec" onclick="_pec(\''+_esc(sg.id)+'\',\''+_esc(ref||sg.id)+'\')">✋ Prendre en charge</button>'+
        '<button class="eq-btn-aff" onclick="_showAffecterModal(\''+_esc(sg.id)+'\',\''+_esc(ref||sg.id)+'\',\''+_esc(desc)+'\')">👷 Affecter</button>'+
      '</div>';
    } else {
      // tech: only PEC
      actionHtml='<div class="eq-card-action">'+
        '<button class="eq-btn-pec" onclick="_pec(\''+_esc(sg.id)+'\',\''+_esc(ref||sg.id)+'\')">✋ Prendre en charge → ouvrir le rapport</button>'+
      '</div>';
    }
  }

  return '<div class="eq-card'+(status==='resolu'?' eq-card-done':'')+'">'+bodyHtml+actionHtml+'</div>';
}

// ═══════════════════════════════════════════════════════════
// PRISE EN CHARGE
// ═══════════════════════════════════════════════════════════
async function _pec(sgId,ref){
  if(!_user){_toast('⚠️ Identifiez-vous d\'abord');return;}
  _toast('⏳ Prise en charge…',1500);
  var now=new Date().toISOString();
  await supaPatch('signalements',sgId,{
    statut:'en_cours',
    pris_en_charge_par:_user.nom,
    pris_en_charge_at:now,
    assigne_a:_user.nom
  });
  // Notify resp_tech (light WA — option A)
  _notifyEquipe({action:'pec',signalement_id:sgId,tech_nom:_user.nom}).catch(function(){});
  // Reload data
  await _loadSignalements();
  _toast('✅ Pris en charge !');
  // Open rapport in new tab
  var url=APP_URL+'/rapport.html?sg='+encodeURIComponent(sgId);
  window.open(url,'_blank');
}

// ═══════════════════════════════════════════════════════════
// MODAL AFFECTER
// ═══════════════════════════════════════════════════════════
function _showAffecterModal(sgId,ref,desc){
  _modalSgId=sgId;
  _modalRef=ref;
  document.getElementById('eq-modal-title').textContent='Affecter — '+ref;
  document.getElementById('eq-modal-sub').textContent=desc?desc.slice(0,60)+(desc.length>60?'…':''):'';

  var html='';

  // Section tech internes
  var techs=_contacts.filter(function(c){return c.role==='technicien';});
  if(techs.length){
    html+='<div class="eq-modal-section-label">Technicien interne</div>';
    html+=techs.map(function(c){
      var ini=_initials(c.nom);
      var haWa=!!c.whatsapp;
      return '<div class="eq-pick-item" onclick="_affecterTech(\''+_esc(c.id)+'\',\''+_esc(c.nom)+'\',\''+_esc(c.whatsapp||'')+'\')">'+
        '<div class="eq-pick-avatar">'+_esc(ini)+'</div>'+
        '<div>'+
          '<div class="eq-pick-nom">'+_esc(c.nom)+'</div>'+
          '<div class="eq-pick-info">'+(haWa?'📱 WA + rapport envoyé':'Rapport envoyé par lien')+'</div>'+
        '</div>'+
        (haWa?'<span class="eq-pick-badge wa">WA</span>':'')+
      '</div>';
    }).join('');
  }

  // Section prestataires
  if(_prestataires.length){
    html+='<div class="eq-modal-section-label">Prestataire externe</div>';
    html+=_prestataires.map(function(p){
      var ini=_initials(p.nom);
      var hasWa=!!(p.telephone);
      var hasEmail=!!(p.email);
      var channels=[];
      if(hasWa)channels.push('<span class="eq-pick-badge wa">WA</span>');
      if(hasEmail)channels.push('<span class="eq-pick-badge email">Email</span>');
      return '<div class="eq-pick-item" onclick="_affecterPrestataire(\''+_esc(p.id)+'\',\''+_esc(p.nom)+'\',\''+_esc(p.telephone||'')+'\',\''+_esc(p.email||'')+'\')">'+
        '<div class="eq-pick-avatar prest">'+_esc(ini)+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div class="eq-pick-nom">'+_esc(p.nom)+(p.specialite?' <span style="font-weight:400;color:var(--text3)">· '+_esc(p.specialite)+'</span>':'')+'</div>'+
          '<div class="eq-pick-info">'+(hasWa?'📱 '+p.telephone:'')+(hasEmail&&hasWa?' · ':'')+(hasEmail?'📧 '+p.email:'')+'</div>'+
        '</div>'+
        '<div style="display:flex;gap:3px;flex-shrink:0">'+channels.join('')+'</div>'+
      '</div>';
    }).join('');
  }

  if(!techs.length&&!_prestataires.length){
    html='<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px">Aucun technicien ni prestataire configuré pour ce site.</div>';
  }

  document.getElementById('eq-modal-content').innerHTML=html;
  document.getElementById('eq-modal').classList.add('show');
}

function _closeModal(){
  document.getElementById('eq-modal').classList.remove('show');
  _modalSgId=null;_modalRef=null;
}
function _closeModalOutside(e){
  if(e.target===document.getElementById('eq-modal'))_closeModal();
}

// ─── Affecter à un technicien interne ───────────────────────
async function _affecterTech(techId,techNom,techWa){
  if(!_modalSgId)return;
  var sgId=_modalSgId,ref=_modalRef;
  _closeModal();
  _toast('⏳ Affectation…',1500);
  var now=new Date().toISOString();
  await supaPatch('signalements',sgId,{
    statut:'en_cours',
    assigne_a:techNom,
    pris_en_charge_par:techNom,
    pris_en_charge_at:now,
    prestataire_id:null
  });
  var rapportUrl=APP_URL+'/rapport.html?sg='+encodeURIComponent(sgId);
  _notifyEquipe({
    action:'affecter_tech',
    signalement_id:sgId,
    tech_nom:techNom,
    tech_wa:techWa,
    rapport_url:rapportUrl
  }).catch(function(){});
  await _loadSignalements();
  _toast('✅ Assigné à '+techNom+' — notifié WA');
}

// ─── Affecter à un prestataire ──────────────────────────────
async function _affecterPrestataire(prestId,prestNom,prestTel,prestEmail){
  if(!_modalSgId)return;
  var sgId=_modalSgId,ref=_modalRef;
  _closeModal();
  _toast('⏳ Affectation…',1500);
  var now=new Date().toISOString();
  await supaPatch('signalements',sgId,{
    statut:'en_cours',
    assigne_a:prestNom,
    pris_en_charge_par:prestNom,
    pris_en_charge_at:now,
    prestataire_id:prestId
  });
  var rapportUrl=APP_URL+'/rapport.html?sg='+encodeURIComponent(sgId);
  _notifyEquipe({
    action:'affecter_prestataire',
    signalement_id:sgId,
    prest_nom:prestNom,
    prest_tel:prestTel,
    prest_email:prestEmail,
    rapport_url:rapportUrl
  }).catch(function(){});
  await _loadSignalements();
  var channels=[];
  if(prestTel)channels.push('WA');
  if(prestEmail)channels.push('Email');
  _toast('✅ Assigné à '+prestNom+(channels.length?' — '+channels.join(' + '):''));
}

// ═══════════════════════════════════════════════════════════
// NOTIFY-EQUIPE edge function call
// ═══════════════════════════════════════════════════════════
function _notifyEquipe(payload){
  return fetch(SUPA_URL+'/functions/v1/notify-equipe',{
    method:'POST',
    headers:{
      'apikey':SUPA_KEY,
      'Authorization':'Bearer '+SUPA_KEY,
      'Content-Type':'application/json'
    },
    body:JSON.stringify(payload)
  });
}

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
init();
</script>
</body>
</html>
