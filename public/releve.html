<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>GenTrack · Relevé horaire</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --dark:#1A1A1A;--text:#2C2C2C;--text2:#5A5A5A;--text3:#9A9A9A;
    --border:#E5E0D8;--creme:#F7F4EF;--white:#FFFFFF;
    --amber:#D4A017;--amber-dark:#9A780E;--amber-light:#FDF3D0;
    --vert:#2D6A4F;--vert-pale:rgba(45,106,79,.08);--vert-border:rgba(45,106,79,.2);--vert-light:#D8F0E6;
    --rouge:#C0392B;--rouge-pale:rgba(192,57,43,.07);--rouge-border:rgba(192,57,43,.2);--rouge-light:#FAE0DE;
    --orange:#D4661A;--orange-pale:rgba(212,102,26,.08);--orange-border:rgba(212,102,26,.2);
    --bleu:#2B5BA8;--bleu-pale:rgba(43,91,168,.07);
    --radius:14px;--shadow:0 2px 12px rgba(0,0,0,.08);
  }
  body{background:var(--creme);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);min-height:100vh}

  /* ── HEADER ── */
  .rh-header{background:var(--dark);padding:env(safe-area-inset-top,16px) 20px 16px;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
  .rh-logo{font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--amber);text-transform:uppercase;margin-bottom:10px}
  .rh-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:2px}
  .rh-meta{display:flex;justify-content:space-between;align-items:center}
  .rh-site{font-size:13px;color:rgba(255,255,255,.6)}
  .rh-time{font-size:13px;font-weight:700;color:var(--amber)}

  /* ── CONTENT ── */
  .rh-content{padding:20px 16px 120px}

  /* ── SECTION ── */
  .rh-section{margin-bottom:24px}
  .rh-section-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .rh-section-icon{font-size:16px}
  .rh-section-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text3)}

  /* ── QUESTION CARD ── */
  .rh-card{background:white;border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
  .rh-card.ok{border-color:var(--vert-border)}
  .rh-card.warn{border-color:var(--rouge-border);background:var(--rouge-pale);box-shadow:0 0 0 3px rgba(192,57,43,.06)}
  .rh-card-inner{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .rh-card-info{flex:1;min-width:0}
  .rh-card-eq{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:2px}
  .rh-card-seuil{font-size:11px;color:var(--text3)}
  .rh-card-seuil.warn{color:var(--rouge);font-weight:600}
  .rh-card-input-wrap{display:flex;align-items:center;gap:6px}
  .rh-card-input{
    width:100px;border:2px solid var(--border);border-radius:10px;
    padding:10px 12px;font-size:22px;font-weight:700;text-align:center;
    color:var(--dark);background:var(--creme);outline:none;
    transition:border-color .15s,background .15s;
    -moz-appearance:textfield;
  }
  .rh-card-input::-webkit-inner-spin-button,.rh-card-input::-webkit-outer-spin-button{-webkit-appearance:none}
  .rh-card-input:focus{border-color:var(--amber);background:#fff}
  .rh-card.warn .rh-card-input{border-color:var(--rouge);background:var(--rouge-pale)}
  .rh-card.ok .rh-card-input{border-color:var(--vert-border)}
  .rh-card-unit{font-size:13px;color:var(--text3);font-weight:600;white-space:nowrap}

  /* OUI/NON */
  .rh-oui-non{display:flex;gap:8px}
  .rh-yn-btn{flex:1;border:2px solid var(--border);border-radius:10px;padding:10px;font-size:14px;font-weight:700;background:white;cursor:pointer;color:var(--text2);transition:all .15s}
  .rh-yn-btn.selected-oui{border-color:var(--vert);background:var(--vert-light);color:var(--vert)}
  .rh-yn-btn.selected-non{border-color:var(--rouge);background:var(--rouge-pale);color:var(--rouge)}

  /* ── ALERTE BANNER ── */
  .rh-alerte-banner{background:var(--rouge-pale);border:1.5px solid var(--rouge-border);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:none}
  .rh-alerte-banner.show{display:flex;align-items:flex-start;gap:10px}
  .rh-alerte-icon{font-size:16px;flex-shrink:0;margin-top:1px}
  .rh-alerte-text{font-size:12px;color:var(--rouge);font-weight:600;line-height:1.4}

  /* ── FOOTER ── */
  .rh-footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1.5px solid var(--border);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .rh-progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:12px;overflow:hidden}
  .rh-progress-bar{height:100%;background:var(--vert);border-radius:2px;transition:width .3s}
  .rh-submit-btn{width:100%;background:var(--dark);color:white;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:opacity .15s}
  .rh-submit-btn:active{opacity:.8}
  .rh-submit-btn:disabled{opacity:.4;cursor:default}
  .rh-footer-meta{text-align:center;font-size:11px;color:var(--text3);margin-top:8px}

  /* ── ÉTATS ── */
  .rh-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:32px 24px;text-align:center}
  .rh-state-icon{font-size:56px;margin-bottom:20px}
  .rh-state-title{font-size:20px;font-weight:800;color:var(--dark);margin-bottom:8px}
  .rh-state-sub{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:24px}
  .rh-confirm-pill{display:inline-flex;align-items:center;gap:6px;background:var(--vert-light);border:1.5px solid var(--vert-border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--vert);margin-bottom:8px}
  .rh-confirm-detail{font-size:12px;color:var(--text2);margin-top:4px}
  .rh-alerte-confirm-pill{display:inline-flex;align-items:center;gap:6px;background:var(--rouge-pale);border:1.5px solid var(--rouge-border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--rouge);margin-bottom:8px}
  .rh-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app"></div>

<script>
var SUPA_URL='https://zbpoxjlkqxnqjzxohasq.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicG94amxrcXhucWp6eG9oYXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1OTIxODksImV4cCI6MjA5NzE2ODE4OX0.PdPWAIZRiHbMUGWYpELMmgYPKuFoZiHkNFLEWq0bXoM';

var _releve=null;
var _equips=[];
var _questions=[];
var _answers={};  // questionId -> value
var _clock=null;

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function supa(table,filter){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?'+filter,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  });
  return r.json();
}

async function supaPost(table,data){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table,{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(data)
  });
  var rows=await r.json();
  return Array.isArray(rows)?rows[0]:rows;
}

async function supaPatch(table,id,data){
  await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id,{
    method:'PATCH',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify(data)
  });
}

function showState(icon,title,sub,extra){
  document.getElementById('app').innerHTML=
    '<div class="rh-header"><div class="rh-logo">GenTrack ✦</div></div>'+
    '<div class="rh-state">'+
      '<div class="rh-state-icon">'+icon+'</div>'+
      '<div class="rh-state-title">'+title+'</div>'+
      '<div class="rh-state-sub">'+sub+'</div>'+
      (extra||'')+
    '</div>';
}

function showLoading(){
  document.getElementById('app').innerHTML=
    '<div class="rh-header"><div class="rh-logo">GenTrack ✦</div></div>'+
    '<div class="rh-state"><div class="rh-spinner"></div><div class="rh-state-sub">Chargement du relevé…</div></div>';
}

async function init(){
  showLoading();
  var params=new URLSearchParams(location.search);
  var token=params.get('token');
  if(!token){showState('🔗','Lien invalide','Aucun token trouvé dans l\'URL.');return;}

  // Fetch releve by token
  var rows=await supa('releves_horaires','token=eq.'+token+'&select=*');
  if(!rows||!rows.length){showState('❌','Lien invalide','Ce relevé n\'existe pas.');return;}
  _releve=rows[0];

  if(_releve.statut==='validé'){
    showConfirmation(true);
    return;
  }

  // Check expiry
  if(new Date(_releve.expires_at)<new Date()){
    await supaPatch('releves_horaires',_releve.id,{statut:'expiré'});
    showState('⏰','Relevé expiré','Ce lien était valable 4h. Demandez au responsable d\'en générer un nouveau.','<div class="rh-confirm-detail">Expiré à '+(new Date(_releve.expires_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}))+'</div>');
    return;
  }

  // Fetch site
  var sites=await supa('sites','id=eq.'+_releve.site_id+'&select=nom,client_id,clients(nom)');
  var site=sites&&sites[0];

  // Fetch contact
  var contactNom='Technicien';
  if(_releve.contact_id){
    var contacts=await supa('contacts','id=eq.'+_releve.contact_id+'&select=nom');
    if(contacts&&contacts[0])contactNom=contacts[0].nom;
  }

  // Fetch active equipments with type
  _equips=await supa('equipements','site_id=eq.'+_releve.site_id+'&actif=eq.true&select=id,nom,type_id,types_equipements(nom,icone)&order=ordre_ronde.asc');

  if(!_equips.length){showState('⚙️','Aucun équipement','Aucun équipement actif configuré sur ce site.');return;}

  var eqIds=_equips.map(function(e){return e.id;});

  // Fetch journalier numeric questions
  _questions=await supa('questions',
    'equipement_id=in.('+eqIds.join(',')+')'+'&actif=eq.true&frequences=cs.{journalier}&select=id,texte,type_reponse,unite,seuil_min,seuil_max,alerte_severite,equipement_id,ordre&order=ordre.asc'
  );

  if(!_questions.length){showState('📋','Aucune question','Aucune question journalière configurée pour ce site.');return;}

  _renderForm(site,contactNom);
}

var _TYPE_ICONS={'Groupe électrogène':'⚡','Cuve fioul':'🛢️','Chambre froide':'❄️','Groupe eau glacée':'💧','Piscine':'🏊','Climatisation centralisée':'🌀','TGBT':'🔌','Ascenseur':'🛗','Chauffe-eau':'🌡️'};

function _renderForm(site,contactNom){
  var siteNom=(site&&site.nom)||'Hôtel';
  var now=new Date();
  var hhmm=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  var expHhmm=new Date(_releve.expires_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

  // Group questions by equipement
  var byEq={};
  _questions.forEach(function(q){
    if(!byEq[q.equipement_id])byEq[q.equipement_id]=[];
    byEq[q.equipement_id].push(q);
  });

  // Group equipements by type
  var byType={};
  _equips.forEach(function(e){
    if(!byEq[e.id]||!byEq[e.id].length)return; // skip equips with no questions
    var tNom=(e.types_equipements&&e.types_equipements.nom)||'Équipements';
    if(!byType[tNom])byType[tNom]=[];
    byType[tNom].push(e);
  });

  if(!Object.keys(byType).length){showState('📋','Aucune question','Configurez des questions journalières dans le dashboard.');return;}

  var sections='';
  Object.keys(byType).forEach(function(tNom){
    var tEquips=byType[tNom];
    var tIcon=_TYPE_ICONS[tNom]||'⚙️';
    var cards='';
    tEquips.forEach(function(e){
      var qs=byEq[e.id]||[];
      qs.forEach(function(q){
        if(q.type_reponse==='oui_non'){
          cards+=_renderOuiNon(q,e);
        } else {
          cards+=_renderNumeric(q,e);
        }
      });
    });
    sections+='<div class="rh-section">'+
      '<div class="rh-section-header">'+
        '<span class="rh-section-icon">'+tIcon+'</span>'+
        '<span class="rh-section-title">'+h(tNom)+'</span>'+
      '</div>'+
      cards+
    '</div>';
  });

  var total=_questions.length;

  document.getElementById('app').innerHTML=
    '<div class="rh-header">'+
      '<div class="rh-logo">GenTrack ✦</div>'+
      '<div class="rh-title">Relevé horaire</div>'+
      '<div class="rh-meta">'+
        '<span class="rh-site">'+h(siteNom)+' · '+h(contactNom)+'</span>'+
        '<span class="rh-time" id="rh-clock">'+hhmm+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="rh-content">'+
      '<div class="rh-alerte-banner" id="rh-alerte-banner">'+
        '<span class="rh-alerte-icon">⚠️</span>'+
        '<span class="rh-alerte-text" id="rh-alerte-text"></span>'+
      '</div>'+
      sections+
    '</div>'+
    '<div class="rh-footer">'+
      '<div class="rh-progress"><div class="rh-progress-bar" id="rh-progress" style="width:0%"></div></div>'+
      '<button class="rh-submit-btn" id="rh-submit" onclick="_submitReleve()" disabled>Valider le relevé</button>'+
      '<div class="rh-footer-meta">Lien valable jusqu\'à '+expHhmm+' · '+total+' mesure'+(total!==1?'s':'')+' à saisir</div>'+
    '</div>';

  // Live clock
  _clock=setInterval(function(){
    var el=document.getElementById('rh-clock');
    if(el)el.textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  },30000);
}

function _renderNumeric(q,e){
  var seuilInfo='';
  if(q.seuil_min!=null&&q.seuil_max!=null)seuilInfo=q.seuil_min+' – '+q.seuil_max+(q.unite?' '+q.unite:'');
  else if(q.seuil_min!=null)seuilInfo='min '+q.seuil_min+(q.unite?' '+q.unite:'');
  else if(q.seuil_max!=null)seuilInfo='max '+q.seuil_max+(q.unite?' '+q.unite:'');
  return '<div class="rh-card" id="card-'+q.id+'">'+
    '<div class="rh-card-inner">'+
      '<div class="rh-card-info">'+
        '<div class="rh-card-eq">'+h(e.nom)+'</div>'+
        '<div class="rh-card-seuil" id="seuil-'+q.id+'">'+(seuilInfo?h(q.texte)+' · '+seuilInfo:h(q.texte))+'</div>'+
      '</div>'+
      '<div class="rh-card-input-wrap">'+
        '<input class="rh-card-input" type="number" inputmode="decimal" id="inp-'+q.id+'" placeholder="—" '+
          'oninput="_onInput(\''+q.id+'\',\'numeric\','+q.seuil_min+','+q.seuil_max+')" />'+
        '<span class="rh-card-unit">'+h(q.unite||'')+'</span>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function _renderOuiNon(q,e){
  return '<div class="rh-card" id="card-'+q.id+'">'+
    '<div class="rh-card-inner" style="flex-direction:column;align-items:stretch;gap:10px">'+
      '<div class="rh-card-info">'+
        '<div class="rh-card-eq">'+h(e.nom)+'</div>'+
        '<div class="rh-card-seuil">'+h(q.texte)+'</div>'+
      '</div>'+
      '<div class="rh-oui-non">'+
        '<button class="rh-yn-btn" id="yn-oui-'+q.id+'" onclick="_onYN(\''+q.id+'\',\'Oui\')">✅ Oui</button>'+
        '<button class="rh-yn-btn" id="yn-non-'+q.id+'" onclick="_onYN(\''+q.id+'\',\'Non\')">❌ Non</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function _onYN(qId,val){
  _answers[qId]=val;
  var bOui=document.getElementById('yn-oui-'+qId);
  var bNon=document.getElementById('yn-non-'+qId);
  if(bOui)bOui.className='rh-yn-btn'+(val==='Oui'?' selected-oui':'');
  if(bNon)bNon.className='rh-yn-btn'+(val==='Non'?' selected-non':'');
  _updateProgress();
}

function _onInput(qId,type,seuilMin,seuilMax){
  var inp=document.getElementById('inp-'+qId);
  if(!inp)return;
  var raw=inp.value.trim();
  var val=raw===''?null:parseFloat(raw.replace(',','.'));
  _answers[qId]=raw===''?null:raw;

  var card=document.getElementById('card-'+qId);
  var seuilEl=document.getElementById('seuil-'+qId);
  var warn=false;
  var warnMsg='';

  if(val!==null&&!isNaN(val)){
    if(seuilMin!==null&&seuilMin!=='null'&&val<parseFloat(seuilMin)){
      warn=true; warnMsg='⚠️ Valeur en dessous du seuil min ('+seuilMin+')';
    }
    if(seuilMax!==null&&seuilMax!=='null'&&val>parseFloat(seuilMax)){
      warn=true; warnMsg='⚠️ Valeur au dessus du seuil max ('+seuilMax+')';
    }
  }

  if(card){card.className='rh-card'+(warn?' warn':(val!==null&&!isNaN(val)?' ok':''));}
  if(seuilEl){
    seuilEl.className='rh-card-seuil'+(warn?' warn':'');
    if(warn)seuilEl.textContent=warnMsg;
    else{
      var q=_questions.find(function(q){return q.id===qId;});
      var seuilInfo='';
      if(q){
        if(q.seuil_min!=null&&q.seuil_max!=null)seuilInfo=q.seuil_min+' – '+q.seuil_max+(q.unite?' '+q.unite:'');
        else if(q.seuil_min!=null)seuilInfo='min '+q.seuil_min+(q.unite?' '+q.unite:'');
        else if(q.seuil_max!=null)seuilInfo='max '+q.seuil_max+(q.unite?' '+q.unite:'');
        seuilEl.textContent=q.texte+(seuilInfo?' · '+seuilInfo:'');
      }
    }
  }
  _updateProgress();
}

function _updateProgress(){
  var total=_questions.length;
  var filled=_questions.filter(function(q){
    var a=_answers[q.id];
    return a!==null&&a!==undefined&&a!=='';
  }).length;
  var pct=total>0?Math.round(filled/total*100):0;
  var bar=document.getElementById('rh-progress');
  if(bar)bar.style.width=pct+'%';

  var submit=document.getElementById('rh-submit');
  if(submit)submit.disabled=filled<total;

  // Count alerts
  var alertIds=_questions.filter(function(q){
    if(q.type_reponse!=='numerique')return false;
    var a=parseFloat(String(_answers[q.id]||'').replace(',','.'));
    if(isNaN(a))return false;
    if(q.seuil_min!=null&&a<q.seuil_min)return true;
    if(q.seuil_max!=null&&a>q.seuil_max)return true;
    return false;
  });

  var banner=document.getElementById('rh-alerte-banner');
  var bannerText=document.getElementById('rh-alerte-text');
  if(banner&&bannerText){
    if(alertIds.length>0){
      banner.className='rh-alerte-banner show';
      var eqNames=alertIds.map(function(q){
        var e=_equips.find(function(e){return e.id===q.equipement_id;});
        return (e?e.nom:'')+' – '+q.texte;
      });
      bannerText.textContent='⚠️ '+alertIds.length+' valeur'+(alertIds.length>1?'s':'')+' hors seuil : '+eqNames.join(' · ');
    } else {
      banner.className='rh-alerte-banner';
    }
  }
}

async function _submitReleve(){
  var submit=document.getElementById('rh-submit');
  if(submit){submit.disabled=true;submit.textContent='Envoi en cours…';}

  var nbAlertes=0;
  var posts=_questions.map(function(q){
    var val=String(_answers[q.id]||'');
    var isAlert=false;
    if(q.type_reponse==='numerique'){
      var num=parseFloat(val.replace(',','.'));
      if(!isNaN(num)){
        if(q.seuil_min!=null&&num<q.seuil_min)isAlert=true;
        if(q.seuil_max!=null&&num>q.seuil_max)isAlert=true;
      }
    }
    if(isAlert)nbAlertes++;
    return supaPost('reponses',{
      question_id:q.id,
      valeur:val,
      releve_id:_releve.id,
      ronde_equipement_id:null
    });
  });

  await Promise.all(posts);
  await supaPatch('releves_horaires',_releve.id,{
    statut:'validé',
    validated_at:new Date().toISOString(),
    nb_valeurs:_questions.length,
    nb_alertes:nbAlertes
  });

  if(_clock)clearInterval(_clock);
  showConfirmation(false,nbAlertes);
}

function showConfirmation(alreadyDone,nbAlertes){
  var siteNom='';
  if(_releve){
    supa('sites','id=eq.'+_releve.site_id+'&select=nom').then(function(rows){
      if(rows&&rows[0])siteNom=rows[0].nom;
    });
  }
  var now=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('app').innerHTML=
    '<div class="rh-header"><div class="rh-logo">GenTrack ✦</div></div>'+
    '<div class="rh-state">'+
      '<div class="rh-state-icon">✅</div>'+
      '<div class="rh-state-title">'+(alreadyDone?'Déjà validé':'Relevé validé !')+'</div>'+
      '<div class="rh-state-sub">'+(alreadyDone?'Ce relevé a déjà été soumis.':'Toutes les valeurs ont été enregistrées dans GenTrack.')+'</div>'+
      (!alreadyDone?
        '<div class="rh-confirm-pill">✅ '+_questions.length+' valeur'+(_questions.length!==1?'s':'')+' enregistrée'+(_questions.length!==1?'s':'')+'</div>'+
        (nbAlertes>0?'<div class="rh-alerte-confirm-pill">⚠️ '+nbAlertes+' alerte'+(nbAlertes>1?'s':'')+' envoyée'+(nbAlertes>1?'s':'')+'</div>':'<div class="rh-confirm-pill" style="background:var(--vert-light);color:var(--vert)">✓ Aucune anomalie</div>')+
        '<div class="rh-confirm-detail" style="margin-top:12px">Validé à '+now+'</div>'
        :'')+
    '</div>';
}

// Boot
init();
</script>
</body>
</html>
