*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F4F2EE;
  --gold: #C8922A;
  --gold-light: #f0d9a8;
  --gold-dark: #a67520;
  --sidebar-bg: #1C1C1E;
  --sidebar-text: #a0a0a8;
  --sidebar-active: #C8922A;
  --card: #ffffff;
  --border: #e4e1db;
  --text: #1a1a1a;
  --text-muted: #6b6b6b;
  --red: #e53e3e;
  --green: #38a169;
  --orange: #dd6b20;
  --blue: #3182ce;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

/* SIDEBAR */
#sidebar {
  width: 220px; min-width: 220px; background: var(--sidebar-bg); display: flex; flex-direction: column;
  padding: 0; overflow-y: auto;
}
.sidebar-logo {
  padding: 20px 20px 16px; border-bottom: 1px solid #2c2c2e;
}
.sidebar-logo h1 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
.sidebar-logo span { color: var(--gold); }
.sidebar-logo small { display: block; font-size: 10px; color: var(--sidebar-text); margin-top: 2px; }
.sidebar-nav { flex: 1; padding: 12px 0; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 20px;
  color: var(--sidebar-text); cursor: pointer; font-size: 13.5px; font-weight: 500;
  transition: all 0.15s; border-left: 3px solid transparent;
}
.nav-item:hover { color: #fff; background: rgba(255,255,255,0.04); }
.nav-item.active { color: #fff; border-left-color: var(--gold); background: rgba(200,146,42,0.1); }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-footer { padding: 12px 20px; border-top: 1px solid #2c2c2e; }
.sidebar-footer small { color: #444; font-size: 11px; }

/* MAIN */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#topbar {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: space-between;

}
#topbar h2 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
#content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* CARDS */
.card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 20px; }
.card-sm { padding: 14px 18px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-header h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; }

/* GRID */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }

/* KPI */
.kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.kpi-value { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; }
.kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.kpi-badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-top: 6px; }
.badge-green { background: #d4edda; color: #276749; }
.badge-red { background: #fed7d7; color: #9b2c2c; }
.badge-orange { background: #feebc8; color: #7b341e; }
.badge-blue { background: #bee3f8; color: #2a4365; }
.badge-gray { background: #e2e8f0; color: #4a5568; }
.badge-gold { background: #fef3cd; color: #7d5a00; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; font-family: 'Inter', sans-serif; }
.btn-primary { background: var(--gold); color: #fff; }
.btn-primary:hover { background: var(--gold-dark); }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--bg); }
.btn-danger { background: #fff0f0; color: var(--red); border: 1px solid #fecaca; }
.btn-danger:hover { background: #fee2e2; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-xs { padding: 2px 8px; font-size: 11px; }

/* TABLE */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 600; }
tbody td { padding: 11px 12px; border-bottom: 1px solid #f0ede8; vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #faf9f6; }
.clickable-row { cursor: pointer; }

/* ALERT items */
.alert-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.alert-item:last-child { border-bottom: none; }
.alert-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.dot-red { background: var(--red); }
.dot-orange { background: var(--orange); }
.dot-green { background: var(--green); }
.alert-body { flex: 1; }
.alert-title { font-size: 13px; font-weight: 500; }
.alert-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* STATUS dot */
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal-sm { max-width: 480px; }
.modal-md { max-width: 640px; }
.modal-lg { max-width: 820px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; }
.modal-body { padding: 20px 22px; }
.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); line-height: 1; }

/* TABS */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab { padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab:hover { color: var(--text); }

/* FORM */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
.form-input, .form-select, .form-textarea {

.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* TOGGLE */
.toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 20px; cursor: pointer; transition: 0.2s; }
.toggle-slider:before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .toggle-slider { background: var(--gold); }
.toggle input:checked + .toggle-slider:before { transform: translateX(16px); }

/* Modèles cards */
.template-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; cursor: pointer; transition: all 0.15s; }

/* Hidden */
.hidden { display: none !important; }

/* Toast */
#toast {

/* Question table rows */
.q-row { display: grid; grid-template-columns: 2fr 100px 100px 100px 60px 50px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0ede8; font-size: 13px; }
.q-row:last-child { border-bottom: none; }
.q-header { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }

/* Token row */
.token-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.token-item:last-child { border-bottom: none; }
.token-code { font-family: monospace; font-size: 12px; background: var(--bg); padding: 3px 8px; border-radius: 4px; }

/* Ronde item */
.ronde-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.ronde-item:last-child { border-bottom: none; }
.ronde-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
</style>

// ═══════════════════════════════════════════════════════════
// API HELPER
// ═══════════════════════════════════════════════════════════
async function api(table, q='', select='*', method='GET', body=null) {
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}?select=${select}${q}`, {
      method,
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': `Bearer ${SUPA_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': method === 'POST' ? 'return=representation' : (method === 'PATCH' ? 'return=representation' : '')
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 204 || res.status === 404) return [];
    if (!res.ok) { const t = await res.text().catch(() => ''); console.warn('API error', table, res.status, t); return []; }
    return res.json();
  } catch(e) { console.error('API fetch error', e); return []; }
}

async function apiDelete(table, q) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}?${q}`, {
    method: 'DELETE',
    headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
  });
  return res.ok;
}

  const btnNewClient = document.getElementById('btn-new-client');
  btnNewClient.classList.toggle('hidden', sec !== 'clients');
  renderSection(sec);
}

}

  const openAlerts = alertes.filter(a => a.statut !== 'resolved').length;
  const critAlerts = alertes.filter(a => a.severite === 'critique' && a.statut !== 'resolved').length;
  const mrr = clients.filter(c => c.statut === 'actif').reduce((s, c) => s + (c.prix_mensuel || 0), 0);
  const today = new Date().toISOString().slice(0, 10);
  const rondesToday = rondes.filter(r => r.created_at && r.created_at.slice(0, 10) === today).length;

  // Health per client
  const clientHealth = clients.map(c => {
    const cAlertes = alertes.filter(a => a.client_id === c.id && a.statut !== 'resolved');
    const cEquip = equipements.filter(e => e.client_id === c.id || (state.sites.find(s => s.id === e.site_id)?.client_id === c.id));
    const lastRonde = rondes.find(r => r.client_id === c.id || (cEquip.find(eq => eq.id === r.equipement_id)));
    const health = cAlertes.some(a => a.severite === 'critique') ? 'critique' : cAlertes.length > 0 ? 'alerte' : 'ok';
    return { ...c, cAlertes: cAlertes.length, cEquip: cEquip.length, health, lastRonde };
  });

  document.getElementById('content').innerHTML = `
    <div class="grid-4">
      <div class="card card-sm">
        <div class="kpi-label">Clients actifs</div>
        <div class="kpi-value">${activeClients}</div>
        <div class="kpi-sub">${clients.length} total</div>
      </div>
      <div class="card card-sm">
        <div class="kpi-label">Équipements</div>
        <div class="kpi-value">${totalEquip}</div>
        <div class="kpi-sub">surveillés</div>
      </div>
      <div class="card card-sm">
        <div class="kpi-label">Alertes ouvertes</div>
        <div class="kpi-value" style="color:${openAlerts>0?'var(--red)':'inherit'}">${openAlerts}</div>
        ${critAlerts > 0 ? `<span class="kpi-badge badge-red">${critAlerts} critiques</span>` : `<span class="kpi-badge badge-green">OK</span>`}
      </div>
      <div class="card card-sm">
        <div class="kpi-label">MRR</div>
        <div class="kpi-value">${fmtCFA(mrr)}</div>
        <div class="kpi-sub">ARR: ${fmtCFA(mrr * 12)}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-header"><h3>État des clients</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Client</th><th>Équipements</th><th>Alertes</th><th>Dernière ronde</th><th>Statut</th></tr></thead>
            <tbody>
              ${clientHealth.length === 0 ? '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:20px">Aucun client</td></tr>' :
                clientHealth.map(c => `
                <tr class="clickable-row" onclick="openClient('${c.id}')">
                  <td><strong>${esc(c.nom)}</strong></td>
                  <td>${c.cEquip}</td>
                  <td>${c.cAlertes > 0 ? `<span class="kpi-badge badge-red">${c.cAlertes}</span>` : '—'}</td>
                  <td style="font-size:12px;color:var(--text-muted)">${c.lastRonde ? relativeTime(c.lastRonde.created_at) : 'Jamais'}</td>
                  <td>
                    <span class="status-dot" style="background:${c.health==='ok'?'var(--green)':c.health==='critique'?'var(--red)':'var(--orange)'}"></span>
                    ${c.health === 'ok' ? 'OK' : c.health === 'critique' ? 'Critique' : 'Alerte'}
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>Alertes récentes</h3><a href="#" onclick="showSection('alertes')" style="font-size:12px;color:var(--gold)">Tout voir →</a></div>
        ${alertes.filter(a=>a.statut!=='resolved').slice(0,8).map(a => `
          <div class="alert-item">
            <div class="alert-dot ${a.severite==='critique'?'dot-red':a.severite==='alerte'?'dot-orange':'dot-green'}"></div>
            <div class="alert-body">
              <div class="alert-title">${esc(a.message||a.type||'Alerte')}</div>
              <div class="alert-meta">${clientName(a.client_id)} · ${relativeTime(a.created_at)}</div>
            </div>
            <span class="kpi-badge ${a.severite==='critique'?'badge-red':'badge-orange'}">${a.severite}</span>
          </div>`).join('') || '<p style="color:var(--text-muted);font-size:13px">Aucune alerte ouverte ✓</p>'}
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Rondes aujourd'hui <span class="kpi-badge badge-blue">${rondesToday}</span></h3></div>
      ${rondesToday === 0 ? '<p style="color:var(--text-muted);font-size:13px">Aucune ronde enregistrée aujourd\'hui.</p>' :
        rondes.filter(r => r.created_at && r.created_at.slice(0,10) === today).slice(0,10).map(r => {
          const equip = state.equipements.find(e => e.id === r.equipement_id);
          const site = equip ? state.sites.find(s => s.id === equip.site_id) : null;
          const client = site ? state.clients.find(c => c.id === site.client_id) : null;
          return `<div class="alert-item">
            <div class="alert-dot dot-green"></div>
            <div class="alert-body">
              <div class="alert-title">${equip ? esc(equip.nom) : 'Équipement inconnu'}</div>
              <div class="alert-meta">${client ? esc(client.nom) : ''} ${site ? '· '+esc(site.nom) : ''} · ${relativeTime(r.created_at)}</div>
            </div>
          </div>`;
        }).join('')}
    </div>
  `;
}

function editClientPrix(id, prix, plan) {
  const plans = Object.entries(PLANS).map(([k,v]) => `<option value="${k}" ${plan===k?'selected':''}>${k} (${fmtCFA(v)}/mois)</option>`).join('');
  showModal('modal-prix', `
    <div class="modal modal-sm">
      <div class="modal-header"><h3>Modifier le pricing</h3><button class="close-btn" onclick="closeModal('modal-prix')">×</button></div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Plan</label>
          <select class="form-select" id="edit-plan" onchange="syncPlan()">
            ${plans}
            <option value="custom" ${!Object.keys(PLANS).includes(plan)?'selected':''}>Personnalisé</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Prix mensuel (FCFA)</label>
          <input class="form-input" id="edit-prix" type="number" value="${prix}" />
        </div>
      </div>
      <div class="modal-footer">

function syncPlan() {
  const plan = document.getElementById('edit-plan').value;
  if (PLANS[plan]) document.getElementById('edit-prix').value = PLANS[plan];
}

async function saveClientPrix(id) {
  const prix = parseInt(document.getElementById('edit-prix').value) || 0;
  const plan = document.getElementById('edit-plan').value;
  await api('clients', `&id=eq.${id}`, '*', 'PATCH', { prix_mensuel: prix, plan });
  closeModal('modal-prix');
  toast('Prix mis à jour');
  await loadAll();
}

function renderClients() {
  const { clients } = state;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-header">
        <h3>Clients <span class="kpi-badge badge-gray">${clients.length}</span></h3>
        <input class="form-input" id="search-clients" style="width:220px" placeholder="Rechercher…" oninput="filterClients()" />
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nom</th><th>Plan</th><th>Sites</th><th>Équipements</th><th>MRR</th><th>Statut</th><th></th></tr></thead>
          <tbody id="clients-tbody">
            ${renderClientRows(clients)}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderClientRows(clients) {
  if (!clients.length) return '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted)">Aucun client</td></tr>';
  return clients.map(c => {
    const sites = state.sites.filter(s => s.client_id === c.id);
    const equips = state.equipements.filter(e => sites.find(s => s.id === e.site_id));
    return `<tr class="clickable-row" onclick="openClient('${c.id}')">
      <td><strong>${esc(c.nom)}</strong>${c.email?`<br><span style='font-size:11px;color:var(--text-muted)'>${esc(c.email)}</span>`:''}
      </td>
      <td><span class="kpi-badge badge-gray">${c.plan||'—'}</span></td>
      <td>${sites.length}</td>
      <td>${equips.length}</td>
      <td>${fmtCFA(c.prix_mensuel||0)}</td>
      <td><span class="kpi-badge ${c.statut==='actif'?'badge-green':c.statut==='inactif'?'badge-gray':'badge-orange'}">${c.statut||'—'}</span></td>
      <td onclick="event.stopPropagation()">
        <button class="btn btn-outline btn-xs" onclick="openClient('${c.id}')">Gérer →</button>
      </td>
    </tr>`;
  }).join('');
}

function filterClients() {
  const q = document.getElementById('search-clients').value.toLowerCase();
  const filtered = state.clients.filter(c => c.nom?.toLowerCase().includes(q) || c.email?.toLowerCase().includes(q));
  document.getElementById('clients-tbody').innerHTML = renderClientRows(filtered);
}

// ═══════════════════════════════════════════════════════════
// FICHE CLIENT (drawer/modal)
// ═══════════════════════════════════════════════════════════
function openClient(id, tab = 'infos') {
  openClientId = id;
  openClientTab = tab;
  renderClientFiche();
}

function renderClientFiche() {
  const client = state.clients.find(c => c.id === openClientId);
  if (!client) return;
  const sites = state.sites.filter(s => s.client_id === client.id);
  const allEquip = state.equipements.filter(e => sites.find(s => s.id === e.site_id));
  const tokens = state.tokens.filter(t => t.client_id === client.id);
  const contacts = state.contacts.filter(c => c.client_id === client.id);
  const rondes = state.rondes.filter(r => allEquip.find(e => e.id === r.equipement_id)).slice(0, 50);

  const tabs = ['infos', 'sites', 'questions', 'contacts', 'acces', 'historique'];
  const tabLabels = { infos: 'Infos', sites: 'Sites & Équipements', questions: 'Questions', contacts: 'Contacts', acces: 'Accès', historique: 'Historique' };

  let tabContent = '';
  if (openClientTab === 'infos') tabContent = renderTabInfos(client);
  else if (openClientTab === 'sites') tabContent = renderTabSites(client, sites, allEquip);
  else if (openClientTab === 'questions') tabContent = renderTabQuestions(client, allEquip);
  else if (openClientTab === 'contacts') tabContent = renderTabContacts(client, contacts);
  else if (openClientTab === 'acces') tabContent = renderTabAcces(client, tokens);
  else if (openClientTab === 'historique') tabContent = renderTabHistorique(client, rondes, allEquip);

  showModal('modal-client', `
    <div class="modal modal-lg">
      <div class="modal-header">
        <div>
          <h3>${esc(client.nom)}</h3>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${client.ville||''} · ${client.plan||''} · ${fmtCFA(client.prix_mensuel||0)}/mois</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="kpi-badge ${client.statut==='actif'?'badge-green':'badge-gray'}">${client.statut||'—'}</span>
          <button class="close-btn" onclick="closeModal('modal-client')">×</button>
        </div>
      </div>
      <div style="padding:0 22px">
        <div class="tabs">
          ${tabs.map(t => `<div class="tab ${openClientTab===t?'active':''}" onclick="openClient('${client.id}','${t}')">${tabLabels[t]}</div>`).join('')}
        </div>
      </div>
      <div class="modal-body" style="padding-top:0">${tabContent}</div>
    </div>`);
}

        <select class="form-select" id="ci-statut">
          <option value="actif" ${client.statut==='actif'?'selected':''}>Actif</option>
          <option value="inactif" ${client.statut==='inactif'?'selected':''}>Inactif</option>
          <option value="essai" ${client.statut==='essai'?'selected':''}>Essai</option>

function syncClientPlan() {
  const plan = document.getElementById('ci-plan').value;
  if (PLANS[plan]) document.getElementById('ci-prix').value = PLANS[plan];
}

async function saveClientInfos(id) {
  const body = {
    nom: document.getElementById('ci-nom').value,
    email: document.getElementById('ci-email').value,
    telephone: document.getElementById('ci-tel').value,
    ville: document.getElementById('ci-ville').value,
    plan: document.getElementById('ci-plan').value,
    prix_mensuel: parseInt(document.getElementById('ci-prix').value)||0,
    statut: document.getElementById('ci-statut').value,
    whatsapp: document.getElementById('ci-wa').value,
    notes: document.getElementById('ci-notes').value,
  };
  await api('clients', `&id=eq.${id}`, '*', 'PATCH', body);
  toast('Client mis à jour');
  await loadAll();
  openClient(id, 'infos');
}

async function deleteClient(id) {
  if (!confirm('Supprimer ce client ? Cette action est irréversible.')) return;
  await apiDelete('clients', `id=eq.${id}`);
  closeModal('modal-client');
  toast('Client supprimé');
  await loadAll();
}

function renderTabSites(client, sites, allEquip) {
  let html = `<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
    <button class="btn btn-primary btn-sm" onclick="openAddSite('${client.id}')">+ Ajouter un site</button>
  </div>`;
  if (!sites.length) html += '<p style="color:var(--text-muted);font-size:13px">Aucun site configuré.</p>';
  sites.forEach(site => {
    const equips = allEquip.filter(e => e.site_id === site.id);
    html += `<div class="card" style="margin-bottom:14px">
      <div class="card-header">
        <div>
          <strong style="font-size:14px">${esc(site.nom)}</strong>
          ${site.adresse ? `<div style="font-size:11px;color:var(--text-muted)">${esc(site.adresse)}</div>` : ''}
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline btn-xs" onclick="openAddEquipement('${site.id}','${client.id}')">+ Équipement</button>
          <button class="btn btn-danger btn-xs" onclick="deleteSite('${site.id}','${client.id}')">🗑️</button>
        </div>
      </div>`;
    if (!equips.length) {
      html += '<p style="font-size:12px;color:var(--text-muted)">Aucun équipement sur ce site.</p>';
    } else {
      equips.forEach(eq => {
        const tmpl = EQUIPMENT_TEMPLATES[eq.type] || EQUIPMENT_TEMPLATES.personnalise;
        const freq = { quotidien: 'Quotidien', hebdomadaire: 'Hebdo', mensuel: 'Mensuel' }[eq.frequence] || eq.frequence || '—';
        html += `<div class="equip-item">
          <div class="equip-item-left">
            <div class="equip-icon">${tmpl.icon}</div>
            <div>
              <div class="equip-name">${esc(eq.nom)}</div>
              <div class="equip-meta">${tmpl.label} · ${freq}</div>
            </div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-outline btn-xs" onclick="openEditEquipement('${eq.id}','${client.id}')">✏️</button>
            <button class="btn btn-danger btn-xs" onclick="deleteEquipement('${eq.id}','${client.id}')">🗑️</button>
          </div>
        </div>`;
      });
    }
    html += '</div>';
  });
  return html;
}

function renderTabQuestions(client, allEquip) {
  if (!allEquip.length) return '<p style="color:var(--text-muted);font-size:13px">Aucun équipement configuré. Ajoutez d\'abord des équipements dans l\'onglet Sites.</p>';
  const allQ = state.questions.filter(q => allEquip.find(e => e.id === q.equipement_id));
  let html = '';
  allEquip.forEach(eq => {
    const qs = allQ.filter(q => q.equipement_id === eq.id);
    const tmpl = EQUIPMENT_TEMPLATES[eq.type] || EQUIPMENT_TEMPLATES.personnalise;
    html += `<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div><span style="font-size:16px;margin-right:6px">${tmpl.icon}</span><strong style="font-size:13px">${esc(eq.nom)}</strong> <span style="font-size:11px;color:var(--text-muted)">(${tmpl.label})</span></div>
        <button class="btn btn-outline btn-xs" onclick="addQuestion('${eq.id}','${client.id}')">+ Question</button>
      </div>
      <div class="q-row q-header">
        <span>Libellé</span><span>Type</span><span>Seuil alerte</span><span>Seuil critique</span><span>Actif</span><span></span>
      </div>`;
    if (!qs.length) {
      html += '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">Aucune question. <a href="#" onclick="applyTemplate(\''+eq.id+'\',\''+eq.type+'\',\''+client.id+'\')">Appliquer le modèle</a></div>';
    } else {
      qs.forEach(q => {
        html += `<div class="q-row">
          <span>${esc(q.libelle)}</span>
          <span><span class="kpi-badge badge-gray">${q.type}</span></span>
          <span style="font-size:12px">${q.seuil_alerte ?? '—'}</span>
          <span style="font-size:12px">${q.seuil_critique ?? '—'}</span>
          <span>
            <label class="toggle">
              <input type="checkbox" ${q.actif!==false?'checked':''} onchange="toggleQuestion('${q.id}',this.checked,'${client.id}')">
              <span class="toggle-slider"></span>
            </label>
          </span>
          <span style="display:flex;gap:4px">
            <button class="btn btn-outline btn-xs" onclick="editQuestion('${q.id}','${client.id}')">✏️</button>
            <button class="btn btn-danger btn-xs" onclick="deleteQuestion('${q.id}','${client.id}')">🗑️</button>
          </span>
        </div>`;
      });
    }
    html += '</div>';
  });
  return html;
}

async function createEquipement(siteId, clientId) {
  const nom = document.getElementById('eq-nom').value.trim();
  if (!nom) { toast('Nom requis'); return; }
  const type = document.getElementById('eq-type').value;
  const frequence = document.getElementById('eq-freq').value;
  const description = document.getElementById('eq-desc').value;
  const result = await api('equipements', '', '*', 'POST', { nom, type, frequence, description, site_id: siteId });
  if (result && result[0]) {
    const equipId = result[0].id;
    const tmpl = EQUIPMENT_TEMPLATES[type] || EQUIPMENT_TEMPLATES.personnalise;
    for (let i = 0; i < tmpl.questions.length; i++) {
      const q = tmpl.questions[i];
      await api('questions', '', '*', 'POST', {
        equipement_id: equipId,
        libelle: q.libelle,
        type: q.type,
        unite: q.unite || null,
        options: q.options || null,
        seuil_alerte: q.seuil_alerte ?? null,
        seuil_critique: q.seuil_critique ?? null,
        obligatoire: q.obligatoire !== false,
        ordre: i + 1,
        actif: true,
      });

  closeModal('modal-equip');
  toast('Équipement créé avec questions');
  await loadAll();
  openClient(clientId, 'sites');

  const tmpl = EQUIPMENT_TEMPLATES[type] || EQUIPMENT_TEMPLATES.personnalise;

    await api('questions', '', '*', 'POST', {
      equipement_id: equipId,
      libelle: q.libelle, type: q.type, unite: q.unite||null, options: q.options||null,
      seuil_alerte: q.seuil_alerte??null, seuil_critique: q.seuil_critique??null,

    telephone: document.getElementById('ct-tel').value,
    email: document.getElementById('ct-email').value,
    client_id: clientId,
  };
  if (isEdit) await api('contacts', `&id=eq.${id}`, '*', 'PATCH', body);
  else await api('contacts', '', '*', 'POST', body);
  closeModal('modal-ct');
  toast(isEdit ? 'Contact mis à jour' : 'Contact ajouté');
  await loadAll();
  openClient(clientId, 'contacts');
}

async function deleteContact(id, clientId) {
  if (!confirm('Supprimer ce contact ?')) return;
  await apiDelete('contacts', `id=eq.${id}`);
  toast('Contact supprimé');
  await loadAll();
  openClient(clientId, 'contacts');
}

// ═══════════════════════════════════════════════════════════
function genToken(clientId) {
  showModal('modal-tok', `
    <div class="modal modal-sm">
      <div class="modal-header"><h3>Générer un accès</h3><button class="close-btn" onclick="closeModal('modal-tok')">×</button></div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label">Label</label><input class="form-input" id="tok-label" placeholder="Accès direction" /></div>
        <div class="form-group">
          <label class="form-label">Rôle</label>
          <select class="form-select" id="tok-role">
            <option value="readonly">Lecture seule</option>
            <option value="operateur">Opérateur</option>
            <option value="admin">Admin client</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Expiration</label>
          <select class="form-select" id="tok-exp">
            <option value="">Sans expiration</option>
            <option value="30">30 jours</option>
            <option value="90">90 jours</option>
            <option value="365">1 an</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('modal-tok')">Annuler</button>
        <button class="btn btn-primary" onclick="createToken('${clientId}')">Générer</button>
      </div>
    </div>`);
}

async function createToken(clientId) {
  const token = generateTokenStr();
  const label = document.getElementById('tok-label').value;
  const role = document.getElementById('tok-role').value;
  const expDays = document.getElementById('tok-exp').value;
  const expires_at = expDays ? new Date(Date.now() + expDays*86400000).toISOString() : null;
  await api('tokens', '', '*', 'POST', { token, label, role, client_id: clientId, expires_at });
  closeModal('modal-tok');
  toast('Accès généré !');
  await loadAll();
  openClient(clientId, 'acces');
}

function generateTokenStr() {
  return Array.from(crypto.getRandomValues(new Uint8Array(20))).map(b => b.toString(36)).join('').slice(0,24);
}

async function revokeToken(id, clientId) {
  if (!confirm('Révoquer cet accès ?')) return;
  await apiDelete('tokens', `id=eq.${id}`);
  toast('Accès révoqué');
  await loadAll();
  openClient(clientId, 'acces');
}

function copyToken(url) {
  navigator.clipboard.writeText(url).then(() => toast('Lien copié !'));
}

// ═══════════════════════════════════════════════════════════
// MODAL HELPERS
// ═══════════════════════════════════════════════════════════
function showModal(id, html) {
  let wrap = document.getElementById(id);
  if (!wrap) { wrap = document.createElement('div'); wrap.id = id; document.getElementById('modals').appendChild(wrap); }
  wrap.innerHTML = `<div class="modal-overlay" onclick="handleOverlayClick(event,'${id}')">${html}</div>`;
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = '';
}

function handleOverlayClick(e, id) {
  if (e.target.classList.contains('modal-overlay')) closeModal(id);
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtCFA(n) {
  return new Intl.NumberFormat('fr-FR').format(n||0) + ' FCFA';
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function relativeTime(d) {
  if (!d) return '—';
  const diff = Date.now() - new Date(d).getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'à l\'instant';
  if (mins < 60) return `il y a ${mins}m`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `il y a ${hrs}h`;
  const days = Math.floor(hrs/24);
  return `il y a ${days}j`;
}

function clientName(id) {
  const c = state.clients.find(x => x.id === id);
  return c ? esc(c.nom) : '—';
}

function toast(msg, duration=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), duration);
}
