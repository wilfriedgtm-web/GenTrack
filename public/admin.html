<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenTrack Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F4F2EE; --gold: #C8922A; --gold-light: #f0d9a8; --gold-dark: #a67520;
  --sidebar-bg: #1C1C1E; --card: #ffffff; --border: #e4e1db;
  --text: #1a1a1a; --text-muted: #6b6b6b;
  --red: #e53e3e; --green: #38a169; --orange: #dd6b20; --blue: #3182ce;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
#sidebar { width: 220px; min-width: 220px; background: var(--sidebar-bg); display: flex; flex-direction: column; overflow-y: auto; }
.sidebar-logo { padding: 20px 20px 16px; border-bottom: 1px solid #2c2c2e; }
.sidebar-logo h1 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: #fff; }
.sidebar-logo h1 span { color: var(--gold); }
.sidebar-logo small { display: block; font-size: 10px; color: #666; margin-top: 2px; }
.sidebar-nav { flex: 1; padding: 12px 0; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #a0a0a8; cursor: pointer; font-size: 13.5px; font-weight: 500; transition: all 0.15s; border-left: 3px solid transparent; }
.nav-item:hover { color: #fff; background: rgba(255,255,255,0.04); }
.nav-item.active { color: #fff; border-left-color: var(--gold); background: rgba(200,146,42,0.1); }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-footer { padding: 12px 20px; border-top: 1px solid #2c2c2e; }
.sidebar-footer small { color: #444; font-size: 11px; }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
#topbar h2 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
#content { flex: 1; overflow-y: auto; padding: 24px 28px; }
.card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 20px; }
.card-sm { padding: 14px 18px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-header h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
.kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.kpi-value { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; }
.kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.kpi-badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-green { background: #d4edda; color: #276749; }
.badge-red { background: #fed7d7; color: #9b2c2c; }
.badge-orange { background: #feebc8; color: #7b341e; }
.badge-blue { background: #bee3f8; color: #2a4365; }
.badge-gray { background: #e2e8f0; color: #4a5568; }
.badge-gold { background: #fef3cd; color: #7d5a00; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; font-family: 'Inter', sans-serif; }
.btn-primary { background: var(--gold); color: #fff; }
.btn-primary:hover { background: var(--gold-dark); }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--bg); }
.btn-danger { background: #fff0f0; color: var(--red); border: 1px solid #fecaca; }
.btn-danger:hover { background: #fee2e2; }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn-xs { padding: 2px 8px; font-size: 11px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 600; }
tbody td { padding: 11px 12px; border-bottom: 1px solid #f0ede8; vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #faf9f6; }
.clickable-row { cursor: pointer; }
.alert-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.alert-item:last-child { border-bottom: none; }
.alert-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.dot-red { background: var(--red); } .dot-orange { background: var(--orange); } .dot-green { background: var(--green); }
.alert-body { flex: 1; }
.alert-title { font-size: 13px; font-weight: 500; }
.alert-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal-sm { max-width: 480px; } .modal-md { max-width: 640px; } .modal-lg { max-width: 820px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; }
.modal-body { padding: 20px 22px; }
.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); line-height: 1; }
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tab { padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab:hover { color: var(--text); }
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px; font-size: 13.5px; font-family: 'Inter', sans-serif; color: var(--text); background: #fff; outline: none; transition: border 0.15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 20px; cursor: pointer; transition: 0.2s; }
.toggle-slider:before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .toggle-slider { background: var(--gold); }
.toggle input:checked + .toggle-slider:before { transform: translateX(16px); }
.equip-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 8px; }
.equip-item-left { display: flex; align-items: center; gap: 10px; }
.equip-icon { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; background: #f0ede8; }
.equip-name { font-size: 13px; font-weight: 500; }
.equip-meta { font-size: 11px; color: var(--text-muted); }
.contact-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.contact-item:last-child { border-bottom: none; }
.contact-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--gold-light); color: var(--gold-dark); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.q-row { display: grid; grid-template-columns: 2fr 90px 120px 90px 90px 50px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0ede8; font-size: 12px; }
.q-row:last-child { border-bottom: none; }
.q-header { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
.token-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.token-item:last-child { border-bottom: none; }
.token-code { font-family: monospace; font-size: 11px; background: var(--bg); padding: 2px 6px; border-radius: 4px; }
.ronde-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.ronde-item:last-child { border-bottom: none; }
.ronde-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.freq-badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; background: #e8f5e9; color: #2e7d32; margin-right: 3px; }
.freq-badge.hebdo { background: #e3f2fd; color: #1565c0; }
.freq-badge.mensuel { background: #fce4ec; color: #880e4f; }
.hidden { display: none !important; }
#toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: #1C1C1E; color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
#toast.show { opacity: 1; }
.info-box { background: #fffbf3; border: 1px solid var(--gold-light); border-radius: 7px; padding: 12px; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
.section-sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.site-check-list { border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; max-height: 160px; overflow-y: auto; }
.site-check-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-logo">
    <h1>Gen<span>Track</span></h1>
    <small>Administration</small>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-section="vue" onclick="showSection('vue')"><span class="icon">📊</span> Vue globale</div>
    <div class="nav-item" data-section="finance" onclick="showSection('finance')"><span class="icon">💰</span> Finance</div>
    <div class="nav-item" data-section="clients" onclick="showSection('clients')"><span class="icon">🏢</span> Clients</div>
    <div class="nav-item" data-section="alertes" onclick="showSection('alertes')"><span class="icon">🔔</span> Alertes<span id="alert-badge" class="kpi-badge badge-red hidden" style="margin-left:auto;font-size:10px;padding:1px 6px">0</span></div>
    <div class="nav-item" data-section="pannes" onclick="showSection('pannes')"><span class="icon">🔧</span> Pannes &amp; maint.</div>
    <div class="nav-item" data-section="modeles" onclick="showSection('modeles')"><span class="icon">📋</span> Modèles</div>
  </nav>
  <div class="sidebar-footer"><small id="sync-status">Chargement…</small></div>
</aside>

<div id="main">
  <div id="topbar">
    <h2 id="topbar-title">Vue globale</h2>
    <div class="topbar-actions">
      <button class="btn btn-outline btn-sm" onclick="loadAll()">↻ Actualiser</button>
      <button class="btn btn-primary btn-sm hidden" id="btn-new-client" onclick="openNewClientModal()">+ Nouveau client</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div id="toast"></div>
<div id="modals"></div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────
const SUPA_URL = 'https://zbpoxjlkqxnqjzxohasq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicG94amxrcXhucWp6eG9oYXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjM3ODAsImV4cCI6MjA5NzA5OTc4MH0.9-QyWgon93jGDo5QKMIh_-QbQZ_P9rQrYJnVxegJe7M';
const BASE_URL = 'https://gen-track.vercel.app';
const PLANS = { starter: 10000, business: 20000, pro: 50000 };

function typeById(id){const t=S.types_equipements.find(t=>t.id===id);return t||{nom:'Autre',icone:'🔩'};}
function typeIcon(id){return typeById(id).icone||'🔩';}
function typeLabel(id){return typeById(id).nom||'Autre';}

// ── API ────────────────────────────────────────────────────
async function api(table, q='', select='*', method='GET', body=null) {
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}?select=${select}${q}`, {
      method,
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', 'Prefer': (method==='POST'||method==='PATCH')?'return=representation':'' },
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status===204||res.status===404) return [];
    if (!res.ok) { const t=await res.text().catch(()=>''); console.warn('API',table,res.status,t); return []; }
    return res.json();
  } catch(e) { console.error(e); return []; }
}
async function apiDelete(table, q) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}?${q}`, { method:'DELETE', headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`} });
  return res.ok;
}

// ── STATE ──────────────────────────────────────────────────
let S = { clients:[], sites:[], equipements:[], questions:[], rondes:[], rondes_equipements:[], alertes:[], signalements:[], tokens:[], contacts:[], types_equipements:[] };
let currentSection = 'vue';
let openClientId = null;
let openClientTab = 'infos';

// ── LOAD ───────────────────────────────────────────────────
async function loadAll() {
  document.getElementById('sync-status').textContent = 'Chargement…';
  const [clients, sites, equipements, questions, rondes, rondes_eq, alertes, signalements, tokens, contacts, types_eq] = await Promise.all([
    api('clients','','*'),
    api('sites','','*'),
    api('equipements','','*'),
    api('questions','&order=ordre.asc','*'),
    api('rondes','&order=created_at.desc&limit=200','*'),
    api('rondes_equipements','','*'),
    api('alertes','&order=created_at.desc','*'),
    api('signalements','&order=created_at.desc&limit=200','*'),
    api('tokens','','*'),
    api('contacts','','*'),
    api('types_equipements','&order=nom.asc','*'),
  ]);
  S = { clients, sites, equipements, questions, rondes, rondes_equipements: rondes_eq, alertes, signalements, tokens, contacts, types_equipements: types_eq };
  document.getElementById('sync-status').textContent = `Màj ${new Date().toLocaleTimeString('fr-FR')}`;
  const openA = alertes.filter(a=>!a.resolue).length;
  const badge = document.getElementById('alert-badge');
  if (openA>0) { badge.textContent=openA; badge.classList.remove('hidden'); } else badge.classList.add('hidden');
  renderSection(currentSection);
}

// ── NAV ────────────────────────────────────────────────────
function showSection(sec) {
  currentSection = sec;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.section===sec));
  const titles = { vue:'Vue globale', finance:'Finance', clients:'Clients', alertes:'Alertes', pannes:'Pannes & maintenance', modeles:'Modèles d\'équipements' };
  document.getElementById('topbar-title').textContent = titles[sec]||sec;
  document.getElementById('btn-new-client').classList.toggle('hidden', sec!=='clients');
  renderSection(sec);
}
function renderSection(sec) {
  if (sec==='vue') renderVue();
  else if (sec==='finance') renderFinance();
  else if (sec==='clients') renderClients();
  else if (sec==='alertes') renderAlertes();
  else if (sec==='pannes') renderPannes();
  else if (sec==='modeles') renderModeles();
}

// ── VUE GLOBALE ────────────────────────────────────────────
function alertClientName(a){const site=S.sites.find(s=>s.id===a.groupe_id);const c=S.clients.find(x=>x.id===site?.client_id);return c?esc(c.nom):'—';}
function alertSiteName(a){const site=S.sites.find(s=>s.id===a.groupe_id);return site?esc(site.nom):'—';}

function renderVue() {
  const activeClients = S.clients.filter(c=>c.actif).length;
  const openA = S.alertes.filter(a=>!a.resolue).length;
  const critA = S.alertes.filter(a=>!a.resolue && a.severite==='critique').length;
  const mrr = S.clients.filter(c=>c.actif).reduce((s,c)=>s+(c.prix_mensuel||0),0);
  const now = Date.now();
  const today = new Date().toISOString().slice(0,10);
  const rondesToday = S.rondes.filter(r=>(r.created_at?.slice(0,10)===today||r.date_ronde===today)).length;

  // Per-site health
  const siteCards = S.sites.map(site => {
    const client = S.clients.find(c=>c.id===site.client_id);
    const lastRonde = S.rondes.find(r=>r.site_id===site.id);
    const siteAlertes = S.alertes.filter(a=>a.groupe_id===site.id && !a.resolue);
    const sitePannes = S.signalements.filter(s=>s.groupe_id===site.id && s.type==='panne' && s.statut!=='resolu');
    const rondeAge = lastRonde ? (now - new Date(lastRonde.created_at).getTime()) / 3600000 : Infinity;
    const hasCrit = siteAlertes.some(a=>a.severite==='critique');
    const status = hasCrit || rondeAge > 48 ? 'red' : (rondeAge > 24 || siteAlertes.length>0 || sitePannes.length>0) ? 'orange' : 'green';
    const statusColors = {red:'#e53e3e', orange:'#dd6b20', green:'#38a169'};
    const rondeText = lastRonde ? relativeTime(lastRonde.created_at) : 'Jamais';
    return `<div class="card card-sm" style="border-left:4px solid ${statusColors[status]};cursor:pointer" onclick="openClient('${client?.id||''}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-weight:600;font-size:13px">${esc(site.nom)}</div>
          <div style="font-size:11px;color:var(--text-muted)">${client?esc(client.nom):'—'}</div>
        </div>
        <div style="width:10px;height:10px;border-radius:50%;background:${statusColors[status]};margin-top:3px;flex-shrink:0"></div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;gap:3px">
        <div>🕐 Dernière ronde : <span style="color:${rondeAge>48?'var(--red)':rondeAge>24?'var(--orange)':'inherit'}">${rondeText}</span></div>
        <div>🔔 Alertes : <span style="color:${siteAlertes.length>0?'var(--red)':'inherit'}">${siteAlertes.length}${hasCrit?' ⚠️ critique':''}</span></div>
        <div>🔧 Pannes en cours : <span style="color:${sitePannes.length>0?'var(--orange)':'inherit'}">${sitePannes.length}</span></div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="grid-4" style="margin-bottom:20px">
      <div class="card card-sm"><div class="kpi-label">Clients actifs</div><div class="kpi-value">${activeClients}</div><div class="kpi-sub">${S.clients.length} total</div></div>
      <div class="card card-sm"><div class="kpi-label">Alertes ouvertes</div><div class="kpi-value" style="color:${openA>0?'var(--red)':'inherit'}">${openA}</div>${critA>0?`<span class="kpi-badge badge-red">${critA} critiques</span>`:`<span class="kpi-badge badge-green">OK</span>`}</div>
      <div class="card card-sm"><div class="kpi-label">Rondes aujourd'hui</div><div class="kpi-value">${rondesToday}</div><div class="kpi-sub">${S.sites.length} sites actifs</div></div>
      <div class="card card-sm"><div class="kpi-label">MRR</div><div class="kpi-value">${fmtCFA(mrr)}</div><div class="kpi-sub">ARR: ${fmtCFA(mrr*12)}</div></div>
    </div>
    ${S.sites.length ? `<div style="margin-bottom:8px"><h3 style="font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--text-muted);margin-bottom:12px">SANTÉ PAR SITE</h3><div class="grid-3">${siteCards}</div></div>` : ''}
    <div class="grid-2">
      <div class="card">
        <div class="card-header"><h3>Alertes ouvertes</h3><a href="#" onclick="showSection('alertes')" style="font-size:12px;color:var(--gold)">Tout voir →</a></div>
        ${S.alertes.filter(a=>!a.resolue).slice(0,8).map(a=>`
          <div class="alert-item">
            <div class="alert-dot ${a.severite==='critique'?'dot-red':'dot-orange'}"></div>
            <div class="alert-body"><div class="alert-title">${esc(a.message||a.type_alerte||a.type||'Alerte')}</div><div class="alert-meta">${alertClientName(a)} · ${alertSiteName(a)} · ${relativeTime(a.created_at)}</div></div>
            <span class="kpi-badge ${a.severite==='critique'?'badge-red':'badge-orange'}">${a.severite||'—'}</span>

// ── HELPERS CASCADE ────────────────────────────────────────
async function _cascadeDeleteEquipement(eqId) {
  const rEqs = await api('rondes_equipements',`&equipement_id=eq.${eqId}`,'id');
  if (rEqs && rEqs.length) {
    const ids = rEqs.map(r=>r.id).join(',');
    await apiDelete('reponses',`ronde_equipement_id=in.(${ids})`);
    await apiDelete('rondes_equipements',`equipement_id=eq.${eqId}`);
  }
  await apiDelete('questions',`equipement_id=eq.${eqId}`);
  await apiDelete('equipements',`id=eq.${eqId}`);
}
async function _cascadeDeleteSite(siteId) {
  const equips = await api('equipements',`&site_id=eq.${siteId}`,'id');
  if (equips) for (const eq of equips) await _cascadeDeleteEquipement(eq.id);
  await apiDelete('rondes',`site_id=eq.${siteId}`);
  await apiDelete('pannes',`site_id=eq.${siteId}`);
  const contacts = await api('contacts',`&site_id=eq.${siteId}`,'id');
  if (contacts) for (const ct of contacts) await api('rondes',`&technicien_id=eq.${ct.id}`,'id','PATCH',{technicien_id:null});
  await apiDelete('contacts',`site_id=eq.${siteId}`);
  await apiDelete('tokens',`site_id=eq.${siteId}`);
  await apiDelete('user_sites',`site_id=eq.${siteId}`);
  await apiDelete('groupes',`site_id=eq.${siteId}`);
  await apiDelete('cuves',`site_id=eq.${siteId}`);
}

async function deleteClient(id) {
  if(!confirm('Supprimer ce client et toutes ses données ? Action irréversible.')) return;
  const sites = await api('sites',`&client_id=eq.${id}`,'id');
  if (sites) for (const s of sites) await _cascadeDeleteSite(s.id);
  await apiDelete('vidanges',`client_id=eq.${id}`);
  await apiDelete('sites',`client_id=eq.${id}`);
  await apiDelete('clients',`id=eq.${id}`);
  closeModal('modal-client'); toast('Client supprimé'); await loadAll();
}

async function createEquipement(siteId, clientId) {
  const nom=document.getElementById('eq-nom').value.trim(); if(!nom){toast('Nom requis');return;}
  const typeId=document.getElementById('eq-type').value;
  const body = { nom, type_id:typeId, site_id:siteId, actif:true };
  body.marque = document.getElementById('eq-marque').value||null;
  body.reference = document.getElementById('eq-reference').value||null;
  body.numero_serie = document.getElementById('eq-serie').value||null;
  if (document.getElementById('eq-kva')?.value) body.puissance_kva = parseFloat(document.getElementById('eq-kva').value)||null;
  if (document.getElementById('eq-conso')) body.conso_theorique_lh = parseFloat(document.getElementById('eq-conso').value)||null;
  if (document.getElementById('eq-capa')) body.capacite_litres = parseInt(document.getElementById('eq-capa').value)||null;
  if (document.getElementById('eq-vidange')) body.seuil_vidange_heures = parseInt(document.getElementById('eq-vidange').value)||null;
  const result = await api('equipements','','*','POST',body);
  if (result&&result[0]) {
    // Appliquer le modèle de questions depuis Supabase (lookup by type_id)
    const modeles = await api('modeles_questions',`&type_id=eq.${typeId}`,'id');
    if (modeles&&modeles[0]) await applyTemplateFromDB(result[0].id, modeles[0].id, clientId, false);
  }
  closeModal('modal-eq'); toast('Équipement créé avec questions'); await loadAll(); openClient(clientId,'sites');
}

async function applyTemplate(equipId, modeleId, clientId) {
  if(!confirm('Appliquer le modèle ? Les questions existantes seront conservées.')) return;
  await applyTemplateFromDB(equipId, modeleId, clientId, true);
}
async function applyTemplateFromDB(equipId, modeleId, clientId, reload=true) {
  const items = await api('modeles_questions_items',`&modele_id=eq.${modeleId}&order=ordre.asc`,'*');
  for (const item of items) {
    await api('questions','','*','POST',{
      equipement_id: equipId, texte: item.texte, type_reponse: item.type_reponse,
      unite: item.unite||null, seuil_min: item.seuil_min??null, seuil_max: item.seuil_max??null,
      frequences: item.frequences||['journalier'], ordre: item.ordre, actif: true, exemple: item.exemple||null,
    });
  }
  if(reload) { toast('Modèle appliqué'); await loadAll(); openClient(clientId,'questions'); }
}

async function saveNewQuestion(eqId, clientId) {
  const txt=document.getElementById('q-txt').value.trim(); if(!txt){toast('Texte requis');return;}
  const freqs=['q-f1','q-f2','q-f3'].map(id=>document.getElementById(id)).filter(el=>el?.checked).map(el=>el.value);
  await api('questions','','*','POST',{equipement_id:eqId,texte:txt,type_reponse:document.getElementById('q-type').value,unite:document.getElementById('q-unit').value||null,seuil_min:parseFloat(document.getElementById('q-min').value)||null,seuil_max:parseFloat(document.getElementById('q-max').value)||null,frequences:freqs.length?freqs:['journalier'],exemple:document.getElementById('q-ex').value||null,ordre:99,actif:true});
  closeModal('modal-q'); toast('Question ajoutée'); await loadAll(); openClient(clientId,'questions');
}

async function saveEditQuestion(qId,clientId) {
  const freqs=['qe-f1','qe-f2','qe-f3'].map(id=>document.getElementById(id)).filter(el=>el?.checked).map(el=>el.value);

  closeModal('modal-qe'); toast('Question mise à jour'); await loadAll(); openClient(clientId,'questions');
}
async function deleteQuestion(qId,clientId) {
  if(!confirm('Supprimer cette question ?')) return;
  await apiDelete('questions',`id=eq.${qId}`);
  toast('Question supprimée'); await loadAll(); openClient(clientId,'questions');
}

// ── CONTACTS ───────────────────────────────────────────────
function addContact(cId) { openContactModal(null,cId); }
function editContact(id,cId) { openContactModal(S.contacts.find(c=>c.id===id),cId); }
function openContactModal(ct,clientId) {
  const isEdit=!!ct;
  const clientSites=S.sites.filter(s=>s.client_id===clientId);
  const siteOpts=clientSites.map(s=>`<option value="${s.id}" ${ct?.site_id===s.id?'selected':''}>${esc(s.nom)}</option>`).join('');
  showModal('modal-ct',`<div class="modal modal-sm">
    <div class="modal-header"><h3>${isEdit?'Modifier':'Ajouter'} un contact</h3><button class="close-btn" onclick="closeModal('modal-ct')">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Nom *</label><input class="form-input" id="ct-nom" value="${esc(ct?.nom||'')}" /></div>
      <div class="form-group"><label class="form-label">Rôle</label>
        <select class="form-select" id="ct-role">
          <option value="technicien" ${ct?.role==='technicien'?'selected':''}>Technicien</option>
          <option value="resp_tech" ${ct?.role==='resp_tech'?'selected':''}>Responsable technique</option>
          <option value="dir_tech" ${ct?.role==='dir_tech'?'selected':''}>Directeur technique</option>
          <option value="dir_ops" ${ct?.role==='dir_ops'?'selected':''}>Directeur opérations</option>
        </select>
      </div>
      ${clientSites.length?`<div class="form-group"><label class="form-label">Site rattaché</label>
        <select class="form-select" id="ct-site">
          <option value="">— Tous les sites (dir_ops / dir_tech) —</option>${siteOpts}
        </select>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">⚠️ Obligatoire pour les techniciens et resp_tech — le bot l'utilise pour router les rondes et alertes.</div>
      </div>`:''}
      <div class="form-group"><label class="form-label">WhatsApp</label><input class="form-input" id="ct-wa" value="${esc(ct?.whatsapp||'')}" placeholder="+2250700000000" /></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="ct-email" type="email" value="${esc(ct?.email||'')}" /></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('modal-ct')">Annuler</button><button class="btn btn-primary" onclick="saveContact('${isEdit?ct.id:''}','${clientId}',${isEdit})">Enregistrer</button></div>
  </div>`);
}
async function saveContact(id,clientId,isEdit) {
  const nom=document.getElementById('ct-nom').value.trim(); if(!nom){toast('Nom requis');return;}
  const role=document.getElementById('ct-role').value;
  const siteEl=document.getElementById('ct-site');
  const site_id=siteEl?.value||null;
  if(['technicien','resp_tech'].includes(role)&&!site_id){toast('Site requis pour ce rôle — le bot ne peut pas router sans site_id','error');return;}
  const body={nom,role,whatsapp:document.getElementById('ct-wa').value||null,email:document.getElementById('ct-email').value||null,client_id:clientId,site_id,actif:true};
  if(isEdit) await api('contacts',`&id=eq.${id}`,'*','PATCH',body);
  else await api('contacts','','*','POST',body);
  closeModal('modal-ct'); toast(isEdit?'Contact mis à jour':'Contact ajouté'); await loadAll(); openClient(clientId,'contacts');
}
async function deleteContact(id,clientId) {
  if(!confirm('Supprimer ce contact ?')) return;
  await api('rondes',`&technicien_id=eq.${id}`,'id','PATCH',{technicien_id:null});
  await apiDelete('contacts',`id=eq.${id}`);
  toast('Contact supprimé'); await loadAll(); openClient(clientId,'contacts');
}

// ── TOKENS ─────────────────────────────────────────────────
function genToken(clientId) {
  const sites = S.sites.filter(s=>s.client_id===clientId);
  showModal('modal-tok',`<div class="modal modal-sm">
    <div class="modal-header"><h3>Générer un accès</h3><button class="close-btn" onclick="closeModal('modal-tok')">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Label</label><input class="form-input" id="tok-nom" placeholder="Accès direction" /></div>
      <div class="form-group"><label class="form-label">Rôle</label>
        <select class="form-select" id="tok-role" onchange="renderTokSiteFields('${clientId}')">
          <option value="technicien">Technicien</option><option value="resp_tech">Resp. technique</option>
          <option value="dir_tech">Dir. technique</option><option value="dir_ops">Dir. opérations</option>
        </select>
      </div>
      <div id="tok-site-fields"></div>
      <div class="form-group"><label class="form-label">Expiration</label>
        <select class="form-select" id="tok-exp"><option value="">Sans expiration</option><option value="30">30 jours</option><option value="90">90 jours</option><option value="365">1 an</option></select>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('modal-tok')">Annuler</button><button class="btn btn-primary" onclick="createToken('${clientId}')">Générer</button></div>
  </div>`);
  renderTokSiteFields(clientId);
}
function renderTokSiteFields(clientId) {
  const role = document.getElementById('tok-role')?.value;
  const wrap = document.getElementById('tok-site-fields');
  if (!wrap) return;
  if (role !== 'resp_tech' && role !== 'dir_tech') { wrap.innerHTML=''; return; }
  const sites = S.sites.filter(s=>s.client_id===clientId);
  if (!sites.length) { wrap.innerHTML = '<div class="info-box">⚠️ Aucun site créé pour ce client — l\'accès portera sur tout le client.</div>'; return; }
  const hint = role==='resp_tech' ? 'Le responsable technique gère un seul site. Si plusieurs sont cochés, le premier sera utilisé.' : 'Cochez les sites gérés par ce directeur technique. Aucun site coché = accès à tous les sites du client.';
  wrap.innerHTML = `<div class="form-group">
    <label class="form-label">Sites gérés</label>
    <div class="site-check-list">${sites.map(s=>`<label class="site-check-row"><input type="checkbox" class="tok-site-cb" value="${s.id}"> ${esc(s.nom)}</label>`).join('')}</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${hint}</div>
  </div>`;
}
async function createToken(clientId) {
  const expDays=document.getElementById('tok-exp').value;
  const expire_at=expDays?new Date(Date.now()+expDays*86400000).toISOString():null;
  const role=document.getElementById('tok-role').value;
  const siteIds = Array.from(document.querySelectorAll('.tok-site-cb:checked')).map(el=>el.value);
  const body={nom:document.getElementById('tok-nom').value||'Accès',role,client_id:clientId,expire_at,actif:true};
  if (['resp_tech','dir_tech'].includes(role) && siteIds.length) body.site_ids = JSON.stringify(siteIds);
  await api('tokens','','*','POST',body);
  closeModal('modal-tok'); toast('Accès généré !'); await loadAll(); openClient(clientId,'acces');
}
async function revokeToken(id,clientId) {
  if(!confirm('Révoquer cet accès ?')) return;
  await api('tokens',`&id=eq.${id}`,'*','PATCH',{actif:false});
  toast('Accès révoqué'); await loadAll(); openClient(clientId,'acces');
}
function copyToken(url) { navigator.clipboard.writeText(url).then(()=>toast('Lien copié !')); }
function sendTokenWA(token, label, role, clientId) {
  const c = S.clients.find(x=>x.id===clientId);
  const url = location.origin+`/dashboard.html?token=${token}`;
  const roleLabel = {resp_tech:'Responsable technique', dir_tech:'Directeur technique', dir_ops:'Directeur des opérations', technicien:'Technicien'}[role]||role;
  const msg = `Bonjour 👋

Voici votre accès *GenTrack* — tableau de bord${c?' de *'+c.nom+'*':''}.

🔑 *Rôle :* ${roleLabel}
📊 *Votre tableau de bord :*
${url}

Ouvrez ce lien depuis votre téléphone ou ordinateur. Pour toute question, répondez à ce message.
— Équipe GenTrack ✅`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank');
}

  showModal('modal-panne',`<div class="modal modal-sm">
    <div class="modal-header"><h3>Signaler une panne</h3><button class="close-btn" onclick="closeModal('modal-panne')">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Site</label><select class="form-select" id="pn-site"><option value="">— Sélectionner —</option>${siteOpts}</select></div>
      <div class="form-group"><label class="form-label">Description *</label><textarea class="form-textarea" id="pn-desc" placeholder="Décrivez la panne…"></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('modal-panne')">Annuler</button><button class="btn btn-primary" onclick="createPanne()">Enregistrer</button></div>
  </div>`);
}
async function createPanne() {
  const desc=document.getElementById('pn-desc').value.trim(); if(!desc){toast('Description requise');return;}
  const siteId=document.getElementById('pn-site').value; if(!siteId){toast('Site requis');return;}
  await api('signalements','','*','POST',{groupe_id:siteId,type:'panne',statut:'ouvert',description:desc});
  closeModal('modal-panne'); toast('Panne enregistrée'); await loadAll();
}
async function resoudreSignalement(id) {
  await api('signalements',`&id=eq.${id}`,'*','PATCH',{statut:'resolu'});
  toast('Signalement résolu'); await loadAll();
}

// ── MODÈLES ────────────────────────────────────────────────
async function renderModeles() {
  document.getElementById('content').innerHTML = '<p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Chargement des modèles…</p>';
  const modeles = await api('modeles_questions','','*');
  const items = await api('modeles_questions_items','&order=ordre.asc','*');
  let html = `<p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">Modèles de questions définis dans Supabase — copiés automatiquement à la création d'un équipement.</p><div class="grid-3">`;
  S.types_equipements.forEach(t => {
    const modele = modeles.find(m=>m.type_id===t.id);
    const mItems = modele ? items.filter(i=>i.modele_id===modele.id) : [];
    html += `<div class="card">
      <div class="card-header"><h3>${t.icone||"🔩"} ${t.nom||"Autre"}</h3><span class="kpi-badge badge-gray">${mItems.length} questions</span></div>
      ${mItems.map(q=>{
        const freqs=Array.isArray(q.frequences)?q.frequences:[];
        return `<div style="padding:6px 0;border-bottom:1px solid #f0ede8;font-size:12px">
          <div style="font-weight:500">${esc(q.texte)}</div>
          <div style="color:var(--text-muted);font-size:11px;margin-top:2px">
            ${q.type_reponse} ${q.unite?'· '+q.unite:''} ${q.seuil_min!=null?'· min:'+q.seuil_min:''} ${q.seuil_max!=null?'· max:'+q.seuil_max:''}
            ${freqs.map(f=>`<span class="freq-badge ${f==='hebdo'?'hebdo':f==='mensuel'?'mensuel':''}">${f}</span>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

// ── BIENVENUE ──────────────────────────────────────────────
async function envoyerBienvenue(clientId) {
  const c=S.clients.find(x=>x.id===clientId); if(!c) return;
  const clientTokens = S.tokens.filter(t=>t.client_id===clientId&&t.actif);
  const anyTok = clientTokens[0];
  const BOT_NUMBER = '+221770000000'; // ← remplacez par le vrai numéro WhatsApp du bot

  // Contacts : technicien, resp_tech, dir_tech, dir_ops
  const contacts=S.contacts.filter(ct=>ct.client_id===clientId&&['technicien','resp_tech','dir_tech','dir_ops'].includes(ct.role));

  function tokenUrlFor(role) {
    const tok = clientTokens.find(t=>t.role===role) || anyTok;
    return tok ? `${BASE_URL}/dashboard.html?token=${tok.token}` : BASE_URL+'/client.html';
  }

  const msgFor = (ct) => {
    const url = tokenUrlFor(ct.role);
    if (ct.role === 'technicien') {
      return `Bonjour ! 👋

Bienvenue sur *GenTrack* — le système de suivi des groupes électrogènes et équipements de *${c.nom}*.

🤖 *Comment ça marche ?*
Envoyez vos rondes directement par WhatsApp au numéro du bot ci-dessous. Le bot vous guidera étape par étape.

📋 *Commandes disponibles :*
• *RONDE* — Démarrer une nouvelle ronde de contrôle
• *STATUT* — Voir l'état des équipements
• *ALERTE* — Signaler une panne ou anomalie
• *NIVEAU* — Saisir le niveau carburant
• *AIDE* — Afficher l'aide

🔢 *Numéro du bot :*
${BOT_NUMBER}

📊 *Tableau de bord :*
${url}

Pour toute question, répondez simplement à ce message.
— Équipe GenTrack ✅`;
    }
    const roleLabel = {resp_tech:'responsable technique', dir_tech:'directeur technique', dir_ops:'directeur des opérations'}[ct.role]||'responsable';
    return `Bonjour ! 👋

Bienvenue sur *GenTrack* — tableau de bord de suivi pour *${c.nom}*.

En tant que ${roleLabel}, vous recevrez :
• Les alertes critiques en temps réel 🔴
• Les rapports hebdomadaires 📊
• Les notifications de pannes 🔧

📊 *Votre tableau de bord :*
${url}

🤖 *Numéro du bot techniciens :*
${BOT_NUMBER}

— Équipe GenTrack ✅`;
  };

  const msgTech = msgFor({role:'technicien'});
  const msgResp = msgFor({role:'resp_tech'});

  let contactsHtml = '';
  if (contacts.length) {
    contactsHtml = `<div style="margin-top:14px"><strong style="font-size:12px;color:var(--text-muted)">DESTINATAIRES DÉTECTÉS</strong>` +
      contacts.map(ct=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <div><span style="font-size:13px;font-weight:500">${esc(ct.nom)}</span> <span class="kpi-badge badge-gray" style="font-size:10px">${ct.role}</span>
        ${ct.whatsapp?`<span style="font-size:11px;color:var(--text-muted);margin-left:6px">${esc(ct.whatsapp)}</span>`:' <span style="font-size:11px;color:var(--red)">⚠️ Pas de WhatsApp</span>'}</div>
        ${ct.whatsapp?`<a href="https://wa.me/${ct.whatsapp.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msgFor(ct))}" target="_blank" class="btn btn-primary btn-xs">📤 Envoyer</a>`:''}
      </div>`).join('') + '</div>';
  } else {
    contactsHtml = `<p style="font-size:12px;color:var(--orange);margin-top:10px">⚠️ Aucun contact technicien/resp_tech/dir_tech/dir_ops trouvé. Ajoutez-en dans l'onglet Contacts.</p>`;
  }

  showModal('modal-bienv',`<div class="modal modal-md">
    <div class="modal-header"><h3>Message de bienvenue — ${esc(c.nom)}</h3><button class="close-btn" onclick="closeModal('modal-bienv')">×</button></div>
    <div class="modal-body">
      <div class="tabs" style="margin-bottom:12px">
        <div class="tab active" onclick="switchBienvTab('tech',this)">Technicien</div>
        <div class="tab" onclick="switchBienvTab('resp',this)">Responsable</div>
      </div>
      <div id="bienv-tech" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:14px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;font-family:monospace">${msgTech}</div>
      <div id="bienv-resp" class="hidden" style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:14px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;font-family:monospace">${msgResp}</div>
      ${contactsHtml}
      <div style="margin-top:12px;font-size:11px;color:var(--text-muted)">🤖 Bot : ${BOT_NUMBER} · Cliquez "Envoyer" pour ouvrir WhatsApp Web avec le message pré-rempli (chaque contact reçoit le lien correspondant à son propre accès quand un token de son rôle existe).</div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('modal-bienv')">Fermer</button></div>
  </div>`);
}
function switchBienvTab(tab, el) {
  document.querySelectorAll('#modal-bienv .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('bienv-tech').classList.toggle('hidden', tab!=='tech');
  document.getElementById('bienv-resp').classList.toggle('hidden', tab!=='resp');
}

// ── MODAL ──────────────────────────────────────────────────
function showModal(id,html) {
  let w=document.getElementById(id);
  if(!w){w=document.createElement('div');w.id=id;document.getElementById('modals').appendChild(w);}
  w.innerHTML=`<div class="modal-overlay" onclick="handleOverlay(event,'${id}')">${html}</div>`;
}
function closeModal(id) { const el=document.getElementById(id);if(el)el.innerHTML=''; }
function handleOverlay(e,id) { if(e.target.classList.contains('modal-overlay'))closeModal(id); }

// ── UTILS ──────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtCFA(n){return new Intl.NumberFormat('fr-FR').format(n||0)+' FCFA';}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function relativeTime(d){if(!d)return'—';const m=Math.floor((Date.now()-new Date(d))/60000);if(m<1)return'à l\'instant';if(m<60)return`il y a ${m}m`;const h=Math.floor(m/60);if(h<24)return`il y a ${h}h`;return`il y a ${Math.floor(h/24)}j`;}
function clientName(id){const c=S.clients.find(x=>x.id===id);return c?esc(c.nom):'—';}
function toast(msg,d=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),d);}

// ── INIT ───────────────────────────────────────────────────
loadAll();
</script>
