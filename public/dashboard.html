async function _mntCreerSubmit(sid){
  var type=document.getElementById('mnt-m-type').value;
  var equipId=document.getElementById('mnt-m-equip').value||null;
  var titre=(document.getElementById('mnt-m-titre').value||'').trim();
  var date=document.getElementById('mnt-m-date').value;
  var coutStr=document.getElementById('mnt-m-cout').value;
  var cout=coutStr&&!isNaN(parseFloat(coutStr))?parseFloat(coutStr):null;
  var prest=(document.getElementById('mnt-m-prest').value||'').trim()||null;
  var desc=(document.getElementById('mnt-m-desc').value||'').trim()||null;
  var statut=document.getElementById('mnt-m-statut').value;
  var nom=_session&&_session.contact&&_session.contact.nom?_session.contact.nom:null;
  if(!titre&&type){titre=(_MNT_TYPES[type]&&_MNT_TYPES[type].label)||type;}
  await supaPost('maintenances',{
    groupe_id:sid,equipement_id:equipId,type:type,titre:titre,
    description:desc,date_intervention:statut==='realise'?date:null,
    date_planifiee:statut==='planifie'?date:null,
    statut:statut,cout:cout,prestataire:prest,created_by:nom
  });
  _closeCfgModal();
  if(_session)renderRespTech(_session,'maintenances');
}

async function _rtConfig(sid){
  _configCurrentSid=sid;
  var types=await supaGet('types_equipements','select=id,nom&order=nom');
  var equips=await supaGet('equipements','site_id=eq.'+sid+'&select=id,nom,actif,actif_ronde,actif_releve,ordre_ronde,type_id,seuil_vidange_heures,heures_dernier_vidange,types_equipements(nom)&order=ordre_ronde.asc');
  // Populate cache for safe onclick lookup (évite l'échappement multi-niveau)
  _configEquipCache={};
  equips.forEach(function(e){_configEquipCache[e.id]=e;});
  var tabs=[
    {key:'equipements',label:'⚙️ Équipements & Rondes'},
    {key:'seuils',label:'🎯 Seuils d\'alerte'},
    {key:'contacts',label:'👥 Contacts & Alertes'},
    {key:'releves',label:'📋 Relevés horaires'}
  ];
  var tabHtml=tabs.map(function(t){
    return '<button class="config-tab'+(_configCurrentTab===t.key?' active':'')+'" onclick="_switchConfigTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join('');

  if(_configCurrentTab==='seuils'){
    var dc2=document.getElementById('dash-content-main');
    if(dc2){dc2.style.padding='24px';dc2.style.maxWidth='none';}
    var seuilsHtml=await _buildSeuilsTab(sid);
    return '<div class="config-tabs">'+tabHtml+'</div>'+seuilsHtml;
  }
  if(_configCurrentTab==='contacts'){
    var dc2b=document.getElementById('dash-content-main');
    if(dc2b){dc2b.style.padding='24px';dc2b.style.maxWidth='none';}
    var contactsHtml=await _buildContactsTab(sid);
    return '<div class="config-tabs">'+tabHtml+'</div>'+contactsHtml;
  }
  if(_configCurrentTab==='releves'){
    var dc2c=document.getElementById('dash-content-main');
    if(dc2c){dc2c.style.padding='24px';dc2c.style.maxWidth='none';}
    var relevesCfgHtml=await _buildReleveConfigTab(sid);
    return '<div class="config-tabs">'+tabHtml+'</div>'+relevesCfgHtml;
  }

  // Default selection
  if(equips.length>0){
    var actifs=equips.filter(function(e){return e.actif;});
    if(!_configSelectedEqId||!equips.find(function(e){return e.id===_configSelectedEqId;})){
      _configSelectedEqId=actifs.length?actifs[0].id:equips[0].id;
    }
  }

  // Group equipements by type
  var byType={};
  equips.forEach(function(e){
    var tNom=(e.types_equipements&&e.types_equipements.nom)||'Autres';
    if(!byType[tNom])byType[tNom]=[];
    byType[tNom].push(e);
  });
  var typeOptsHtml=types.map(function(t){return '<option value="'+t.id+'">'+escape_html(t.nom)+'</option>';}).join('');
  var listHtml='<div class="config-equip-list">';
  if(equips.length===0){
    listHtml+='<div style="padding:24px 16px;text-align:center;color:var(--text3);font-size:12px"><div style="font-size:32px;margin-bottom:8px;opacity:.3">⚙️</div>Aucun équipement configuré</div>';
  } else {
    Object.keys(byType).forEach(function(tNom){
      listHtml+='<div class="config-eq-section">'+escape_html(tNom)+'</div>';
      byType[tNom].forEach(function(e){
        var icon=_TYPE_ICONS[(e.types_equipements&&e.types_equipements.nom)]||'⚙️';
        var sel=e.id===_configSelectedEqId;
        listHtml+='<div class="config-eq-item'+(sel?' selected':'')+(!e.actif?' cfg-eq-inactive':'')+'" onclick="_selectConfigEq(\''+e.id+'\')">'+
          '<span class="config-eq-icon">'+icon+'</span>'+
          '<div style="flex:1;min-width:0">'+
            '<div class="config-eq-name" style="'+(e.actif?'':'color:var(--text3)')+'">'+escape_html(e.nom)+'</div>'+
            '<div class="config-eq-type">'+(e.actif?'Actif':'Inactif')+'</div>'+
          '</div>'+
          '<button class="config-eq-edit-btn" onclick="event.stopPropagation();_openEditEquipFromCache(\''+e.id+'\')" title="Modifier">✏️</button>'+
        '</div>';
      });
    });
  }
  listHtml+='<button class="config-add-eq-btn" onclick="_openAddEquipModal()">＋ Ajouter un équipement</button>';
  listHtml+='</div>';

  // Right panel
  var panelHtml=_configSelectedEqId
    ? await _buildConfigRondePanel(sid,_configSelectedEqId,equips)
    : '<div class="config-ronde-panel"><div style="color:var(--text3);font-size:13px;padding:40px;text-align:center">Commencez par ajouter un équipement</div></div>';

  // Remove padding from outer dash-content for full-bleed layout
  var dc=document.getElementById('dash-content-main');
  if(dc){dc.style.padding='0';dc.style.maxWidth='none';}
  return '<div class="config-tabs">'+tabHtml+'</div>'+
    '<div class="config-layout">'+listHtml+panelHtml+'</div>';
}

async function _buildContactsTab(sid){
  var contacts=await supaGet('contacts','site_id=eq.'+sid+'&select=id,nom,role,whatsapp,email,actif&order=nom.asc');
  var ROLES={resp_tech:'⚙️ Resp. technique',dir_tech:'🏗️ Dir. technique',dir_ops:'📊 Dir. opérations',technicien:'🔧 Technicien',autre:'👤 Autre'};

  var byRole={};
  contacts.forEach(function(c){
    var r=c.role||'autre';
    if(!byRole[r])byRole[r]=[];
    byRole[r].push(c);
  });

  var html='<div style="max-width:680px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
      '<div style="font-size:12px;color:var(--text2);line-height:1.5">'+
        'Gérez les personnes notifiées lors des alertes. Chaque contact recevra les alertes selon les canaux configurés dans l\'onglet Seuils.'+
      '</div>'+
      '<button class="cfg-btn-primary" style="white-space:nowrap;margin-left:16px" onclick="_openAddContactModal()">＋ Ajouter</button>'+
    '</div>';

  if(!contacts.length){
    html+='<div style="text-align:center;padding:40px;color:var(--text3);font-size:13px">'+
      '<div style="font-size:40px;margin-bottom:12px;opacity:.3">👥</div>'+
      'Aucun contact configuré.<br>Ajoutez les personnes à notifier en cas d\'alerte.</div>';
  } else {
    Object.keys(byRole).forEach(function(role){
      var cs=byRole[role];
      html+='<div style="margin-bottom:20px">'+
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px">'+
          (ROLES[role]||role)+
        '</div>'+
        '<div style="background:white;border:1.5px solid var(--border);border-radius:10px;overflow:hidden">';
      cs.forEach(function(c,ci){
        html+='<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;'+(ci<cs.length-1?'border-bottom:1px solid var(--border)':'')+(c.actif?'':'opacity:.5')+'">'+
          '<div style="width:36px;height:36px;border-radius:50%;background:var(--amber-light);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--amber-dark);flex-shrink:0">'+
            escape_html((c.nom||'?')[0].toUpperCase())+
          '</div>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-size:13px;font-weight:600;color:var(--dark)">'+escape_html(c.nom)+'</div>'+
            '<div style="font-size:11px;color:var(--text3);margin-top:2px">'+
              (c.whatsapp?'💬 '+escape_html(c.whatsapp):'')+(c.whatsapp&&c.email?' · ':'')+
              (c.email?'✉️ '+escape_html(c.email):'')+
              (!c.whatsapp&&!c.email?'Aucun contact renseigné':'')+
            '</div>'+
          '</div>'+
          (c.actif?
            '<span style="font-size:10px;font-weight:700;color:var(--vert);background:var(--vert-pale);border:1px solid var(--vert-border);padding:2px 8px;border-radius:10px">Actif</span>':
            '<span style="font-size:10px;font-weight:700;color:var(--text3);background:var(--creme);border:1px solid var(--border);padding:2px 8px;border-radius:10px">Inactif</span>')+
          '<button class="config-eq-edit-btn" style="opacity:1" onclick="_openEditContactModal(\''+c.id+'\',\''+escape_html(c.nom)+'\',\''+escape_html(c.role||'')+'\',\''+escape_html(c.whatsapp||'')+'\',\''+escape_html(c.email||'')+'\','+c.actif+')" title="Modifier">✏️</button>'+
        '</div>';
      });
      html+='</div></div>';
    });
  }

  // QR code signalement
  var sgUrl=location.origin+location.pathname.replace('dashboard.html','signalement.html')+'?site='+sid;
  html+='<div style="margin-top:24px;background:white;border:1.5px solid var(--border);border-radius:12px;padding:18px 20px">'+
    '<div style="font-size:13px;font-weight:700;color:var(--dark);margin-bottom:6px">📍 Formulaire de signalement</div>'+
    '<div style="font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5">Partagez ce lien ou ce QR code à la réception pour permettre à quiconque de signaler un problème sans connexion.</div>'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<div id="sg-qr-'+sid+'"></div>'+
      '<div style="flex:1;min-width:200px">'+
        '<div style="font-size:11px;color:var(--text3);margin-bottom:6px">Lien direct :</div>'+
        '<div style="font-size:11px;font-family:monospace;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;word-break:break-all;color:var(--text)">'+escape_html(sgUrl)+'</div>'+
        '<div style="display:flex;gap:8px;margin-top:10px">'+
          '<button onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+sgUrl+'\')" style="padding:7px 14px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-weight:600;background:white;cursor:pointer;color:var(--text)">📋 Copier</button>'+

        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';

  html+='</div>';

  // Generate QR code using QR server API (no JS lib needed)
  html+='<script>'+
    '(function(){'+

async function _buildReleveConfigTab(sid){

      var freqs=Array.isArray(q.frequences)?q.frequences:[];

      return '<div style="display:flex;align-items:center;gap:12px;padding:9px 14px 9px 36px;border-bottom:1px solid var(--border);background:'+(active?'var(--vert-pale)':'white')+'">'+ // indent under eq toggle
        '<label style="position:relative;display:inline-block;width:32px;height:18px;flex-shrink:0">'+

          '<label style="position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0">'+
            '<input type="checkbox" '+(eqActive?'checked':'')+' onchange="_toggleReleveEquipement(\''+eqId+'\',this.checked)" '+
              'style="opacity:0;width:0;height:0;position:absolute" />'+
            '<span style="position:absolute;inset:0;background:'+(eqActive?'var(--amber)':'#ccc')+';border-radius:20px;transition:.2s;cursor:pointer"></span>'+

async function _toggleReleveEquipement(eqId,active){
  // Toggle ALL questions of this equipment at once
  var rows=await supaGet('questions','equipement_id=eq.'+eqId+'&actif=eq.true&select=id,frequences');
  var patches=rows.map(function(q){
    var freqs=Array.isArray(q.frequences)?q.frequences.slice():[];
    var idx=freqs.indexOf('journalier');
    if(active&&idx===-1)freqs.push('journalier');
    else if(!active&&idx!==-1)freqs.splice(idx,1);
    return supaPatch('questions',q.id,{frequences:freqs});
  });
  await Promise.all(patches);
  if(_session)renderRespTech(_session,'config');
}

async function _toggleReleveQuestion(qId,active){
  var rows=await supaGet('questions','id=eq.'+qId+'&select=frequences');
  var cur=rows&&rows[0]?rows[0].frequences:null;
  var freqs=Array.isArray(cur)?cur.slice():[];
  var idx=freqs.indexOf('journalier');
  if(active&&idx===-1)freqs.push('journalier');
  else if(!active&&idx!==-1)freqs.splice(idx,1);
  await supaPatch('questions',qId,{frequences:freqs});
  if(_session)renderRespTech(_session,'config');
}

  var typeLabel={numerique:'Valeur numérique',oui_non:'Oui / Non',choix:'Choix',texte:'Texte libre',photo:'📷 Photo'};

  var sectionsHtml=groups.map(function(g){
    var qsHtml=g.questions.map(function(q){
      var inputHtml='';
      if(q.type_reponse==='numerique'){

        '</div>';
      } else if(q.type_reponse==='choix'){
        var opts=Array.isArray(q.options)?q.options:[];
        inputHtml='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">'+
          opts.map(function(o){
            return '<button disabled style="padding:6px 12px;border:1.5px solid #ddd;border-radius:20px;background:#f8f8f8;font-size:12px;cursor:default">'+escape_html(o)+'</button>';
          }).join('')+
          (!opts.length?'<span style="font-size:12px;color:#aaa">Options à configurer</span>':'')+
        '</div>';
      } else if(q.type_reponse==='texte'){
        inputHtml='<textarea disabled placeholder="Saisir..." rows="2" '+

      }

        inputHtml+
      '</div>';
    }).join('');
    return '<div style="background:#f8f8f8;border-radius:10px;padding:12px 14px;margin-bottom:12px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+

        '<span style="font-size:13px;font-weight:700;color:#1a1a1a">'+escape_html(g.eqNom)+'</span>'+
      '</div>'+
      qsHtml+
    '</div>';
  }).join('');

async function _moveQ(qId, freqKey, dir){
  var list=(window._eqQOrders&&window._eqQOrders[freqKey])||[];
  var idx=list.findIndex(function(q){return q.id===qId;});
  if(idx<0)return;
  var swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=list.length)return;
  // Swap ordre values
  var a=list[idx], b=list[swapIdx];
  var tmpOrdre=a.ordre;
  // If ordres are equal, assign distinct values
  if(a.ordre===b.ordre){a.ordre=idx+1;b.ordre=swapIdx+1;}
  await Promise.all([
    supaPatch('questions',a.id,{ordre:b.ordre}),
    supaPatch('questions',b.id,{ordre:tmpOrdre})
  ]);
  if(_session)renderRespTech(_session,'config');
}

function openWaPreview(cacheKey){
  var cached=_waCache[cacheKey];
  if(!cached){console.warn('WA cache miss:',cacheKey);return;}
  var freq=cached.freq, freqLabel=cached.label, eqNom=cached.eqNom, questions=cached.questions;
  // Remove existing overlay if any
  var old=document.getElementById('wa-overlay');
  if(old)old.remove();

  var typeIcon={numerique:'🔢',texte:'💬',oui_non:'✅',photo:'📷',choix:'📋'};
  var typeLabel={numerique:'Valeur numérique',texte:'Texte libre',oui_non:'Oui / Non',photo:'Photo requise',choix:'Choix multiple'};
  var exampleFallback={numerique:'42',texte:'RAS',oui_non:'Oui',photo:'[Photo envoyée]',choix:'Option 1'};

  var now=new Date();
  var hh=String(now.getHours()).padStart(2,'0');
  var mm=String(now.getMinutes()).padStart(2,'0');
  var baseTime=now.getHours()*60+now.getMinutes();
  function simTime(offset){var t=baseTime+offset;var h=Math.floor(t/60)%24;var m=t%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}

  var freqColor={journalier:'#2D6A4F',hebdo:'#9A780E',mensuel:'#2B5BA8'};
  var headerBg=freqColor[freq]||'#075E54';

  // Build chat bubbles
  var bubbles='<div class="wa-date-sep">'+now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</div>';

  // Opening bot message
  var freqEmoji={journalier:'📋',hebdo:'📅',mensuel:'🗓️'};
  bubbles+='<div class="wa-bubble bot">'+
    '<div style="font-weight:700;color:#075E54;margin-bottom:3px">'+(freqEmoji[freq]||'📋')+' Ronde '+freqLabel.toLowerCase()+'</div>'+
    escape_html(eqNom)+'<br>'+
    '<span style="font-size:11px;color:rgba(0,0,0,.45)">Bonjour 👋 Voici votre ronde du jour</span>'+
    '<div class="wa-bubble-time">'+simTime(0)+'</div>'+
  '</div>';

  questions.forEach(function(q,i){
    var tIcon=typeIcon[q.type]||'💬';
    var tLabel=typeLabel[q.type]||q.type||'texte';
    var example=q.exemple||(exampleFallback[q.type]||'—');
    var uniteStr=q.unite?' ('+q.unite+')':'';
    var seuilStr='';
    if(q.seuil_max!==null&&q.seuil_max!==undefined)seuilStr='⚠️ Seuil critique > '+q.seuil_max+(q.unite?' '+q.unite:'');
    else if(q.seuil_min!==null&&q.seuil_min!==undefined)seuilStr='⚠️ Seuil critique < '+q.seuil_min+(q.unite?' '+q.unite:'');

    // Question bubble (bot)
    bubbles+='<div class="wa-bubble bot">'+
      '<div class="wa-bubble-step">'+(i+1)+'/'+questions.length+'</div>'+
      '<div style="font-weight:600;margin-bottom:4px">'+escape_html(q.texte)+'</div>'+
      '<div class="wa-bubble-type">'+tIcon+' '+tLabel+uniteStr+'</div>'+
      (seuilStr?'<div class="wa-bubble-seuil">'+seuilStr+'</div>':'')+
      '<div class="wa-bubble-time">'+simTime(i*2+1)+'</div>'+
    '</div>';

    // Tech response bubble
    bubbles+='<div class="wa-bubble tech">'+
      escape_html(String(example))+
      '<div class="wa-bubble-time">'+simTime(i*2+2)+' ✓✓</div>'+
    '</div>';

    // Bot acknowledgment (except after last question)
    if(i<questions.length-1){
      bubbles+='<div class="wa-bubble bot">'+
        '<div class="wa-bubble-ack">✅ Noté</div>'+
        '<div class="wa-bubble-time">'+simTime(i*2+2)+'</div>'+
      '</div>';
    }
  });

  // Closing bot message
  if(questions.length>0){
    bubbles+='<div class="wa-bubble bot">'+
      '<div style="font-weight:700;color:#25D366;margin-bottom:3px">✅ Ronde complète !</div>'+
      questions.length+'/'+questions.length+' questions · Merci 👍<br>'+
      '<span style="font-size:11px;color:rgba(0,0,0,.45)">Données enregistrées dans GenTrack</span>'+
      '<div class="wa-bubble-time">'+simTime(questions.length*2+2)+'</div>'+
    '</div>';
  }

  var overlay=document.createElement('div');
  overlay.className='wa-overlay';
  overlay.id='wa-overlay';
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
  overlay.innerHTML=
    '<div class="wa-phone">'+
      '<div class="wa-phone-bar" style="background:'+headerBg+'">'+
        '<div class="wa-phone-avatar">🤖</div>'+
        '<div class="wa-phone-info">'+
          '<div class="wa-phone-name">GenTrack Bot</div>'+
          '<div class="wa-phone-status">Ronde '+escape_html(freqLabel.toLowerCase())+' · '+escape_html(eqNom)+'</div>'+
        '</div>'+
        '<button class="wa-phone-close" onclick="document.getElementById(\'wa-overlay\').remove()">×</button>'+
      '</div>'+
      '<div class="wa-chat">'+bubbles+'</div>'+
      '<div class="wa-phone-footer">'+
        '<button class="wa-edit-btn" onclick="document.getElementById(\'wa-overlay\').remove()">Fermer</button>'+
        '<button class="wa-validate-btn" onclick="document.getElementById(\'wa-overlay\').remove()">✅ Ronde validée</button>'+
      '</div>'+
    '</div>';

  document.body.appendChild(overlay);
  // Scroll chat to bottom after render
  setTimeout(function(){var c=overlay.querySelector('.wa-chat');if(c)c.scrollTop=c.scrollHeight;},50);
}

async function _saveEditEquip(eqId){
  var nom=(document.getElementById('eq-edit-nom')||{}).value;
  if(!nom||!nom.trim()){alert('Nom requis');return;}
  var actifRadio=document.querySelector('input[name="eq-edit-actif"]:checked');
  var actif=actifRadio?actifRadio.value==='true':true;
  var actifRonde=!!(document.getElementById('eq-edit-ronde')||{}).checked;
  var actifReleve=!!(document.getElementById('eq-edit-releve')||{}).checked;
  var body={nom:nom.trim(),actif:actif,actif_ronde:actifRonde,actif_releve:actifReleve};
  // Champs GE (si présents)
  var seuilEl=document.getElementById('eq-edit-seuil');
  var baselineEl=document.getElementById('eq-edit-baseline');
  if(seuilEl&&seuilEl.value)body.seuil_vidange_heures=parseFloat(seuilEl.value);
  if(baselineEl&&baselineEl.value){
    body.heures_dernier_vidange=parseFloat(baselineEl.value);
    body.date_dernier_vidange=new Date().toISOString();
  }
  _closeCfgModal();
  var ok=await supaPatch('equipements',eqId,body);
  if(!ok){
    var toast=document.createElement('div');
    toast.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999';
    toast.textContent='❌ Erreur sauvegarde — vérifiez la console (F12)';
    document.body.appendChild(toast);setTimeout(function(){toast.remove();},4000);
  }
  if(eqId===_configSelectedEqId&&!actif)_configSelectedEqId=null;
  if(_session)renderRespTech(_session,'config');
}

async function _saveNewEquip(){
  var nom=(document.getElementById('eq-new-nom')||{}).value;
  if(!nom||!nom.trim()){alert('Nom requis');return;}
  var typeId=(document.getElementById('eq-new-type')||{}).value||null;
  var marque=(document.getElementById('eq-new-marque')||{}).value||null;
  var modeleId=(document.getElementById('eq-new-modele')||{}).value||null;
  // Champs GE
  var kva=parseFloat((document.getElementById('eq-new-kva')||{}).value)||null;
  var conso=parseFloat((document.getElementById('eq-new-conso')||{}).value)||null;
  var capa=parseInt((document.getElementById('eq-new-capa')||{}).value)||null;
  var seuil=parseInt((document.getElementById('eq-new-seuil')||{}).value)||null;
  // Champs Cuve
  var capaCuve=parseInt((document.getElementById('eq-new-capa-cuve')||{}).value)||null;
  var consoCuve=parseFloat((document.getElementById('eq-new-conso-cuve')||{}).value)||null;
  _closeCfgModal();
  var eqData={nom:nom.trim(),site_id:_configCurrentSid,type_id:typeId,marque:marque||null,actif:true,ordre_ronde:99};
  if(typeId===GE_TYPE_ID_CFG){
    if(kva)eqData.puissance_kva=kva;
    if(conso)eqData.conso_theorique_lh=conso;
    if(capa)eqData.capacite_litres=capa;
    if(seuil)eqData.seuil_vidange_heures=seuil;
  }
  if(typeId===CUVE_TYPE_ID_CFG){
    if(capaCuve)eqData.capacite_litres=capaCuve;
    if(consoCuve)eqData.conso_theorique_lh=consoCuve;
  }
  var created=await supaPost('equipements',eqData);
  if(created&&created.id&&modeleId){
    await _applyModeleToEquip(created.id,modeleId);
  }
  if(_session)renderRespTech(_session,'config');
}

async function _applyModeleToEquip(eqId,modeleId){
  var items=await supaGet('modeles_questions_items','modele_id=eq.'+modeleId+'&order=ordre.asc&select=texte,type_reponse,unite,seuil_min,seuil_max,frequences,exemple,ordre');
  for(var i=0;i<items.length;i++){
    var it=items[i];
    await supaPost('questions',{
      equipement_id:eqId,texte:it.texte,type_reponse:it.type_reponse||'numerique',
      unite:it.unite||null,seuil_min:it.seuil_min??null,seuil_max:it.seuil_max??null,
      frequences:it.frequences||['journalier'],exemple:it.exemple||null,ordre:it.ordre||i+1,actif:true
    });
  }
}

function escape_html(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Pour mettre une valeur dans une chaîne JS entre apostrophes (onclick="...'val'...")
function js_esc(s){
  if(!s)return'';
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function renderDirTech(session,nav){

async function _loadDT(session,nav){
  var sids=session.site_ids||[];

  if(!el)return;
  try{
    var html='';
    if(nav==='accueil')html=await _dtAccueil(session,sids,cid);
    else if(nav==='alertes')html=await _dtAlertes(sids,cid);
    else if(nav==='historique')html=await _dtHistorique(sids);

  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

async function _dtAccueil(session,sids,cid){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">🏨</div>Aucun site configuré pour ce compte</div>';
  var sidStr=sids.join(',');
  var today=todayStr();
  var since7=dateNJours(7);

  var[sites,equips,rondes,alertes,pannes,pannes7]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('equipements','site_id=in.('+sidStr+')&actif=eq.true&select=id,site_id'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=eq.'+today+'&select=id,site_id,frequence,technicien_id'),
    supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc&limit=50'),
    supaGet('pannes','site_id=in.('+sidStr+')&resolue=eq.false&select=id,site_id,type,description,date_panne,equipements(nom)&order=date_panne.desc&limit=50'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since7+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=30')
  ]);

  var rIds=rondes.map(function(r){return r.id;});
  var rondesEq=rIds.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,equipement_id,statut'):[];

  var techIds=[...new Set(rondes.filter(function(r){return r.technicien_id;}).map(function(r){return r.technicien_id;}))];
  var contacts=techIds.length?await supaGet('contacts','id=in.('+techIds.join(',')+')'+'&select=id,nom,site_id'):[];
  var contactMap={};contacts.forEach(function(c){contactMap[c.id]=c.nom;});

  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  var eqBySite={};equips.forEach(function(e){eqBySite[e.site_id]=(eqBySite[e.site_id]||0)+1;});
  var pannesBySite={};pannes.forEach(function(p){pannesBySite[p.site_id]=(pannesBySite[p.site_id]||0)+1;});
  var rondesBySite={};
  rondes.forEach(function(r){if(!rondesBySite[r.site_id])rondesBySite[r.site_id]=[];rondesBySite[r.site_id].push(r);});
  var reByRonde={};
  rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});

  // KPI globaux
  var totalAlertes=alertes.length+pannes.length;
  var totalVal=0,totalTot=0;
  rondes.forEach(function(r){
    var eq=reByRonde[r.id]||[];
    totalTot+=eq.length;
    totalVal+=eq.filter(function(re){return re.statut==='valide';}).length;
  });
  var confPct=totalTot>0?Math.round(totalVal/totalTot*100):null;

  // Banner
  var banner=totalAlertes>0
    ?'<div class="alert-banner"><div class="ab-icon">🚨</div><div class="ab-body"><div class="ab-title">'+totalAlertes+' alerte'+(totalAlertes>1?'s':'')+' active'+(totalAlertes>1?'s':'')+'</div><div class="ab-sub">Pannes ou alertes à traiter sur vos sites</div></div></div>'
    :'<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Tous les sites opérationnels</div><div class="ab-sub">Aucune alerte active'+(confPct!==null?' · '+confPct+'% de conformité rondes':'')+'</div></div></div>';

  // KPIs
  var kpis='<div class="kpi-grid">'+
    '<div class="kpi"><div class="kpi-label">Sites suivis</div><div class="kpi-value">'+sites.length+'</div><div class="kpi-trend">Hôtels du portefeuille</div></div>'+
    '<div class="kpi"><div class="kpi-label">Alertes actives</div><div class="kpi-value" style="color:'+(totalAlertes>0?'var(--rouge)':'var(--vert)')+'">'+totalAlertes+'</div><div class="kpi-trend">'+(totalAlertes>0?'À traiter':'RAS')+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Conformité rondes</div><div class="kpi-value" style="color:'+(confPct===null?'var(--text2)':confPct===100?'var(--vert)':confPct>=70?'var(--amber)':'var(--rouge)')+'">'+( confPct!==null?confPct+'%':'—')+'</div><div class="kpi-trend">Aujourd\'hui</div></div>'+
  '</div>';

  // Bloc 1 — Vue multi-sites
  var bloc1='<div class="section-title">Vue d\'ensemble multi-sites</div><div style="display:flex;flex-direction:column;gap:8px">';
  sids.forEach(function(sid){
    var sNom=siteMap[sid]||'Site';
    var sEqCount=eqBySite[sid]||0;
    var sPannesCount=pannesBySite[sid]||0;
    var sRondes=rondesBySite[sid]||[];
    var rondeJ=sRondes.find(function(r){return r.frequence==='journalier';});
    var eqRJ=rondeJ?(reByRonde[rondeJ.id]||[]):[];
    var val=eqRJ.filter(function(re){return re.statut==='valide';}).length;
    var tot=eqRJ.length;
    var pct=tot>0?Math.round(val/tot*100):null;
    var ok=tot>0&&val===tot;
    var rondeDisp,rondeCol;
    if(!rondeJ){rondeDisp='Pas de ronde';rondeCol='var(--text3)';}
    else if(tot===0){rondeDisp='Non commencée';rondeCol='var(--text3)';}
    else if(ok){rondeDisp='Complète';rondeCol='var(--vert)';}
    else{rondeDisp=val+'/'+tot+' · '+pct+'%';rondeCol='var(--amber)';}
    var sNomEsc=escape_html(sNom).replace(/'/g,"\\'");
    bloc1+='<div class="ronde-card" style="cursor:pointer" onclick="renderDirTechSite(_session,\''+sid+'\',\''+sNomEsc+'\',\'accueil\')">'+
      '<div style="display:flex;align-items:center;gap:12px'+(pct!==null?';margin-bottom:10px':'')+'">'+
        '<span style="font-size:20px">'+(ok?'✅':!rondeJ||tot===0?'📋':'🔄')+'</span>'+
        '<div style="flex:1">'+
          '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
          '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+sEqCount+' équipements · Ronde : <span style="color:'+rondeCol+'">'+rondeDisp+'</span></div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'+
          (sPannesCount>0
            ?'<span style="font-size:10px;font-weight:600;color:var(--rouge);background:var(--rouge-pale);border:1px solid var(--rouge-border);border-radius:4px;padding:2px 8px">'+sPannesCount+' panne'+(sPannesCount>1?'s':'')+'</span>'
            :'<span style="font-size:10px;font-weight:600;color:var(--vert)">RAS</span>')+
          '<span style="font-size:16px;color:var(--text3)">›</span>'+
        '</div>'+
      '</div>'+
      (pct!==null?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':'var(--amber)')+'"></div></div>':'')+
    '</div>';
  });
  bloc1+='</div>';

  // Bloc 2 — Équipements en alerte
  var bloc2='<div class="section-title">Équipements en alerte</div>';
  if(totalAlertes===0){
    bloc2+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune alerte active</div><div class="ab-sub">Tous les équipements fonctionnent normalement</div></div></div>';
  }else{
    bloc2+=_buildAlerteCardsDT(alertes,pannes,'accueil',siteMap);
  }

  // Bloc 3 — Suivi équipe
  var bloc3='<div class="section-title">Suivi équipe</div>';
  var byTech={};
  rondes.forEach(function(r){
    var tId=r.technicien_id||'_inconnu';
    if(!byTech[tId])byTech[tId]={nom:r.technicien_id?(contactMap[r.technicien_id]||'Technicien'):'Non assigné',rondes:[]};
    byTech[tId].rondes.push(r);
  });
  var techKeys=Object.keys(byTech);
  if(techKeys.length===0){
    bloc3+='<div class="placeholder-card"><div class="placeholder-icon">👥</div>Aucune ronde assignée aujourd\'hui</div>';
  }else{
    bloc3+='<div style="display:flex;flex-direction:column;gap:6px">';
    techKeys.forEach(function(tId){
      var t=byTech[tId];
      var allEq=[];
      t.rondes.forEach(function(r){allEq=allEq.concat(reByRonde[r.id]||[]);});
      var tVal=allEq.filter(function(re){return re.statut==='valide';}).length;
      var tTot=allEq.length;
      var tPct=tTot>0?Math.round(tVal/tTot*100):0;
      var tOk=tTot>0&&tVal===tTot;
      var techSiteIds=[...new Set(t.rondes.map(function(r){return r.site_id;}))];
      var techSiteNames=techSiteIds.map(function(s){return siteMap[s]||s;}).join(', ');
      bloc3+='<div class="eq-card" style="padding:12px 14px">'+
        '<span style="font-size:20px">'+(tOk?'✅':tTot===0?'⏳':'🔄')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(t.nom)+'</div>'+
          '<div class="eq-card-type">'+escape_html(techSiteNames)+'</div>'+
        '</div>'+
        '<div style="text-align:right;flex-shrink:0">'+
          '<div style="font-family:\'Cormorant Garamond\',serif;font-size:20px;font-weight:600;color:'+(tOk?'var(--vert)':tTot===0?'var(--text3)':'var(--amber)')+'">'+( tTot>0?tPct+'%':'—')+'</div>'+
          '<div style="font-size:10px;color:var(--text2)">'+tVal+'/'+tTot+'</div>'+
        '</div>'+
      '</div>';
    });
    bloc3+='</div>';
  }

  // Bloc 4 — Pannes 7 jours
  var bloc4='<div class="section-title">Pannes récentes <span style="font-size:12px;font-weight:400;color:var(--text3)">— 7 jours</span></div>';
  if(pannes7.length===0){
    bloc4+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur 7 jours</div><div class="ab-sub">Tous les sites sont stables</div></div></div>';
  }else{
    bloc4+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannes7.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      bloc4+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+( ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    bloc4+='</div>';
  }

  _updateAlertPill(totalAlertes);
  var recos=await _buildRecommandations(sids,siteMap);
  return banner+kpis+(recos?recos:'')+bloc1+bloc2+bloc3+bloc4;
}

async function _dtAlertes(sids,cid){
  var sidStr=sids.join(',');
  var[sites,alertes,pannes]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc'),
    supaGet('pannes','site_id=in.('+sidStr+')&resolue=eq.false&select=id,site_id,type,description,date_panne,equipements(nom)&order=date_panne.desc')
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  if(alertes.length===0&&pannes.length===0){
    return '<div class="alert-banner ok" style="margin-top:12px"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune alerte active</div><div class="ab-sub">Tous les systèmes fonctionnent normalement</div></div></div>';
  }
  return '<div style="margin-top:4px">'+_buildAlerteCardsDT(alertes,pannes,'alertes',siteMap)+'</div>';
}

function _buildAlerteCardsDT(alertes,pannes,fromNav,siteMap){
  var h='<div style="display:flex;flex-direction:column;gap:8px">';
  alertes.forEach(function(a){
    var crit=a.severite==='critical';
    var bg=crit?'var(--rouge-pale)':'var(--orange-pale)';
    var bd=crit?'var(--rouge-border)':'var(--orange-border)';
    var bl=crit?'var(--rouge)':'var(--orange)';
    var dot=crit?'🔴':'🟡';
    var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    h+='<div class="alerte-card" style="background:'+bg+';border:1px solid '+bd+';border-left:3px solid '+bl+'">'+
      '<span style="font-size:16px;margin-top:1px">'+dot+'</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:'+bl+'">'+escape_html(a.type||'Alerte')+'</div>'+
        '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
        (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
      '</div>'+
      '<button class="btn-traite" onclick="_marquerTraiteDT(\'alertes\',\''+a.id+'\',\''+fromNav+'\')">✓ Traité</button>'+
    '</div>';
  });
  pannes.forEach(function(p){
    var eqNom=p.equipements&&p.equipements.nom?' · '+p.equipements.nom:'';
    var sNom=siteMap&&p.site_id&&siteMap[p.site_id]?' · '+siteMap[p.site_id]:'';
    var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    h+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
      '<span style="font-size:16px;margin-top:1px">🔴</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:var(--rouge)">Panne'+escape_html(eqNom)+escape_html(sNom)+'</div>'+
        '<div class="alerte-card-msg">'+escape_html((p.type?p.type+' — ':'')+( p.description||''))+'</div>'+
        (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
      '</div>'+
      '<button class="btn-traite" onclick="_marquerTraiteDT(\'pannes\',\''+p.id+'\',\''+fromNav+'\')">✓ Résolu</button>'+
    '</div>';
  });
  return h+'</div>';
}

async function _marquerTraiteDT(table,id,fromNav){
  var btn=event&&event.target;
  if(btn){btn.disabled=true;btn.textContent='...';}
  await supaPatch(table,id,{resolue:true});
  if(!_session)return;
  if(_session.role==='dir_ops')renderDirOps(_session,fromNav||'alertes');
  else renderDirTech(_session,fromNav||'alertes');
}

async function _dtHistorique(sids){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucun site configuré</div>';
  var sidStr=sids.join(',');
  var period=_histPeriod||30;
  var since30=dateNJours(30);
  var cutoff=dateNJours(period);
  var[sites,rondes,pannes]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since30+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=300'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since30+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=120')
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  var rondesFilt=rondes.filter(function(r){return r.date_ronde>=cutoff;});
  var pannesFilt=pannes.filter(function(p){return!p.date_panne||p.date_panne>=cutoff;});
  var h=_buildPeriodSelector(period);
  if(rondesFilt.length===0&&pannesFilt.length===0){
    return h+'<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucune donnée sur les '+period+' derniers jours</div>';
  }
  // Rondes groupées par date → par site
  if(rondesFilt.length>0){
    var rIds=rondesFilt.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,statut');
    var reByRonde={};
    rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});
    var byDate={};
    rondesFilt.forEach(function(ro){var d=ro.date_ronde;if(!byDate[d])byDate[d]=[];byDate[d].push(ro);});
    var dates=Object.keys(byDate).sort(function(a,b){return b>a?1:-1;});
    h+='<div class="section-title" style="margin-top:4px">Rondes</div><div style="display:flex;flex-direction:column;gap:10px">';
    dates.forEach(function(d){
      var dateDisp=new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      var isToday=d===todayStr();
      h+='<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:8px;margin-bottom:2px">'+(isToday?'Aujourd\'hui — ':'')+dateDisp+'</div>';
      var bySite={};
      byDate[d].forEach(function(ro){if(!bySite[ro.site_id])bySite[ro.site_id]=[];bySite[ro.site_id].push(ro);});
      Object.keys(bySite).forEach(function(sid){
        var sNom=siteMap[sid]||'Site';
        var sRondes=bySite[sid];
        var allEq=[];
        sRondes.forEach(function(ro){allEq=allEq.concat(reByRonde[ro.id]||[]);});
        var val=allEq.filter(function(re){return re.statut==='valide';}).length;
        var tot=allEq.length;
        var pct=tot>0?Math.round(val/tot*100):0;
        var ok=val===tot&&tot>0;
        h+='<div class="ronde-card">'+
          '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
            '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':pct>0?'🔄':'❌')+'</span>'+
            '<div style="flex:1">'+
              '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
              '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+'/'+tot+' équipements · '+sRondes.length+' ronde'+(sRondes.length>1?'s':''):'Aucune donnée')+'</div>'+
            '</div>'+
            '<span style="font-family:\'Cormorant Garamond\',serif;font-size:22px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--amber)')+'">'+( tot>0?pct+'%':'—')+'</span>'+
          '</div>'+
          (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':pct>0?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
        '</div>';
      });
    });
    h+='</div>';
  }
  // Pannes
  h+='<div class="section-title">Pannes <span style="font-size:12px;font-weight:400;color:var(--text3)">— '+period+' jours</span></div>';
  if(pannesFilt.length===0){
    h+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur cette période</div></div></div>';
  }else{
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannesFilt.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      h+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+(ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

/* ── DIR TECH : détail site ── */
function renderDirTechSite(session,sid,siteNom,nav){
  nav=nav||'accueil';
  _dtCurrentSite={id:sid,nom:siteNom};
  var skeleton='<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px"><span class="spinner"></span>Chargement...</div>';
  app().innerHTML=buildLayout(session,nav,skeleton);
  var tb=document.querySelector('.dash-topbar-title');
  if(tb)tb.textContent=siteNom;
  _loadDTSite(session,sid,siteNom,nav);
}

async function _loadDTSite(session,sid,siteNom,nav){
  var cid=session.client_id;
  var el=document.querySelector('.dash-content');
  if(!el)return;
  try{
    var back='<button onclick="_exitSiteDetail()" style="display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:7px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;margin-bottom:8px;transition:background 0.12s" onmouseover="this.style.background=\'var(--creme)\'" onmouseout="this.style.background=\'none\'">← Tous les hôtels</button>';
    var html=back;
    if(nav==='accueil')html+=await _rtAccueil(session,sid,cid);
    else if(nav==='alertes')html+=await _rtAlertes(sid,cid);
    else if(nav==='historique')html+=await _rtHistorique(sid);
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

function _exitSiteDetail(){
  _dtCurrentSite=null;
  renderDirTech(_session,'accueil');
}

function renderDirOps(session,nav){

  var skeleton='<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px"><span class="spinner"></span>Chargement des données...</div>';

async function _loadDO(session,nav){
  var sids=session.site_ids||[];
  var cid=session.client_id;
  var el=document.querySelector('.dash-content');
  if(!el)return;
  try{
    var html='';
    if(nav==='accueil')html=await _doAccueil(session,sids,cid);

  }
}

async function _doAccueil(session,sids,cid){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">🏨</div>Aucun site configuré pour ce compte</div>';
  var sidStr=sids.join(',');
  var since7=dateNJours(7);
  var since14=dateNJours(14);
  var threeDaysAgo=dateNJours(3);

  var[sites,alertes,pannes,rondes7,pannes14]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc&limit=50'),
    supaGet('pannes','site_id=in.('+sidStr+')&resolue=eq.false&select=id,site_id,type,description,date_panne,equipements(nom)&order=date_panne.asc&limit=50'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since7+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=200'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since14+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=60')
  ]);

  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});

  // Rondes 7j → conformité globale + par site
  var rIds7=rondes7.map(function(r){return r.id;});
  var rondesEq7=rIds7.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds7.join(',')+')'+'&select=ronde_id,statut'):[];
  // attach site_id to rondesEq via rondes7 map
  var rondeToSite={};
  rondes7.forEach(function(r){rondeToSite[r.id]=r.site_id;});
  var reByRonde7={};
  rondesEq7.forEach(function(re){
    if(!reByRonde7[re.ronde_id])reByRonde7[re.ronde_id]=[];
    reByRonde7[re.ronde_id].push(re);
  });

  var totalVal7=0,totalTot7=0;
  rondes7.forEach(function(r){
    var eq=reByRonde7[r.id]||[];
    totalTot7+=eq.length;
    totalVal7+=eq.filter(function(re){return re.statut==='valide';}).length;
  });
  var confGlobal7=totalTot7>0?Math.round(totalVal7/totalTot7*100):null;
  var totalAlertes=alertes.length+pannes.length;

  // Banner
  var banner=totalAlertes>0
    ?'<div class="alert-banner"><div class="ab-icon">🚨</div><div class="ab-body"><div class="ab-title">'+totalAlertes+' action'+(totalAlertes>1?'s':'')+' requise'+(totalAlertes>1?'s':'')+'</div><div class="ab-sub">Pannes ou alertes nécessitant votre attention</div></div></div>'
    :'<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Tous les sites opérationnels</div><div class="ab-sub">Aucune alerte active'+(confGlobal7!==null?' · '+confGlobal7+'% de conformité sur 7 jours':'')+'</div></div></div>';

  // KPIs
  var kpis='<div class="kpi-grid">'+
    '<div class="kpi"><div class="kpi-label">Hôtels suivis</div><div class="kpi-value">'+sites.length+'</div><div class="kpi-trend">Portefeuille Azalaï</div></div>'+
    '<div class="kpi"><div class="kpi-label">Actions requises</div><div class="kpi-value" style="color:'+(totalAlertes>0?'var(--rouge)':'var(--vert)')+'">'+totalAlertes+'</div><div class="kpi-trend">'+(totalAlertes>0?'À traiter':'RAS')+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Conformité 7 jours</div><div class="kpi-value" style="color:'+(confGlobal7===null?'var(--text2)':confGlobal7===100?'var(--vert)':confGlobal7>=70?'var(--amber)':'var(--rouge)')+'">'+( confGlobal7!==null?confGlobal7+'%':'—')+'</div><div class="kpi-trend">Rondes tous sites</div></div>'+
  '</div>';

  // Bloc 1 — Vue multi-sites (cartes cliquables)
  var bloc1='<div class="section-title">Vue d\'ensemble</div><div style="display:flex;flex-direction:column;gap:8px">';
  sids.forEach(function(sid){
    var sNom=siteMap[sid]||'Site';

    var sPannesCount=sPannes.length;
    var sRondes7=rondes7.filter(function(r){return r.site_id===sid;});
    var allEq7=[];
    sRondes7.forEach(function(r){allEq7=allEq7.concat(reByRonde7[r.id]||[]);});
    var sVal=allEq7.filter(function(re){return re.statut==='valide';}).length;
    var sTot=allEq7.length;
    var sPct7=sTot>0?Math.round(sVal/sTot*100):null;
    var sNomEsc=escape_html(sNom).replace(/'/g,"\\'");
    bloc1+='<div class="ronde-card" style="cursor:pointer" onclick="renderDirOpsSite(_session,\''+sid+'\',\''+sNomEsc+'\',\'accueil\')">'+
      '<div style="display:flex;align-items:center;gap:12px'+(sPct7!==null?';margin-bottom:10px':'')+'">'+
        '<span style="font-size:20px">'+(sPannesCount>0?'🔴':sPct7===100?'✅':'📋')+'</span>'+
        '<div style="flex:1">'+
          '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
          '<div style="font-size:11px;color:var(--text2);margin-top:2px">Conformité 7j : '+(sPct7!==null?'<span style="font-weight:600;color:'+(sPct7===100?'var(--vert)':sPct7>=70?'var(--amber)':'var(--rouge)')+'">'+sPct7+'%</span>':'<span style="color:var(--text3)">—</span>')+'</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'+
          (sPannesCount>0
            ?'<span style="font-size:10px;font-weight:600;color:var(--rouge);background:var(--rouge-pale);border:1px solid var(--rouge-border);border-radius:4px;padding:2px 8px">'+sPannesCount+' panne'+(sPannesCount>1?'s':'')+'</span>'
            :'<span style="font-size:10px;font-weight:600;color:var(--vert)">RAS</span>')+
          '<span style="font-size:16px;color:var(--text3)">›</span>'+
        '</div>'+
      '</div>'+
      (sPct7!==null?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+sPct7+'%;background:'+(sPct7===100?'var(--vert)':sPct7>=70?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
    '</div>';
  });
  bloc1+='</div>';

  // Bloc 2 — Actions requises
  var bloc2='<div class="section-title">Actions requises</div>';
  var pannesRetard=pannes.filter(function(p){return p.date_panne&&p.date_panne<=threeDaysAgo;});
  var alertesCritiques=alertes.filter(function(a){return a.severite==='critical';});
  var pannesNormales=pannes.filter(function(p){return !p.date_panne||p.date_panne>threeDaysAgo;});
  var alertesNormales=alertes.filter(function(a){return a.severite!=='critical';});

  if(totalAlertes===0){
    bloc2+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune action requise</div><div class="ab-sub">Tous les délais sont respectés</div></div></div>';
  }else{
    var items='<div style="display:flex;flex-direction:column;gap:8px">';
    // Pannes en retard (> 3j) — priorité max
    pannesRetard.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var daysDiff=p.date_panne?Math.floor((new Date()-new Date(p.date_panne))/(1000*60*60*24)):0;
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
      items+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
        '<span style="font-size:16px;margin-top:1px">⏰</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--rouge)">Panne en retard · '+escape_html(sNom)+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(eqNom)+(p.description||p.type?' — '+escape_html(p.description||p.type):'')+'</div>'+
          '<div style="font-size:10px;color:var(--rouge);margin-top:4px;font-weight:600">'+daysDiff+' jour'+(daysDiff>1?'s':'')+' sans résolution · Signalé le '+ts+'</div>'+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'pannes\',\''+p.id+'\',\'accueil\')">✓ Résolu</button>'+
      '</div>';
    });
    // Alertes critiques
    alertesCritiques.forEach(function(a){
      var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      items+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
        '<span style="font-size:16px;margin-top:1px">🔴</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--rouge)">'+escape_html(a.type||'Alerte critique')+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
          (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'alertes\',\''+a.id+'\',\'accueil\')">✓ Traité</button>'+
      '</div>';
    });
    // Pannes récentes (< 3j)
    pannesNormales.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      items+='<div class="alerte-card" style="background:var(--orange-pale);border:1px solid var(--orange-border);border-left:3px solid var(--orange)">'+
        '<span style="font-size:16px;margin-top:1px">🟡</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--orange)">Panne · '+escape_html(sNom)+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(eqNom)+(p.description||p.type?' — '+escape_html(p.description||p.type):'')+'</div>'+
          (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'pannes\',\''+p.id+'\',\'accueil\')">✓ Résolu</button>'+
      '</div>';
    });
    // Alertes non-critiques
    alertesNormales.forEach(function(a){
      var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      items+='<div class="alerte-card" style="background:var(--amber-pale);border:1px solid var(--amber-border);border-left:3px solid var(--amber)">'+
        '<span style="font-size:16px;margin-top:1px">🟡</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--amber)">'+escape_html(a.type||'Alerte')+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
          (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'alertes\',\''+a.id+'\',\'accueil\')">✓ Traité</button>'+
      '</div>';
    });
    bloc2+=items+'</div>';
  }

  // Bloc 3 — Activité récente 14j
  var bloc3='<div class="section-title">Activité récente <span style="font-size:12px;font-weight:400;color:var(--text3)">— 14 jours</span></div>';
  if(pannes14.length===0){
    bloc3+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur 14 jours</div><div class="ab-sub">Tous les sites sont stables</div></div></div>';
  }else{
    bloc3+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannes14.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      bloc3+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+

          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+( ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';

  }

  _updateAlertPill(totalAlertes);
  var recos=await _buildRecommandations(sids,siteMap);
  return banner+kpis+(recos?recos:'')+bloc1+bloc2+bloc3;
}

async function _marquerTraiteDO(table,id,fromNav){
  var btn=event&&event.target;
  if(btn){btn.disabled=true;btn.textContent='...';}
  await supaPatch(table,id,{resolue:true});
  if(_session)renderDirOps(_session,fromNav||'alertes');
}

async function _doHistorique(sids){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucun site configuré</div>';
  var sidStr=sids.join(',');
  var period=_histPeriod||30;
  var since30=dateNJours(30);
  var cutoff=dateNJours(period);
  var[sites,rondes,pannes]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since30+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=300'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since30+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=120')
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  var rondesFilt=rondes.filter(function(r){return r.date_ronde>=cutoff;});
  var pannesFilt=pannes.filter(function(p){return!p.date_panne||p.date_panne>=cutoff;});
  var h=_buildPeriodSelector(period);
  if(rondesFilt.length===0&&pannesFilt.length===0){
    return h+'<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucune donnée sur les '+period+' derniers jours</div>';
  }
  // Rondes groupées par date → par site
  if(rondesFilt.length>0){
    var rIds=rondesFilt.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,statut');
    var reByRonde={};
    rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});
    var byDate={};
    rondesFilt.forEach(function(ro){var d=ro.date_ronde;if(!byDate[d])byDate[d]=[];byDate[d].push(ro);});
    var dates=Object.keys(byDate).sort(function(a,b){return b>a?1:-1;});
    h+='<div class="section-title" style="margin-top:4px">Rondes</div><div style="display:flex;flex-direction:column;gap:10px">';
    dates.forEach(function(d){
      var dateDisp=new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      var isToday=d===todayStr();
      h+='<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:8px;margin-bottom:2px">'+(isToday?'Aujourd\'hui — ':'')+dateDisp+'</div>';
      var bySite={};
      byDate[d].forEach(function(ro){if(!bySite[ro.site_id])bySite[ro.site_id]=[];bySite[ro.site_id].push(ro);});
      Object.keys(bySite).forEach(function(sid){
        var sNom=siteMap[sid]||'Site';
        var sRondes=bySite[sid];
        var allEq=[];
        sRondes.forEach(function(ro){allEq=allEq.concat(reByRonde[ro.id]||[]);});
        var val=allEq.filter(function(re){return re.statut==='valide';}).length;
        var tot=allEq.length;
        var pct=tot>0?Math.round(val/tot*100):0;
        var ok=val===tot&&tot>0;
        h+='<div class="ronde-card">'+
          '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
            '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':pct>0?'🔄':'❌')+'</span>'+
            '<div style="flex:1">'+
              '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
              '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+'/'+tot+' équipements · '+sRondes.length+' ronde'+(sRondes.length>1?'s':''):'Aucune donnée')+'</div>'+
            '</div>'+
            '<span style="font-family:\'Cormorant Garamond\',serif;font-size:22px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--amber)')+'">'+( tot>0?pct+'%':'—')+'</span>'+
          '</div>'+
          (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':pct>0?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
        '</div>';
      });
    });
    h+='</div>';
  }
  // Pannes
  h+='<div class="section-title">Pannes <span style="font-size:12px;font-weight:400;color:var(--text3)">— '+period+' jours</span></div>';
  if(pannesFilt.length===0){
    h+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur cette période</div></div></div>';
  }else{
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannesFilt.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      h+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+(ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

/* ── DIR OPS : détail site ── */
function renderDirOpsSite(session,sid,siteNom,nav){
  nav=nav||'accueil';
  _doCurrentSite={id:sid,nom:siteNom};
  var skeleton='<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px"><span class="spinner"></span>Chargement...</div>';
  app().innerHTML=buildLayout(session,nav,skeleton);
  var tb=document.querySelector('.dash-topbar-title');
  if(tb)tb.textContent=siteNom;
  _loadDOSite(session,sid,siteNom,nav);
}

async function _loadDOSite(session,sid,siteNom,nav){
  var cid=session.client_id;
  var el=document.querySelector('.dash-content');
  if(!el)return;
  try{
    var back='<button onclick="_exitDOSiteDetail()" style="display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:7px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;margin-bottom:8px;transition:background 0.12s" onmouseover="this.style.background=\'var(--creme)\'" onmouseout="this.style.background=\'none\'">← Tous les hôtels</button>';
    var html=back;
    if(nav==='accueil')html+=await _rtAccueil(session,sid,cid);
    else if(nav==='alertes')html+=await _rtAlertes(sid,cid);
    else if(nav==='historique')html+=await _rtHistorique(sid);
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

function _exitDOSiteDetail(){
  _doCurrentSite=null;
  renderDirOps(_session,'accueil');
}

function _timeAgo(isoStr){
  if(!isoStr)return'';
  var diff=Math.round((Date.now()-new Date(isoStr))/60000);
  if(diff<1)return'à l\'instant';
  if(diff<60)return'il y a '+diff+' min';
  if(diff<1440)return'il y a '+Math.round(diff/60)+'h';
  return'il y a '+Math.round(diff/1440)+'j';
}

// Store reco data for action buttons (keyed by eqId+index to avoid JSON in onclick)
var _recoCache={};

function _buildRecoTag(reco,eqId,eqNom,sid){
  var cfgs={
    immediate:{bg:'var(--rouge-pale)',border:'var(--rouge-border)',color:'var(--rouge)',icon:'🔴',btnLabel:'Créer un signalement',btnFn:'_recoSignaler'},
    preventive:{bg:'var(--orange-pale)',border:'var(--orange-border)',color:'var(--orange)',icon:'🟡',btnLabel:'Planifier une maintenance',btnFn:'_recoPlanifier'},
    operationnelle:{bg:'var(--amber-pale)',border:'var(--amber-border)',color:'var(--amber)',icon:'🔧',btnLabel:'Signaler vétusté',btnFn:'_recoVetuste'}
  };
  var cfg=cfgs[reco.type]||cfgs.operationnelle;
  var cacheKey=(eqId||'x')+'_'+reco.type;
  _recoCache[cacheKey]={reco:reco,eqId:eqId,eqNom:eqNom,sid:sid};
  var btnHtml=eqId&&sid?
    '<button onclick="'+cfg.btnFn+'(\''+cacheKey+'\')" style="margin-top:6px;padding:5px 10px;border:1px solid '+cfg.border+';border-radius:6px;background:white;font-size:11px;font-weight:700;color:'+cfg.color+';cursor:pointer;width:100%">'+cfg.btnLabel+' →</button>':'';
  return '<div style="background:'+cfg.bg+';border:1px solid '+cfg.border+';border-radius:6px;padding:6px 10px">'+
    '<div style="display:flex;align-items:flex-start;gap:6px">'+
      '<span style="font-size:13px;flex-shrink:0;margin-top:1px">'+cfg.icon+'</span>'+
      '<span style="font-size:11px;color:'+cfg.color+';line-height:1.4">'+escape_html(reco.message)+'</span>'+
    '</div>'+
    btnHtml+
  '</div>';
}

async function _recoSignaler(cacheKey){
  var d=_recoCache[cacheKey];if(!d)return;

async function _fetchRecoEquipements(sid){
  var since7=dateNJours(7);
  var since90=dateNJours(90);
  // --- Rondes (7 derniers jours) ---
  var reToEq={};
  var reponses=[];
  var rondes7=await supaGet('rondes','site_id=eq.'+sid+'&date_ronde=gte.'+since7+'&select=id&limit=100');
  if(rondes7.length){
    var rIds=rondes7.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=id,equipement_id&limit=500');
    if(rondesEq.length){
      var reIds=rondesEq.map(function(re){return re.id;});
      rondesEq.forEach(function(re){reToEq[re.id]=re.equipement_id;});
      reponses=await supaGet('reponses','ronde_equipement_id=in.('+reIds.join(',')+')'+'&select=valeur,created_at,ronde_equipement_id,question_id,questions(texte,type_reponse,unite,seuil_min,seuil_max)'+'&order=created_at.desc&limit=600');
    }
  }
  var pannes90=await supaGet('pannes','site_id=eq.'+sid+'&date_panne=gte.'+since90+'&select=id,equipement_id&limit=200');
  var pannesByEq={};
  pannes90.forEach(function(p){pannesByEq[p.equipement_id]=(pannesByEq[p.equipement_id]||0)+1;});
  // Group reponses numériques (avec seuils) par équipement → question
  var repByEqQ={};
  var lastSaisieByEq={};
  reponses.forEach(function(r){
    var eqId=reToEq[r.ronde_equipement_id];
    if(!eqId)return;
    var q=r.questions;
    // Dernière saisie numérique (toutes questions)
    if(q&&q.type_reponse==='numerique'){
      if(!lastSaisieByEq[eqId]||r.created_at>lastSaisieByEq[eqId].t){
        lastSaisieByEq[eqId]={v:parseFloat(r.valeur),t:r.created_at,unite:q.unite||''};
      }
    }
    // Pour les recos : numérique + seuils définis
    if(!q||q.type_reponse!=='numerique'||(q.seuil_min===null&&q.seuil_max===null))return;
    if(!repByEqQ[eqId])repByEqQ[eqId]={};
    if(!repByEqQ[eqId][r.question_id])repByEqQ[eqId][r.question_id]=[];
    repByEqQ[eqId][r.question_id].push({v:parseFloat(r.valeur),t:r.created_at,q:q});
  });
  // --- Relevés horaires validés (7 derniers jours) ---
  var relevesRecent=await supaGet('releves_horaires','site_id=eq.'+sid+'&statut=eq.validé&created_at=gte.'+since7+'T00:00:00Z&select=id&limit=50');
  if(relevesRecent.length){
    var relIds=relevesRecent.map(function(r){return r.id;});
    var releveReps=await supaGet('reponses','releve_id=in.('+relIds.join(',')+')'+'&select=valeur,created_at,question_id,questions(texte,type_reponse,unite,seuil_min,seuil_max,equipement_id)'+'&order=created_at.desc&limit=400');
    releveReps.forEach(function(r){
      var q=r.questions;if(!q)return;
      var eqId=q.equipement_id;if(!eqId)return;
      if(q.type_reponse==='numerique'){
        if(!lastSaisieByEq[eqId]||r.created_at>lastSaisieByEq[eqId].t){
          lastSaisieByEq[eqId]={v:parseFloat(r.valeur),t:r.created_at,unite:q.unite||''};
        }
        if(q.seuil_min!==null||q.seuil_max!==null){
          if(!repByEqQ[eqId])repByEqQ[eqId]={};
          if(!repByEqQ[eqId][r.question_id])repByEqQ[eqId][r.question_id]=[];
          repByEqQ[eqId][r.question_id].push({v:parseFloat(r.valeur),t:r.created_at,q:q});
        }
      }
    });
  }
  var result={};
  var allEqIds=Object.keys(Object.assign({},repByEqQ,pannesByEq));
  allEqIds.forEach(function(eqId){
    var recos=[];
    var qMap=repByEqQ[eqId]||{};
    Object.keys(qMap).forEach(function(qId){
      var vals=qMap[qId].slice().sort(function(a,b){return b.t.localeCompare(a.t);});
      var q=vals[0].q;
      var last=vals[0].v;
      var sMin=q.seuil_min!==null?parseFloat(q.seuil_min):null;
      var sMax=q.seuil_max!==null?parseFloat(q.seuil_max):null;
      var u=q.unite?' '+q.unite:'';
      // Immédiate : seuil dépassé à la dernière saisie
      if((sMax!==null&&last>sMax)||(sMin!==null&&last<sMin)){
        var dir=sMax!==null&&last>sMax?'max':'min';
        var seuil=dir==='max'?sMax:sMin;
        recos.push({type:'immediate',message:last+u+' — seuil '+dir+' : '+seuil+u+'. Vérifier l\'équipement.',severite:1});
      }else{
        // Préventive approche seuil min (ex: cuve carburant proche de 1500L)
        if(sMin!==null&&sMin>0&&last>sMin&&last<sMin*1.3){
          recos.push({type:'preventive',message:'Niveau à '+last+u+' — approche du seuil minimum ('+sMin+u+'). Planifier le ravitaillement.',severite:2});
        }
        // Préventive approche seuil max (ex: CF proche de 5°C)
        if(sMax!==null&&sMax>0&&last<sMax&&last>sMax*0.8){
          recos.push({type:'preventive',message:'Valeur à '+last+u+' — approche du seuil maximum ('+sMax+u+'). Surveiller.',severite:2});
        }
        // Préventive : tendance dégradée sur 4+ relevés
        if(vals.length>=4){
          var n=Math.min(3,Math.floor(vals.length/2));
          var avgOld=vals.slice(-n).reduce(function(s,x){return s+x.v;},0)/n;
          var avgNew=vals.slice(0,n).reduce(function(s,x){return s+x.v;},0)/n;
          var delta=avgNew-avgOld;
          var pct=avgOld!==0?Math.abs(delta/avgOld*100):0;
          var degrading=(sMax!==null&&delta>0&&pct>15)||(sMin!==null&&delta<0&&pct>15);
          if(degrading){
            var sign=delta>0?'+':'';
            recos.push({type:'preventive',message:'Dérive '+sign+delta.toFixed(1)+u+' sur '+vals.length+' relevés. Prévoir un contrôle.',severite:2});
          }
        }
      }
    });
    // Opérationnelle : récurrence pannes 90j
    var nb=pannesByEq[eqId]||0;
    if(nb>3)recos.push({type:'operationnelle',message:nb+' interventions en 90 jours. Remplacement à envisager.',severite:3});
    recos.sort(function(a,b){return a.severite-b.severite;});
    result[eqId]={recos:recos,lastSaisie:lastSaisieByEq[eqId]||null};
  });
  // Équipements avec saisie numérique mais sans seuils ni pannes (ex: GE compteur horaire)
  Object.keys(lastSaisieByEq).forEach(function(eqId){
    if(!result[eqId])result[eqId]={recos:[],lastSaisie:lastSaisieByEq[eqId]};
  });
  return result;
}

function _toggleExportMenu(){
  var m=document.getElementById('export-menu');
  if(!m)return;
  var isOpen=m.style.display!=='none';
  m.style.display=isOpen?'none':'block';
  if(!isOpen){
    setTimeout(function(){
      document.addEventListener('click',function _cl(e){
        if(!m.contains(e.target)&&e.target.id!=='export-btn-trigger'){m.style.display='none';}
        document.removeEventListener('click',_cl);
      });
    },10);
  }
}

async function _openReport(period){
  var m=document.getElementById('export-menu');
  if(m)m.style.display='none';
  var btn=document.getElementById('export-btn-trigger');
  if(btn){btn.disabled=true;btn.textContent='⏳ Chargement...';}
  try{
    var cid=_session.client_id;
    var cutoff=dateNJours(period);
    var sid=null,siteNom='Tous les sites',sids=null;
    if(_session.role==='resp_tech'){
      sid=_session.site_ids&&_session.site_ids[0];
      var sr=sid?await supaGet('sites','id=eq.'+sid+'&select=nom&limit=1'):[];
      siteNom=sr.length?sr[0].nom:'Mon site';
    }else if(_doCurrentSite){sid=_doCurrentSite.id;siteNom=_doCurrentSite.nom;}
    else if(_dtCurrentSite){sid=_dtCurrentSite.id;siteNom=_dtCurrentSite.nom;}
    else{sids=_session.site_ids||[];}
    var reportHtml='';
    if(sid){
      var[rondes,pannes,alertes,equips]=await Promise.all([
        supaGet('rondes','site_id=eq.'+sid+'&date_ronde=gte.'+cutoff+'&select=id,date_ronde,frequence&order=date_ronde.desc&limit=90'),
        supaGet('pannes','site_id=eq.'+sid+'&date_panne=gte.'+cutoff+'&select=id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=60'),
        supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc'),
        supaGet('equipements','site_id=eq.'+sid+'&actif=eq.true&select=id,nom,types_equipements(nom)&order=ordre_ronde.asc')
      ]);
      var rIds=rondes.map(function(r){return r.id;});
      var rondesEq=rIds.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,equipement_id,statut'):[];
      reportHtml=_buildReportSingle(siteNom,period,rondes,rondesEq,pannes,alertes,equips);
    }else{
      var sidStr=(sids||[]).join(',');
      if(!sidStr){reportHtml='<p>Aucun site configuré</p>';}
      else{
        var[sites,rondes,pannes,alertes]=await Promise.all([
          supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
          supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+cutoff+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=300'),
          supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+cutoff+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=120'),
          supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc')
        ]);
        var rIds=rondes.map(function(r){return r.id;});
        var rondesEq=rIds.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,statut'):[];
        var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
        var rondeToSite={};rondes.forEach(function(r){rondeToSite[r.id]=r.site_id;});
        reportHtml=_buildReportMulti(sites,siteMap,period,rondes,rondesEq,rondeToSite,pannes,alertes);
      }
    }
    var w=window.open('','_blank');
    if(!w){alert('Autorisez les popups pour générer le rapport.');return;}
    w.document.write(reportHtml);
    w.document.close();
  }catch(e){alert('Erreur lors de la génération du rapport : '+(e.message||e));}
  finally{if(btn){btn.disabled=false;btn.textContent='⬇ Exporter';}}
}
