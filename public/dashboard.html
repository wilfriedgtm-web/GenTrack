}

function _eqImportRenderAssign(zones,sid){
  var cats=Object.keys(_eqImportByCat);
  var allEqs=[];
  cats.forEach(function(cat){
    (_eqImportByCat[cat]||[]).forEach(function(eq,idx){
      allEqs.push({key:cat+'__'+idx,cat:cat,nom:eq});
    });
  });
  var totalEq=allEqs.length;

  // Calcul total lignes
  var totalRows=0;
  if(_eqImportAssignMode==='bloc'){
    totalRows=totalEq*_eqImportBlocZones.length;
  } else {
    allEqs.forEach(function(eq){
      var ids=_eqImportIndivZones.hasOwnProperty(eq.key)?_eqImportIndivZones[eq.key]:_eqImportBlocZones;
      totalRows+=ids.length;
    });
  }

  // Zones groupées par catégorie pour le picker
  var zoneByCat={};
  zones.forEach(function(z){
    var c=z.categorie||'Autre';
    if(!zoneByCat[c])zoneByCat[c]=[];
    zoneByCat[c].push(z);
  });

  // Render zone picker (DOM direct pour toggle sans re-render)
  function renderZonePicker(selectedIds,pickerId,fnToggle,fnToggleCat){
    var groupsHtml=Object.keys(zoneByCat).map(function(c){
      var czones=zoneByCat[c];
      var icon=_ZONE_CAT_ICONS[c]||'📍';
      var selCount=czones.filter(function(z){return selectedIds.indexOf(z.id)>=0;}).length;
      var allIdsJson="['"+czones.map(function(z){return z.id;}).join("','")+"']";
      var cEsc=c.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return '<div class="eq-zone-group" style="margin-bottom:10px">'+
        '<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">'+
          '<span style="font-size:13px">'+icon+'</span>'+
          '<span style="font-size:12px;font-weight:700;color:var(--dark);flex:1">'+escape_html(c)+'</span>'+
          '<span id="'+pickerId+'-cnt-'+c.replace(/[^a-z0-9]/gi,'_')+'" style="font-size:11px;color:var(--text2)">'+selCount+'/'+czones.length+'</span>'+
          '<button onclick="'+fnToggleCat+'(\''+cEsc+'\','+allIdsJson+',true,\''+pickerId+'\')" '+
            'style="padding:2px 6px;border:1px solid var(--border);border-radius:4px;background:white;font-size:10px;cursor:pointer;font-family:inherit;color:var(--text2)">Tout</button>'+
          '<button onclick="'+fnToggleCat+'(\''+cEsc+'\','+allIdsJson+',false,\''+pickerId+'\')" '+
            'style="padding:2px 6px;border:1px solid var(--border);border-radius:4px;background:white;font-size:10px;cursor:pointer;font-family:inherit;color:var(--text2)">Aucun</button>'+
        '</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:5px">'+
          czones.map(function(z){
            var sel=selectedIds.indexOf(z.id)>=0;
            return '<button class="eq-zone-chip" data-name="'+escape_html(z.nom.toLowerCase())+'" '+
              'data-zone="'+z.id+'" data-cat="'+escape_html(c)+'" '+
              'onclick="'+fnToggle+'(\''+z.id+'\',this,\''+pickerId+'\')" '+
              'style="padding:3px 9px;border:1.5px solid '+(sel?'var(--amber)':'var(--border)')+';border-radius:14px;'+
              'background:'+(sel?'var(--amber)':'white')+';color:'+(sel?'white':'var(--text2)')+';'+
              'font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">'+
              escape_html(z.nom)+
            '</button>';
          }).join('')+
        '</div>'+
      '</div>';
    }).join('');
    return '<div style="margin-bottom:8px">'+
      '<input placeholder="🔍 Rechercher…" oninput="_eqImportZoneFilter(this.value,\''+pickerId+'\')" '+
        'style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;font-family:inherit;outline:none">'+
    '</div>'+
    '<div id="'+pickerId+'">'+groupsHtml+'</div>';
  }

  // Toggle bloc
  var modeHtml='<div style="display:flex;gap:8px;margin-bottom:14px">'+
    _buildModeBtn('🗂 Même zones pour tous','bloc')+

// ── Bloc mode toggles (DOM direct, pas de re-render) ──
function _eqImportToggleBlocZone(zoneId,btn,pickerId){
  var idx=_eqImportBlocZones.indexOf(zoneId);
  if(idx>=0){_eqImportBlocZones.splice(idx,1);_eqImportSetChipSel(btn,false);}
  else{_eqImportBlocZones.push(zoneId);_eqImportSetChipSel(btn,true);}
  _eqImportUpdateCatCount(pickerId,btn.dataset.cat,_eqImportBlocZones);
  _eqImportUpdateTotal();
}

function _eqImportToggleBlocCat(cat,allIds,selectAll,pickerId){
  if(selectAll){
    allIds.forEach(function(id){if(_eqImportBlocZones.indexOf(id)<0)_eqImportBlocZones.push(id);});
  } else {
    allIds.forEach(function(id){var i=_eqImportBlocZones.indexOf(id);if(i>=0)_eqImportBlocZones.splice(i,1);});
  }
  _eqImportRefreshPicker(pickerId,_eqImportBlocZones);
  _eqImportUpdateTotal();
}

// ── Individual mode toggles (DOM direct) ──
function _eqImportToggleIndivZone(key,zoneId,btn,pickerId){
  if(!_eqImportIndivZones.hasOwnProperty(key))_eqImportIndivZones[key]=_eqImportBlocZones.slice();
  var arr=_eqImportIndivZones[key];
  var idx=arr.indexOf(zoneId);
  if(idx>=0){arr.splice(idx,1);_eqImportSetChipSel(btn,false);}
  else{arr.push(zoneId);_eqImportSetChipSel(btn,true);}
  _eqImportUpdateCatCount(pickerId,btn.dataset.cat,arr);
  _eqImportUpdateTotal();
}

function _eqImportToggleIndivCat(key,cat,allIds,selectAll,pickerId){
  if(!_eqImportIndivZones.hasOwnProperty(key))_eqImportIndivZones[key]=_eqImportBlocZones.slice();
  var arr=_eqImportIndivZones[key];
  if(selectAll){allIds.forEach(function(id){if(arr.indexOf(id)<0)arr.push(id);});}
  else{allIds.forEach(function(id){var i=arr.indexOf(id);if(i>=0)arr.splice(i,1);});}
  _eqImportRefreshPicker(pickerId,arr);
  _eqImportUpdateTotal();
}

// ── DOM helpers ──
function _eqImportSetChipSel(btn,sel){
  btn.style.background=sel?'var(--amber)':'white';
  btn.style.borderColor=sel?'var(--amber)':'var(--border)';
  btn.style.color=sel?'white':'var(--text2)';
}

function _eqImportRefreshPicker(pickerId,selectedIds){
  var picker=document.getElementById(pickerId);
  if(!picker)return;
  picker.querySelectorAll('.eq-zone-chip').forEach(function(btn){
    _eqImportSetChipSel(btn,selectedIds.indexOf(btn.dataset.zone||btn.getAttribute('data-zone'))>=0);
  });
  // update all cat counts
  picker.querySelectorAll('.eq-zone-group').forEach(function(grp){
    var cat=grp.querySelector('.eq-zone-chip');
    if(!cat)return;
    var catName=cat.dataset.cat;
    _eqImportUpdateCatCount(pickerId,catName,selectedIds);
  });
}

function _eqImportUpdateCatCount(pickerId,cat,selectedIds){
  var picker=document.getElementById(pickerId);
  if(!picker)return;
  var catKey=cat.replace(/[^a-z0-9]/gi,'_');
  var el=picker.querySelector('[id$="-cnt-'+catKey+'"]')||document.getElementById(pickerId+'-cnt-'+catKey);
  if(!el)return;
  var chips=picker.querySelectorAll('.eq-zone-chip[data-cat="'+cat+'"]');
  var total=chips.length;
  var sel=Array.from(chips).filter(function(b){return selectedIds.indexOf(b.dataset.zone||b.getAttribute('data-zone'))>=0;}).length;
  el.textContent=sel+'/'+total;
}

function _eqImportUpdateTotal(){
  var el=document.getElementById('eq-import-total');
  if(!el)return;
  var allEqs=[];
  Object.keys(_eqImportByCat).forEach(function(cat){(_eqImportByCat[cat]||[]).forEach(function(eq,idx){allEqs.push(cat+'__'+idx);});});
  var total=0;
  if(_eqImportAssignMode==='bloc'){
    total=allEqs.length*_eqImportBlocZones.length;
  } else {
    allEqs.forEach(function(key){
      var ids=_eqImportIndivZones.hasOwnProperty(key)?_eqImportIndivZones[key]:_eqImportBlocZones;
      total+=ids.length;
    });
  }
  el.textContent=total;
}

function _eqImportZoneFilter(val,pickerId){
  var q=(val||'').trim().toLowerCase();
  var picker=document.getElementById(pickerId);
  if(!picker)return;
  picker.querySelectorAll('.eq-zone-chip').forEach(function(btn){
    btn.style.display=(!q||btn.dataset.name.indexOf(q)>=0)?'':'none';
  });
  picker.querySelectorAll('.eq-zone-group').forEach(function(grp){
    var visible=grp.querySelectorAll('.eq-zone-chip:not([style*="display: none"])').length;
    grp.style.display=visible?'':'none';
  });
}

async function _eqImportConfirm(){
  var sid=_eqImportSid||(_session&&_session.groupe_id);
  if(!sid)return;
  var zones=window._zonesCacheZones||[];
  var progEl=document.getElementById('eq-import-progress');
  var btn=document.querySelector('[onclick="_eqImportConfirm()"]');
  if(btn){btn.disabled=true;btn.textContent='Import en cours…';}

  // Construire la map eq → zones cibles
  var allEqsForConfirm=[];
  Object.keys(_eqImportByCat).forEach(function(cat){
    (_eqImportByCat[cat]||[]).forEach(function(eq,idx){
      var key=cat+'__'+idx;
      var targetIds=_eqImportIndivZones.hasOwnProperty(key)?_eqImportIndivZones[key]:_eqImportBlocZones;
      allEqsForConfirm.push({nom:eq,zoneIds:targetIds});
    });
  });

  // Mode replace : supprimer équipements sur toutes les zones ciblées
  if(_eqImportMode==='replace'){
    var delIdSet={};
    allEqsForConfirm.forEach(function(eq){eq.zoneIds.forEach(function(id){delIdSet[id]=true;});});
    var delIds=Object.keys(delIdSet);
    if(delIds.length){
      if(progEl)progEl.textContent='Suppression des équipements existants…';
      var delChunk=50;
      for(var ci=0;ci<delIds.length;ci+=delChunk){
        var chunk=delIds.slice(ci,ci+delChunk);
        try{
          await fetch(window.SUPA_URL+'/rest/v1/equipements_zone?zone_id=in.('+chunk.join(',')+')',{
            method:'DELETE',
            headers:{'apikey':window.SUPA_KEY,'Authorization':'Bearer '+window.SUPA_KEY,'Prefer':'return=minimal'}
          });
        }catch(e){console.warn('delete chunk error',e);}
      }
    }
  }

  // Construire les lignes à insérer
  var zoneMap={};
  (window._zonesCacheZones||[]).forEach(function(z){zoneMap[z.id]=z;});
  var eqRows=[];
  allEqsForConfirm.forEach(function(eq){
    eq.zoneIds.forEach(function(zid){
      var z=zoneMap[zid];
      if(z)eqRows.push({site_id:sid,zone_id:zid,nom:eq.nom+' — '+z.nom,actif:true});
    });
  });

  if(!eqRows.length){if(progEl)progEl.textContent='Aucun équipement à créer.';return;}

  // Batch insert par chunks de 500
  var batchSize=500;
  for(var i=0;i<eqRows.length;i+=batchSize){
    var batch=eqRows.slice(i,i+batchSize);
    if(progEl)progEl.textContent='Import '+(Math.min(i+batchSize,eqRows.length))+'/'+eqRows.length+'…';
    try{
      await fetch(window.SUPA_URL+'/rest/v1/equipements_zone',{
        method:'POST',
        headers:{'apikey':window.SUPA_KEY,'Authorization':'Bearer '+window.SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(batch)
      });
    }catch(e){console.warn('insert chunk error',e);}
  }

  _eqImportStep=0;_eqImportByCat={};_eqImportBlocZones=[];_eqImportIndivZones={};_eqImportActiveIndivKey=null;
  if(_session)renderRespTech(_session,'config');
}

// Télécharger le modèle Excel
function _eqImportDownloadTemplate(){
  var zones=window._zonesCacheZones||[];
  var catSet={};
  zones.forEach(function(z){catSet[z.categorie||'Autre']=true;});
  _ZONE_CATS.forEach(function(c){catSet[c]=true;});
  var cats=Object.keys(catSet);
  function doDownload(XLSX){
    var rows=[['Type de zone','Équipement']];
    cats.forEach(function(cat){
      var templates=_ZONE_EQ_TEMPLATES[cat]||[];
      if(templates.length){templates.forEach(function(eq){rows.push([cat,eq]);});}
      else{rows.push([cat,'']);}
      rows.push(['','']);
    });
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:22},{wch:42}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Équipements');
    XLSX.writeFile(wb,'modele-equipements-gentrack.xlsx');
  }
  if(window.XLSX){doDownload(window.XLSX);}
  else{
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=function(){doDownload(window.XLSX);};
    document.head.appendChild(s);
  }
}

// Parser le fichier Excel uploadé
function _eqImportHandleFile(file,sid){
  if(!file)return;
  _eqImportSid=sid;
  var statusEl=document.getElementById('eq-import-status');
  if(statusEl)statusEl.textContent='Chargement…';
  function doparse(XLSX){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(e.target.result,{type:'array'});
        var result={};
        wb.SheetNames.forEach(function(sheetName){
          var ws=wb.Sheets[sheetName];
          var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
          if(!rows.length)return;
          var catCol=-1,eqCol=-1,headerRow=-1;
          for(var ri=0;ri<Math.min(rows.length,5);ri++){
            for(var ci=0;ci<rows[ri].length;ci++){
              var cn=(rows[ri][ci]+'').trim().toUpperCase()
                .replace(/[ÉÈÊË]/g,'E').replace(/[ÀÂÄÁ]/g,'A').replace(/[ÙÛÜÚ]/g,'U');
              if((cn.indexOf('TYPE')>=0||cn.indexOf('ZONE')>=0||cn.indexOf('CATEGORIE')>=0)&&catCol<0)catCol=ci;
              if((cn.indexOf('EQUIPEMENT')>=0||cn.indexOf('MATERIEL')>=0||cn.indexOf('NOM')>=0)&&eqCol<0)eqCol=ci;
            }
            if(catCol>=0&&eqCol>=0){headerRow=ri;break;}
          }
          // Si pas d'en-tête trouvé : chercher avec 1 seule colonne (liste simple)
          if(headerRow<0&&eqCol<0&&rows[0]){catCol=-1;eqCol=0;headerRow=0;}
          if(eqCol<0)return;
          for(var di=headerRow+1;di<rows.length;di++){
            var cat=catCol>=0?(rows[di][catCol]+'').trim():sheetName;
            var eq=(rows[di][eqCol]+'').trim();
            if(!cat||!eq||eq.indexOf('(Saisir')===0)continue;
            if(!result[cat])result[cat]=[];
            if(result[cat].indexOf(eq)<0)result[cat].push(eq);
          }
        });
        var count=Object.values(result).reduce(function(a,v){return a+v.length;},0);
        if(!count){if(statusEl)statusEl.textContent='Aucun équipement trouvé. Vérifiez les colonnes "Type de zone" et "Équipement".';return;}
        _eqImportByCat=result;_eqImportStep=2;
        if(_session)renderRespTech(_session,'config');
      }catch(err){if(statusEl)statusEl.textContent='Erreur: '+err.message;console.error(err);}
    };
    reader.readAsArrayBuffer(file);
  }
  if(window.XLSX){doparse(window.XLSX);}
  else{
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=function(){doparse(window.XLSX);};
    s.onerror=function(){if(statusEl)statusEl.textContent='Impossible de charger SheetJS.';};
    document.head.appendChild(s);
  }
}

    if(!selectableEquips.length)selectableEquips=equips.filter(function(e){return e.actif;});
    if(!selectableEquips.length)selectableEquips=equips;
    if(!_configSelectedEqId||!selectableEquips.find(function(e){return e.id===_configSelectedEqId;})){
      _configSelectedEqId=selectableEquips[0].id;
    }
  }

  // Séparer équipements en suivi actif vs secondaires (exclure les équipements de zone)
  var prioritaires=equips.filter(function(e){return e.actif_ronde||e.actif_releve;});
  var secondaires=equips.filter(function(e){return !e.actif_ronde&&!e.actif_releve&&!e.zone_id;});

  // Helper: rend un groupe d'équipements groupé par type
  function _cfgBuildEquipGroup(list){
    var byT={};
    list.forEach(function(e){
      var tNom=(e.types_equipements&&e.types_equipements.nom)||'Autres';
      if(!byT[tNom])byT[tNom]=[];
      byT[tNom].push(e);
    });
    return Object.keys(byT).sort().map(function(tNom){
      return '<div class="config-eq-section">'+escape_html(tNom)+'</div>'+
        byT[tNom].map(function(e){
          var icon=_TYPE_ICONS[(e.types_equipements&&e.types_equipements.nom)]||'⚙️';
          var sel=e.id===_configSelectedEqId;
          var suivi=e.actif_ronde&&e.actif_releve?'Ronde + Relevé':e.actif_ronde?'Ronde':e.actif_releve?'Relevé':'';
          return '<div class="config-eq-item'+(sel?' selected':'')+(!e.actif?' cfg-eq-inactive':'')+'" onclick="_selectConfigEq(\''+e.id+'\')">'+
            '<span class="config-eq-icon">'+icon+'</span>'+
            '<div style="flex:1;min-width:0">'+
              '<div class="config-eq-name" style="'+(e.actif?'':'color:var(--text3)')+'">'+escape_html(e.nom)+'</div>'+
              '<div class="config-eq-type" style="'+(suivi?'color:var(--amber);font-weight:600':'')+'">'+escape_html(suivi||(e.actif?'Actif':'Inactif'))+'</div>'+
            '</div>'+
            '<button class="config-eq-edit-btn" onclick="event.stopPropagation();_duplicateEquip(\''+e.id+'\')" title="Dupliquer" style="font-size:14px">⧉</button>'+
            '<button class="config-eq-edit-btn" onclick="event.stopPropagation();_openEditEquipFromCache(\''+e.id+'\')" title="Modifier">✏️</button>'+
          '</div>';
        }).join('');
    }).join('');
  }

  var typeOptsHtml=types.map(function(t){return '<option value="'+t.id+'">'+escape_html(t.nom)+'</option>';}).join('');
  var listHtml='<div class="config-equip-list">';
  if(prioritaires.length===0&&equips.length===0){
    listHtml+='<div style="padding:24px 16px;text-align:center;color:var(--text3);font-size:12px"><div style="font-size:32px;margin-bottom:8px;opacity:.3">⚙️</div>Aucun équipement configuré</div>';
  } else if(prioritaires.length===0){
    // Aucun avec suivi → message indicatif + liste des équipements sans zone uniquement
    listHtml+='<div style="padding:8px 12px;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">Activez Ronde ou Relevé sur un équipement pour le faire apparaître ici</div>'+
      (secondaires.length?_cfgBuildEquipGroup(secondaires):'');
  } else {
    // Seulement les équipements avec suivi actif (ronde ou relevé)
    listHtml+=_cfgBuildEquipGroup(prioritaires);
  }
  listHtml+='<button class="config-add-eq-btn" onclick="_openAddEquipModal()">＋ Ajouter un équipement</button>';
  listHtml+='</div>';

  // Right panel
  var panelHtml=_configSelectedEqId
    ? await _buildConfigRondePanel(sid,_configSelectedEqId,equips)
    : '<div class="config-ronde-panel"><div style="color:var(--text3);font-size:13px;padding:40px;text-align:center">Commencez par ajouter un équipement</div></div>';

  // Remove padding from outer dash-content for full-bleed layout
  var dc=document.getElementById('dash-content-main');
  if(dc){dc.style.padding='0';dc.style.maxWidth='none';}
  return '<div class="config-tabs">'+tabHtml+'</div>'+
    '<div class="config-layout">'+listHtml+panelHtml+'</div>';
}

              (c.email?'✉️ '+escape_html(c.email):'')+
              (!c.whatsapp&&!c.email?'Aucun contact renseigné':'')+
            '</div>'+
          '</div>'+
          (c.notif_signalement&&c.whatsapp&&c.actif?
            '<span style="font-size:10px;font-weight:700;color:#2e7d32;background:#e8f5e9;border:1px solid #a5d6a7;padding:2px 8px;border-radius:10px;margin-right:4px">📲 Signalements</span>':'')+
          (c.actif?

          '<button class="config-eq-edit-btn" style="opacity:1" onclick="_openEditContactModal(\''+c.id+'\',\''+escape_html(c.nom)+'\',\''+escape_html(c.role||'')+'\',\''+escape_html(c.whatsapp||'')+'\',\''+escape_html(c.email||'')+'\','+c.actif+','+!!c.notif_signalement+')" title="Modifier">✏️</button>'+
        '</div>';
      });
      html+='</div></div>';
    });
  }

  // QR code signalement
  var sgUrl=location.origin+location.pathname.replace('dashboard.html','signalement.html')+'?site='+sid;
  html+='<div style="margin-top:24px;background:white;border:1.5px solid var(--border);border-radius:12px;padding:18px 20px">'+
    '<div style="font-size:13px;font-weight:700;color:var(--dark);margin-bottom:6px">📍 Formulaire de signalement</div>'+
    '<div style="font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5">Partagez ce lien ou ce QR code à la réception pour permettre à quiconque de signaler un problème sans connexion.</div>'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<div id="sg-qr-'+sid+'"></div>'+

          '<a href="'+sgUrl+'" target="_blank" style="padding:7px 14px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-weight:600;background:white;cursor:pointer;color:var(--text);text-decoration:none">↗ Ouvrir</a>'+
          '<a href="affiche-signalement.html?site='+sid+'&nom='+encodeURIComponent((_session&&_session.siteNom)||'')+'" target="_blank" style="padding:7px 14px;border:1.5px solid var(--amber-border);border-radius:7px;font-size:12px;font-weight:600;background:var(--amber-pale);cursor:pointer;color:var(--amber-dark);text-decoration:none">🖨️ Affiche</a>'+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';

  html+='</div>';

  // Generate QR code using QR server API (no JS lib needed)
  html+='<script>'+
    '(function(){'+
      'var el=document.getElementById("sg-qr-'+sid+'");'+
      'if(el){'+
        'var img=document.createElement("img");'+
        'img.src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data="+encodeURIComponent("'+sgUrl+'");'+
        'img.style="border-radius:8px;border:1px solid var(--border)";img.width=120;img.height=120;'+
        'el.appendChild(img);}'+
    '})();'+
  '<\/script>';

  return html;
}

async function _buildSeuilsTab(sid){
  var equips=await supaGet('equipements','site_id=eq.'+sid+'&actif=eq.true&select=id,nom,type_id,types_equipements(nom)&order=ordre_ronde.asc');
  if(!equips.length)return '<div class="placeholder-card" style="margin-top:16px"><div class="placeholder-icon">🎯</div>Aucun équipement configuré</div>';
  var eqIds=equips.map(function(e){return e.id;});
  var questions=await supaGet('questions','equipement_id=in.('+eqIds.join(',')+')'+'&actif=eq.true&select=id,texte,type_reponse,unite,seuil_min,seuil_max,equipement_id,frequences,alerte_severite,alerte_canal&order=ordre.asc');
  // Only show numeric questions (can have seuils)
  var numQs=questions.filter(function(q){return q.type_reponse==='numerique'||q.seuil_min!=null||q.seuil_max!=null;});
  var eqMap={};equips.forEach(function(e){eqMap[e.id]=e;});

  if(!numQs.length){
    return '<div style="text-align:center;padding:40px;color:var(--text3);font-size:13px">'+
      '<div style="font-size:40px;margin-bottom:12px;opacity:.3">🎯</div>'+
      'Aucune question numérique configurée.<br>Ajoutez des questions avec seuils dans l\'onglet Équipements.</div>';
  }

  var byEq={};
  numQs.forEach(function(q){if(!byEq[q.equipement_id])byEq[q.equipement_id]=[];byEq[q.equipement_id].push(q);});

  var html='<div style="max-width:760px">'+

      'Définissez les seuils d\'alerte pour chaque mesure. Une alerte est déclenchée dès qu\'une valeur sort de la plage autorisée.'+

        '</td>'+
        '<td style="padding:9px 12px;border-bottom:1px solid var(--border)">'+

              var labels={dashboard:'📊 Dashboard',wa:'💬 WA',email:'✉️ Email'};

async function _toggleReleveEquipement(eqId,active){
  // Toggle ALL questions of this equipment at once
  var rows=await supaGet('questions','equipement_id=eq.'+eqId+'&actif=eq.true&select=id,frequences');
  var patches=rows.map(function(q){
    var freqs=Array.isArray(q.frequences)?q.frequences.slice():[];
    var idx=freqs.indexOf('journalier');
    if(active&&idx===-1)freqs.push('journalier');
    else if(!active&&idx!==-1)freqs.splice(idx,1);
    return supaPatch('questions',q.id,{frequences:freqs});
  });
  await Promise.all(patches);
  if(_session)renderRespTech(_session,'config');
}

async function _toggleReleveQuestion(qId,active){
  var rows=await supaGet('questions','id=eq.'+qId+'&select=frequences');
  var cur=rows&&rows[0]?rows[0].frequences:null;
  var freqs=Array.isArray(cur)?cur.slice():[];
  var idx=freqs.indexOf('journalier');
  if(active&&idx===-1)freqs.push('journalier');
  else if(!active&&idx!==-1)freqs.splice(idx,1);
  await supaPatch('questions',qId,{frequences:freqs});
  if(_session)renderRespTech(_session,'config');
}

async function _moveQ(qId, freqKey, dir){
  var list=(window._eqQOrders&&window._eqQOrders[freqKey])||[];
  var idx=list.findIndex(function(q){return q.id===qId;});
  if(idx<0)return;
  var swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=list.length)return;
  // Swap ordre values
  var a=list[idx], b=list[swapIdx];
  var tmpOrdre=a.ordre;
  // If ordres are equal, assign distinct values
  if(a.ordre===b.ordre){a.ordre=idx+1;b.ordre=swapIdx+1;}
  await Promise.all([
    supaPatch('questions',a.id,{ordre:b.ordre}),
    supaPatch('questions',b.id,{ordre:tmpOrdre})
  ]);
  if(_session)renderRespTech(_session,'config');
}

    mensuel_actif:mensuelActif,
    heure_rappel:heureRappel,
    jour_hebdo:jourHebdo,
    jour_mensuel:jourMensuel
  };
  var ok=await supaPatch('sites',sid,body);
  var msgOk=document.getElementById('plan-save-msg');
  var msgErr=document.getElementById('plan-save-err');
  if(ok){
    if(msgOk){msgOk.style.display='';setTimeout(function(){msgOk.style.display='none';},3000);}
    if(msgErr)msgErr.style.display='none';
  } else {
    if(msgErr){msgErr.style.display='';setTimeout(function(){msgErr.style.display='none';},4000);}
    if(msgOk)msgOk.style.display='none';
  }
}

  questions.forEach(function(q){
    var freqs=Array.isArray(q.frequences)?q.frequences:(typeof q.frequences==='string'?JSON.parse(q.frequences||'[]'):[]);
    freqs.forEach(function(f){if(qByFreq[f])qByFreq[f].push(q);});

  var _RONDE_CFG=[

    {freq:'mensuel',color:'blue',label:'Mensuelle',freqDisp:'Le '+jourMensuelNum+' du mois · 1×/mois'+(mensuelActif?'':' · Désactivée'),trigger:'📅 Le '+jourMensuelNum+' du mois'}
  ];

  var jourMensuelNum=siteConf.jour_mensuel!=null?Number(siteConf.jour_mensuel):1;

          : '<span style="font-size:10px;font-weight:700;color:var(--rouge);background:var(--rouge-pale);border:1px solid var(--rouge-border);padding:2px 8px;border-radius:10px">Inactif</span>')+
        '<button onclick="window.open(\''+afficheUrl+'\',\'_blank\')" title="Imprimer l\'affiche QR pour cet équipement" style="font-size:11px;padding:2px 10px;border:1.5px solid var(--amber-border);border-radius:8px;background:var(--amber-pale);color:var(--amber-dark);cursor:pointer;font-weight:700;font-family:inherit">🖨 Affiche</button>'+

    }).join('');

    if(qs.length>0)hasAny=true;

        '<span class="config-ronde-badge">'+rc.label+'</span>'+

      '</div>'+

function openWaPreview(cacheKey){
  var cached=_waCache[cacheKey];
  if(!cached){console.warn('WA cache miss:',cacheKey);return;}
  var freq=cached.freq, freqLabel=cached.label, eqNom=cached.eqNom, questions=cached.questions;
  // Remove existing overlay if any
  var old=document.getElementById('wa-overlay');
  if(old)old.remove();

  var typeIcon={numerique:'🔢',texte:'💬',oui_non:'✅',photo:'📷',choix:'📋'};
  var typeLabel={numerique:'Valeur numérique',texte:'Texte libre',oui_non:'Oui / Non',photo:'Photo requise',choix:'Choix multiple'};
  var exampleFallback={numerique:'42',texte:'RAS',oui_non:'Oui',photo:'[Photo envoyée]',choix:'Option 1'};

  var now=new Date();
  var hh=String(now.getHours()).padStart(2,'0');
  var mm=String(now.getMinutes()).padStart(2,'0');
  var baseTime=now.getHours()*60+now.getMinutes();
  function simTime(offset){var t=baseTime+offset;var h=Math.floor(t/60)%24;var m=t%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}

  var freqColor={journalier:'#2D6A4F',hebdo:'#9A780E',mensuel:'#2B5BA8'};
  var headerBg=freqColor[freq]||'#075E54';

  // Build chat bubbles
  var bubbles='<div class="wa-date-sep">'+now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</div>';

  // Opening bot message
  var freqEmoji={journalier:'📋',hebdo:'📅',mensuel:'🗓️'};
  bubbles+='<div class="wa-bubble bot">'+
    '<div style="font-weight:700;color:#075E54;margin-bottom:3px">'+(freqEmoji[freq]||'📋')+' Ronde '+freqLabel.toLowerCase()+'</div>'+
    escape_html(eqNom)+'<br>'+
    '<span style="font-size:11px;color:rgba(0,0,0,.45)">Bonjour 👋 Voici votre ronde du jour</span>'+
    '<div class="wa-bubble-time">'+simTime(0)+'</div>'+
  '</div>';

  questions.forEach(function(q,i){
    var tIcon=typeIcon[q.type]||'💬';
    var tLabel=typeLabel[q.type]||q.type||'texte';
    var example=q.exemple||(exampleFallback[q.type]||'—');
    var uniteStr=q.unite?' ('+q.unite+')':'';
    var seuilStr='';
    if(q.seuil_max!==null&&q.seuil_max!==undefined)seuilStr='⚠️ Seuil critique > '+q.seuil_max+(q.unite?' '+q.unite:'');
    else if(q.seuil_min!==null&&q.seuil_min!==undefined)seuilStr='⚠️ Seuil critique < '+q.seuil_min+(q.unite?' '+q.unite:'');

    // Question bubble (bot)
    bubbles+='<div class="wa-bubble bot">'+
      '<div class="wa-bubble-step">'+(i+1)+'/'+questions.length+'</div>'+
      '<div style="font-weight:600;margin-bottom:4px">'+escape_html(q.texte)+'</div>'+
      '<div class="wa-bubble-type">'+tIcon+' '+tLabel+uniteStr+'</div>'+
      (seuilStr?'<div class="wa-bubble-seuil">'+seuilStr+'</div>':'')+
      '<div class="wa-bubble-time">'+simTime(i*2+1)+'</div>'+
    '</div>';

    // Tech response bubble
    bubbles+='<div class="wa-bubble tech">'+
      escape_html(String(example))+
      '<div class="wa-bubble-time">'+simTime(i*2+2)+' ✓✓</div>'+
    '</div>';

    // Bot acknowledgment (except after last question)
    if(i<questions.length-1){
      bubbles+='<div class="wa-bubble bot">'+
        '<div class="wa-bubble-ack">✅ Noté</div>'+
        '<div class="wa-bubble-time">'+simTime(i*2+2)+'</div>'+
      '</div>';
    }
  });

  // Closing bot message
  if(questions.length>0){
    bubbles+='<div class="wa-bubble bot">'+
      '<div style="font-weight:700;color:#25D366;margin-bottom:3px">✅ Ronde complète !</div>'+
      questions.length+'/'+questions.length+' questions · Merci 👍<br>'+
      '<span style="font-size:11px;color:rgba(0,0,0,.45)">Données enregistrées dans GenTrack</span>'+
      '<div class="wa-bubble-time">'+simTime(questions.length*2+2)+'</div>'+
    '</div>';
  }

  var overlay=document.createElement('div');
  overlay.className='wa-overlay';
  overlay.id='wa-overlay';
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
  overlay.innerHTML=
    '<div class="wa-phone">'+
      '<div class="wa-phone-bar" style="background:'+headerBg+'">'+
        '<div class="wa-phone-avatar">🤖</div>'+
        '<div class="wa-phone-info">'+
          '<div class="wa-phone-name">GenTrack Bot</div>'+
          '<div class="wa-phone-status">Ronde '+escape_html(freqLabel.toLowerCase())+' · '+escape_html(eqNom)+'</div>'+
        '</div>'+
        '<button class="wa-phone-close" onclick="document.getElementById(\'wa-overlay\').remove()">×</button>'+
      '</div>'+
      '<div class="wa-chat">'+bubbles+'</div>'+
      '<div class="wa-phone-footer">'+
        '<button class="wa-edit-btn" onclick="document.getElementById(\'wa-overlay\').remove()">Fermer</button>'+
        '<button class="wa-validate-btn" onclick="document.getElementById(\'wa-overlay\').remove()">✅ Ronde validée</button>'+
      '</div>'+
    '</div>';

  document.body.appendChild(overlay);
  // Scroll chat to bottom after render
  setTimeout(function(){var c=overlay.querySelector('.wa-chat');if(c)c.scrollTop=c.scrollHeight;},50);
}

async function _duplicateEquip(eqId){
  var src=_configEquipCache[eqId];
  if(!src){return;}
  var newEq={
    site_id:_configCurrentSid,type_id:src.type_id||null,nom:src.nom+' (copie)',
    actif:src.actif,actif_ronde:src.actif_ronde,actif_releve:src.actif_releve,
    ordre_ronde:src.ordre_ronde||99,
    marque:src.marque||null,reference:src.reference||null,
    puissance_kva:src.puissance_kva||null,conso_theorique_lh:src.conso_theorique_lh||null,
    capacite_litres:src.capacite_litres||null,seuil_vidange_heures:src.seuil_vidange_heures||null,
    prix_litre:src.prix_litre||null
  };
  var created=await supaPost('equipements',newEq);
  if(!created||!created.id){alert('Erreur duplication');return;}
  var newId=created.id;
  var qs=await supaGet('questions','equipement_id=eq.'+eqId+'&actif=eq.true&order=ordre.asc&select=texte,type_reponse,unite,ordre,actif,frequences,options,seuil_min,seuil_max,alerte_severite,alerte_canal');
  if(qs&&qs.length){
    var qsCopy=qs.map(function(q){var o=Object.assign({},q);o.equipement_id=newId;return o;});
    await fetch(SUPA_URL+'/rest/v1/questions',{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(qsCopy)
    });

async function _saveEditEquip(eqId){
  var nom=(document.getElementById('eq-edit-nom')||{}).value;
  if(!nom||!nom.trim()){alert('Nom requis');return;}
  var actifRadio=document.querySelector('input[name="eq-edit-actif"]:checked');
  var actif=actifRadio?actifRadio.value==='true':true;
  var actifRonde=!!(document.getElementById('eq-edit-ronde')||{}).checked;
  var actifReleve=!!(document.getElementById('eq-edit-releve')||{}).checked;
  var body={nom:nom.trim(),actif:actif,actif_ronde:actifRonde,actif_releve:actifReleve};
  // Champs techniques GE / Cuve (si présents dans le DOM)
  var kvaEl=document.getElementById('eq-edit-kva');
  var consoEl=document.getElementById('eq-edit-conso');
  var capaEl=document.getElementById('eq-edit-capa');
  var seuilSel=document.getElementById('eq-edit-seuil');
  var seuilCustomEl=document.getElementById('eq-edit-seuil-custom');
  var baselineEl=document.getElementById('eq-edit-baseline');
  var prixEl=document.getElementById('eq-edit-prix');
  var typeCompteurEl=document.getElementById('eq-edit-type-compteur');
  if(kvaEl&&kvaEl.value!=='')body.puissance_kva=parseFloat(kvaEl.value);
  if(consoEl&&consoEl.value!=='')body.conso_theorique_lh=parseFloat(consoEl.value);
  else if(consoEl)body.conso_theorique_lh=null;
  if(capaEl&&capaEl.value!=='')body.capacite_litres=parseFloat(capaEl.value);
  if(seuilSel){
    var seuilVal=seuilSel.value;
    if(seuilVal===''||seuilVal===null){body.seuil_vidange_heures=null;}
    else if(seuilVal==='0'){body.seuil_vidange_heures=seuilCustomEl&&seuilCustomEl.value!==''?parseInt(seuilCustomEl.value):null;}
    else{body.seuil_vidange_heures=parseInt(seuilVal);}
  }
  if(prixEl&&prixEl.value!=='')body.prix_litre=parseFloat(prixEl.value);
  else if(prixEl)body.prix_litre=null;
  if(typeCompteurEl)body.type_compteur_heures=typeCompteurEl.value||'cumule';
  if(baselineEl&&baselineEl.value!==''){
    body.heures_dernier_vidange=parseFloat(baselineEl.value);
    body.date_dernier_vidange=new Date().toISOString();
  }
  _closeCfgModal();
  var ok=await supaPatch('equipements',eqId,body);
  if(!ok){
    var toast=document.createElement('div');
    toast.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999';
    toast.textContent='❌ Erreur sauvegarde — vérifiez la console (F12)';
    document.body.appendChild(toast);setTimeout(function(){toast.remove();},4000);
  }
  if(eqId===_configSelectedEqId&&!actif)_configSelectedEqId=null;
  if(_session)renderRespTech(_session,'config');
}

async function _confirmDeleteEquip(eqId){
  if(!confirm('Supprimer cet équipement ? Toutes ses questions et rondes seront désactivées.'))return;
  _closeCfgModal();
  await supaPatch('equipements',eqId,{actif:false});
  _configSelectedEqId=null;
  if(_session)renderRespTech(_session,'config');
}

async function _saveNewEquip(){
  var nom=(document.getElementById('eq-new-nom')||{}).value;
  if(!nom||!nom.trim()){alert('Nom requis');return;}
  var typeId=(document.getElementById('eq-new-type')||{}).value||null;
  var marque=(document.getElementById('eq-new-marque')||{}).value||null;
  var modeleId=(document.getElementById('eq-new-modele')||{}).value||null;
  // Champs GE
  var kva=parseFloat((document.getElementById('eq-new-kva')||{}).value)||null;
  var conso=null; // calculé automatiquement
  var capa=parseInt((document.getElementById('eq-new-capa')||{}).value)||null;
  var seuilSelVal=(document.getElementById('eq-new-seuil')||{}).value||'';
  var seuil=seuilSelVal===''?null:seuilSelVal==='0'?parseInt((document.getElementById('eq-new-seuil-custom')||{}).value)||null:parseInt(seuilSelVal)||null;
  var typeCompteurNew=(document.getElementById('eq-new-type-compteur')||{}).value||'cumule';
  // Champs Cuve
  var capaCuve=parseInt((document.getElementById('eq-new-capa-cuve')||{}).value)||null;
  var consoCuve=parseFloat((document.getElementById('eq-new-conso-cuve')||{}).value)||null;
  _closeCfgModal();
  var eqData={nom:nom.trim(),site_id:_configCurrentSid,type_id:typeId,marque:marque||null,actif:true,ordre_ronde:99};
  if(typeId===GE_TYPE_ID_CFG){
    if(kva)eqData.puissance_kva=kva;
    if(capa)eqData.capacite_litres=capa;
    if(seuil)eqData.seuil_vidange_heures=seuil;
    eqData.type_compteur_heures=typeCompteurNew;
  }
  if(typeId===CUVE_TYPE_ID_CFG){
    if(capaCuve)eqData.capacite_litres=capaCuve;
    if(consoCuve)eqData.conso_theorique_lh=consoCuve;
  }
  var created=await supaPost('equipements',eqData);
  if(created&&created.id&&modeleId){
    await _applyModeleToEquip(created.id,modeleId);
  }
  if(_session)renderRespTech(_session,'config');
}

async function _applyModele(eqId,selectId){
  var sel=document.getElementById(selectId);
  if(!sel||!sel.value)return;
  if(!confirm('Appliquer le modèle ? Les questions existantes seront conservées.'))return;
  await _applyModeleToEquip(eqId,sel.value);
  if(_session)renderRespTech(_session,'config');
}

async function _applyModeleToEquip(eqId,modeleId){
  var items=await supaGet('modeles_questions_items','modele_id=eq.'+modeleId+'&order=ordre.asc&select=texte,type_reponse,unite,seuil_min,seuil_max,frequences,exemple,ordre');
  for(var i=0;i<items.length;i++){
    var it=items[i];
    await supaPost('questions',{
      equipement_id:eqId,texte:it.texte,type_reponse:it.type_reponse||'numerique',
      unite:it.unite||null,seuil_min:it.seuil_min??null,seuil_max:it.seuil_max??null,
      frequences:it.frequences||['journalier'],exemple:it.exemple||null,ordre:it.ordre||i+1,actif:true
    });
  }
}

      '<button class="cfg-btn-secondary" onclick="_closeCfgModal()">Annuler</button>'+
      '<button class="cfg-btn-primary" onclick="_saveEditQ(\''+qId+'\')">Enregistrer</button>'+
    '</div>'
  );
}

async function _saveEditQ(qId){
  // Lire TOUTES les valeurs avant de fermer le modal (closeCfgModal détruit le DOM)
  var texte=(document.getElementById('q-edit-texte')||{}).value;
  if(!texte||!texte.trim()){alert('Question requise');return;}
  var freqs=['qef-j','qef-h','qef-m'].map(function(id){var el=document.getElementById(id);return el&&el.checked?el.value:null;}).filter(Boolean);
  if(!freqs.length)freqs=['journalier'];
  var minVal=(document.getElementById('q-edit-min')||{}).value||'';
  var maxVal=(document.getElementById('q-edit-max')||{}).value||'';
  var typeVal=(document.getElementById('q-edit-type')||{}).value||'numerique';
  var uniteVal=(document.getElementById('q-edit-unite')||{}).value||null;
  var exempleVal=(document.getElementById('q-edit-exemple')||{}).value||null;
  _closeCfgModal();
  await supaPatch('questions',qId,{
    texte:texte.trim(),
    type_reponse:typeVal,
    unite:uniteVal||null,
    seuil_min:minVal!==''?parseFloat(minVal):null,
    seuil_max:maxVal!==''?parseFloat(maxVal):null,
    exemple:exempleVal||null,
    frequences:freqs
  });
  if(_session)renderRespTech(_session,'config');
}

async function _deleteQ(qId){
  if(!confirm('Supprimer cette question ?'))return;
  await supaDelete('questions','id=eq.'+qId);
  if(_session)renderRespTech(_session,'config');
}

function escape_html(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Pour mettre une valeur dans une chaîne JS entre apostrophes (onclick="...'val'...")
function js_esc(s){
  if(!s)return'';
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function renderDirTech(session,nav){
  nav=nav||'accueil';
  _dtCurrentSite=null;
  var skeleton='<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px"><span class="spinner"></span>Chargement des données...</div>';
  app().innerHTML=buildLayout(session,nav,skeleton);
  _loadDT(session,nav);
}

async function _loadDT(session,nav){
  var sids=session.site_ids||[];
  var cid=session.client_id;
  var el=document.querySelector('.dash-content');
  if(!el)return;
  try{
    var html='';
    if(nav==='accueil')html=await _dtAccueil(session,sids,cid);
    else if(nav==='alertes')html=await _dtAlertes(sids,cid);
    else if(nav==='comparaison')html=await _dtComparaison(sids,session);
    else if(nav==='historique')html=await _dtHistorique(sids);
    else if(nav==='signalements')html=await _dtSignalements(sids);
    else if(nav==='maintenances')html=await _dtMaintenances(sids);
    else if(nav==='fiabilite')html=await _dtFiabiliteMulti(sids,session);
    else if(nav==='equipe')html=await _dtEquipe(sids,session);
    else if(nav==='commandes')html=await _dtCommandesDT(sids,session);
    else if(nav==='rapport')html=await _dtRapport(sids,session);
    else if(nav==='energie')html=await _dtEnergie(sids,session);
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

      '</div>';
    });
    bloc4+='</div>';
  }

  _updateAlertPill(totalAlertes);
  var recos=await _buildRecommandations(sids,siteMap);
  return banner+kpis+(recos?recos:'')+bloc1+bloc2+bloc3+bloc4;
}

/* ── COMPARAISON MULTI-SITES ── */
async function _dtComparaison(sids,session){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">🏨</div>Aucun site configuré pour ce compte</div>';
  var dc=document.getElementById('dash-content-main');
  if(dc){dc.style.padding='24px';dc.style.maxWidth='1100px';}
  var sidStr=sids.join(',');
  var today=todayStr();
  var since30=dateNJours(30);
  var CUVE_TYPE='de5519d0-363b-4628-b872-2dcf01859002';

  // Fetch parallèle de tout ce dont on a besoin
  var[sites,equips,rondes,pannesActives,alertes,mnt30]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom&order=nom.asc'),
    supaGet('equipements','site_id=in.('+sidStr+')&actif=eq.true&select=id,site_id,type_id'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=eq.'+today+'&select=id,site_id,frequence'),
    supaGet('signalements','groupe_id=in.('+sidStr+')&type=eq.panne&statut=neq.resolu&select=id,groupe_id&order=created_at.desc'),
    supaGet('alertes','client_id=eq.'+session.client_id+'&resolue=eq.false&select=id,type,severite&order=created_at.desc'),
    supaGet('maintenances','groupe_id=in.('+sidStr+')&created_at=gte.'+since30+'T00:00:00&select=id,groupe_id,statut&limit=200')
  ]);

  // Rondes équipements pour la conformité
  var rIds=rondes.map(function(r){return r.id;});
  var rondesEq=rIds.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,equipement_id,statut'):[];

  // Niveaux cuves — source prioritaire : releves_energie, fallback : ronde
  var cuveEquips=equips.filter(function(e){return e.type_id===CUVE_TYPE;});
  var cuveNivMap={};
  // Fetch cuveEquips detail (capacité) + gasoil depuis releves_energie
  var _cuveEquipsDetail=cuveEquips.length?await supaGet('equipements','id=in.('+cuveEquips.map(function(e){return e.id;}).join(',')+')'+'&select=id,site_id,nom,capacite_litres,conso_theorique_lh'):[];
  var gasoilBySiteComp=await _fetchGasoilNiveauBySite(sidStr);
  // For sites without releve_energie, fallback to ronde
  var sitesNeedRonde=sids.filter(function(sid){return !gasoilBySiteComp[sid];});
  if(sitesNeedRonde.length&&cuveEquips.length){
    var cIds2=_cuveEquipsDetail.filter(function(e){return sitesNeedRonde.indexOf(e.site_id)>=0;}).map(function(e){return e.id;});
    if(cIds2.length){
      var cQs=await supaGet('questions','equipement_id=in.('+cIds2.join(',')+')'+'&actif=eq.true&select=id,equipement_id,texte&order=ordre.asc');
      var nQs=cQs.filter(function(q){return q.texte.toLowerCase().indexOf('niveau')>=0||q.texte.toLowerCase().indexOf('cuve')>=0;});
      if(nQs.length){
        var nQids=nQs.map(function(q){return q.id;});
        var cReps=await supaGet('reponses','question_id=in.('+nQids.join(',')+')'+'&select=question_id,valeur,created_at&order=created_at.desc&limit=200');
        var lastByQ2={};
        cReps.forEach(function(r){if(!lastByQ2[r.question_id]||r.created_at>lastByQ2[r.question_id].created_at)lastByQ2[r.question_id]=r;});
        nQs.forEach(function(q){
          var eq=_cuveEquipsDetail.find(function(e){return e.id===q.equipement_id;});
          if(!eq)return;
          if(gasoilBySiteComp[eq.site_id])return; // already covered by releve
          var rawVal=lastByQ2[q.id]?parseFloat(lastByQ2[q.id].valeur):null;
          if(rawVal==null)return;
          var cap=parseFloat(eq.capacite_litres)||8000;
          var isL=rawVal>100;
          var litres=isL?Math.round(rawVal):Math.round(rawVal/100*cap);
          var pct=Math.min(100,Math.round(litres/cap*100));
          cuveNivMap[eq.site_id]={litres:litres,pct:pct,cap:cap,at:lastByQ2[q.id].created_at,source:'ronde'};
        });
      }
    }
  }
  // Merge gasoilBySiteComp into cuveNivMap
  Object.keys(gasoilBySiteComp).forEach(function(sid){
    var g=gasoilBySiteComp[sid];
    cuveNivMap[sid]={litres:g.litres,pct:g.pct,cap:g.cap,at:g.date,source:'energie'};
  });

  // Regroupements par site
  var eqBySite={};equips.forEach(function(e){eqBySite[e.site_id]=(eqBySite[e.site_id]||[]).concat(e);});

  var mntBySite={};mnt30.forEach(function(m){mntBySite[m.groupe_id]=(mntBySite[m.groupe_id]||0)+1;});

  var reByRonde={};rondesEq.forEach(function(re){(reByRonde[re.ronde_id]=reByRonde[re.ronde_id]||[]).push(re);});

    var eqIds=eqs.map(function(e){return e.id;});
    var pannesThisSite=pannesActives.filter(function(p){return p.groupe_id===sid;});
    var dispoEq=eqCount>0?Math.round((eqCount-pannesThisSite.length)/eqCount*100):null;

    // Conformité rondes du jour
    var sRondes=rondesBySite[sid]||[];
    var rondeJ=sRondes.find(function(r){return r.frequence==='journalier';});

    var totJ=eqRJ.length;
    var confJ=totJ>0?Math.round(valJ/totJ*100):null;
    var rondeHebdo=sRondes.find(function(r){return r.frequence==='hebdo';});
    var eqRH=rondeHebdo?(reByRonde[rondeHebdo.id]||[]):[];
    var valH=eqRH.filter(function(re){return re.statut==='valide';}).length;
    var totH=eqRH.length;
    var confH=totH>0?Math.round(valH/totH*100):null;

    // Cuve
    var cuveInfo=cuveNivMap[sid]||null;

    // Score synthétique pour le tri (0-100)
    var score=100;
    if(pannes>0)score-=pannes*15;
    if(confJ!==null&&confJ<100)score-=(100-confJ)*0.3;
    if(cuveInfo&&cuveInfo.pct!=null&&cuveInfo.pct<=20)score-=20;
    score=Math.max(0,score);

    return {site:site,eqCount:eqCount,pannes:pannes,dispoEq:dispoEq,confJ:confJ,confH:confH,valJ:valJ,totJ:totJ,valH:valH,totH:totH,cuveInfo:cuveInfo,maintenance:maintenance,score:score};
  });

  // Résumé global

  var sitesOk=rows.filter(function(r){return r.pannes===0&&(r.confJ===null||r.confJ===100);}).length;

  // Statut global

    '<span style="font-size:22px">'+bannerIcon+'</span>'+
    '<div>'+
      '<div style="font-size:13px;font-weight:700;color:var(--dark)">'+bannerText+'</div>'+
      '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+sitesOk+'/'+sites.length+' sites sans anomalie'+(avgConf!==null?' · Conformité moy. rondes : '+avgConf+'%':'')+'</div>'+
    '</div>'+
  '</div>';

  // KPIs
  h+='<div class="kpi-grid" style="margin-bottom:20px">'+

    '<div class="kpi"><div class="kpi-label">Pannes actives</div><div class="kpi-value" style="color:'+(totalPannes>0?'var(--rouge)':'var(--vert)')+'">'+totalPannes+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Conformité rondes</div><div class="kpi-value" style="color:'+(avgConf===null?'var(--text3)':avgConf===100?'var(--vert)':avgConf>=80?'var(--amber)':'var(--rouge)')+'">'+( avgConf!==null?avgConf+'%':'—')+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Maintenances 30j</div><div class="kpi-value">'+mnt30.length+'</div></div>'+

      cuveCell='<span style="font-weight:700;color:'+cCol+'">'+(cL!=null?cL.toLocaleString('fr-FR')+' L':'—')+'</span>'+

    h+='<td style="padding:10px 12px;font-weight:700;color:var(--dark)">'+escape_html(site.nom)+'</td>';

    h+='<td style="padding:10px 12px">'+confJCell+'</td>';
    h+='<td style="padding:10px 12px">'+confHCell+'</td>';
    h+='<td style="padding:10px 12px">'+pannesCell+'</td>';
    h+='<td style="padding:10px 12px">'+dispoCell+'</td>';
    h+='<td style="padding:10px 12px">'+cuveCell+'</td>';
    h+='<td style="padding:10px 12px;color:var(--text2)">'+r.maintenance+'</td>';
    h+='<td style="padding:10px 12px"><span style="padding:3px 10px;border-radius:8px;font-size:10px;font-weight:700;color:'+statusColor+';background:'+statusBg+'">'+statusLabel+'</span></td>';
    h+='</tr>';
  });

  h+='</tbody></table></div>';

  // Légende
  h+='<div style="margin-top:16px;display:flex;gap:16px;flex-wrap:wrap">';
  [{c:'var(--vert)',l:'OK — Aucune panne, rondes conformes'},{c:'var(--amber)',l:'Attention — Rondes incomplètes ou alerte mineure'},{c:'var(--rouge)',l:'Critique — Panne active ou cuve basse'}].forEach(function(leg){
    h+='<div style="display:flex;align-items:center;gap:6px"><div style="width:10px;height:10px;border-radius:50%;background:'+leg.c+'"></div><span style="font-size:11px;color:var(--text2)">'+leg.l+'</span></div>';
  });
  h+='</div>';

  return h;
}

    var bd=crit?'var(--rouge-border)':'var(--orange-border)';
    var bl=crit?'var(--rouge)':'var(--orange)';
    var dot=crit?'🔴':'🟡';
    var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    h+='<div class="alerte-card" style="background:'+bg+';border:1px solid '+bd+';border-left:3px solid '+bl+'">'+
      '<span style="font-size:16px;margin-top:1px">'+dot+'</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:'+bl+'">'+escape_html(a.type||'Alerte')+'</div>'+
        '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
        (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
      '</div>'+
      '<button class="btn-traite" onclick="_marquerTraiteDT(\'alertes\',\''+a.id+'\',\''+fromNav+'\')">✓ Traité</button>'+
    '</div>';
  });
  pannes.forEach(function(p){
    var eqNom=p.equipements&&p.equipements.nom?' · '+p.equipements.nom:'';
    var sNom=siteMap&&p.groupe_id&&siteMap[p.groupe_id]?' · '+siteMap[p.groupe_id]:'';
    var ts=p.created_at?new Date(p.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    var ref=p.ref_code||'';
    var enCours=p.statut==='en_cours';
    var preneur=p.assigne_a||p.pris_en_charge_par||'';
    h+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge);flex-direction:column;align-items:stretch;gap:0">'+
      '<div style="display:flex;align-items:flex-start;gap:10px">'+
        '<span style="font-size:16px;margin-top:1px">🔴</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--rouge)">Panne'+escape_html(eqNom)+escape_html(sNom)+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(p.description||'')+'</div>'+
          '<div style="font-size:10px;color:var(--text3);margin-top:4px">'+(ts||'')+(ts&&ref?' · ':'')+escape_html(ref)+'</div>'+
        '</div>'+
        (enCours?'<span style="font-size:10px;font-weight:600;color:var(--vert);background:var(--vert-pale);border:1px solid var(--vert-border);border-radius:12px;padding:3px 9px;white-space:nowrap;flex-shrink:0">⚡ '+escape_html(preneur||'En cours')+'</span>':'')+
      '</div>'+
      '<div style="display:flex;gap:6px;margin-top:10px">'+
        '<button onclick="_sgAffecter(\''+p.id+'\')" style="flex:1;padding:6px;border-radius:6px;border:1px solid var(--rouge-border);background:none;font-size:11px;color:var(--rouge);font-weight:600;cursor:pointer">'+(!enCours?'👷 Affecter':'↩ Réaffecter')+'</button>'+
        '<button onclick="event.stopPropagation();_marquerTraiteDT(\'signalements\',\''+p.id+'\',\''+fromNav+'\')" style="flex:1;padding:6px;border-radius:6px;border:none;background:var(--rouge);color:white;font-size:11px;font-weight:600;cursor:pointer">✓ Résolu</button>'+
      '</div>'+
    '</div>';
  });
  return h+'</div>';
}

async function _marquerTraiteDT(table,id,fromNav){
  var btn=event&&event.target;
  if(btn){btn.disabled=true;btn.textContent='...';}
  var body=table==='signalements'?{statut:'resolu',resolved_at:new Date().toISOString()}:{resolue:true};
  await supaPatch(table,id,body);
  if(!_session)return;
  if(_session.role==='dir_ops')renderDirOps(_session,fromNav||'alertes');
  else renderDirTech(_session,fromNav||'alertes');
}

async function _dtHistorique(sids){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucun site configuré</div>';
  var sidStr=sids.join(',');
  var period=_histPeriod||30;
  var since30=dateNJours(30);
  var cutoff=dateNJours(period);
  var[sites,rondes,pannes]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since30+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=300'),
    supaGet('signalements','groupe_id=in.('+sidStr+')&type=eq.panne&created_at=gte.'+since30+'&select=id,groupe_id,type,description,created_at,statut,equipements(nom)&order=created_at.desc&limit=120')
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  var rondesFilt=rondes.filter(function(r){return r.date_ronde>=cutoff;});
  var pannesFilt=pannes.filter(function(p){return!p.created_at||p.created_at.substring(0,10)>=cutoff;});
  var h=_buildPeriodSelector(period);
  if(rondesFilt.length===0&&pannesFilt.length===0){
    return h+'<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucune donnée sur les '+period+' derniers jours</div>';
  }
  // Rondes groupées par date → par site
  if(rondesFilt.length>0){
    var rIds=rondesFilt.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,statut');
    var reByRonde={};
    rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});
    var byDate={};
    rondesFilt.forEach(function(ro){var d=ro.date_ronde;if(!byDate[d])byDate[d]=[];byDate[d].push(ro);});
    var dates=Object.keys(byDate).sort(function(a,b){return b>a?1:-1;});
    h+='<div class="section-title" style="margin-top:4px">Rondes</div><div style="display:flex;flex-direction:column;gap:10px">';
    dates.forEach(function(d){
      var dateDisp=new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      var isToday=d===todayStr();
      h+='<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:8px;margin-bottom:2px">'+(isToday?'Aujourd\'hui — ':'')+dateDisp+'</div>';
      var bySite={};
      byDate[d].forEach(function(ro){if(!bySite[ro.site_id])bySite[ro.site_id]=[];bySite[ro.site_id].push(ro);});
      Object.keys(bySite).forEach(function(sid){
        var sNom=siteMap[sid]||'Site';
        var sRondes=bySite[sid];
        var allEq=[];
        sRondes.forEach(function(ro){allEq=allEq.concat(reByRonde[ro.id]||[]);});
        var val=allEq.filter(function(re){return re.statut==='valide';}).length;
        var tot=allEq.length;
        var pct=tot>0?Math.round(val/tot*100):0;
        var ok=val===tot&&tot>0;
        h+='<div class="ronde-card">'+
          '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
            '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':pct>0?'🔄':'❌')+'</span>'+
            '<div style="flex:1">'+
              '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
              '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+'/'+tot+' équipements · '+sRondes.length+' ronde'+(sRondes.length>1?'s':''):'Aucune donnée')+'</div>'+
            '</div>'+
            '<span style="font-family:\'Cormorant Garamond\',serif;font-size:22px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--amber)')+'">'+( tot>0?pct+'%':'—')+'</span>'+
          '</div>'+
          (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':pct>0?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
        '</div>';
      });
    });
    h+='</div>';
  }
  // Pannes
  h+='<div class="section-title">Pannes <span style="font-size:12px;font-weight:400;color:var(--text3)">— '+period+' jours</span></div>';
  if(pannesFilt.length===0){
    h+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur cette période</div></div></div>';
  }else{
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannesFilt.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.groupe_id]||'Site';
      var ts=p.created_at?new Date(p.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.statut==='resolu';
      h+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+escape_html(p.description||'')+(ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

var _dtSgFilter='tous';
var _dtSgSiteFilter='tous';
var _dtSgTypeFilter='tous';
function _dtSetSgFilter(f){_dtSgFilter=f;if(_session)renderDirTech(_session,'signalements');}
function _dtSetSgSiteFilter(v){_dtSgSiteFilter=v;if(_session)renderDirTech(_session,'signalements');}
function _dtSetSgTypeFilter(v){_dtSgTypeFilter=v;if(_session)renderDirTech(_session,'signalements');}

async function _dtSignalements(sids){
  var dc=document.getElementById('dash-content-main');
  if(dc){dc.style.padding='24px';dc.style.maxWidth='none';}
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">📍</div>Aucun site configuré</div>';
  var sidStr=sids.join(',');
  var since30=dateNJours(30);
  var[sites,allRows]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom&order=nom.asc'),
    supaGet('signalements','groupe_id=in.('+sidStr+')&created_at=gte.'+since30+'T00:00:00&order=created_at.desc&limit=400&select=id,groupe_id,type,description,statut,signale_par,lieu,assigne_a,pris_en_charge_par,ref_code,created_at,equipement_id,equipement_zone_id,equipements(nom),equipements_zone(nom,zones(nom))')
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});

  // Cache rows for _sgAffecter
  if(!window._sgRows)window._sgRows={};
  allRows.forEach(function(r){window._sgRows[r.id]=r;});

  // KPIs globaux
  var cOuvert=allRows.filter(function(r){return r.statut==='ouvert';}).length;
  var cEnCours=allRows.filter(function(r){return r.statut==='en_cours';}).length;
  var cResolu=allRows.filter(function(r){return r.statut==='resolu';}).length;
  // Zones actives = zones uniques avec signalements non résolus
  var _zonesActives=new Set();
  allRows.filter(function(r){return r.statut!=='resolu';}).forEach(function(r){
    if(r.equipements_zone&&r.equipements_zone.zones&&r.equipements_zone.zones.nom)_zonesActives.add(r.equipements_zone.zones.nom);
  });

  // Zones chaudes = top 5 par nb signalements non résolus
  var _zoneCounts={};
  allRows.filter(function(r){return r.statut!=='resolu';}).forEach(function(r){
    var zNom=(r.equipements_zone&&r.equipements_zone.zones&&r.equipements_zone.zones.nom)||
             (r.equipements_zone&&r.equipements_zone.nom)||
             (r.equipements&&r.equipements.nom)||
             (r.lieu)||'—';
    _zoneCounts[zNom]=(_zoneCounts[zNom]||0)+1;
  });
  var _hotZones=Object.keys(_zoneCounts).map(function(k){return{nom:k,n:_zoneCounts[k]};}).sort(function(a,b){return b.n-a.n;}).slice(0,5);
  var _maxHot=_hotZones.length?_hotZones[0].n:1;

  // Apply filters
  var rows=allRows.filter(function(r){
    if(_dtSgFilter!=='tous'&&r.statut!==_dtSgFilter)return false;
    if(_dtSgSiteFilter!=='tous'&&r.groupe_id!==_dtSgSiteFilter)return false;
    if(_dtSgTypeFilter!=='tous'&&r.type!==_dtSgTypeFilter)return false;
    return true;
  });

  // KPI bar
  var kpisHtml='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">'+
    '<div class="kpi"><div class="kpi-label">Ouverts</div><div class="kpi-value" style="color:var(--rouge)">'+cOuvert+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">En cours</div><div class="kpi-value" style="color:var(--orange)">'+cEnCours+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Résolus (30j)</div><div class="kpi-value" style="color:var(--vert)">'+cResolu+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Zones actives</div><div class="kpi-value">'+_zonesActives.size+'</div></div>'+
  '</div>';

  // Filters
  var stPills=['tous','ouvert','en_cours','resolu'].map(function(f){
    var labels={tous:'Tous',ouvert:'Ouverts',en_cours:'En cours',resolu:'Résolus'};
    var n={tous:allRows.length,ouvert:cOuvert,en_cours:cEnCours,resolu:cResolu}[f];
    var active=_dtSgFilter===f;
    return '<button onclick="_dtSetSgFilter(\''+f+'\')" style="padding:5px 13px;border-radius:20px;border:1.5px solid '+(active?'var(--amber)':'var(--border)')+';background:'+(active?'var(--amber-pale)':'white')+';font-size:12px;font-weight:'+(active?'700':'500')+';color:'+(active?'var(--amber-dark)':'var(--text2)')+';cursor:pointer">'+labels[f]+' ('+n+')</button>';
  }).join('');
  var siteSelect='<select onchange="_dtSetSgSiteFilter(this.value)" style="padding:5px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px"><option value="tous">Tous les sites</option>'+
    sites.map(function(s){return '<option value="'+s.id+'"'+(s.id===_dtSgSiteFilter?' selected':'')+'>'+escape_html(s.nom)+'</option>';}).join('')+'</select>';
  var typeSelect='<select onchange="_dtSetSgTypeFilter(this.value)" style="padding:5px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px"><option value="tous">Tous types</option><option value="panne">Panne</option><option value="anomalie">Anomalie</option><option value="observation">Observation</option></select>';

  var filtersHtml='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px">'+
    stPills+
    '<span style="margin-left:auto;display:flex;gap:6px">'+siteSelect+typeSelect+'</span>'+
  '</div>';

  // Group by site → zone
  var bySite={};
  rows.forEach(function(r){
    if(!bySite[r.groupe_id])bySite[r.groupe_id]=[];
    bySite[r.groupe_id].push(r);
  });

  function _sgAccentColor(statut){return statut==='ouvert'?'var(--rouge)':statut==='en_cours'?'var(--orange)':'var(--vert)';}

  var siteCardsHtml='';
  if(!rows.length){
    siteCardsHtml='<div style="text-align:center;padding:48px 24px;color:var(--text3)"><div style="font-size:40px;margin-bottom:12px;opacity:.4">📍</div><div>Aucun signalement</div></div>';
  }else{
    sites.forEach(function(site){
      var sRows=bySite[site.id];
      if(!sRows||!sRows.length)return;
      var sOuv=sRows.filter(function(r){return r.statut==='ouvert';}).length;
      var sEnc=sRows.filter(function(r){return r.statut==='en_cours';}).length;
      // Group by zone
      var byZone={};
      sRows.forEach(function(r){
        var zKey=(r.equipements_zone&&r.equipements_zone.zones&&r.equipements_zone.zones.nom)||'Sans zone';
        if(!byZone[zKey])byZone[zKey]=[];
        byZone[zKey].push(r);
      });
      var badgeHtml='';
      if(sOuv>0)badgeHtml+='<span style="font-size:10px;font-weight:700;color:var(--rouge);background:#FDECEA;padding:2px 8px;border-radius:10px;border:1px solid var(--rouge)">'+sOuv+' ouvert'+(sOuv>1?'s':'')+'</span>';
      if(sEnc>0)badgeHtml+='<span style="font-size:10px;font-weight:700;color:var(--orange);background:#FDF3E3;padding:2px 8px;border-radius:10px;border:1px solid var(--orange);margin-left:4px">'+sEnc+' en cours</span>';

      var zonesHtml='';
      Object.keys(byZone).forEach(function(zNom){
        var zRows=byZone[zNom];
        var sgCardsHtml=zRows.map(function(r){
          var acc=_sgAccentColor(r.statut);
          var st=(_SG_STATUTS&&_SG_STATUTS[r.statut])||{label:r.statut,color:'var(--text2)',bg:'var(--bg)'};
          var typeLabel=(_SG_TYPES&&_SG_TYPES[r.type])||r.type||'Signalement';
          var eqZNom=r.equipements_zone&&r.equipements_zone.nom?r.equipements_zone.nom:null;
          var eqNom=r.equipements&&r.equipements.nom?r.equipements.nom:null;
          // Breadcrumb: Zone > EquipZone > Equip
          var bc='<span style="color:var(--text3);font-size:10px">'+escape_html(zNom)+'</span>';

        zonesHtml+='<div style="margin-left:10px;margin-bottom:10px">'+
          '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:4px 0 4px 8px;border-left:2px solid var(--border);margin-bottom:6px">'+
            '📍 '+escape_html(zNom)+
          '</div>'+
          sgCardsHtml+
        '</div>';
      });

      siteCardsHtml+='<div style="margin-bottom:14px">'+
        '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:8px">'+
          '<span style="font-size:14px">🏨</span>'+
          '<span style="font-size:13px;font-weight:700;color:var(--dark);flex:1">'+escape_html(site.nom)+'</span>'+
          badgeHtml+
        '</div>'+
        zonesHtml+
      '</div>';
    });
  }

  // Zones chaudes
  var hotHtml='<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:10px">🔥 Zones chaudes</div>';

    hotHtml+=_hotZones.map(function(z){
      var barW=Math.round(z.n/_maxHot*100);

      '</div>';

    hotHtml+='<div style="font-size:12px;color:var(--text3)">Aucun signalement actif</div>';
  }
  // Récap par site
  var recapHtml='<div style="margin-top:16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px">Par hôtel</div>'+
    '<div style="background:white;border:0.5px solid var(--border);border-radius:8px;overflow:hidden">'+
    sites.map(function(s,i){
      var sr=allRows.filter(function(r){return r.groupe_id===s.id;});
      var sO=sr.filter(function(r){return r.statut==='ouvert';}).length;
      var sE=sr.filter(function(r){return r.statut==='en_cours';}).length;
      return '<div style="padding:7px 10px;'+(i>0?'border-top:0.5px solid var(--border)':'')+';display:flex;justify-content:space-between;align-items:center">'+
        '<span style="font-size:11px;color:var(--text2)">'+escape_html(s.nom)+'</span>'+
        '<span style="font-size:11px">'+(sO?'<b style="color:var(--rouge)">'+sO+'</b> <span style="color:var(--text3)">ouv.</span> ':'<span style="color:var(--vert)">0</span> <span style="color:var(--text3)">ouv.</span> ')+(sE?'· <b style="color:var(--orange)">'+sE+'</b> <span style="color:var(--text3)">enc.</span>':'')+'</span>'+

  return '<div>'+

    '<div style="display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px;align-items:start">'+
      '<div>'+siteCardsHtml+'</div>'+
      '<div>'+hotHtml+recapHtml+'</div>'+
    '</div>'+

}

/* ── DIR TECH : maintenances cross-site ── */
var _dtMntFilter='tous';
var _dtMntPeriod=30;
var _dtMntSiteFilter='tous';
function _mntKpi(label,val,sub,valCol){

  '</div>';
}
async function _dtMaintenances(sids){
  var dc=document.getElementById('dash-content-main');
  if(dc){dc.style.padding='24px';dc.style.maxWidth='none';}
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">🔧</div>Aucun site configuré</div>';
  var HCOLS=['#C49A1C','#2D7A4F','#3498DB','#D4761E','#8E44AD','#E74C3C'];
  var HCOLS_PALE=['#FDF3E3','#E8F5EE','#EBF5FB','#FDF0E6','#F5EEF8','#FDEDEC'];
  var MNT=_MNT_TYPES||{};
  var sidStr=sids.join(',');
  var sites=await supaGet('sites','id=in.('+sidStr+')&select=id,nom');
  var siteMap={};
  sites.forEach(function(s,i){siteMap[s.id]={nom:s.nom,col:HCOLS[i%HCOLS.length],pale:HCOLS_PALE[i%HCOLS_PALE.length]};});
  var cutoff=new Date();cutoff.setDate(cutoff.getDate()-_dtMntPeriod);
  var cutoffStr=cutoff.toISOString().slice(0,10);
  var todayStr=new Date().toISOString().slice(0,10);
  var baseSelect='id,groupe_id,type,titre,statut,date_intervention,cout,prestataire,quantite,unite,equipements(nom)';
  var qPast='groupe_id=in.('+sidStr+')&statut=neq.planifie&date_intervention=gte.'+cutoffStr+'&order=date_intervention.desc&limit=300&select='+baseSelect;
  var qUpcoming='groupe_id=in.('+sidStr+')&statut=eq.planifie&date_intervention=gte.'+todayStr+'&order=date_intervention.asc&limit=100&select='+baseSelect;
  var results=await Promise.all([supaGet('maintenances',qPast),supaGet('maintenances',qUpcoming)]);
  var rows=results[0];var upcoming=results[1];
  /* filtered views */
  var displayRows=rows.filter(function(r){
    if(_dtMntFilter!=='tous'&&r.type!==_dtMntFilter)return false;
    if(_dtMntSiteFilter!=='tous'&&String(r.groupe_id)!==String(_dtMntSiteFilter))return false;
    return true;
  });
  var displayUpcoming=upcoming.filter(function(r){
    if(_dtMntSiteFilter!=='tous'&&String(r.groupe_id)!==String(_dtMntSiteFilter))return false;
    return true;
  });
  /* KPIs */
  var nbRealises=rows.filter(function(r){return r.statut==='realise';}).length;
  var totalCout=rows.filter(function(r){return r.statut==='realise'&&r.type!=='ravitaillement';}).reduce(function(s,r){return s+(Number(r.cout)||0);},0);
  var sitesActifs=new Set(rows.map(function(r){return r.groupe_id;}));
  /* per-site stats */
  var siteStats={};
  sites.forEach(function(s,i){siteStats[s.id]={nb:0,cout:0,planif:0,col:HCOLS[i%HCOLS.length],pale:HCOLS_PALE[i%HCOLS_PALE.length],nom:s.nom};});
  rows.forEach(function(r){if(siteStats[r.groupe_id]){siteStats[r.groupe_id].nb++;if(r.statut==='realise'&&r.type!=='ravitaillement')siteStats[r.groupe_id].cout+=(Number(r.cout)||0);}});
  upcoming.forEach(function(r){if(siteStats[r.groupe_id])siteStats[r.groupe_id].planif++;});
  var maxNb=1;Object.values(siteStats).forEach(function(s){if(s.nb>maxNb)maxNb=s.nb;});
  /* KPI bar */
  var kpiHtml='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">'+
    _mntKpi('Interventions réalisées',nbRealises,_dtMntPeriod+' derniers jours','')+
    _mntKpi('Coût interventions',totalCout.toLocaleString('fr-FR')+' FCFA','hors ravitaillement carburant','')+
    _mntKpi('Planifiées à venir',upcoming.length,'à partir d\'aujourd\'hui',upcoming.length>0?'var(--orange)':'')+
    _mntKpi('Sites actifs',sitesActifs.size+' / '+sites.length,'avec activité sur la période','')+
  '</div>';
  /* period pills */
  var periodHtml=[7,30,90].map(function(d){
    var a=_dtMntPeriod===d;
    return '<button onclick="_dtMntPeriod='+d+';_dtSetMntFilter(_dtMntFilter)" style="padding:5px 12px;border-radius:20px;border:1.5px solid '+(a?'var(--amber)':'var(--border)')+';background:'+(a?'var(--amber-pale)':'white')+';font-size:11px;font-weight:'+(a?'700':'500')+';color:'+(a?'var(--amber-dark)':'var(--text2)')+';cursor:pointer">'+d+' jours</button>';
  }).join('');
  /* type pills */
  var byType={};rows.forEach(function(r){if(r.type)byType[r.type]=(byType[r.type]||0)+1;});
  var typeLabels={tous:'Tous les types',panne:'Pannes',vidange:'Vidanges',ravitaillement:'Ravitaillement',preventive:'Préventive'};
  var typeHtml=['tous','panne','vidange','ravitaillement','preventive'].map(function(f){
    var a=_dtMntFilter===f;
    var n=f==='tous'?rows.length:(byType[f]||0);
    return '<button onclick="_dtSetMntFilter(\''+f+'\')" style="padding:5px 12px;border-radius:20px;border:1.5px solid '+(a?'var(--amber)':'var(--border)')+';background:'+(a?'var(--amber-pale)':'white')+';font-size:11px;font-weight:'+(a?'700':'500')+';color:'+(a?'var(--amber-dark)':'var(--text2)')+';cursor:pointer">'+typeLabels[f]+(n&&f!=='tous'?' ('+n+')':'')+'</button>';
  }).join('');
  /* site dropdown */
  var siteOptHtml='<option value="tous">Tous les hôtels</option>'+sites.map(function(s){return '<option value="'+s.id+'"'+(String(_dtMntSiteFilter)===String(s.id)?' selected':'')+'>'+escape_html(s.nom)+'</option>';}).join('');
  var siteSelectHtml='<select onchange="_dtMntSiteFilter=this.value;_dtSetMntFilter(_dtMntFilter)" style="padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:white;font-size:11px;color:var(--text2);cursor:pointer;outline:none">'+siteOptHtml+'</select>';
  var filtersHtml='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px">'+
    periodHtml+
    '<div style="width:1px;height:18px;background:var(--border);margin:0 2px;flex-shrink:0"></div>'+
    typeHtml+
    '<div style="width:1px;height:18px;background:var(--border);margin:0 2px;flex-shrink:0"></div>'+
    siteSelectHtml+
  '</div>';
  /* recap table */
  var siteRows=sites.map(function(s){
    var st=siteStats[s.id]||{nb:0,cout:0,planif:0,col:'#aaa'};
    var pct=rows.length?Math.round(st.nb/rows.length*100):0;
    var barPct=Math.round(st.nb/maxNb*100);
    return '<tr>'+
      '<td style="padding:8px 10px;border-bottom:0.5px solid var(--border)">'+
        '<div style="display:flex;align-items:center;gap:7px">'+
          '<span style="width:9px;height:9px;border-radius:50%;background:'+st.col+';display:inline-block;flex-shrink:0"></span>'+
          '<span style="font-weight:600;font-size:12px">'+escape_html(s.nom)+'</span>'+
        '</div></td>'+
      '<td style="padding:8px 10px;border-bottom:0.5px solid var(--border)">'+
        '<div style="display:flex;align-items:center;gap:7px">'+
          '<div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;min-width:50px"><div style="height:100%;border-radius:3px;background:'+st.col+';width:'+barPct+'%"></div></div>'+
          '<span style="font-size:11px;font-weight:600;min-width:16px;color:var(--dark)">'+st.nb+'</span>'+
        '</div></td>'+
      '<td style="padding:8px 10px;border-bottom:0.5px solid var(--border);font-size:12px;font-weight:600;color:var(--dark)">'+(st.cout?st.cout.toLocaleString('fr-FR')+' FCFA':'—')+'</td>'+
      '<td style="padding:8px 10px;border-bottom:0.5px solid var(--border);font-size:11px;color:var(--text3)">'+(pct?pct+'%':'—')+'</td>'+
      '<td style="padding:8px 10px;border-bottom:0.5px solid var(--border)">'+(st.planif>0?'<span style="background:var(--orange-pale);color:var(--orange);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px">'+st.planif+' planifiée'+(st.planif>1?'s':'')+'</span>':'<span style="font-size:11px;color:var(--text3)">—</span>')+'</td>'+
    '</tr>';
  }).join('');
  var recapHtml='<div style="margin-bottom:16px">'+
    '<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px">Récap par hôtel</div>'+
    '<div style="background:white;border:1.5px solid var(--border);border-radius:12px;overflow:hidden">'+
      '<table style="width:100%;border-collapse:collapse">'+
        '<thead><tr>'+
          '<th style="font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--border)">Hôtel</th>'+
          '<th style="font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--border)">Interventions</th>'+
          '<th style="font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--border)">Coût réalisé</th>'+
          '<th style="font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--border)">Part</th>'+
          '<th style="font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--border)">Planifiées</th>'+
        '</tr></thead>'+
        '<tbody>'+siteRows+'</tbody>'+
      '</table>'+
    '</div>'+
  '</div>';
  /* upcoming banner */
  var bannerHtml='';
  if(displayUpcoming.length){
    var snippet=displayUpcoming.slice(0,3).map(function(r){
      var t=MNT[r.type]||{label:r.type,icon:'🔧'};

      return '<span style="margin-right:12px">'+t.icon+' '+escape_html(r.titre||t.label)+' · <span style="opacity:.8">'+escape_html(sInfo.nom)+'</span>'+(dStr?' <span style="opacity:.6">'+dStr+'</span>':'')+'</span>';
    }).join('');
    var extra=displayUpcoming.length>3?'<span style="opacity:.6"> +'+( displayUpcoming.length-3)+'</span>':'';
    bannerHtml='<div style="background:var(--orange-pale);border:1.5px solid var(--orange);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px">'+
      '<div style="font-size:18px;flex-shrink:0;margin-top:1px">📅</div>'+
      '<div><div style="font-size:12px;font-weight:700;color:var(--orange-dark)">'+displayUpcoming.length+' intervention'+(displayUpcoming.length>1?'s':'')+' planifiée'+(displayUpcoming.length>1?'s':'')+' à venir</div>'+
        '<div style="font-size:11px;color:var(--orange-dark);margin-top:3px;line-height:1.6">'+snippet+extra+'</div>'+
      '</div>'+
    '</div>';
  }
  /* cards list */
  var listTitle='<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px">Interventions — chronologique</div>';
  var cards='';
  if(!displayRows.length){
    cards='<div style="text-align:center;padding:48px 24px;color:var(--text3)"><div style="font-size:40px;margin-bottom:12px;opacity:.4">🔧</div><div style="font-size:14px">Aucune opération enregistrée pour cette période.</div></div>';

      var eqNom=r.equipements&&r.equipements.nom?r.equipements.nom:null;
      var date=r.date_intervention||r.created_at;
      var dateStr=date?new Date(date).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'';
      var statutBadge='';
      if(r.statut==='realise')statutBadge='<span style="background:var(--vert-pale);color:var(--vert);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px">Réalisée</span>';
      else if(r.statut==='en_cours')statutBadge='<span style="background:var(--bleu-pale);color:var(--bleu);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px">En cours</span>';
      else statutBadge='<span style="background:var(--orange-pale);color:var(--orange);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px">'+escape_html(r.statut||'—')+'</span>';
