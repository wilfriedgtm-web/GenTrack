<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenTrack Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --creme:#F5F0E8;--dark:#111110;--amber:#C49A1C;
  --amber-pale:rgba(196,154,28,0.12);--amber-border:rgba(196,154,28,0.3);
  --surface:#FDFAF5;--border:#DDD0BC;
  --text:#1A1A18;--text2:#6B5E4A;--text3:#A8957E;
  --vert:#2D7A4F;--vert-pale:rgba(45,122,79,0.1);--vert-border:rgba(45,122,79,0.25);
  --rouge:#C0392B;--rouge-pale:rgba(192,57,43,0.08);--rouge-border:rgba(192,57,43,0.22);
  --orange:#D4761E;--orange-pale:rgba(212,118,30,0.08);--orange-border:rgba(212,118,30,0.25);
  --nav-h:64px;--sidebar-w:220px;
}
body{font-family:'Inter',sans-serif;background:var(--creme);color:var(--text);min-height:100vh}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.full-loader{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:13px;color:var(--text2)}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--creme)}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--dark);margin-bottom:4px}
.login-sub{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-bottom:40px}
.login-card{background:white;border:1px solid var(--border);border-radius:14px;padding:32px;width:100%;max-width:380px;box-shadow:0 2px 20px rgba(0,0,0,0.06)}
.login-step-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.login-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--text);margin-bottom:6px}
.login-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:24px}
.login-input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:'Inter',sans-serif;background:var(--surface);color:var(--text);outline:none;transition:border-color 0.15s;margin-bottom:14px;display:block}
.login-input:focus{border-color:var(--amber)}
.login-input::placeholder{color:var(--text3)}
.login-btn{width:100%;padding:13px;background:var(--dark);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;letter-spacing:0.5px;cursor:pointer;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.login-btn:hover{opacity:0.85}
.login-btn:disabled{opacity:0.5;cursor:default}
.login-back{background:none;border:none;font-size:12px;color:var(--text2);cursor:pointer;margin-top:14px;display:block;text-align:center;text-decoration:underline;width:100%}
.login-back:hover{color:var(--text)}
.login-error{font-size:12px;color:var(--rouge);background:var(--rouge-pale);border:1px solid var(--rouge-border);border-radius:6px;padding:10px 12px;margin-bottom:14px;display:none}
.login-success{font-size:13px;color:var(--vert);background:var(--vert-pale);border:1px solid var(--vert-border);border-radius:6px;padding:14px 16px;margin-bottom:14px;line-height:1.6}
.login-footer{font-size:10px;color:var(--text3);text-align:center;margin-top:32px;letter-spacing:0.5px}
.login-icon-big{font-size:40px;text-align:center;margin-bottom:16px}
/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--dark);min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;padding:0 0 24px;z-index:100}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.07)}
.sidebar-logo-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:white}
.sidebar-logo-sub{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.28);margin-top:3px}
.sidebar-nav{padding:16px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,0.45);font-size:12px;font-weight:500;cursor:pointer;transition:background 0.12s,color 0.12s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.8)}
.nav-item.active{background:rgba(196,154,28,0.15);color:var(--amber)}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sidebar-user{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.07)}
.sidebar-user-role{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--amber);margin-bottom:4px}
.sidebar-user-name{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:2px}
.sidebar-user-email{font-size:10px;color:rgba(255,255,255,0.25);word-break:break-all}
.logout-btn{background:none;border:none;color:rgba(255,255,255,0.25);font-size:11px;cursor:pointer;padding:0;margin-top:8px;text-decoration:underline}
.logout-btn:hover{color:rgba(255,255,255,0.55)}
/* MAIN */
.dash-main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;padding-bottom:40px}
.dash-topbar{background:white;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.dash-topbar-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600}
.dash-topbar-date{font-size:11px;color:var(--text2)}
.dash-content{padding:24px 28px;max-width:1000px}
/* MOBILE */
.mobile-header{display:none;background:var(--dark);padding:14px 18px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.mobile-header-logo{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:white}
.mobile-header-role{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-top:2px}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--dark);height:var(--nav-h);z-index:100;border-top:1px solid rgba(255,255,255,0.06)}
.mobile-nav-inner{display:flex;height:100%}
.mobile-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(255,255,255,0.38);font-size:9px;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;border:none;background:none;transition:color 0.12s}
.mobile-nav-item.active{color:var(--amber)}
.mobile-nav-icon{font-size:18px}
@media(max-width:768px){
  .sidebar{display:none}.dash-main{margin-left:0;padding-bottom:calc(var(--nav-h) + 16px)}
  .mobile-nav{display:flex}.mobile-header{display:flex}.dash-topbar{display:none}.dash-content{padding:16px}
}
/* UI */
.section-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin:28px 0 12px}
.alert-banner{background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge);border-radius:8px;padding:12px 16px;display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.alert-banner.ok{background:var(--vert-pale);border-color:var(--vert-border);border-left-color:var(--vert)}
.alert-banner.warn{background:var(--orange-pale);border-color:var(--orange-border);border-left-color:var(--orange)}
.ab-icon{font-size:16px;flex-shrink:0;margin-top:1px}.ab-body{flex:1}
.ab-title{font-size:13px;font-weight:600;color:var(--rouge)}.alert-banner.ok .ab-title{color:var(--vert)}.alert-banner.warn .ab-title{color:var(--orange)}
.ab-sub{font-size:12px;color:var(--text2);margin-top:2px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px}
.kpi{background:white;border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text2);font-weight:600;margin-bottom:8px}
.kpi-value{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1}
.kpi-trend{font-size:11px;color:var(--text2);margin-top:6px}
.placeholder-card{background:white;border:1px solid var(--border);border-radius:10px;padding:32px;margin-bottom:14px;text-align:center;color:var(--text3);font-size:13px;line-height:1.5}
.placeholder-icon{font-size:32px;margin-bottom:10px}
.eq-card{background:white;border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.eq-card-nom{font-size:12px;font-weight:600;color:var(--text)}
.eq-card-type{font-size:10px;color:var(--text3);margin-top:1px}
.ronde-card{background:white;border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.alerte-card{border-radius:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.alerte-card-titre{font-size:12px;font-weight:600}
.alerte-card-msg{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.4}
.btn-traite{flex-shrink:0;background:var(--dark);color:white;border:none;border-radius:6px;padding:5px 10px;font-size:10px;font-weight:600;cursor:pointer;letter-spacing:0.3px;white-space:nowrap;transition:opacity 0.15s}
.btn-traite:hover{opacity:0.75}
.progress-bar-wrap{height:4px;background:var(--border);border-radius:2px;margin-top:10px}
.progress-bar{height:100%;border-radius:2px;transition:width 0.4s}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div class="full-loader"><span class="spinner"></span>Chargement...</div>
</div>
<script>
var SUPA_URL='https://zbpoxjlkqxnqjzxohasq.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicG94amxrcXhucWp6eG9oYXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjM3ODAsImV4cCI6MjA5NzA5OTc4MH0.9-QyWgon93jGDo5QKMIh_-QbQZ_P9rQrYJnVxegJe7M';
var _session=null;
var _dtCurrentSite=null;
var _doCurrentSite=null;
var _histPeriod=30;

function $id(id){return document.getElementById(id);}
function app(){return $id('app');}
function nowStr(){return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function roleName(r){var m={dir_ops:'Directeur des opérations',dir_tech:'Directeur technique',resp_tech:'Responsable technique',technicien:'Technicien'};return m[r]||r;}
function navViewTitle(id){var m={accueil:'Accueil',alertes:'Alertes',historique:'Historique',config:'Configuration'};return m[id]||'Accueil';}
function saveSession(s){_session=s;try{localStorage.setItem('gt_session',JSON.stringify(s));}catch(e){}}
function loadStored(){try{return JSON.parse(localStorage.getItem('gt_session'));}catch(e){return null;}}
function clearSession(){_session=null;try{localStorage.removeItem('gt_session');}catch(e){}}
function todayStr(){return new Date().toISOString().split('T')[0];}
function dateNJours(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0];}

/* ── SUPABASE REST ── */
async function supaGet(table,qs){
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?'+qs,{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Accept':'application/json'}
    });
    if(!r.ok)return[];
    return await r.json();
  }catch(e){return[];}
}
async function supaPatch(table,id,data){
  try{
    await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id,{
      method:'PATCH',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(data)
    });
  }catch(e){}
}

/* ── INIT : token URL (?token=xxx) ou localStorage ── */
async function init(){
  var urlParams=new URLSearchParams(window.location.search);
  var urlToken=urlParams.get('token');
  if(urlToken){
    history.replaceState(null,'',window.location.pathname);
    var ok=await _validateToken(urlToken);
    if(ok){renderDashboard(_session);return;}
  }
  var stored=loadStored();
  if(stored&&stored.session_token){
    var ok2=await _validateToken(stored.session_token);
    if(ok2){renderDashboard(_session);return;}
    clearSession();
  }
  renderInvalidLink();
}

async function _validateToken(token){
  var now=new Date().toISOString();
  var rows=await supaGet('auth_sessions',
    'session_token=eq.'+encodeURIComponent(token)+
    '&expire_at=gte.'+now+
    '&select=session_token,role,site_ids,client_id,contact_id,contacts(nom,email)'+
    '&limit=1'
  );
  if(!rows||!rows.length)return false;
  var s=rows[0];
  var c=s.contacts||{};
  _session={
    session_token:token,
    role:s.role,
    site_ids:s.site_ids||[],
    client_id:s.client_id,
    contact:{id:s.contact_id,nom:c.nom||''},
    email:c.email||''
  };
  saveSession(_session);
  return true;
}

function renderInvalidLink(){
  app().innerHTML=`
    <div class="login-wrap">
      <div class="login-logo">GenTrack</div>
      <div class="login-sub">Gestion technique hôtelière</div>
      <div class="login-card">
        <div class="login-icon-big">🔒</div>
        <div class="login-title">Lien invalide ou expiré</div>
        <div class="login-desc">Ce lien d'accès n'est plus valide. Contactez votre administrateur pour obtenir un nouveau lien.</div>
      </div>
      <div class="login-footer">GenTrack · Dakar, Sénégal</div>
    </div>`;
}

/* ── ROUTING ── */
function renderDashboard(s){
  if(!s){renderInvalidLink();return;}
  if(s.role==='resp_tech')renderRespTech(s,'accueil');
  else if(s.role==='dir_tech')renderDirTech(s,'accueil');
  else if(s.role==='dir_ops')renderDirOps(s,'accueil');
  else renderRespTech(s,'accueil');
}
function navTo(id){
  if(!_session)return;
  if(_session.role==='resp_tech')renderRespTech(_session,id);
  else if(_session.role==='dir_tech'){
    if(_dtCurrentSite)renderDirTechSite(_session,_dtCurrentSite.id,_dtCurrentSite.nom,id);
    else renderDirTech(_session,id);
  }
  else if(_session.role==='dir_ops'){
    if(_doCurrentSite)renderDirOpsSite(_session,_doCurrentSite.id,_doCurrentSite.nom,id);
    else renderDirOps(_session,id);
  }
}
function logout(){clearSession();renderInvalidLink();}

/* ── LAYOUT ── */
function buildNavItems(role){
  var items=[{id:'accueil',icon:'🏠',label:'Accueil'},{id:'alertes',icon:'⚠️',label:'Alertes'},{id:'historique',icon:'📊',label:'Historique'}];
  if(role==='resp_tech')items.push({id:'config',icon:'⚙️',label:'Config'});
  return items;
}
function buildSidebar(session,activeNav){
  var items=buildNavItems(session.role);
  var navHtml=items.map(function(it){
    return '<button class="nav-item'+(it.id===activeNav?' active':'')+'" onclick="navTo(\''+it.id+'\')"><span class="nav-icon">'+it.icon+'</span>'+it.label+'</button>';
  }).join('');
  var nom=(session.contact&&session.contact.nom)||'';
  return '<div class="sidebar">'+
    '<div class="sidebar-logo"><div class="sidebar-logo-name">GenTrack</div><div class="sidebar-logo-sub">Tableau de bord</div></div>'+
    '<nav class="sidebar-nav">'+navHtml+'</nav>'+
    '<div class="sidebar-user">'+
      '<div class="sidebar-user-role">'+roleName(session.role)+'</div>'+
      (nom?'<div class="sidebar-user-name">'+nom+'</div>':'')+
      '<div class="sidebar-user-email">'+(session.email||'')+'</div>'+
      '<button class="logout-btn" onclick="logout()">Se déconnecter</button>'+
    '</div></div>';
}
function buildMobileHeader(s){
  return '<div class="mobile-header"><div><div class="mobile-header-logo">GenTrack</div><div class="mobile-header-role">'+roleName(s.role)+'</div></div></div>';
}
function buildMobileNav(role,activeNav){
  var items=buildNavItems(role);
  return '<div class="mobile-nav"><div class="mobile-nav-inner">'+items.map(function(it){
    return '<button class="mobile-nav-item'+(it.id===activeNav?' active':'')+'" onclick="navTo(\''+it.id+'\')"><span class="mobile-nav-icon">'+it.icon+'</span>'+it.label+'</button>';
  }).join('')+'</div></div>';
}
function buildLayout(session,activeNav,contentHtml){
  return buildSidebar(session,activeNav)+
    '<div class="dash-main">'+buildMobileHeader(session)+
    '<div class="dash-topbar"><div class="dash-topbar-title">'+navViewTitle(activeNav)+'</div><div class="dash-topbar-date">'+nowStr()+'</div></div>'+
    '<div class="dash-content">'+contentHtml+'</div></div>'+buildMobileNav(session.role,activeNav);
}

/* ══════════════════════════════════════
   VUE RESP TECH — Session B
══════════════════════════════════════ */

var _TYPE_ICONS={'Groupe électrogène':'⚡','Cuve fioul':'🛢️','Chambre froide':'❄️','Groupe eau glacée':'💧'};
var _FREQ_LABELS={journalier:'Ronde journalière',hebdo:'Ronde hebdomadaire',mensuel:'Ronde mensuelle',releve_horaire:'Relevé horaire'};

function renderRespTech(session,nav){
  nav=nav||'accueil';
  var skeleton='<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px"><span class="spinner"></span>Chargement des données...</div>';
  app().innerHTML=buildLayout(session,nav,skeleton);
  _loadRT(session,nav);
}

async function _loadRT(session,nav){
  var sid=session.site_ids&&session.site_ids[0];
  var cid=session.client_id;
  var el=document.querySelector('.dash-content');
  if(!el)return;
  try{
    var html='';
    if(nav==='accueil')html=await _rtAccueil(session,sid,cid);
    else if(nav==='alertes')html=await _rtAlertes(sid,cid);
    else if(nav==='historique')html=await _rtHistorique(sid);
    else if(nav==='config')html=await _rtConfig(sid);
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

/* ── Accueil ── */
async function _rtAccueil(session,sid,cid){
  var today=todayStr();
  var[rondes,equips,alertes,pannes]=await Promise.all([
    supaGet('rondes','site_id=eq.'+sid+'&date_ronde=eq.'+today+'&select=id,frequence,date_ronde'),
    supaGet('equipements','site_id=eq.'+sid+'&actif=eq.true&select=id,nom,ordre_ronde,types_equipements(nom)&order=ordre_ronde.asc'),
    supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc&limit=20'),
    supaGet('pannes','site_id=eq.'+sid+'&resolue=eq.false&select=id,type,description,date_panne,equipements(nom)&order=date_panne.desc&limit=20')
  ]);
  var rIds=rondes.map(function(r){return r.id;});
  var rondesEq=rIds.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=id,ronde_id,equipement_id,statut,valide_at'):[];

  // Ronde journalière
  var rondeJ=rondes.find(function(r){return r.frequence==='journalier';});
  var eqRJ=rondeJ?rondesEq.filter(function(re){return re.ronde_id===rondeJ.id;}):[];
  var nbVal=eqRJ.filter(function(re){return re.statut==='valide';}).length;
  var nbTot=eqRJ.length;
  var rondeOk=nbTot>0&&nbVal===nbTot;
  var nbAlertes=alertes.length+pannes.length;

  // Banner
  var banner='';
  if(nbAlertes>0){
    banner='<div class="alert-banner"><div class="ab-icon">🚨</div><div class="ab-body"><div class="ab-title">'+nbAlertes+' alerte'+(nbAlertes>1?'s':'')+' active'+(nbAlertes>1?'s':'')+'</div><div class="ab-sub">Voir le détail ci-dessous</div></div></div>';
  }else if(rondeOk){
    banner='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Tout est OK</div><div class="ab-sub">Ronde journalière validée · '+equips.length+' équipements</div></div></div>';
  }else if(nbTot>0){
    banner='<div class="alert-banner warn"><div class="ab-icon">⏳</div><div class="ab-body"><div class="ab-title">Ronde en cours</div><div class="ab-sub">'+nbVal+'/'+nbTot+' équipements validés</div></div></div>';
  }else{
    banner='<div class="alert-banner warn"><div class="ab-icon">📋</div><div class="ab-body"><div class="ab-title">Ronde journalière à démarrer</div><div class="ab-sub">Aucun relevé aujourd\'hui pour ce site</div></div></div>';
  }

  // KPIs
  var rondeDisp=nbTot>0?(nbVal+'/'+nbTot):'—';
  var kpis='<div class="kpi-grid">'+
    '<div class="kpi"><div class="kpi-label">Équipements</div><div class="kpi-value">'+equips.length+'</div><div class="kpi-trend">Ce site</div></div>'+
    '<div class="kpi"><div class="kpi-label">Ronde du jour</div><div class="kpi-value" style="color:'+(rondeOk?'var(--vert)':nbTot===0?'var(--text2)':'var(--orange)')+'">'+rondeDisp+'</div><div class="kpi-trend">'+(rondeOk?'Validée':nbTot===0?'Non commencée':'En cours')+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Alertes actives</div><div class="kpi-value" style="color:'+(nbAlertes>0?'var(--rouge)':'var(--vert)')+'">'+nbAlertes+'</div><div class="kpi-trend">'+(nbAlertes>0?'À traiter':'RAS')+'</div></div>'+
  '</div>';

  // Ma journée
  var journee='<div class="section-title">Ma journée</div>';
  if(rondes.length===0){
    journee+='<div class="placeholder-card"><div class="placeholder-icon">📋</div>Aucune ronde programmée aujourd\'hui</div>';
  }else{
    journee+='<div style="display:flex;flex-direction:column;gap:8px">';
    rondes.forEach(function(ro){
      var eqRo=rondesEq.filter(function(re){return re.ronde_id===ro.id;});
      var val=eqRo.filter(function(re){return re.statut==='valide';}).length;
      var tot=eqRo.length;
      var pct=tot>0?Math.round(val/tot*100):0;
      var ok=val===tot&&tot>0;
      journee+='<div class="ronde-card">'+
        '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
          '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':'🔄')+'</span>'+
          '<div style="flex:1">'+
            '<div style="font-size:13px;font-weight:600">'+(_FREQ_LABELS[ro.frequence]||ro.frequence)+'</div>'+
            '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+' / '+tot+' équipements · '+pct+'%':'Pas encore commencée')+'</div>'+
          '</div>'+
          '<span style="font-size:11px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--amber)')+'">'+
            (ok?'Validée':tot===0?'En attente':'En cours')+
          '</span>'+
        '</div>'+
        (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':'var(--amber)')+'"></div></div>':'')+
      '</div>';
    });
    journee+='</div>';
  }

  // Statut équipements
  var statut='<div class="section-title">Statut équipements</div>';
  if(equips.length===0){
    statut+='<div class="placeholder-card"><div class="placeholder-icon">⚙️</div>Aucun équipement trouvé pour ce site</div>';
  }else{
    statut+='<div style="display:flex;flex-direction:column;gap:6px">';
    equips.forEach(function(e){
      var re=rondeJ&&rondesEq.find(function(r){return r.ronde_id===rondeJ.id&&r.equipement_id===e.id;});
      var s,sc,dot;
      if(!rondeJ){s='Pas de ronde';sc='var(--text3)';dot='⚪';}
      else if(!re){s='—';sc='var(--text3)';dot='⚫';}
      else if(re.statut==='valide'){s='OK';sc='var(--vert)';dot='🟢';}
      else if(re.statut==='en_cours'){s='En cours';sc='var(--orange)';dot='🟡';}
      else{s='En attente';sc='var(--orange)';dot='🟡';}
      var tNom=(e.types_equipements&&e.types_equipements.nom)||'';
      var tIcon=_TYPE_ICONS[tNom]||'⚙️';
      statut+='<div class="eq-card">'+
        '<span style="font-size:18px">'+tIcon+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+e.nom+'</div>'+
          (tNom?'<div class="eq-card-type">'+tNom+'</div>':'')+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:5px;flex-shrink:0">'+
          '<span style="font-size:11px">'+dot+'</span>'+
          '<span style="font-size:10px;font-weight:600;color:'+sc+';text-transform:uppercase;letter-spacing:0.3px">'+s+'</span>'+
        '</div>'+
      '</div>';
    });
    statut+='</div>';
  }

  // Alertes actives
  var alertesHtml='<div class="section-title">Alertes actives</div>';
  if(nbAlertes===0){
    alertesHtml+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune alerte</div><div class="ab-sub">Tous les systèmes sont opérationnels</div></div></div>';
  }else{
    alertesHtml+=_buildAlerteCards(alertes,pannes,'accueil');
  }

  return banner+kpis+journee+statut+alertesHtml;
}

/* ── Alertes (vue complète) ── */
async function _rtAlertes(sid,cid){
  var[alertes,pannes]=await Promise.all([
    supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc'),
    supaGet('pannes','site_id=eq.'+sid+'&resolue=eq.false&select=id,type,description,date_panne,equipements(nom)&order=date_panne.desc')
  ]);
  if(alertes.length===0&&pannes.length===0){
    return '<div class="alert-banner ok" style="margin-top:12px"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune alerte active</div><div class="ab-sub">Tous les systèmes fonctionnent normalement</div></div></div>';
  }
  return '<div style="margin-top:4px">'+_buildAlerteCards(alertes,pannes,'alertes')+'</div>';
}

function _buildAlerteCards(alertes,pannes,fromNav){
  var h='<div style="display:flex;flex-direction:column;gap:8px">';
  alertes.forEach(function(a){
    var crit=a.severite==='critical';
    var bg=crit?'var(--rouge-pale)':'var(--orange-pale)';
    var bd=crit?'var(--rouge-border)':'var(--orange-border)';
    var bl=crit?'var(--rouge)':'var(--orange)';
    var dot=crit?'🔴':'🟡';
    var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    h+='<div class="alerte-card" style="background:'+bg+';border:1px solid '+bd+';border-left:3px solid '+bl+'">'+
      '<span style="font-size:16px;margin-top:1px">'+dot+'</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:'+bl+'">'+escape_html(a.type||'Alerte')+'</div>'+
        '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
        (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
      '</div>'+
      '<button class="btn-traite" onclick="_marquerTraite(\'alertes\',\''+a.id+'\',\''+fromNav+'\')">✓ Traité</button>'+
    '</div>';
  });
  pannes.forEach(function(p){
    var eqNom=p.equipements&&p.equipements.nom?' · '+p.equipements.nom:'';
    var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    h+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
      '<span style="font-size:16px;margin-top:1px">🔴</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:var(--rouge)">Panne'+escape_html(eqNom)+'</div>'+
        '<div class="alerte-card-msg">'+escape_html((p.type?p.type+' — ':'')+( p.description||''))+'</div>'+
        (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
      '</div>'+
      '<button class="btn-traite" onclick="_marquerTraite(\'pannes\',\''+p.id+'\',\''+fromNav+'\')">✓ Résolu</button>'+
    '</div>';
  });
  return h+'</div>';
}

async function _marquerTraite(table,id,fromNav){
  var btn=event&&event.target;
  if(btn){btn.disabled=true;btn.textContent='...';}
  await supaPatch(table,id,{resolue:true});
  if(!_session)return;
  if(_doCurrentSite)renderDirOpsSite(_session,_doCurrentSite.id,_doCurrentSite.nom,fromNav||'alertes');
  else if(_dtCurrentSite)renderDirTechSite(_session,_dtCurrentSite.id,_dtCurrentSite.nom,fromNav||'alertes');
  else renderRespTech(_session,fromNav||'alertes');
}

/* ── Historique (30j avec sélecteur de période) ── */
async function _rtHistorique(sid){
  var period=_histPeriod||30;
  var since30=dateNJours(30);
  var cutoff=dateNJours(period);
  var[rondes,pannes]=await Promise.all([
    supaGet('rondes','site_id=eq.'+sid+'&date_ronde=gte.'+since30+'&select=id,date_ronde,frequence&order=date_ronde.desc&limit=90'),
    supaGet('pannes','site_id=eq.'+sid+'&date_panne=gte.'+since30+'&select=id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=60')
  ]);
  var rondesFilt=rondes.filter(function(r){return r.date_ronde>=cutoff;});
  var pannesFilt=pannes.filter(function(p){return!p.date_panne||p.date_panne>=cutoff;});
  var h=_buildPeriodSelector(period);
  if(rondesFilt.length===0&&pannesFilt.length===0){
    return h+'<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucune donnée sur les '+period+' derniers jours</div>';
  }
  // Rondes
  if(rondesFilt.length>0){
    var rIds=rondesFilt.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,statut');
    var reByRonde={};
    rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});
    var byDate={};
    rondesFilt.forEach(function(ro){var d=ro.date_ronde;if(!byDate[d])byDate[d]=[];byDate[d].push(ro);});
    var dates=Object.keys(byDate).sort(function(a,b){return b>a?1:-1;});
    h+='<div class="section-title" style="margin-top:4px">Rondes</div><div style="display:flex;flex-direction:column;gap:10px">';
    dates.forEach(function(d){
      var dateDisp=new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      var isToday=d===todayStr();
      h+='<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:8px;margin-bottom:2px">'+(isToday?'Aujourd\'hui — ':'')+dateDisp+'</div>';
      byDate[d].forEach(function(ro){
        var eqRo=reByRonde[ro.id]||[];
        var val=eqRo.filter(function(re){return re.statut==='valide';}).length;
        var tot=eqRo.length;
        var pct=tot>0?Math.round(val/tot*100):0;
        var ok=val===tot&&tot>0;
        h+='<div class="ronde-card">'+
          '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
            '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':pct>0?'🔄':'❌')+'</span>'+
            '<div style="flex:1">'+
              '<div style="font-size:13px;font-weight:600">'+(_FREQ_LABELS[ro.frequence]||ro.frequence)+'</div>'+
              '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+'/'+tot+' équipements validés':'Aucune donnée')+'</div>'+
            '</div>'+
            '<span style="font-family:\'Cormorant Garamond\',serif;font-size:22px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--orange)')+'">'+( tot>0?pct+'%':'—')+'</span>'+
          '</div>'+
          (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':pct>0?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
        '</div>';
      });
    });
    h+='</div>';
  }
  // Pannes
  h+='<div class="section-title">Pannes <span style="font-size:12px;font-weight:400;color:var(--text3)">— '+period+' jours</span></div>';
  if(pannesFilt.length===0){
    h+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur cette période</div></div></div>';
  }else{
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannesFilt.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      h+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+'</div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+(ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

async function _rtConfig(sid){

  var inactifs=equips.filter(function(e){return !e.actif;});

    '<div style="display:flex;flex-direction:column;gap:6px">';
  actifs.forEach(function(e){
    var tNom=(e.types_equipements&&e.types_equipements.nom)||'—';
    var tIcon=_TYPE_ICONS[tNom]||'⚙️';
    h+='<div class="eq-card">'+
      '<span style="font-size:18px">'+tIcon+'</span>'+
      '<div style="flex:1">'+
        '<div class="eq-card-nom">'+escape_html(e.nom)+'</div>'+
        '<div class="eq-card-type">'+escape_html(tNom)+' · Ordre '+e.ordre_ronde+'</div>'+
      '</div>'+
      '<span style="font-size:10px;font-weight:600;color:var(--vert)">● ACTIF</span>'+
    '</div>';
  });
  h+='</div>';
  if(inactifs.length>0){
    h+='<div class="section-title">Équipements inactifs ('+inactifs.length+')</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px">';
    inactifs.forEach(function(e){
      var tNom=(e.types_equipements&&e.types_equipements.nom)||'—';
      var tIcon=_TYPE_ICONS[tNom]||'⚙️';
      h+='<div class="eq-card" style="opacity:0.55">'+
        '<span style="font-size:18px">'+tIcon+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(e.nom)+'</div>'+
          '<div class="eq-card-type">'+escape_html(tNom)+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:var(--text3)">○ INACTIF</span>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

function escape_html(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderDirTech(session,nav){
  nav=nav||'accueil';
  _dtCurrentSite=null;
  var skeleton='<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px"><span class="spinner"></span>Chargement des données...</div>';
  app().innerHTML=buildLayout(session,nav,skeleton);
  _loadDT(session,nav);
}

async function _loadDT(session,nav){
  var sids=session.site_ids||[];
  var cid=session.client_id;
  var el=document.querySelector('.dash-content');
  if(!el)return;
  try{
    var html='';
    if(nav==='accueil')html=await _dtAccueil(session,sids,cid);
    else if(nav==='alertes')html=await _dtAlertes(sids,cid);
    else if(nav==='historique')html=await _dtHistorique(sids);
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

async function _dtAccueil(session,sids,cid){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">🏨</div>Aucun site configuré pour ce compte</div>';
  var sidStr=sids.join(',');
  var today=todayStr();
  var since7=dateNJours(7);

  var[sites,equips,rondes,alertes,pannes,pannes7]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('equipements','site_id=in.('+sidStr+')&actif=eq.true&select=id,site_id'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=eq.'+today+'&select=id,site_id,frequence,technicien_id'),
    supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc&limit=50'),
    supaGet('pannes','site_id=in.('+sidStr+')&resolue=eq.false&select=id,site_id,type,description,date_panne,equipements(nom)&order=date_panne.desc&limit=50'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since7+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=30')
  ]);

  var rIds=rondes.map(function(r){return r.id;});
  var rondesEq=rIds.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,equipement_id,statut'):[];

  var techIds=[...new Set(rondes.filter(function(r){return r.technicien_id;}).map(function(r){return r.technicien_id;}))];
  var contacts=techIds.length?await supaGet('contacts','id=in.('+techIds.join(',')+')'+'&select=id,nom,site_id'):[];
  var contactMap={};contacts.forEach(function(c){contactMap[c.id]=c.nom;});

  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  var eqBySite={};equips.forEach(function(e){eqBySite[e.site_id]=(eqBySite[e.site_id]||0)+1;});
  var pannesBySite={};pannes.forEach(function(p){pannesBySite[p.site_id]=(pannesBySite[p.site_id]||0)+1;});
  var rondesBySite={};
  rondes.forEach(function(r){if(!rondesBySite[r.site_id])rondesBySite[r.site_id]=[];rondesBySite[r.site_id].push(r);});
  var reByRonde={};
  rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});

  // KPI globaux
  var totalAlertes=alertes.length+pannes.length;
  var totalVal=0,totalTot=0;
  rondes.forEach(function(r){
    var eq=reByRonde[r.id]||[];
    totalTot+=eq.length;
    totalVal+=eq.filter(function(re){return re.statut==='valide';}).length;
  });
  var confPct=totalTot>0?Math.round(totalVal/totalTot*100):null;

  // Banner
  var banner=totalAlertes>0
    ?'<div class="alert-banner"><div class="ab-icon">🚨</div><div class="ab-body"><div class="ab-title">'+totalAlertes+' alerte'+(totalAlertes>1?'s':'')+' active'+(totalAlertes>1?'s':'')+'</div><div class="ab-sub">Pannes ou alertes à traiter sur vos sites</div></div></div>'
    :'<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Tous les sites opérationnels</div><div class="ab-sub">Aucune alerte active'+(confPct!==null?' · '+confPct+'% de conformité rondes':'')+'</div></div></div>';

  // KPIs
  var kpis='<div class="kpi-grid">'+
    '<div class="kpi"><div class="kpi-label">Sites suivis</div><div class="kpi-value">'+sites.length+'</div><div class="kpi-trend">Hôtels du portefeuille</div></div>'+
    '<div class="kpi"><div class="kpi-label">Alertes actives</div><div class="kpi-value" style="color:'+(totalAlertes>0?'var(--rouge)':'var(--vert)')+'">'+totalAlertes+'</div><div class="kpi-trend">'+(totalAlertes>0?'À traiter':'RAS')+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Conformité rondes</div><div class="kpi-value" style="color:'+(confPct===null?'var(--text2)':confPct===100?'var(--vert)':confPct>=70?'var(--amber)':'var(--rouge)')+'">'+( confPct!==null?confPct+'%':'—')+'</div><div class="kpi-trend">Aujourd\'hui</div></div>'+
  '</div>';

  // Bloc 1 — Vue multi-sites
  var bloc1='<div class="section-title">Vue d\'ensemble multi-sites</div><div style="display:flex;flex-direction:column;gap:8px">';
  sids.forEach(function(sid){
    var sNom=siteMap[sid]||'Site';
    var sEqCount=eqBySite[sid]||0;
    var sPannesCount=pannesBySite[sid]||0;
    var sRondes=rondesBySite[sid]||[];
    var rondeJ=sRondes.find(function(r){return r.frequence==='journalier';});
    var eqRJ=rondeJ?(reByRonde[rondeJ.id]||[]):[];
    var val=eqRJ.filter(function(re){return re.statut==='valide';}).length;
    var tot=eqRJ.length;
    var pct=tot>0?Math.round(val/tot*100):null;
    var ok=tot>0&&val===tot;
    var rondeDisp,rondeCol;
    if(!rondeJ){rondeDisp='Pas de ronde';rondeCol='var(--text3)';}
    else if(tot===0){rondeDisp='Non commencée';rondeCol='var(--text3)';}
    else if(ok){rondeDisp='Complète';rondeCol='var(--vert)';}
    else{rondeDisp=val+'/'+tot+' · '+pct+'%';rondeCol='var(--amber)';}
    var sNomEsc=escape_html(sNom).replace(/'/g,"\\'");
    bloc1+='<div class="ronde-card" style="cursor:pointer" onclick="renderDirTechSite(_session,\''+sid+'\',\''+sNomEsc+'\',\'accueil\')">'+
      '<div style="display:flex;align-items:center;gap:12px'+(pct!==null?';margin-bottom:10px':'')+'">'+
        '<span style="font-size:20px">'+(ok?'✅':!rondeJ||tot===0?'📋':'🔄')+'</span>'+
        '<div style="flex:1">'+
          '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
          '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+sEqCount+' équipements · Ronde : <span style="color:'+rondeCol+'">'+rondeDisp+'</span></div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'+
          (sPannesCount>0
            ?'<span style="font-size:10px;font-weight:600;color:var(--rouge);background:var(--rouge-pale);border:1px solid var(--rouge-border);border-radius:4px;padding:2px 8px">'+sPannesCount+' panne'+(sPannesCount>1?'s':'')+'</span>'
            :'<span style="font-size:10px;font-weight:600;color:var(--vert)">RAS</span>')+
          '<span style="font-size:16px;color:var(--text3)">›</span>'+
        '</div>'+
      '</div>'+
      (pct!==null?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':'var(--amber)')+'"></div></div>':'')+
    '</div>';
  });
  bloc1+='</div>';

  // Bloc 2 — Équipements en alerte
  var bloc2='<div class="section-title">Équipements en alerte</div>';
  if(totalAlertes===0){
    bloc2+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune alerte active</div><div class="ab-sub">Tous les équipements fonctionnent normalement</div></div></div>';
  }else{
    bloc2+=_buildAlerteCardsDT(alertes,pannes,'accueil',siteMap);
  }

  // Bloc 3 — Suivi équipe
  var bloc3='<div class="section-title">Suivi équipe</div>';
  var byTech={};
  rondes.forEach(function(r){
    var tId=r.technicien_id||'_inconnu';
    if(!byTech[tId])byTech[tId]={nom:r.technicien_id?(contactMap[r.technicien_id]||'Technicien'):'Non assigné',rondes:[]};
    byTech[tId].rondes.push(r);
  });
  var techKeys=Object.keys(byTech);
  if(techKeys.length===0){
    bloc3+='<div class="placeholder-card"><div class="placeholder-icon">👥</div>Aucune ronde assignée aujourd\'hui</div>';
  }else{
    bloc3+='<div style="display:flex;flex-direction:column;gap:6px">';
    techKeys.forEach(function(tId){
      var t=byTech[tId];
      var allEq=[];
      t.rondes.forEach(function(r){allEq=allEq.concat(reByRonde[r.id]||[]);});
      var tVal=allEq.filter(function(re){return re.statut==='valide';}).length;
      var tTot=allEq.length;
      var tPct=tTot>0?Math.round(tVal/tTot*100):0;
      var tOk=tTot>0&&tVal===tTot;
      var techSiteIds=[...new Set(t.rondes.map(function(r){return r.site_id;}))];
      var techSiteNames=techSiteIds.map(function(s){return siteMap[s]||s;}).join(', ');
      bloc3+='<div class="eq-card" style="padding:12px 14px">'+
        '<span style="font-size:20px">'+(tOk?'✅':tTot===0?'⏳':'🔄')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(t.nom)+'</div>'+
          '<div class="eq-card-type">'+escape_html(techSiteNames)+'</div>'+
        '</div>'+
        '<div style="text-align:right;flex-shrink:0">'+
          '<div style="font-family:\'Cormorant Garamond\',serif;font-size:20px;font-weight:600;color:'+(tOk?'var(--vert)':tTot===0?'var(--text3)':'var(--amber)')+'">'+( tTot>0?tPct+'%':'—')+'</div>'+
          '<div style="font-size:10px;color:var(--text2)">'+tVal+'/'+tTot+'</div>'+
        '</div>'+
      '</div>';
    });
    bloc3+='</div>';
  }

  // Bloc 4 — Pannes 7 jours
  var bloc4='<div class="section-title">Pannes récentes <span style="font-size:12px;font-weight:400;color:var(--text3)">— 7 jours</span></div>';
  if(pannes7.length===0){
    bloc4+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur 7 jours</div><div class="ab-sub">Tous les sites sont stables</div></div></div>';
  }else{
    bloc4+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannes7.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      bloc4+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+( ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    bloc4+='</div>';
  }

  var recos=await _buildRecommandations(sids,siteMap);
  return banner+kpis+(recos?recos:'')+bloc1+bloc2+bloc3+bloc4;
}

async function _dtAlertes(sids,cid){
  var sidStr=sids.join(',');
  var[sites,alertes,pannes]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc'),
    supaGet('pannes','site_id=in.('+sidStr+')&resolue=eq.false&select=id,site_id,type,description,date_panne,equipements(nom)&order=date_panne.desc')
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  if(alertes.length===0&&pannes.length===0){
    return '<div class="alert-banner ok" style="margin-top:12px"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune alerte active</div><div class="ab-sub">Tous les systèmes fonctionnent normalement</div></div></div>';
  }
  return '<div style="margin-top:4px">'+_buildAlerteCardsDT(alertes,pannes,'alertes',siteMap)+'</div>';
}

function _buildAlerteCardsDT(alertes,pannes,fromNav,siteMap){
  var h='<div style="display:flex;flex-direction:column;gap:8px">';
  alertes.forEach(function(a){
    var crit=a.severite==='critical';
    var bg=crit?'var(--rouge-pale)':'var(--orange-pale)';
    var bd=crit?'var(--rouge-border)':'var(--orange-border)';
    var bl=crit?'var(--rouge)':'var(--orange)';
    var dot=crit?'🔴':'🟡';
    var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    h+='<div class="alerte-card" style="background:'+bg+';border:1px solid '+bd+';border-left:3px solid '+bl+'">'+
      '<span style="font-size:16px;margin-top:1px">'+dot+'</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:'+bl+'">'+escape_html(a.type||'Alerte')+'</div>'+
        '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
        (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
      '</div>'+
      '<button class="btn-traite" onclick="_marquerTraiteDT(\'alertes\',\''+a.id+'\',\''+fromNav+'\')">✓ Traité</button>'+
    '</div>';
  });
  pannes.forEach(function(p){
    var eqNom=p.equipements&&p.equipements.nom?' · '+p.equipements.nom:'';
    var sNom=siteMap&&p.site_id&&siteMap[p.site_id]?' · '+siteMap[p.site_id]:'';
    var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    h+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
      '<span style="font-size:16px;margin-top:1px">🔴</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:var(--rouge)">Panne'+escape_html(eqNom)+escape_html(sNom)+'</div>'+
        '<div class="alerte-card-msg">'+escape_html((p.type?p.type+' — ':'')+( p.description||''))+'</div>'+
        (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
      '</div>'+
      '<button class="btn-traite" onclick="_marquerTraiteDT(\'pannes\',\''+p.id+'\',\''+fromNav+'\')">✓ Résolu</button>'+
    '</div>';
  });
  return h+'</div>';
}

async function _marquerTraiteDT(table,id,fromNav){
  var btn=event&&event.target;
  if(btn){btn.disabled=true;btn.textContent='...';}
  await supaPatch(table,id,{resolue:true});
  if(!_session)return;
  if(_session.role==='dir_ops')renderDirOps(_session,fromNav||'alertes');
  else renderDirTech(_session,fromNav||'alertes');
}

async function _dtHistorique(sids){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucun site configuré</div>';
  var sidStr=sids.join(',');
  var period=_histPeriod||30;
  var since30=dateNJours(30);
  var cutoff=dateNJours(period);
  var[sites,rondes,pannes]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since30+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=300'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since30+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=120')
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  var rondesFilt=rondes.filter(function(r){return r.date_ronde>=cutoff;});
  var pannesFilt=pannes.filter(function(p){return!p.date_panne||p.date_panne>=cutoff;});
  var h=_buildPeriodSelector(period);
  if(rondesFilt.length===0&&pannesFilt.length===0){
    return h+'<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucune donnée sur les '+period+' derniers jours</div>';
  }
  // Rondes groupées par date → par site
  if(rondesFilt.length>0){
    var rIds=rondesFilt.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,statut');
    var reByRonde={};
    rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});
    var byDate={};
    rondesFilt.forEach(function(ro){var d=ro.date_ronde;if(!byDate[d])byDate[d]=[];byDate[d].push(ro);});
    var dates=Object.keys(byDate).sort(function(a,b){return b>a?1:-1;});
    h+='<div class="section-title" style="margin-top:4px">Rondes</div><div style="display:flex;flex-direction:column;gap:10px">';
    dates.forEach(function(d){
      var dateDisp=new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      var isToday=d===todayStr();
      h+='<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:8px;margin-bottom:2px">'+(isToday?'Aujourd\'hui — ':'')+dateDisp+'</div>';
      var bySite={};
      byDate[d].forEach(function(ro){if(!bySite[ro.site_id])bySite[ro.site_id]=[];bySite[ro.site_id].push(ro);});
      Object.keys(bySite).forEach(function(sid){
        var sNom=siteMap[sid]||'Site';
        var sRondes=bySite[sid];
        var allEq=[];
        sRondes.forEach(function(ro){allEq=allEq.concat(reByRonde[ro.id]||[]);});
        var val=allEq.filter(function(re){return re.statut==='valide';}).length;
        var tot=allEq.length;
        var pct=tot>0?Math.round(val/tot*100):0;
        var ok=val===tot&&tot>0;
        h+='<div class="ronde-card">'+
          '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
            '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':pct>0?'🔄':'❌')+'</span>'+
            '<div style="flex:1">'+
              '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
              '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+'/'+tot+' équipements · '+sRondes.length+' ronde'+(sRondes.length>1?'s':''):'Aucune donnée')+'</div>'+
            '</div>'+
            '<span style="font-family:\'Cormorant Garamond\',serif;font-size:22px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--amber)')+'">'+( tot>0?pct+'%':'—')+'</span>'+
          '</div>'+
          (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':pct>0?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
        '</div>';
      });
    });
    h+='</div>';
  }
  // Pannes
  h+='<div class="section-title">Pannes <span style="font-size:12px;font-weight:400;color:var(--text3)">— '+period+' jours</span></div>';
  if(pannesFilt.length===0){
    h+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur cette période</div></div></div>';
  }else{
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannesFilt.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      h+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+(ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

/* ── DIR TECH : détail site ── */
function renderDirTechSite(session,sid,siteNom,nav){
  nav=nav||'accueil';
  _dtCurrentSite={id:sid,nom:siteNom};
  var skeleton='<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px"><span class="spinner"></span>Chargement...</div>';
  app().innerHTML=buildLayout(session,nav,skeleton);
  var tb=document.querySelector('.dash-topbar-title');
  if(tb)tb.textContent=siteNom;
  _loadDTSite(session,sid,siteNom,nav);
}

async function _loadDTSite(session,sid,siteNom,nav){
  var cid=session.client_id;
  var el=document.querySelector('.dash-content');
  if(!el)return;
  try{
    var back='<button onclick="_exitSiteDetail()" style="display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:7px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;margin-bottom:8px;transition:background 0.12s" onmouseover="this.style.background=\'var(--creme)\'" onmouseout="this.style.background=\'none\'">← Tous les hôtels</button>';
    var html=back;
    if(nav==='accueil')html+=await _rtAccueil(session,sid,cid);
    else if(nav==='alertes')html+=await _rtAlertes(sid,cid);
    else if(nav==='historique')html+=await _rtHistorique(sid);
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

function _exitSiteDetail(){
  _dtCurrentSite=null;
  renderDirTech(_session,'accueil');
}

function renderDirOps(session,nav){

async function _loadDO(session,nav){
  var sids=session.site_ids||[];
  var cid=session.client_id;

  if(!el)return;
  try{

  }
}

async function _doAccueil(session,sids,cid){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">🏨</div>Aucun site configuré pour ce compte</div>';
  var sidStr=sids.join(',');
  var since7=dateNJours(7);
  var since14=dateNJours(14);
  var threeDaysAgo=dateNJours(3);

  var[sites,alertes,pannes,rondes7,pannes14]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc&limit=50'),
    supaGet('pannes','site_id=in.('+sidStr+')&resolue=eq.false&select=id,site_id,type,description,date_panne,equipements(nom)&order=date_panne.asc&limit=50'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since7+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=200'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since14+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=60')
  ]);

  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});

  // Rondes 7j → conformité globale + par site
  var rIds7=rondes7.map(function(r){return r.id;});
  var rondesEq7=rIds7.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds7.join(',')+')'+'&select=ronde_id,statut'):[];
  // attach site_id to rondesEq via rondes7 map
  var rondeToSite={};
  rondes7.forEach(function(r){rondeToSite[r.id]=r.site_id;});
  var reByRonde7={};
  rondesEq7.forEach(function(re){
    if(!reByRonde7[re.ronde_id])reByRonde7[re.ronde_id]=[];
    reByRonde7[re.ronde_id].push(re);
  });

  var totalVal7=0,totalTot7=0;
  rondes7.forEach(function(r){
    var eq=reByRonde7[r.id]||[];
    totalTot7+=eq.length;
    totalVal7+=eq.filter(function(re){return re.statut==='valide';}).length;
  });
  var confGlobal7=totalTot7>0?Math.round(totalVal7/totalTot7*100):null;
  var totalAlertes=alertes.length+pannes.length;

  // Banner
  var banner=totalAlertes>0
    ?'<div class="alert-banner"><div class="ab-icon">🚨</div><div class="ab-body"><div class="ab-title">'+totalAlertes+' action'+(totalAlertes>1?'s':'')+' requise'+(totalAlertes>1?'s':'')+'</div><div class="ab-sub">Pannes ou alertes nécessitant votre attention</div></div></div>'
    :'<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Tous les sites opérationnels</div><div class="ab-sub">Aucune alerte active'+(confGlobal7!==null?' · '+confGlobal7+'% de conformité sur 7 jours':'')+'</div></div></div>';

  // KPIs
  var kpis='<div class="kpi-grid">'+
    '<div class="kpi"><div class="kpi-label">Hôtels suivis</div><div class="kpi-value">'+sites.length+'</div><div class="kpi-trend">Portefeuille Azalaï</div></div>'+
    '<div class="kpi"><div class="kpi-label">Actions requises</div><div class="kpi-value" style="color:'+(totalAlertes>0?'var(--rouge)':'var(--vert)')+'">'+totalAlertes+'</div><div class="kpi-trend">'+(totalAlertes>0?'À traiter':'RAS')+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Conformité 7 jours</div><div class="kpi-value" style="color:'+(confGlobal7===null?'var(--text2)':confGlobal7===100?'var(--vert)':confGlobal7>=70?'var(--amber)':'var(--rouge)')+'">'+( confGlobal7!==null?confGlobal7+'%':'—')+'</div><div class="kpi-trend">Rondes tous sites</div></div>'+
  '</div>';

  // Bloc 1 — Vue multi-sites (cartes cliquables)
  var bloc1='<div class="section-title">Vue d\'ensemble</div><div style="display:flex;flex-direction:column;gap:8px">';
  sids.forEach(function(sid){
    var sNom=siteMap[sid]||'Site';
    var sPannes=pannes.filter(function(p){return p.site_id===sid;});
    var sPannesCount=sPannes.length;
    var sRondes7=rondes7.filter(function(r){return r.site_id===sid;});
    var allEq7=[];
    sRondes7.forEach(function(r){allEq7=allEq7.concat(reByRonde7[r.id]||[]);});
    var sVal=allEq7.filter(function(re){return re.statut==='valide';}).length;
    var sTot=allEq7.length;
    var sPct7=sTot>0?Math.round(sVal/sTot*100):null;
    var sNomEsc=escape_html(sNom).replace(/'/g,"\\'");
    bloc1+='<div class="ronde-card" style="cursor:pointer" onclick="renderDirOpsSite(_session,\''+sid+'\',\''+sNomEsc+'\',\'accueil\')">'+
      '<div style="display:flex;align-items:center;gap:12px'+(sPct7!==null?';margin-bottom:10px':'')+'">'+
        '<span style="font-size:20px">'+(sPannesCount>0?'🔴':sPct7===100?'✅':'📋')+'</span>'+
        '<div style="flex:1">'+
          '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
          '<div style="font-size:11px;color:var(--text2);margin-top:2px">Conformité 7j : '+(sPct7!==null?'<span style="font-weight:600;color:'+(sPct7===100?'var(--vert)':sPct7>=70?'var(--amber)':'var(--rouge)')+'">'+sPct7+'%</span>':'<span style="color:var(--text3)">—</span>')+'</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'+
          (sPannesCount>0
            ?'<span style="font-size:10px;font-weight:600;color:var(--rouge);background:var(--rouge-pale);border:1px solid var(--rouge-border);border-radius:4px;padding:2px 8px">'+sPannesCount+' panne'+(sPannesCount>1?'s':'')+'</span>'
            :'<span style="font-size:10px;font-weight:600;color:var(--vert)">RAS</span>')+
          '<span style="font-size:16px;color:var(--text3)">›</span>'+
        '</div>'+
      '</div>'+
      (sPct7!==null?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+sPct7+'%;background:'+(sPct7===100?'var(--vert)':sPct7>=70?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
    '</div>';
  });
  bloc1+='</div>';

  // Bloc 2 — Actions requises
  var bloc2='<div class="section-title">Actions requises</div>';
  var pannesRetard=pannes.filter(function(p){return p.date_panne&&p.date_panne<=threeDaysAgo;});
  var alertesCritiques=alertes.filter(function(a){return a.severite==='critical';});
  var pannesNormales=pannes.filter(function(p){return !p.date_panne||p.date_panne>threeDaysAgo;});
  var alertesNormales=alertes.filter(function(a){return a.severite!=='critical';});

  if(totalAlertes===0){
    bloc2+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune action requise</div><div class="ab-sub">Tous les délais sont respectés</div></div></div>';
  }else{
    var items='<div style="display:flex;flex-direction:column;gap:8px">';
    // Pannes en retard (> 3j) — priorité max
    pannesRetard.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var daysDiff=p.date_panne?Math.floor((new Date()-new Date(p.date_panne))/(1000*60*60*24)):0;
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
      items+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
        '<span style="font-size:16px;margin-top:1px">⏰</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--rouge)">Panne en retard · '+escape_html(sNom)+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(eqNom)+(p.description||p.type?' — '+escape_html(p.description||p.type):'')+'</div>'+
          '<div style="font-size:10px;color:var(--rouge);margin-top:4px;font-weight:600">'+daysDiff+' jour'+(daysDiff>1?'s':'')+' sans résolution · Signalé le '+ts+'</div>'+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'pannes\',\''+p.id+'\',\'accueil\')">✓ Résolu</button>'+
      '</div>';
    });
    // Alertes critiques
    alertesCritiques.forEach(function(a){
      var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      items+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
        '<span style="font-size:16px;margin-top:1px">🔴</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--rouge)">'+escape_html(a.type||'Alerte critique')+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
          (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'alertes\',\''+a.id+'\',\'accueil\')">✓ Traité</button>'+
      '</div>';
    });
    // Pannes récentes (< 3j)
    pannesNormales.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      items+='<div class="alerte-card" style="background:var(--orange-pale);border:1px solid var(--orange-border);border-left:3px solid var(--orange)">'+
        '<span style="font-size:16px;margin-top:1px">🟡</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--orange)">Panne · '+escape_html(sNom)+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(eqNom)+(p.description||p.type?' — '+escape_html(p.description||p.type):'')+'</div>'+
          (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'pannes\',\''+p.id+'\',\'accueil\')">✓ Résolu</button>'+
      '</div>';
    });
    // Alertes non-critiques
    alertesNormales.forEach(function(a){
      var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      items+='<div class="alerte-card" style="background:var(--amber-pale);border:1px solid var(--amber-border);border-left:3px solid var(--amber)">'+
        '<span style="font-size:16px;margin-top:1px">🟡</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--amber)">'+escape_html(a.type||'Alerte')+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
          (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'alertes\',\''+a.id+'\',\'accueil\')">✓ Traité</button>'+
      '</div>';
    });
    bloc2+=items+'</div>';
  }

  // Bloc 3 — Activité récente 14j
  var bloc3='<div class="section-title">Activité récente <span style="font-size:12px;font-weight:400;color:var(--text3)">— 14 jours</span></div>';
  if(pannes14.length===0){
    bloc3+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur 14 jours</div><div class="ab-sub">Tous les sites sont stables</div></div></div>';
  }else{
    bloc3+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannes14.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      bloc3+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+( ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    bloc3+='</div>';
  }

  var recos=await _buildRecommandations(sids,siteMap);
  return banner+kpis+(recos?recos:'')+bloc1+bloc2+bloc3;
}

async function _marquerTraiteDO(table,id,fromNav){
  var btn=event&&event.target;
  if(btn){btn.disabled=true;btn.textContent='...';}
  await supaPatch(table,id,{resolue:true});
  if(_session)renderDirOps(_session,fromNav||'alertes');
}

async function _doHistorique(sids){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucun site configuré</div>';
  var sidStr=sids.join(',');
  var period=_histPeriod||30;
  var since30=dateNJours(30);
  var cutoff=dateNJours(period);
  var[sites,rondes,pannes]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since30+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=300'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since30+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=120')
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  var rondesFilt=rondes.filter(function(r){return r.date_ronde>=cutoff;});
  var pannesFilt=pannes.filter(function(p){return!p.date_panne||p.date_panne>=cutoff;});
  var h=_buildPeriodSelector(period);
  if(rondesFilt.length===0&&pannesFilt.length===0){
    return h+'<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucune donnée sur les '+period+' derniers jours</div>';
  }
  // Rondes groupées par date → par site
  if(rondesFilt.length>0){
    var rIds=rondesFilt.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,statut');
    var reByRonde={};
    rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});
    var byDate={};
    rondesFilt.forEach(function(ro){var d=ro.date_ronde;if(!byDate[d])byDate[d]=[];byDate[d].push(ro);});
    var dates=Object.keys(byDate).sort(function(a,b){return b>a?1:-1;});
    h+='<div class="section-title" style="margin-top:4px">Rondes</div><div style="display:flex;flex-direction:column;gap:10px">';
    dates.forEach(function(d){
      var dateDisp=new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      var isToday=d===todayStr();
      h+='<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:8px;margin-bottom:2px">'+(isToday?'Aujourd\'hui — ':'')+dateDisp+'</div>';
      var bySite={};
      byDate[d].forEach(function(ro){if(!bySite[ro.site_id])bySite[ro.site_id]=[];bySite[ro.site_id].push(ro);});
      Object.keys(bySite).forEach(function(sid){
        var sNom=siteMap[sid]||'Site';
        var sRondes=bySite[sid];
        var allEq=[];
        sRondes.forEach(function(ro){allEq=allEq.concat(reByRonde[ro.id]||[]);});
        var val=allEq.filter(function(re){return re.statut==='valide';}).length;
        var tot=allEq.length;
        var pct=tot>0?Math.round(val/tot*100):0;
        var ok=val===tot&&tot>0;
        h+='<div class="ronde-card">'+
          '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
            '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':pct>0?'🔄':'❌')+'</span>'+
            '<div style="flex:1">'+
              '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
              '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+'/'+tot+' équipements · '+sRondes.length+' ronde'+(sRondes.length>1?'s':''):'Aucune donnée')+'</div>'+
            '</div>'+
            '<span style="font-family:\'Cormorant Garamond\',serif;font-size:22px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--amber)')+'">'+( tot>0?pct+'%':'—')+'</span>'+
          '</div>'+
          (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':pct>0?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
        '</div>';
      });
    });
    h+='</div>';
  }
  // Pannes
  h+='<div class="section-title">Pannes <span style="font-size:12px;font-weight:400;color:var(--text3)">— '+period+' jours</span></div>';
  if(pannesFilt.length===0){
    h+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur cette période</div></div></div>';
  }else{
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannesFilt.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      h+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+(ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

/* ── DIR OPS : détail site ── */
function renderDirOpsSite(session,sid,siteNom,nav){
  nav=nav||'accueil';
  _doCurrentSite={id:sid,nom:siteNom};
  var skeleton='<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px"><span class="spinner"></span>Chargement...</div>';
  app().innerHTML=buildLayout(session,nav,skeleton);
  var tb=document.querySelector('.dash-topbar-title');
  if(tb)tb.textContent=siteNom;
  _loadDOSite(session,sid,siteNom,nav);
}

async function _loadDOSite(session,sid,siteNom,nav){
  var cid=session.client_id;
  var el=document.querySelector('.dash-content');
  if(!el)return;
  try{
    var back='<button onclick="_exitDOSiteDetail()" style="display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:7px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;margin-bottom:8px;transition:background 0.12s" onmouseover="this.style.background=\'var(--creme)\'" onmouseout="this.style.background=\'none\'">← Tous les hôtels</button>';
    var html=back;
    if(nav==='accueil')html+=await _rtAccueil(session,sid,cid);
    else if(nav==='alertes')html+=await _rtAlertes(sid,cid);
    else if(nav==='historique')html+=await _rtHistorique(sid);
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

function _exitDOSiteDetail(){
  _doCurrentSite=null;
  renderDirOps(_session,'accueil');
}

function _buildPeriodSelector(current){
  var opts=[7,14,30];
  return '<div style="display:flex;gap:6px;margin-bottom:16px">'+
    opts.map(function(n){
      var a=n===current;
      return '<button onclick="_setHistPeriod('+n+')" style="padding:5px 14px;border-radius:20px;border:1px solid '+(a?'var(--amber)':'var(--border)')+';background:'+(a?'var(--amber-pale)':'white')+';color:'+(a?'var(--amber)':'var(--text2)')+';font-size:11px;font-weight:'+(a?'600':'400')+';cursor:pointer;letter-spacing:0.3px;transition:all 0.12s">'+n+' jours</button>';
    }).join('')+'</div>';
}
function _setHistPeriod(n){_histPeriod=n;navTo('historique');}

async function _buildRecommandations(sids,siteMap){
  if(!sids||!sids.length)return'';
  var sidStr=sids.join(',');
  var since30=dateNJours(30);
  var since7=dateNJours(7);
  var[pannes30,rondes7]=await Promise.all([
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since30+'&select=id,site_id,equipement_id,equipements(nom)&limit=300'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since7+'&select=id,site_id&limit=300')
  ]);
  // Pannes récurrentes : >2 pannes/30j sur même équipement
  var byEq={};
  pannes30.forEach(function(p){
    var k=p.equipement_id;
    if(!byEq[k])byEq[k]={nom:(p.equipements&&p.equipements.nom)||'Équipement',site_id:p.site_id,count:0};
    byEq[k].count++;
  });
  var recurrents=Object.values(byEq).filter(function(e){return e.count>2;});
  // Conformité rondes 7j par site
  var rIds7=rondes7.map(function(r){return r.id;});
  var rondeToSite={};rondes7.forEach(function(r){rondeToSite[r.id]=r.site_id;});
  var rondesEq7=rIds7.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds7.join(',')+')'+'&select=ronde_id,statut'):[];
  var confBySite={};
  rondes7.forEach(function(r){if(!confBySite[r.site_id])confBySite[r.site_id]={val:0,tot:0};});
  rondesEq7.forEach(function(re){
    var sid=rondeToSite[re.ronde_id];
    if(!sid||!confBySite[sid])return;
    confBySite[sid].tot++;
    if(re.statut==='valide')confBySite[sid].val++;
  });
  var lowConf=Object.keys(confBySite).filter(function(sid){var c=confBySite[sid];return c.tot>0&&Math.round(c.val/c.tot*100)<70;});
  if(!recurrents.length&&!lowConf.length)return'';
  var h='<div class="section-title">Recommandations <span style="font-size:12px;font-weight:400;color:var(--text3)">— automatiques</span></div>'+
    '<div style="display:flex;flex-direction:column;gap:8px">';
  recurrents.forEach(function(eq){
    h+='<div class="alerte-card" style="background:var(--orange-pale);border:1px solid var(--orange-border);border-left:3px solid var(--orange)">'+
      '<span style="font-size:16px;margin-top:1px">🔧</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:var(--orange)">Équipement récurrent · '+escape_html(siteMap[eq.site_id]||'Site')+'</div>'+
        '<div class="alerte-card-msg">'+escape_html(eq.nom)+' — '+eq.count+' pannes sur 30 jours. Inspection préventive recommandée.</div>'+
      '</div></div>';
  });
  lowConf.forEach(function(sid){
    var c=confBySite[sid];
    var pct=Math.round(c.val/c.tot*100);
    h+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
      '<span style="font-size:16px;margin-top:1px">📉</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:var(--rouge)">Conformité faible · '+escape_html(siteMap[sid]||'Site')+'</div>'+
        '<div class="alerte-card-msg">'+pct+'% de conformité rondes sur 7 jours (seuil : 70%). Revoir la planification des rondes.</div>'+
      '</div></div>';
  });
  return h+'</div>';
}

init();
</script>

</html>
