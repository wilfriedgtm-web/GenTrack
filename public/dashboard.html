<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenTrack Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --creme:#F5F0E8;--dark:#111110;--amber:#C49A1C;
  --amber-pale:rgba(196,154,28,0.12);--amber-border:rgba(196,154,28,0.3);
  --amber-light:#F5E6B0;--amber-dark:#9A780E;
  --surface:#FDFAF5;--border:#DDD0BC;
  --text:#1A1A18;--text2:#6B5E4A;--text3:#A8957E;
  --vert:#2D6A4F;--vert-pale:rgba(45,106,79,0.1);--vert-border:rgba(45,106,79,0.25);--vert-light:#D8F0E6;
  --rouge:#C0392B;--rouge-pale:rgba(192,57,43,0.08);--rouge-border:rgba(192,57,43,0.22);--rouge-light:#FAE0DE;
  --orange:#E07B2A;--orange-pale:rgba(224,123,42,0.08);--orange-border:rgba(224,123,42,0.25);--orange-light:#FDE8D0;
  --bleu:#2B5BA8;--bleu-pale:rgba(43,91,168,0.08);--bleu-light:#D6E4FA;
  --nav-h:64px;--sidebar-w:220px;
}
body{font-family:'Inter',sans-serif;background:var(--creme);color:var(--text);min-height:100vh}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.full-loader{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:13px;color:var(--text2)}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--creme)}
.login-shell{width:100%;max-width:420px;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.18);background:var(--creme)}
.login-header{background:var(--dark);padding:32px;text-align:center}
.login-brand{font-size:26px;font-weight:800;letter-spacing:.08em;color:white}
.login-brand span{color:var(--amber)}
.login-brand-sub{font-size:11px;color:rgba(255,255,255,0.4);margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.login-body{padding:32px}
.login-step-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.login-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}
.login-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:24px}
.login-input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:'Inter',sans-serif;background:white;color:var(--text);outline:none;transition:border-color 0.15s;margin-bottom:14px;display:block}
.login-input:focus{border-color:var(--amber)}
.login-input::placeholder{color:var(--text3)}
.login-btn{width:100%;padding:13px;background:var(--amber);color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;letter-spacing:0.03em;cursor:pointer;transition:background 0.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.login-btn:hover{background:var(--amber-dark)}
.login-btn:disabled{opacity:0.5;cursor:default}
.login-btn.secondary{background:var(--dark);font-weight:600;font-size:13px;letter-spacing:0.5px}
.login-btn.secondary:hover{opacity:0.85;background:var(--dark)}
.login-back{background:none;border:none;font-size:12px;color:var(--text2);cursor:pointer;margin-top:14px;display:block;text-align:center;text-decoration:underline;width:100%}
.login-back:hover{color:var(--text)}
.login-error{font-size:12px;color:var(--rouge);background:var(--rouge-pale);border:1px solid var(--rouge-border);border-radius:6px;padding:10px 12px;margin-bottom:14px;display:none}
.login-success{font-size:13px;color:var(--vert);background:var(--vert-pale);border:1px solid var(--vert-border);border-radius:6px;padding:14px 16px;margin-bottom:14px;line-height:1.6}
.login-footer{font-size:10px;color:var(--text3);text-align:center;margin-top:24px;letter-spacing:0.5px}
.login-icon-big{font-size:40px;text-align:center;margin-bottom:16px}
/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--dark);min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;padding:0 0 24px;z-index:100}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.07)}
.sidebar-logo-name{font-size:18px;font-weight:700;letter-spacing:.06em;color:white}
.sidebar-logo-name span{color:var(--amber)}
.sidebar-logo-sub{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.28);margin-top:3px}
.sidebar-nav{padding:16px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;color:#AAA;font-size:13.5px;cursor:pointer;transition:all 0.15s;border-left:3px solid transparent;border-top:none;border-right:none;border-bottom:none;background:none;width:100%;text-align:left}
.nav-item:hover{color:white;background:#1a1a18}
.nav-item.active{color:var(--amber);border-left-color:var(--amber);background:#1a1a18}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{background:var(--rouge);color:white;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;margin-left:auto}
.sidebar-user{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.07)}
.persona-chip{background:#1e1e1c;border-radius:8px;padding:8px 12px}
.persona-name{font-size:12px;font-weight:600;color:white}
.persona-role{font-size:10px;color:var(--amber);margin-top:2px}
.logout-btn{background:none;border:none;color:rgba(255,255,255,0.25);font-size:11px;cursor:pointer;padding:0;margin-top:10px;text-decoration:underline;display:block}
.logout-btn:hover{color:rgba(255,255,255,0.55)}
/* MAIN */
.dash-main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;padding-bottom:40px}
.dash-topbar{background:white;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.dash-topbar-left{display:flex;flex-direction:column;gap:2px}
.dash-topbar-title{font-size:16px;font-weight:700;color:var(--dark)}
.dash-topbar-date{font-size:12px;color:var(--text2)}
.alert-pill{background:var(--rouge-light);color:var(--rouge);font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px}
.dash-content{padding:20px 24px;max-width:1000px}
/* MOBILE */
.mobile-header{display:none;background:var(--dark);padding:14px 18px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.mobile-header-logo{font-size:18px;font-weight:700;letter-spacing:.06em;color:white}
.mobile-header-logo span{color:var(--amber)}
.mobile-header-role{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-top:2px}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--dark);z-index:100;border-top:1px solid rgba(255,255,255,0.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.mobile-nav-inner{display:flex;height:var(--nav-h)}
.mobile-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(255,255,255,0.35);font-size:10px;font-weight:500;cursor:pointer;border:none;background:none;transition:color 0.15s;border-top:2px solid transparent;position:relative;padding:0 4px;-webkit-tap-highlight-color:transparent}
.mobile-nav-item.active{color:var(--amber);border-top-color:var(--amber)}
.mobile-nav-icon{font-size:20px;line-height:1}
.mobile-nav-label{font-size:10px;font-weight:500;white-space:nowrap}
.mobile-nav-badge{position:absolute;top:8px;left:calc(50% + 4px);width:8px;height:8px;border-radius:50%;background:var(--rouge);border:2px solid var(--dark)}
/* Plus panel */
.plus-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:150}
.plus-overlay.open{display:block}
.plus-panel{position:fixed;bottom:0;left:0;right:0;background:#1a1a18;border-radius:20px 20px 0 0;padding:10px 0 0;z-index:151;transform:translateY(100%);transition:transform 0.24s cubic-bezier(0.4,0,0.2,1);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.plus-panel.open{transform:translateY(0)}
.plus-panel-handle{width:40px;height:4px;background:rgba(255,255,255,0.12);border-radius:2px;margin:0 auto 10px}
.plus-panel-item{display:flex;align-items:center;gap:16px;padding:14px 28px;color:rgba(255,255,255,0.82);font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background 0.12s;-webkit-tap-highlight-color:transparent}
.plus-panel-item:active{background:rgba(255,255,255,0.07)}
.plus-panel-item.active-item{color:var(--amber)}
.plus-panel-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.plus-panel-sep{height:1px;background:rgba(255,255,255,0.07);margin:4px 28px}
.plus-panel-badge{margin-left:auto;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--rouge);color:white;font-weight:700}
@media(max-width:768px){
  .sidebar{display:none}.dash-main{margin-left:0;padding-bottom:calc(var(--nav-h) + 16px)}
  .mobile-nav{display:flex}.mobile-header{display:flex}.dash-topbar{display:none}.dash-content{padding:16px}
  .plus-overlay,.plus-panel{display:none}
  .plus-overlay.open{display:block}
  .plus-panel{display:block}
}
@media(min-width:769px){
  .plus-overlay,.plus-panel{display:none!important}
}
/* UI */
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:24px 0 10px}
.alert-banner{background:var(--rouge-pale);border:1.5px solid var(--rouge-border);border-left:3px solid var(--rouge);border-radius:10px;padding:12px 16px;display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.alert-banner.ok{background:var(--vert-pale);border-color:var(--vert-border);border-left-color:var(--vert)}
.alert-banner.warn{background:var(--orange-pale);border-color:var(--orange-border);border-left-color:var(--orange)}
.ab-icon{font-size:16px;flex-shrink:0;margin-top:1px}.ab-body{flex:1}
.ab-title{font-size:13px;font-weight:600;color:var(--rouge)}.alert-banner.ok .ab-title{color:var(--vert)}.alert-banner.warn .ab-title{color:var(--orange)}
.ab-sub{font-size:12px;color:var(--text2);margin-top:2px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px}
.kpi{background:white;border:1.5px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:700;margin-bottom:8px}
.kpi-value{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1}
.kpi-trend{font-size:11px;color:var(--text2);margin-top:6px}
.placeholder-card{background:white;border:1.5px solid var(--border);border-radius:12px;padding:40px 32px;margin-bottom:14px;text-align:center;color:var(--text3);font-size:13px;line-height:1.5}
.placeholder-icon{font-size:48px;margin-bottom:12px;opacity:.3}
.eq-card{background:white;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.eq-card-nom{font-size:13px;font-weight:600;color:var(--text)}
.eq-card-type{font-size:11px;color:var(--text3);margin-top:1px}
.ronde-card{background:white;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px}
.alerte-card{border-radius:10px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.alerte-card-titre{font-size:12px;font-weight:600}
.alerte-card-msg{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.4}
.btn-traite{flex-shrink:0;background:var(--dark);color:white;border:none;border-radius:6px;padding:5px 10px;font-size:10px;font-weight:600;cursor:pointer;letter-spacing:0.3px;white-space:nowrap;transition:opacity 0.15s}
.btn-traite:hover{opacity:0.75}
.progress-bar-wrap{height:4px;background:var(--border);border-radius:2px;margin-top:10px}
.progress-bar{height:100%;border-radius:2px;transition:width 0.4s}
/* CONFIG */
.config-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:white;padding:0 24px;overflow-x:auto}
.config-tab{padding:12px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:'Inter',sans-serif}
.config-tab.active{color:var(--amber-dark);border-bottom-color:var(--amber);font-weight:600}
.config-layout{display:flex;min-height:500px}
.config-equip-list{width:260px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:white}
.config-eq-section{padding:10px 16px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.config-eq-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .12s}
.config-eq-item:hover{background:var(--creme)}
.config-eq-item.selected{background:var(--amber-light);border-left-color:var(--amber)}
.config-eq-item.cfg-eq-inactive{opacity:.6}
.config-eq-edit-btn{opacity:0;background:none;border:none;cursor:pointer;padding:2px 4px;font-size:13px;border-radius:4px;transition:opacity .15s;flex-shrink:0}
.config-eq-item:hover .config-eq-edit-btn{opacity:1}
.config-eq-icon{font-size:18px;width:28px;text-align:center}
.config-eq-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.3}
.config-eq-type{font-size:11px;color:var(--text3)}
.config-eq-dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex-shrink:0}
.config-eq-dot.ok{background:var(--vert)}
.config-eq-dot.warn{background:var(--orange)}
.config-ronde-panel{flex:1;overflow-y:auto;padding:20px 24px}
.config-ronde-panel-title{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:2px}
.config-ronde-panel-sub{font-size:12px;color:var(--text2);margin-bottom:20px}
.config-ronde-card{border-radius:12px;border:1.5px solid;overflow:hidden;margin-bottom:16px}
.config-ronde-card.green{border-color:#A8D5C2}
.config-ronde-card.amber{border-color:#E8D090}
.config-ronde-card.blue{border-color:#A8C4F0}
.config-ronde-card.disabled{opacity:.55}
.config-ronde-header{display:flex;align-items:center;gap:10px;padding:12px 16px}
.config-ronde-card.green .config-ronde-header{background:var(--vert-light)}
.config-ronde-card.amber .config-ronde-header{background:var(--amber-light)}
.config-ronde-card.blue .config-ronde-header{background:var(--bleu-light)}
.config-ronde-badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;color:white;flex-shrink:0}
.config-ronde-card.green .config-ronde-badge{background:var(--vert)}
.config-ronde-card.amber .config-ronde-badge{background:var(--amber)}
.config-ronde-card.blue .config-ronde-badge{background:var(--bleu)}
.config-ronde-title{font-size:13px;font-weight:600;color:var(--dark)}
.config-ronde-freq{font-size:11px;color:var(--text2)}
.config-ronde-body{padding:12px 16px;background:white}
.config-q-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.config-q-move{background:none;border:none;cursor:pointer;font-size:8px;color:var(--text3);padding:0 2px;line-height:1;opacity:.5;transition:opacity .1s}
.config-q-move:hover:not([disabled]){opacity:1;color:var(--dark)}
.config-q-move[disabled]{opacity:.2;cursor:default}
.config-q-item:last-child{border-bottom:none}
.config-q-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.config-ronde-card.green .config-q-dot{background:var(--vert)}
.config-ronde-card.amber .config-q-dot{background:var(--amber)}
.config-ronde-card.blue .config-q-dot{background:var(--bleu)}
.config-q-label{font-size:12px;color:var(--text);flex:1}
.config-q-type{font-size:10px;color:var(--text2);background:var(--creme);padding:2px 6px;border-radius:4px}
.config-q-seuil{font-size:10px;font-weight:600}
.config-ronde-card.green .config-q-seuil{color:var(--vert)}
.config-ronde-card.amber .config-q-seuil{color:var(--amber-dark)}
.config-ronde-card.blue .config-q-seuil{color:var(--bleu)}
.config-ronde-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.config-ronde-trigger{font-size:11px;color:var(--text2)}
.config-preview-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.config-preview-btn:hover{border-color:var(--amber);color:var(--amber)}
.config-add-eq-btn{width:calc(100% - 24px);margin:8px 12px;background:none;border:1.5px dashed var(--border);border-radius:8px;padding:10px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s}
.config-add-eq-btn:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-pale)}
.config-add-q-btn{background:none;border:1px dashed var(--border);border-radius:6px;padding:5px 10px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s;margin-top:6px;width:100%;text-align:center}
.config-add-q-btn:hover{border-color:var(--amber);color:var(--amber)}
.config-q-actions{display:flex;gap:4px;flex-shrink:0}
.config-q-act{background:none;border:none;cursor:pointer;padding:2px 4px;font-size:12px;opacity:.4;transition:opacity .15s;line-height:1}
.config-q-act:hover{opacity:1}
.config-apply-btn{width:100%;margin-top:8px;background:var(--amber-pale);border:1px solid var(--amber-border);border-radius:8px;padding:10px;font-size:12px;font-weight:600;color:var(--amber-dark);cursor:pointer;transition:all .15s;text-align:center}
.config-apply-btn:hover{background:var(--amber);color:white}
/* CONFIG MODAL */
.cfg-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8000;display:flex;align-items:center;justify-content:center;animation:fadeIn .12s}
.cfg-modal-box{background:white;border-radius:16px;padding:28px;width:440px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.cfg-modal-title{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:20px;display:flex;align-items:center;gap:8px}
.cfg-modal-footer{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.cfg-form-group{margin-bottom:14px}
.cfg-form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);display:block;margin-bottom:6px}
.cfg-form-input,.cfg-form-select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;transition:border-color .15s;background:white;font-family:inherit}
.cfg-form-input:focus,.cfg-form-select:focus{border-color:var(--amber)}
.cfg-btn-primary{background:var(--amber);color:white;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s}
.cfg-btn-primary:hover{opacity:.88}
.cfg-btn-secondary{background:none;border:1.5px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text2);cursor:pointer}
.cfg-btn-danger{background:none;border:1.5px solid var(--rouge-border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--rouge);cursor:pointer}
.cfg-freq-check{display:flex;gap:14px;flex-wrap:wrap}
.cfg-freq-label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text)}
.cfg-info{background:var(--amber-pale);border:1px solid var(--amber-border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--amber-dark);margin-top:6px}
/* DETAIL SLIDE PANEL */
.dp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8500;display:none}
.dp-overlay.open{display:block;animation:fadeIn .15s}
.dp-panel{position:fixed;right:0;top:0;bottom:0;width:440px;max-width:100vw;background:#fff;
  box-shadow:-4px 0 32px rgba(0,0,0,.15);z-index:8501;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.dp-panel.open{transform:translateX(0)}
.dp-header{padding:18px 20px 14px;border-bottom:1.5px solid var(--border);display:flex;align-items:flex-start;gap:12px;flex-shrink:0;background:var(--dark)}

/* ── SUPABASE REST ── */
async function supaGet(table,qs){
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?'+qs,{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Accept':'application/json'}
    });
    if(!r.ok){
      var errBody=await r.text().catch(function(){return'';});
      console.error('[supaGet] '+table+' → HTTP '+r.status+': '+errBody);
      return[];
    }
    return await r.json();
  }catch(e){
    console.error('[supaGet] '+table+' exception: '+e);
    return[];
  }
}
async function supaPatch(table,id,data){
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id,{
      method:'PATCH',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(data)
    });
    if(!r.ok){var t=await r.text().catch(function(){return'';});console.error('[supaPatch]',table,r.status,t);}
    return r.ok;
  }catch(e){console.error('[supaPatch]',e);return false;}
}
async function supaUpdate(table,filter,data){
  try{
    await fetch(SUPA_URL+'/rest/v1/'+table+'?'+filter,{
      method:'PATCH',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(data)
    });
  }catch(e){console.error('[supaUpdate]',e);}
}
async function supaPost(table,data){
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/'+table,{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
      body:JSON.stringify(data)
    });
    var rows=await r.json();
    return Array.isArray(rows)?rows[0]:rows;
  }catch(e){return null;}
}
async function supaDelete(table,filter){
  try{
    await fetch(SUPA_URL+'/rest/v1/'+table+'?'+filter,{
      method:'DELETE',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=minimal'}
    });
  }catch(e){}
}

/* ── INIT : token URL (?token=xxx) ou localStorage ── */
async function init(){
  var urlParams=new URLSearchParams(window.location.search);
  var urlToken=urlParams.get('token');
  if(urlToken){
    history.replaceState(null,'',window.location.pathname);
    var ok=await _validateToken(urlToken);
    if(ok){renderDashboard(_session);return;}
  }
  var stored=loadStored();
  if(stored&&stored.token){
    var ok2=await _validateToken(stored.token);
    if(ok2){renderDashboard(_session);return;}
    clearSession();
  }
  renderInvalidLink();
}

async function _validateToken(token){
  var now=new Date().toISOString();
  var rows=await supaGet('tokens',
    'token=eq.'+encodeURIComponent(token)+
    '&actif=eq.true'+
    '&select=id,token,role,site_ids,site_id,client_id,nom,expire_at'+
    '&limit=1'
  );
  if(!rows||!rows.length)return false;
  var s=rows[0];
  // Vérifier expiration si définie
  if(s.expire_at&&s.expire_at<now)return false;
  // Parser site_ids (stocké en JSON string ou array)
  var siteIds=[];
  try{
    if(Array.isArray(s.site_ids))siteIds=s.site_ids;
    else if(s.site_ids)siteIds=JSON.parse(s.site_ids);
  }catch(e){}
  if(!siteIds.length&&s.site_id)siteIds=[s.site_id];
  _session={
    token:token,
    role:s.role,
    site_ids:siteIds,
    client_id:s.client_id,
    contact:{id:null,nom:s.nom||''},
    email:''
  };
  saveSession(_session);
  return true;
}

  if(s.role==='resp_tech')renderRespTech(s,'accueil');

}

  if(!_session)return;
  if(id!=='config'){_configCurrentTab='equipements';_configSelectedEqId=null;}
  if(_session.role==='resp_tech')renderRespTech(_session,id);
  else if(_session.role==='dir_tech'){
    if(_dtCurrentSite)renderDirTechSite(_session,_dtCurrentSite.id,_dtCurrentSite.nom,id);
    else renderDirTech(_session,id);
  }
  else if(_session.role==='dir_ops'){
    if(_doCurrentSite)renderDirOpsSite(_session,_doCurrentSite.id,_doCurrentSite.nom,id);

  var sid=session.site_ids&&session.site_ids[0];

  if(!el)return;

    var html='';

    else if(nav==='alertes')html=await _rtAlertes(sid,cid);
    else if(nav==='historique')html=await _rtHistorique(sid);
    else if(nav==='releves')html=await _rtReleves(session,sid);
    else if(nav==='signalements')html=await _rtSignalements(sid);
    else if(nav==='maintenances')html=await _rtMaintenances(sid);
    else if(nav==='config')html=await _rtConfig(sid);
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

/* ── Accueil ── */
async function _rtAccueil(session,sid,cid){
  var today=todayStr();
  var CUVE_TYPE='de5519d0-363b-4628-b872-2dcf01859002';
  var GE_TYPE='98849793-9201-4adf-aec2-a4a08587c4e2';
  var[rondes,equips,alertes,pannes,recoData]=await Promise.all([
    supaGet('rondes','site_id=eq.'+sid+'&date_ronde=eq.'+today+'&select=id,frequence,date_ronde'),
    supaGet('equipements','site_id=eq.'+sid+'&actif=eq.true&select=id,nom,ordre_ronde,type_id,conso_theorique_lh,capacite_litres,seuil_vidange_heures,heures_dernier_vidange,date_dernier_vidange,types_equipements(nom)&order=ordre_ronde.asc'),
    supaGet('alertes','groupe_id=eq.'+sid+'&resolue=eq.false&select=id,type,severite,type_alerte,message,created_at&order=created_at.desc&limit=20'),
    supaGet('signalements','groupe_id=eq.'+sid+'&type=eq.panne&statut=neq.resolu&select=id,type,description,created_at,equipement_id,equipements(nom)&order=created_at.desc&limit=20'),
    _fetchRecoEquipements(sid)
  ]);
  var rIds=rondes.map(function(r){return r.id;});
  var rondesEq=rIds.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=id,ronde_id,equipement_id,statut,valide_at'):[];

  // Cuve + GE data
  var cuveEquips=equips.filter(function(e){return e.type_id===CUVE_TYPE;});
  var geEquips=equips.filter(function(e){return e.type_id===GE_TYPE;});
  var cuveSection='',vidangesSection='';
  var specialIds=cuveEquips.concat(geEquips).map(function(e){return e.id;});
  if(specialIds.length){
    var geIds=geEquips.map(function(e){return e.id;});
    var cuveIds=cuveEquips.map(function(e){return e.id;});
    var[specialQs,vidangesHist,pleinsHist]=await Promise.all([
      supaGet('questions','equipement_id=in.('+specialIds.join(',')+')'+'&actif=eq.true&select=id,texte,unite,seuil_min,seuil_max,equipement_id&order=ordre.asc'),
      geIds.length?supaGet('vidanges','equipement_id=in.('+geIds.join(',')+')'+'&select=id,equipement_id,date,heures_au_moment,cout,notes&order=date.desc&limit=50'):Promise.resolve([]),
      cuveIds.length?supaGet('pleins','equipement_id=in.('+cuveIds.join(',')+')'+'&select=id,equipement_id,date,litres_ajoutes,niveau_apres,cout,operateur&order=date.desc&limit=50'):Promise.resolve([])
    ]);
    var qIds=specialQs.map(function(q){return q.id;});
    var latestReps=qIds.length?await supaGet('reponses','question_id=in.('+qIds.join(',')+')'+'&select=question_id,valeur,created_at&order=created_at.desc&limit=300'):[];
    var repByQ={};
    latestReps.forEach(function(r){if(!repByQ[r.question_id]||r.created_at>repByQ[r.question_id].created_at)repByQ[r.question_id]=r;});
    specialQs.forEach(function(q){q._lastVal=repByQ[q.id]?repByQ[q.id].valeur:null;q._lastAt=repByQ[q.id]?repByQ[q.id].created_at:null;});
    cuveSection=_buildCuveSection(cuveEquips,specialQs.filter(function(q){return cuveEquips.some(function(e){return e.id===q.equipement_id;})}),pleinsHist);
    vidangesSection=_buildVidangesSection(geEquips,specialQs.filter(function(q){return geEquips.some(function(e){return e.id===q.equipement_id;})}),vidangesHist);
  }

  // Ronde journalière
  var rondeJ=rondes.find(function(r){return r.frequence==='journalier';});
  var eqRJ=rondeJ?rondesEq.filter(function(re){return re.ronde_id===rondeJ.id;}):[];
  var nbVal=eqRJ.filter(function(re){return re.statut==='valide';}).length;
  var nbTot=eqRJ.length;
  var rondeOk=nbTot>0&&nbVal===nbTot;
  var nbAlertes=alertes.length+pannes.length;

  // Banner
  var banner='';
  if(nbAlertes>0){
    banner='<div class="alert-banner"><div class="ab-icon">🚨</div><div class="ab-body"><div class="ab-title">'+nbAlertes+' alerte'+(nbAlertes>1?'s':'')+' active'+(nbAlertes>1?'s':'')+'</div><div class="ab-sub">Voir le détail ci-dessous</div></div></div>';
  }else if(rondeOk){
    banner='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Tout est OK</div><div class="ab-sub">Ronde journalière validée · '+equips.length+' équipements</div></div></div>';
  }else if(nbTot>0){
    banner='<div class="alert-banner warn"><div class="ab-icon">⏳</div><div class="ab-body"><div class="ab-title">Ronde en cours</div><div class="ab-sub">'+nbVal+'/'+nbTot+' équipements validés</div></div></div>';
  }else{
    banner='<div class="alert-banner warn"><div class="ab-icon">📋</div><div class="ab-body"><div class="ab-title">Ronde journalière à démarrer</div><div class="ab-sub">Aucun relevé aujourd\'hui pour ce site</div></div></div>';
  }

  // KPIs
  var rondeDisp=nbTot>0?(nbVal+'/'+nbTot):'—';
  var kpis='<div class="kpi-grid">'+
    '<div class="kpi"><div class="kpi-label">Équipements</div><div class="kpi-value">'+equips.length+'</div><div class="kpi-trend">Ce site</div></div>'+
    '<div class="kpi"><div class="kpi-label">Ronde du jour</div><div class="kpi-value" style="color:'+(rondeOk?'var(--vert)':nbTot===0?'var(--text2)':'var(--orange)')+'">'+rondeDisp+'</div><div class="kpi-trend">'+(rondeOk?'Validée':nbTot===0?'Non commencée':'En cours')+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Alertes actives</div><div class="kpi-value" style="color:'+(nbAlertes>0?'var(--rouge)':'var(--vert)')+'">'+nbAlertes+'</div><div class="kpi-trend">'+(nbAlertes>0?'À traiter':'RAS')+'</div></div>'+
  '</div>';

  // Ma journée
  var journee='<div class="section-title">Ma journée</div>';
  if(rondes.length===0){
    journee+='<div class="placeholder-card"><div class="placeholder-icon">📋</div>Aucune ronde programmée aujourd\'hui</div>';
  }else{
    journee+='<div style="display:flex;flex-direction:column;gap:8px">';
    rondes.forEach(function(ro){
      var eqRo=rondesEq.filter(function(re){return re.ronde_id===ro.id;});
      var val=eqRo.filter(function(re){return re.statut==='valide';}).length;
      var tot=eqRo.length;
      var pct=tot>0?Math.round(val/tot*100):0;
      var ok=val===tot&&tot>0;
      journee+='<div class="ronde-card">'+
        '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
          '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':'🔄')+'</span>'+
          '<div style="flex:1">'+
            '<div style="font-size:13px;font-weight:600">'+(_FREQ_LABELS[ro.frequence]||ro.frequence)+'</div>'+
            '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+' / '+tot+' équipements · '+pct+'%':'Pas encore commencée')+'</div>'+
          '</div>'+
          '<span style="font-size:11px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--amber)')+'">'+
            (ok?'Validée':tot===0?'En attente':'En cours')+
          '</span>'+
        '</div>'+
        (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':'var(--amber)')+'"></div></div>':'')+
      '</div>';
    });
    journee+='</div>';
  }

  // Statut équipements
  var statut='<div class="section-title">Statut équipements</div>';
  if(equips.length===0){
    statut+='<div class="placeholder-card"><div class="placeholder-icon">⚙️</div>Aucun équipement trouvé pour ce site</div>';
  }else{
    statut+='<div style="display:flex;flex-direction:column;gap:6px">';
    equips.forEach(function(e){
      var re=rondeJ&&rondesEq.find(function(r){return r.ronde_id===rondeJ.id&&r.equipement_id===e.id;});
      var s,sc,dot;
      if(!rondeJ){s='Pas de ronde';sc='var(--text3)';dot='⚪';}
      else if(!re){s='—';sc='var(--text3)';dot='⚫';}
      else if(re.statut==='valide'){s='OK';sc='var(--vert)';dot='🟢';}
      else if(re.statut==='en_cours'){s='En cours';sc='var(--orange)';dot='🟡';}
      else{s='En attente';sc='var(--orange)';dot='🟡';}
      var tNom=(e.types_equipements&&e.types_equipements.nom)||'';
      var tIcon=_TYPE_ICONS[tNom]||'⚙️';
      // Recommandations et dernière saisie
      var eqReco=recoData&&recoData[e.id]?recoData[e.id]:{recos:[],lastSaisie:null};
      var topReco=eqReco.recos[0]||null;
      var ls=eqReco.lastSaisie;
      var today=new Date().toISOString().split('T')[0];
      var lsOld=ls?new Date(ls.t).toISOString().split('T')[0]<today:false;
      // Si pas de reco mais pas de saisie aujourd'hui → statut orange
      if(lsOld&&!topReco&&s==='OK'){sc='var(--orange)';dot='🟡';s='Inactif';}
      statut+='<div class="eq-card" style="flex-direction:column;align-items:stretch;gap:6px">'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<span style="font-size:18px">'+tIcon+'</span>'+
          '<div style="flex:1">'+
            '<div class="eq-card-nom">'+escape_html(e.nom)+'</div>'+
            (tNom?'<div class="eq-card-type">'+escape_html(tNom)+'</div>':'')+
          '</div>'+
          '<div style="display:flex;align-items:center;gap:5px;flex-shrink:0">'+
            '<span style="font-size:11px">'+dot+'</span>'+
            '<span style="font-size:10px;font-weight:600;color:'+sc+';text-transform:uppercase;letter-spacing:0.3px">'+s+'</span>'+
          '</div>'+
        '</div>'+
        (ls?'<div style="font-size:11px;color:'+(lsOld?'var(--orange)':'var(--text3)')+';padding-left:28px">'+
          (lsOld?'⚠ ':'')+
          'Dernière valeur : '+ls.v+(ls.unite?' '+ls.unite:'')+' · '+_timeAgo(ls.t)+
        '</div>':'')+
        (topReco?_buildRecoTag(topReco,e.id,e.nom,sid):'')+
      '</div>';
    });
    statut+='</div>';
  }

  // Alertes actives
  var alertesHtml='<div class="section-title">Alertes actives</div>';
  if(nbAlertes===0){
    alertesHtml+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune alerte</div><div class="ab-sub">Tous les systèmes sont opérationnels</div></div></div>';
  }else{
    alertesHtml+='<div style="display:flex;flex-direction:column;gap:8px">';
    alertes.forEach(function(a){
      var isDanger=a.severite==='danger'||a.severite==='critical';
      var bl=isDanger?'var(--rouge)':'var(--orange)';
      var bg=isDanger?'var(--rouge-pale)':'var(--orange-pale)';
      var bd=isDanger?'var(--rouge-border)':'var(--orange-border)';
      alertesHtml+='<div class="alerte-card" style="background:'+bg+';border:1px solid '+bd+';border-left:3px solid '+bl+'">'+
        '<span style="font-size:15px">'+( isDanger?'🔴':'🟡')+'</span>'+
        '<div style="flex:1"><div class="alerte-card-titre" style="color:'+bl+'">'+escape_html(_alerteTypeLabel(a.type_alerte||a.type))+'</div>'+
        '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div></div>'+
        '<button class="btn-traite" onclick="_resolveAlerte(\''+a.id+'\')">✓ Traité</button>'+
      '</div>';
    });
    pannes.forEach(function(sg){
      var eqNom=sg.equipements&&sg.equipements.nom?' · '+sg.equipements.nom:'';
      alertesHtml+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
        '<span style="font-size:15px">🔴</span>'+
        '<div style="flex:1"><div class="alerte-card-titre" style="color:var(--rouge)">Panne'+escape_html(eqNom)+'</div>'+
        '<div class="alerte-card-msg">'+escape_html(sg.description||'')+'</div></div>'+
        '<button class="btn-traite" onclick="navTo(\'alertes\')">Voir →</button>'+
      '</div>';
    });
    alertesHtml+='</div>';
  }

  _updateAlertPill(nbAlertes);
  return banner+kpis+cuveSection+vidangesSection+journee+statut+alertesHtml;
}

/* ── Cuve carburant section ── */
function _buildCuveSection(cuveEquips,cuveQs,pleinsHist){
  pleinsHist=pleinsHist||[];
  if(!cuveEquips.length)return '';
  var html='<div class="section-title">⛽ Carburant</div>';
  cuveEquips.forEach(function(e){
    var niveauQ=cuveQs.find(function(q){
      return q.equipement_id===e.id&&(q.texte.toLowerCase().indexOf('niveau')>=0||q.texte.toLowerCase().indexOf('cuve')>=0);
    });
    var niveau=niveauQ&&niveauQ._lastVal!=null?parseFloat(niveauQ._lastVal):null;
    var cap=parseFloat(e.capacite_litres)||8000;
    // Si le dernier plein est plus récent que la dernière ronde, utiliser niveau_apres
    var pleinsEquip=pleinsHist.filter(function(p){return p.equipement_id===e.id;});
    var latestPlein=pleinsEquip[0]||null;
    var sourceLabel=null;
    if(latestPlein&&latestPlein.niveau_apres!=null){
      var pleinDate=latestPlein.date||'';
      var rondeDate=niveauQ&&niveauQ._lastAt?niveauQ._lastAt.slice(0,10):'0';
      if(pleinDate>=rondeDate){
        niveau=parseFloat(latestPlein.niveau_apres);
        sourceLabel='Après plein du '+new Date(latestPlein.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      }
    }
    var pct=niveau!=null?Math.min(100,Math.round(niveau/cap*100)):null;
    var consoH=parseFloat(e.conso_theorique_lh)||65;
    var autoJours=niveau!=null?Math.round(niveau/(consoH*8)*10)/10:null;
    var seuilMin=niveauQ&&niveauQ.seuil_min!=null?parseFloat(niveauQ.seuil_min):null;
    var col=pct!=null?(pct<=20?'var(--rouge)':pct<=40?'var(--orange)':'var(--vert)'):'var(--text3)';
    var lastAt=sourceLabel||(niveauQ&&niveauQ._lastAt?'Relevé '+_timeAgo(niveauQ._lastAt):'Aucun relevé');
    var autoBg=autoJours!=null?(autoJours<2?'var(--rouge-pale)':autoJours<5?'var(--orange-pale)':'var(--vert-pale)'):'transparent';
    var autoCol=autoJours!=null?(autoJours<2?'var(--rouge)':autoJours<5?'var(--orange)':'var(--vert)'):'var(--text3)';
    var operateur=_session&&_session.contact&&_session.contact.nom?_session.contact.nom:'';

    html+='<div class="eq-card" style="flex-direction:column;align-items:stretch;gap:0;padding:16px 18px;border-top:3px solid var(--amber)">'+
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">'+
        '<div>'+
          '<div class="eq-card-nom" style="font-size:14px">'+escape_html(e.nom)+'</div>'+
          '<div class="eq-card-type" style="margin-top:3px">'+lastAt+'</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<div style="font-size:32px;font-weight:800;color:'+col+';line-height:1">'+(pct!=null?pct+'%':'—')+'</div>'+
          '<div style="font-size:12px;color:var(--text2);margin-top:2px">'+(niveau!=null?Math.round(niveau).toLocaleString('fr-FR')+' L / '+Math.round(cap).toLocaleString('fr-FR')+' L':'')+'</div>'+
        '</div>'+
      '</div>'+
      '<div style="height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin-bottom:10px">'+
        (pct!=null?'<div style="height:100%;width:'+Math.max(2,pct)+'%;background:'+col+';border-radius:5px;transition:width .5s ease"></div>':'')+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
        (seuilMin!=null?'<div style="font-size:11px;color:var(--text3)">Seuil alerte : <strong>'+Math.round(seuilMin).toLocaleString('fr-FR')+' L</strong></div>':'<div></div>')+
        (autoJours!=null?'<div style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;background:'+autoBg+';color:'+autoCol+'">≈ '+autoJours+' j autonomie</div>':'<div style="font-size:11px;color:var(--text3)">Autonomie : —</div>')+
      '</div>'+
      '<button onclick="openDeclarePlein(\''+e.id+'\',\''+js_esc(e.nom)+'\','+cap+',\''+js_esc(operateur)+'\')" style="margin-top:10px;padding:7px 12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text1);font-size:12px;cursor:pointer;width:100%;text-align:center;font-weight:600">⛽ Déclarer ravitaillement</button>'+
      (function(){
        var hist=pleinsHist.filter(function(p){return p.equipement_id===e.id;}).slice(0,5);
        if(!hist.length)return '';
        var rows=hist.map(function(p){
          var d=new Date(p.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
          var litr=p.litres_ajoutes?'+'+Math.round(p.litres_ajoutes).toLocaleString('fr-FR')+'L → ':'';
          var apres=p.niveau_apres!=null?Math.round(p.niveau_apres).toLocaleString('fr-FR')+'L':'';
          var cout=p.cout?(' · '+(p.cout).toLocaleString('fr-FR')+' FCFA'):'';
          var oper=p.operateur?' · '+p.operateur:'';
          return '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);padding:4px 0;border-top:1px solid var(--border)">'+
            '<span>'+d+oper+'</span>'+
            '<span style="white-space:nowrap;margin-left:8px">⛽ '+litr+apres+cout+'</span>'+
          '</div>';
        }).join('');
        return '<div style="margin-top:10px">'+
          '<div style="font-size:10px;font-weight:600;color:var(--text3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em">Derniers ravitaillements</div>'+
          rows+'</div>';
      })()+
    '</div>';
  });
  return html;
}

/* ── Vidanges / maintenance préventive section ── */
function _buildVidangesSection(geEquips,geQs,vidangesHist){
  vidangesHist=vidangesHist||[];
  if(!geEquips.length)return '';
  var hasVidange=geEquips.some(function(e){return e.seuil_vidange_heures;});
  if(!hasVidange)return '';
  var html='<div class="section-title">🔧 Maintenance préventive</div>';
  html+='<div style="display:flex;flex-direction:column;gap:8px">';
  geEquips.forEach(function(e){
    if(!e.seuil_vidange_heures)return;
    var seuil=parseFloat(e.seuil_vidange_heures);
    // Find the latest compteur reading from the ronde questions
    var compteurQ=geQs.find(function(q){
      return q.equipement_id===e.id&&(q.texte.toLowerCase().indexOf('compteur')>=0||q.texte.toLowerCase().indexOf('horaire')>=0);
    });
    var currentH=compteurQ&&compteurQ._lastVal!=null?parseFloat(compteurQ._lastVal):null;
    // Baseline = counter value at last oil change (set during onboarding or after declaring vidange)
    var baseline=e.heures_dernier_vidange!=null?parseFloat(e.heures_dernier_vidange):null;
    var lastVidDate=e.date_dernier_vidange||null;
    var heuresDepuis=null;
    if(currentH!=null&&baseline!=null){
      heuresDepuis=Math.max(0,currentH-baseline);
    }
    var pct=heuresDepuis!=null?Math.min(100,Math.round(heuresDepuis/seuil*100)):null;
    var col=pct!=null?(pct>=100?'var(--rouge)':pct>=80?'var(--orange)':'var(--vert)'):'var(--text3)';
    var statusTxt=pct!=null?(pct>=100?'⚠️ Vidange due':pct>=80?'Bientôt':'OK ✓'):'—';
    var statusCol=pct!=null?(pct>=100?'var(--rouge)':pct>=80?'var(--orange)':'var(--vert)'):'var(--text3)';
    var lastVidStr=lastVidDate?new Date(lastVidDate).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'Aucune enregistrée';
    var restantH=heuresDepuis!=null?Math.max(0,Math.round(seuil-heuresDepuis)):null;

    html+='<div class="eq-card" style="flex-direction:column;align-items:stretch;gap:8px;padding:14px 16px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between">'+
        '<div>'+
          '<div class="eq-card-nom">⚡ '+escape_html(e.nom)+'</div>'+
          '<div class="eq-card-type" style="margin-top:2px">Dernière vidange : '+lastVidStr+'</div>'+
        '</div>'+
        '<span style="font-size:11px;font-weight:700;color:'+statusCol+'">'+statusTxt+'</span>'+
      '</div>'+
      (pct!=null?
        '<div>'+
          '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:4px">'+
            '<span>'+(heuresDepuis!=null?Math.round(heuresDepuis)+'h depuis vidange':'')+'</span>'+
            '<span>Seuil : '+seuil+'h'+(restantH!==null&&restantH>0?' · '+restantH+'h restantes':'')+'</span>'+
          '</div>'+
          '<div class="progress-bar-wrap" style="height:6px"><div class="progress-bar" style="width:'+Math.min(100,pct)+'%;background:'+col+'"></div></div>'+
        '</div>':
        '<div style="font-size:11px;color:var(--text3)">'+(baseline==null?'Compteur de référence non configuré':'Pas de lecture compteur')+'</div>'
      )+
      '<button onclick="openDeclareVidange(\''+e.id+'\',\''+escape_html(e.nom)+'\','+(currentH!=null?currentH:'null')+')" style="margin-top:4px;padding:6px 12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text1);font-size:12px;cursor:pointer;width:100%;text-align:center">🛢 Déclarer vidange effectuée</button>'+
      (function(){
        var hist=vidangesHist.filter(function(v){return v.equipement_id===e.id;}).slice(0,5);
        if(!hist.length)return '';
        var rows=hist.map(function(v){
          var d=new Date(v.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
          var cout=v.cout?(' · '+(v.cout).toLocaleString('fr-FR')+' FCFA'):'';
          var notes=v.notes?(' — '+v.notes):'';
          return '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);padding:4px 0;border-top:1px solid var(--border)">'+
            '<span>'+d+(notes?'<br><span style="font-style:italic">'+v.notes+'</span>':'')+'</span>'+
            '<span style="white-space:nowrap;margin-left:8px">'+Math.round(v.heures_au_moment)+'h'+cout+'</span>'+
          '</div>';
        }).join('');
        return '<div style="margin-top:8px"><div style="font-size:10px;font-weight:600;color:var(--text3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em">Historique</div>'+rows+'</div>';
      })()+
    '</div>';
  });
  html+='</div>';
  return html;
}

function _alerteTypeLabel(type){
  var map={
    'panne':'Panne équipement','plein_manque':'Niveau anormal','seuil_depasse':'Seuil dépassé',
    'signalement':'Signalement','anomalie':'Anomalie','derive':'Dérive température',
    'maintenance':'Maintenance requise'
  };
  return map[type]||type||'Alerte';
}

function _relativeTime(ts){
  var diff=Date.now()-new Date(ts).getTime();
  var m=Math.floor(diff/60000);
  if(m<60)return 'Il y a '+m+' min';
  var h=Math.floor(m/60);
  if(h<24)return 'Il y a '+h+'h';
  return 'Il y a '+Math.floor(h/24)+' j';
}

async function _resolveAlerte(id){
  await supaPatch('alertes',id,{resolue:true});
  navTo('alertes');
}
async function _resolveSg(id){
  await supaPatch('signalements',id,{statut:'resolu',resolved_at:new Date().toISOString()});
  navTo('alertes');
}

async function _marquerTraite(table,id,fromNav){
  var btn=event&&event.target;
  if(btn){btn.disabled=true;btn.textContent='...';}
  await supaPatch(table,id,{resolue:true});
  if(!_session)return;
  if(_doCurrentSite)renderDirOpsSite(_session,_doCurrentSite.id,_doCurrentSite.nom,fromNav||'alertes');
  else if(_dtCurrentSite)renderDirTechSite(_session,_dtCurrentSite.id,_dtCurrentSite.nom,fromNav||'alertes');
  else renderRespTech(_session,fromNav||'alertes');
}

/* ── Historique (30j avec sélecteur de période) ── */
async function _rtHistorique(sid){
  var period=_histPeriod||30;
  var since30=dateNJours(30);
  var cutoff=dateNJours(period);
  var[rondes,pannes]=await Promise.all([
    supaGet('rondes','site_id=eq.'+sid+'&date_ronde=gte.'+since30+'&select=id,date_ronde,frequence&order=date_ronde.desc&limit=90'),
    supaGet('signalements','groupe_id=eq.'+sid+'&type=eq.panne&created_at=gte.'+since30+'T00:00:00&select=id,description,statut,created_at,equipement_id,equipements(nom)&order=created_at.desc&limit=60')
  ]);
  var rondesFilt=rondes.filter(function(r){return r.date_ronde>=cutoff;});
  var pannesFilt=pannes.filter(function(p){return!p.created_at||p.created_at>=cutoff+'T00:00:00';});
  var h=_buildPeriodSelector(period);
  if(rondesFilt.length===0&&pannesFilt.length===0){
    return h+'<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucune donnée sur les '+period+' derniers jours</div>';
  }
  // Rondes
  if(rondesFilt.length>0){
    var rIds=rondesFilt.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,statut');
    var reByRonde={};
    rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});
    var byDate={};
    rondesFilt.forEach(function(ro){var d=ro.date_ronde;if(!byDate[d])byDate[d]=[];byDate[d].push(ro);});
    var dates=Object.keys(byDate).sort(function(a,b){return b>a?1:-1;});
    h+='<div class="section-title" style="margin-top:4px">Rondes</div><div style="display:flex;flex-direction:column;gap:10px">';
    dates.forEach(function(d){
      var dateDisp=new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      var isToday=d===todayStr();
      h+='<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:8px;margin-bottom:2px">'+(isToday?'Aujourd\'hui — ':'')+dateDisp+'</div>';
      byDate[d].forEach(function(ro){
        var eqRo=reByRonde[ro.id]||[];
        var val=eqRo.filter(function(re){return re.statut==='valide';}).length;
        var tot=eqRo.length;
        var pct=tot>0?Math.round(val/tot*100):0;
        var ok=val===tot&&tot>0;
        h+='<div class="ronde-card" style="cursor:pointer;transition:box-shadow .15s" '+
            'onclick="_openRondeDetail(\''+ro.id+'\',\''+ro.date_ronde+'\',\''+ro.frequence+'\')" '+
            'onmouseenter="this.style.boxShadow=\'0 2px 16px rgba(0,0,0,.1)\'" onmouseleave="this.style.boxShadow=\'\'">'+
          '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
            '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':pct>0?'🔄':'❌')+'</span>'+
            '<div style="flex:1">'+
              '<div style="font-size:13px;font-weight:600">'+(_FREQ_LABELS[ro.frequence]||ro.frequence)+'</div>'+
              '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+'/'+tot+' équipements validés':'Aucune donnée')+'</div>'+
            '</div>'+
            '<span style="font-family:\'Cormorant Garamond\',serif;font-size:22px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--orange)')+'">'+( tot>0?pct+'%':'—')+'</span>'+
          '</div>'+
          (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':pct>0?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
          '<div style="font-size:10px;color:var(--text3);margin-top:8px;text-align:right">Voir le détail →</div>'+
        '</div>';
      });
    });
    h+='</div>';
  }
  // Pannes
  h+='<div class="section-title">Pannes <span style="font-size:12px;font-weight:400;color:var(--text3)">— '+period+' jours</span></div>';
  if(pannesFilt.length===0){
    h+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur cette période</div></div></div>';
  }else{
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannesFilt.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var ts=p.created_at?new Date(p.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.statut==='resolu';
      h+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+'</div>'+
          '<div class="eq-card-type">'+escape_html(p.description||'')+(ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

async function _rtReleves(session,sid){
  var BASE_URL=location.origin+location.pathname.replace('dashboard.html','');

  // Fetch today's relevés + last 7 days
  var since=new Date();since.setDate(since.getDate()-7);since.setHours(0,0,0,0);
  var releves=await supaGet('releves_horaires',
    'site_id=eq.'+sid+'&created_at=gte.'+since.toISOString()+
    '&select=id,site_id,contact_id,token,statut,expires_at,validated_at,nb_valeurs,nb_alertes,created_at'+
    '&order=created_at.desc'
  );

  // Fetch contact names for display
  var cIds=[...new Set(releves.filter(function(r){return r.contact_id;}).map(function(r){return r.contact_id;}))];
  var contactMap={};
  if(cIds.length){
    var cts=await supaGet('contacts','id=in.('+cIds.join(',')+')'+'&select=id,nom');
    cts.forEach(function(c){contactMap[c.id]=c.nom;});
  }

  var today=new Date().toDateString();
  var todayReleves=releves.filter(function(r){return new Date(r.created_at).toDateString()===today;});
  var histReleves=releves.filter(function(r){return new Date(r.created_at).toDateString()!==today;});

  function statusBadge(r){
    if(r.statut==='validé') return '<span style="font-size:10px;font-weight:700;color:var(--vert);background:var(--vert-pale);border:1px solid var(--vert-border);padding:2px 8px;border-radius:10px">✅ Validé</span>';
    if(r.statut==='expiré') return '<span style="font-size:10px;font-weight:700;color:var(--text3);background:var(--creme);border:1px solid var(--border);padding:2px 8px;border-radius:10px">⏰ Expiré</span>';
    var exp=new Date(r.expires_at);
    var isExp=exp<new Date();
    if(isExp) return '<span style="font-size:10px;font-weight:700;color:var(--text3);background:var(--creme);border:1px solid var(--border);padding:2px 8px;border-radius:10px">⏰ Expiré</span>';
    return '<span style="font-size:10px;font-weight:700;color:var(--orange);background:var(--orange-pale);border:1px solid var(--orange-border);padding:2px 8px;border-radius:10px">🔄 En cours</span>';
  }

  function relevéRow(r){
    var heure=new Date(r.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    var heureVal=r.validated_at?new Date(r.validated_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):null;
    var nom=r.contact_id&&contactMap[r.contact_id]?contactMap[r.contact_id]:'—';
    // Cache pour le panneau détail
    _rhCache[r.id]={h:heure,hv:heureVal,n:nom};
    var alertBadge=r.nb_alertes>0?'<span style="font-size:10px;font-weight:700;color:var(--rouge);background:var(--rouge-pale);border:1px solid var(--rouge-border);padding:2px 8px;border-radius:10px;margin-left:6px">⚠️ '+r.nb_alertes+' alerte'+(r.nb_alertes>1?'s':'')+'</span>':'';
    var isOpen=r.statut==='ouvert'&&new Date(r.expires_at)>new Date();
    var linkBtn=isOpen?'<a href="'+BASE_URL+'releve.html?token='+r.token+'" target="_blank" style="font-size:11px;color:var(--bleu);text-decoration:none;font-weight:600;white-space:nowrap" onclick="event.stopPropagation()">🔗 Ouvrir</a>':'';
    var clickable=r.statut==='validé';
    return '<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:'+(clickable?'pointer':'default')+';transition:background .15s" '+
      (clickable?'onclick="_openReleveDetail(\''+r.id+'\')" onmouseenter="this.style.background=\'var(--creme)\'" onmouseleave="this.style.background=\'\'"':'')+'>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
          statusBadge(r)+alertBadge+
          '<span style="font-size:11px;color:var(--text3)">'+heure+(heureVal?' → '+heureVal:'')+'</span>'+
          (clickable?'<span style="font-size:10px;color:var(--text3);margin-left:auto">Voir détail →</span>':'')+
        '</div>'+
        '<div style="font-size:11px;color:var(--text3);margin-top:3px">'+nom+(r.nb_valeurs?' · '+r.nb_valeurs+' valeur'+(r.nb_valeurs>1?'s':''):'')+'</div>'+
      '</div>'+
      linkBtn+
    '</div>';
  }

  var todayHtml=todayReleves.length?
    todayReleves.map(relevéRow).join(''):
    '<div style="padding:20px 16px;text-align:center;color:var(--text3);font-size:12px">Aucun relevé aujourd\'hui</div>';

  var histHtml='';
  if(histReleves.length){
    var byDay={};
    histReleves.forEach(function(r){
      var d=new Date(r.created_at).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      if(!byDay[d])byDay[d]=[];
      byDay[d].push(r);
    });
    Object.keys(byDay).forEach(function(d){
      histHtml+='<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:10px 16px 4px">'+d+'</div>'+
        byDay[d].map(relevéRow).join('');
    });
  }

  var html='<div style="max-width:640px">'+
    // CTA déclencher
    '<div style="background:var(--dark);border-radius:14px;padding:20px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px">'+
      '<div>'+
        '<div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:4px">📋 Déclencher un relevé</div>'+
        '<div style="font-size:12px;color:rgba(255,255,255,.55)">Génère un lien sécurisé valable 4h à envoyer au technicien</div>'+
      '</div>'+
      '<button class="cfg-btn-primary" style="white-space:nowrap;padding:10px 18px;flex-shrink:0" onclick="_triggerReleve()">Nouveau relevé</button>'+
    '</div>'+

    // Aujourd'hui
    '<div style="margin-bottom:24px">'+
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px">Aujourd\'hui</div>'+
      '<div style="background:white;border:1.5px solid var(--border);border-radius:12px;overflow:hidden">'+
        todayHtml+
      '</div>'+
    '</div>'+

    // Historique 7j
    (histReleves.length?
      '<div>'+
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px">7 derniers jours</div>'+
        '<div style="background:white;border:1.5px solid var(--border);border-radius:12px;overflow:hidden">'+histHtml+'</div>'+
      '</div>':'')

  +'</div>';

  // Reset padding
  var dc=document.getElementById('dash-content-main');
  if(dc){dc.style.padding='24px';dc.style.maxWidth='none';}
  return html;
}

async function _triggerReleve(){
  var session=_session;
  if(!session)return;
  var sid=session.site_ids&&session.site_ids[0];
  var cid=session.contact&&session.contact.id;

  var btn=event&&event.target;
  if(btn){btn.disabled=true;btn.textContent='Création…';}

  var releve=await supaPost('releves_horaires',{
    site_id:sid,
    contact_id:cid||null,
    statut:'ouvert',
    expires_at:new Date(Date.now()+4*3600*1000).toISOString()
  });

  if(btn){btn.disabled=false;btn.textContent='Nouveau relevé';}

  if(!releve||!releve.token){alert('Erreur lors de la création du relevé');return;}

  var BASE_URL=location.origin+location.pathname.replace('dashboard.html','');
  var url=BASE_URL+'releve.html?token='+releve.token;

  // Show link modal
  var modal=document.createElement('div');
  modal.className='cfg-modal-overlay';
  modal.id='releve-link-modal';
  modal.onclick=function(e){if(e.target===modal)modal.remove();};
  modal.innerHTML='<div class="cfg-modal-box">'+
    '<div class="cfg-modal-title">📋 Relevé créé</div>'+
    '<div style="font-size:12px;color:var(--text2);margin-bottom:12px">Partagez ce lien avec le technicien. Il est valable 4h.</div>'+
    '<div style="background:var(--creme);border:1.5px solid var(--border);border-radius:8px;padding:12px;word-break:break-all;font-size:11px;font-family:monospace;color:var(--dark);margin-bottom:12px">'+url+'</div>'+
    '<div class="cfg-modal-footer">'+
      '<button class="cfg-btn-secondary" onclick="document.getElementById(\'releve-link-modal\').remove()">Fermer</button>'+
      '<button class="cfg-btn-primary" onclick="navigator.clipboard.writeText(\''+url+'\').then(function(){var b=document.querySelector(\'#releve-link-modal .cfg-btn-primary\');if(b){b.textContent=\'✅ Copié !\';setTimeout(function(){b.textContent=\'Copier le lien\';},2000);}})">Copier le lien</button>'+
    '</div>'+
    '</div>';
  document.body.appendChild(modal);

  // Refresh the view in background
  if(_session)renderRespTech(_session,'releves');
}

var _rhCache={};  // releveId → {h, hv, n}

function _dpEnsure(){
  if(document.getElementById('dp-panel'))return;
  var ov=document.createElement('div');
  ov.id='dp-overlay';ov.className='dp-overlay';
  ov.onclick=function(e){if(e.target===ov)_dpClose();};
  var panel=document.createElement('div');
  panel.id='dp-panel';panel.className='dp-panel';
  panel.innerHTML=
    '<div class="dp-header">'+
      '<div style="flex:1">'+
        '<div class="dp-title" id="dp-title"></div>'+
        '<div class="dp-sub" id="dp-sub"></div>'+
      '</div>'+
      '<button class="dp-close" onclick="_dpClose()">×</button>'+
    '</div>'+
    '<div class="dp-body" id="dp-body"></div>';
  document.body.appendChild(ov);
  document.body.appendChild(panel);
}

function _dpOpen(title,sub){
  _dpEnsure();
  document.getElementById('dp-title').textContent=title;
  document.getElementById('dp-sub').textContent=sub||'';
  document.getElementById('dp-body').innerHTML='<div class="dp-loading"><div class="dp-spinner"></div>Chargement…</div>';
  document.getElementById('dp-overlay').classList.add('open');
  document.getElementById('dp-panel').classList.add('open');
}

function _dpClose(){
  var p=document.getElementById('dp-panel');
  var o=document.getElementById('dp-overlay');
  if(p)p.classList.remove('open');
  if(o)o.classList.remove('open');
}

function _dpValRow(q,val){
  if(!q)return'';
  var label=q.texte||'';
  var unit=q.unite||'';
  var num=parseFloat(String(val).replace(',','.'));
  var warn=false;
  if(!isNaN(num)){
    if(q.seuil_min!=null&&num<parseFloat(q.seuil_min))warn=true;
    if(q.seuil_max!=null&&num>parseFloat(q.seuil_max))warn=true;
  }
  var display=val&&val!==''?escape_html(val):'<span style="color:var(--text3)">—</span>';
  return '<div class="dp-q-row'+(warn?' warn':'')+'">'+
    '<span class="dp-q-label">'+escape_html(label)+'</span>'+
    '<span class="dp-q-val'+(warn?' warn':'')+'">'+display+'</span>'+
    (unit?'<span class="dp-q-unit">'+escape_html(unit)+'</span>':'')+
    (warn?'<span class="dp-q-warn">⚠</span>':'')+
  '</div>';
}

async function _openReleveDetail(rid){
  var c=_rhCache[rid]||{};
  _dpOpen('Relevé horaire',(c.h||'')+(c.hv?' → '+c.hv:'')+(c.n?' · '+c.n:''));

  var[reps,obs]=await Promise.all([
    supaGet('reponses',
      'releve_id=eq.'+rid+
      '&select=valeur,question_id,questions(id,texte,unite,seuil_min,seuil_max,equipement_id,equipements(nom,types_equipements(nom,icone)))'),
    supaGet('releve_observations',
      'releve_id=eq.'+rid+'&select=texte,equipement_id,equipements(nom)')
  ]);

  if(!reps.length){
    document.getElementById('dp-body').innerHTML='<div class="dp-empty">Aucune réponse enregistrée</div>';
    return;
  }

  var byEq={};var eqMeta={};
  reps.forEach(function(r){
    var q=r.questions;if(!q)return;
    var eid=q.equipement_id;
    if(!byEq[eid])byEq[eid]=[];
    byEq[eid].push(r);
    if(!eqMeta[eid]&&q.equipements)eqMeta[eid]=q.equipements;
  });

  var obsMap={};
  obs.forEach(function(o){obsMap[o.equipement_id]=o.texte;});

  var html='';
  Object.keys(byEq).forEach(function(eid){
    var eq=eqMeta[eid]||{};
    var icon=(eq.types_equipements&&eq.types_equipements.icone)||'⚙️';
    var nom=eq.nom||'Équipement';
    var rows=byEq[eid].map(function(r){return _dpValRow(r.questions,r.valeur);}).join('');
    var obsHtml=obsMap[eid]?
      '<div class="dp-obs"><div class="dp-obs-lbl">💬 Observation</div>'+escape_html(obsMap[eid])+'</div>':'';
    html+='<div class="dp-eq-card">'+
      '<div class="dp-eq-hdr">'+icon+' '+escape_html(nom)+'</div>'+
      rows+obsHtml+
    '</div>';
  });

  document.getElementById('dp-body').innerHTML=html;
}

async function _openRondeDetail(rondeId,dateStr,freq){
  var freqLabel=_FREQ_LABELS[freq]||freq;
  var dateDisp=new Date(dateStr+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  _dpOpen('Ronde '+freqLabel.toLowerCase(),dateDisp);

  var rondesEq=await supaGet('rondes_equipements',
    'ronde_id=eq.'+rondeId+
    '&select=id,statut,equipement_id,equipements(nom,types_equipements(nom,icone))'+
    '&order=equipement_id.asc'
  );

  if(!rondesEq.length){
    document.getElementById('dp-body').innerHTML='<div class="dp-empty">Aucun équipement sur cette ronde</div>';
    return;
  }

  var reIds=rondesEq.map(function(re){return re.id;});
  var reps=await supaGet('reponses',
    'ronde_equipement_id=in.('+reIds.join(',')+')'+'&select=valeur,ronde_equipement_id,questions(texte,unite,seuil_min,seuil_max)'
  );

  var repByRe={};
  reps.forEach(function(r){
    if(!repByRe[r.ronde_equipement_id])repByRe[r.ronde_equipement_id]=[];
    repByRe[r.ronde_equipement_id].push(r);
  });

  var html='';
  rondesEq.forEach(function(re){
    var eq=re.equipements||{};
    var icon=(eq.types_equipements&&eq.types_equipements.icone)||'⚙️';
    var nom=eq.nom||'Équipement';
    var ok=re.statut==='valide';
    var rows=(repByRe[re.id]||[]);
    var rowsHtml=rows.length?
      rows.map(function(r){return _dpValRow(r.questions,r.valeur);}).join(''):
      '<div class="dp-q-row"><span class="dp-q-label" style="color:var(--text3)">Aucune réponse enregistrée</span></div>';
    html+='<div class="dp-eq-card">'+
      '<div class="dp-eq-hdr">'+icon+' '+escape_html(nom)+
        '<span class="dp-ronde-status '+(ok?'ok':'nok')+'">'+(ok?'✅ Validé':'⏳ En attente')+'</span>'+
      '</div>'+
      rowsHtml+
    '</div>';
  });

  document.getElementById('dp-body').innerHTML=html;
}

function _sgAffecterSelect(id,nom,wa,el){
  _sgAffecterChosen={nom:nom,wa:wa};

  document.querySelectorAll('[data-id]').forEach(function(d){d.style.borderColor='var(--border)';d.style.background='white';});

async function _sgAffecterConfirm(id){
  var r=window._sgRows&&window._sgRows[id];
  if(!r||!_sgAffecterChosen.nom)return;
  // Patch signalement
  await supaPatch('signalements',id,{assigne_a:_sgAffecterChosen.nom,statut:'en_cours'});
  // Construire message WhatsApp
  var typeLabel=_SG_TYPES[r.type]||r.type||'Signalement';
  var eqNom=r.equipements&&r.equipements.nom?r.equipements.nom:'';
  var lieu=r.lieu||'';
  var rapportUrl=location.origin+location.pathname.replace('dashboard.html','rapport.html')+'?sg='+id;
  var msg='🔧 *Intervention requise — GenTrack*\n\n'+
    '📍 *Type :* '+typeLabel+'\n'+
    (eqNom?'⚙️ *Équipement :* '+eqNom+'\n':'')+
    (lieu?'📍 *Lieu :* '+lieu+'\n':'')+
    '📝 *Détail :* '+r.description+'\n\n'+
    '✅ Une fois terminé, soumettez votre rapport ici :\n'+rapportUrl;
  _closeCfgModal();
  if(_sgAffecterChosen.wa){
    var waNum=_sgAffecterChosen.wa.replace(/\D/g,'');
    window.open('https://wa.me/'+waNum+'?text='+encodeURIComponent(msg),'_blank');
  }
  if(_session)renderRespTech(_session,'signalements');
}

var _mntFilter='tous'; // tous | panne | vidange | ravitaillement | preventive

var _MNT_TYPES={
  panne:{label:'Panne / Réparation',icon:'🔧',color:'var(--rouge)',bg:'var(--rouge-pale)'},
  vidange:{label:'Vidange',icon:'🛢️',color:'var(--orange)',bg:'var(--orange-pale)'},
  ravitaillement:{label:'Ravitaillement',icon:'⛽',color:'var(--bleu)',bg:'var(--bleu-pale)'},
  preventive:{label:'Maintenance préventive',icon:'📅',color:'var(--vert)',bg:'var(--vert-pale)'}
};

async function _rtMaintenances(sid){
  var dc=document.getElementById('dash-content-main');
  if(dc){dc.style.padding='24px';dc.style.maxWidth='960px';}

  var query='groupe_id=eq.'+sid+'&order=created_at.desc&limit=150&select=id,type,titre,description,date_intervention,date_planifiee,statut,cout,quantite,unite,prestataire,created_by,created_at,equipement_id,equipements(nom)';
  if(_mntFilter!=='tous')query+='&type=eq.'+_mntFilter;
  var rows=await supaGet('maintenances',query);

  // Cost summary
  var totalCout=rows.filter(function(r){return r.statut==='realise';}).reduce(function(s,r){return s+(r.cout||0);},0);
  var byType={};
  Object.keys(_MNT_TYPES).forEach(function(t){byType[t]=0;});
  rows.forEach(function(r){if(r.type&&byType[r.type]!==undefined)byType[r.type]++;});

  var filterHtml=['tous','panne','vidange','ravitaillement','preventive'].map(function(f){
    var labels={tous:'Tous',panne:'Pannes',vidange:'Vidanges',ravitaillement:'Ravitaillements',preventive:'Préventive'};
    var active=_mntFilter===f;
    var n=f==='tous'?rows.length:(byType[f]||0);
    return '<button onclick="_setMntFilter(\''+f+'\')" style="padding:6px 14px;border-radius:20px;border:1.5px solid '+(active?'var(--amber)':'var(--border)')+';background:'+(active?'var(--amber-pale)':'white')+';font-size:12px;font-weight:'+(active?'700':'500')+';color:'+(active?'var(--amber-dark)':'var(--text2)')+';cursor:pointer">'+labels[f]+(n?' ('+n+')':'')+'</button>';
  }).join('');

  var cardsHtml='';
  if(!rows.length){
    cardsHtml='<div style="text-align:center;padding:48px 24px;color:var(--text3)"><div style="font-size:40px;margin-bottom:12px;opacity:.4">🔧</div><div style="font-size:14px">Aucune opération enregistrée'+(_mntFilter!=='tous'?' dans cette catégorie':'')+'.</div></div>';
  } else {
    cardsHtml=rows.map(function(r){
      var t=_MNT_TYPES[r.type]||{label:r.type,icon:'🔧',color:'var(--text2)',bg:'var(--bg)'};

  return '<div>'+

}
