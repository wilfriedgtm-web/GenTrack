    supaGet('signalements',
      'groupe_id=eq.'+sid+'&order=created_at.desc&limit=200'+
      '&select=id,groupe_id,site_id,type,description,statut,signale_par,lieu,zone_id,cout_intervention,note_resolution,resolved_by,resolved_at,assigne_a,pris_en_charge_par,pris_en_charge_at,ref_code,created_at,source,photo_url,equipement_id,equipement_zone_id,equipements(nom),equipements_zone(nom),maintenances(photo_url,prestataire)'
    )
  ]);
  zones=zones||[]; allRows=allRows||[];
  window._sgZones=zones;
  window._sgAllRows=allRows;
  window._sgRows={};
  allRows.forEach(function(r){window._sgRows[r.id]=r;});

  // KPIs
  var moisDebut=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  var rowsMois=allRows.filter(function(r){return new Date(r.created_at)>=moisDebut;});
  var resolus30=allRows.filter(function(r){return r.resolved_at&&new Date(r.resolved_at)>=moisDebut;});
  var totalCout=resolus30.reduce(function(s,r){return s+(parseFloat(r.cout_intervention)||0);},0);
  var ouverts=allRows.filter(function(r){return r.statut==='ouvert';}).length;
  var enCours=allRows.filter(function(r){return r.statut==='en_cours';}).length;
  var kpiHtml='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">'+
    _sgKpi('Ce mois','var(--dark)',rowsMois.length+'',resolus30.length+' résolus')+
    _sgKpi('Ouverts',ouverts>0?'var(--rouge)':'var(--dark)',ouverts+'','en attente')+
    _sgKpi('En cours',enCours>0?'var(--orange)':'var(--dark)',enCours+'','pris en charge')+
    _sgKpi('Coût mois','var(--dark)',Math.round(totalCout/1000)+'k','FCFA interventions')+
  '</div>';

  // Points chauds
  var zCount={};
  allRows.forEach(function(r){if(r.zone_id)zCount[r.zone_id]=(zCount[r.zone_id]||0)+1;});
  var zTop=Object.entries(zCount).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  var eqCount={};
  allRows.forEach(function(r){
    var n=(r.equipements&&r.equipements.nom)?r.equipements.nom
         :(r.equipements_zone&&r.equipements_zone.nom)?r.equipements_zone.nom
         :null;
    if(n)eqCount[n]=(eqCount[n]||0)+1;
  });
  var eqTop=Object.entries(eqCount).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  var hotHtml='';
  if(zTop.length||eqTop.length){
    hotHtml='<details style="margin-bottom:14px;background:white;border:1.5px solid var(--border);border-radius:10px;overflow:hidden" open>'+
      '<summary style="list-style:none;display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;background:var(--bg);border-bottom:1px solid var(--border)">'+
        '<span style="font-size:13px;font-weight:700;color:var(--dark);flex:1">🔥 Points chauds</span>'+
      '</summary>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0">'+
        '<div style="padding:12px 14px;border-right:1px solid var(--border)">'+
          '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px">📍 Zones</div>'+
          zTop.map(function(e,i){
            var z=zones.find(function(z){return z.id===e[0];});
            var _catPfx={'Hébergement':'Chambre','Restauration':'Salle','Bureaux':'Bureau','Loisirs':'Espace','Spa':'Spa','Casino':'Casino','Accueil':'Accueil','Commerce':'Commerce','Technique':'Local','Circulation':'Couloir'};
            var pfx=z&&z.categorie&&_catPfx[z.categorie]?_catPfx[z.categorie]+' ':'';
            var nom=z?(pfx+z.nom+(z.etage?' · '+z.etage:'')):e[0];
            var isA=_sgZoneFilter===e[0];
            return '<div onclick="_setSgZone(\''+e[0]+'\')" style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;background:'+(isA?'var(--amber-pale)':'transparent')+';border:1px solid '+(isA?'var(--amber)':'transparent')+';margin-bottom:3px">'+
              '<span style="font-size:11px;font-weight:700;color:var(--text3);width:14px;text-align:center">'+(i+1)+'</span>'+
              '<span style="font-size:12px;color:var(--dark);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escape_html(nom)+'</span>'+
              '<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--rouge-pale);color:var(--rouge)">'+e[1]+'</span>'+
            '</div>';
          }).join('')+
        '</div>'+
        '<div style="padding:12px 14px">'+
          '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px">🔧 Équipements</div>'+
          eqTop.map(function(e,i){
            return '<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;margin-bottom:3px">'+
              '<span style="font-size:11px;font-weight:700;color:var(--text3);width:14px;text-align:center">'+(i+1)+'</span>'+
              '<span style="font-size:12px;color:var(--dark);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escape_html(e[0])+'</span>'+
              '<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:#e3f0ff;color:#1565c0">'+e[1]+'</span>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</details>';
  }

  // Zone select options
  var zoneOpts='<option value="">Toutes les zones</option>'+
    zones.map(function(z){return '<option value="'+z.id+'"'+(z.id===_sgZoneFilter?' selected':'')+'>'+escape_html(z.nom)+'</option>';}).join('');

  return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">'+
      '<div style="display:flex;align-items:center;gap:6px;background:white;border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;flex:1;min-width:160px">'+
        '<span style="font-size:13px;color:var(--text3)">🔍</span>'+
        '<input id="sg-search" type="text" placeholder="Rechercher…" oninput="_sgSetSearch(this.value)" style="border:none;background:none;font-size:12px;color:var(--dark);outline:none;width:100%;font-family:inherit" value="'+escape_html(_sgSearch)+'">'+
      '</div>'+
      '<select id="sg-zone-sel" onchange="_setSgZone(this.value||null)" style="font-size:12px;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;background:white;color:var(--dark);cursor:pointer;font-family:inherit">'+zoneOpts+'</select>'+
      '<button onclick="_sgCreerManuel(\''+sid+'\')" style="padding:7px 14px;border:1.5px solid var(--amber);border-radius:8px;background:var(--amber-pale);font-size:12px;font-weight:700;color:var(--amber-dark);cursor:pointer;white-space:nowrap">＋ Signalement</button>'+
    '</div>'+
    kpiHtml+
    hotHtml+
    '<div id="sg-kanban"></div>'+
    '<div id="sg-detail" style="margin-top:10px"></div>';
}

function _sgSetSearch(v){
  _sgSearch=(v||'').toLowerCase().trim();
  _sgRenderKanban(window._sgSid);
}

function _sgSelectCard(id){
  _sgSelected=(_sgSelected===id)?null:id;
  _sgRenderKanban(window._sgSid);
  if(_sgSelected){
    var d=document.getElementById('sg-detail');
    if(d)setTimeout(function(){d.scrollIntoView({behavior:'smooth',block:'nearest'});},60);
  }
}

async function _sgPrendreEnCharge(id){
  var nom=_session&&(_session.nom||_session.email)||'Resp Tech';
  await supaPatch('signalements',id,{statut:'en_cours',pris_en_charge_par:nom,pris_en_charge_at:new Date().toISOString()});
  if(window._sgRows&&window._sgRows[id]){
    window._sgRows[id].statut='en_cours';
    window._sgRows[id].pris_en_charge_par=nom;
  }
  if(window._sgAllRows){
    var idx=window._sgAllRows.findIndex(function(r){return r.id===id;});
    if(idx>=0){window._sgAllRows[idx].statut='en_cours';window._sgAllRows[idx].pris_en_charge_par=nom;}
  }
  _sgSelected=id;
  _sgRenderKanban(window._sgSid);
}

function _sgRenderKanban(sid){
  var kEl=document.getElementById('sg-kanban');
  if(!kEl)return;
  var allRows=window._sgAllRows||[];
  var zones=window._sgZones||[];

  // Filters
  var rows=_sgZoneFilter?allRows.filter(function(r){return r.zone_id===_sgZoneFilter;}):allRows;
  if(_sgSearch){
    rows=rows.filter(function(r){
      return (r.description||'').toLowerCase().indexOf(_sgSearch)>=0||
        (r.equipements&&r.equipements.nom?r.equipements.nom.toLowerCase():'' ).indexOf(_sgSearch)>=0||
        (r.lieu||'').toLowerCase().indexOf(_sgSearch)>=0;
    });
  }

  var byStatut={ouvert:[],en_cours:[],resolu:[]};
  rows.forEach(function(r){if(byStatut[r.statut])byStatut[r.statut].push(r);});

  var cols=[
    {key:'ouvert',label:'Ouvert',dot:'var(--rouge)',cntBg:'var(--rouge-pale)',cntColor:'var(--rouge)'},
    {key:'en_cours',label:'En cours',dot:'var(--orange)',cntBg:'var(--orange-pale)',cntColor:'var(--orange)'},
    {key:'resolu',label:'Résolu',dot:'var(--vert)',cntBg:'var(--vert-pale)',cntColor:'var(--vert)'}
  ];

  kEl.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">'+
    cols.map(function(col){
      var items=byStatut[col.key]||[];
      return '<div style="background:white;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column">'+
        '<div style="display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1.5px solid var(--border);background:var(--bg)">'+
          '<div style="width:8px;height:8px;border-radius:50%;background:'+col.dot+';flex-shrink:0"></div>'+
          '<div style="font-size:12px;font-weight:700;color:var(--dark);flex:1">'+col.label+'</div>'+
          '<div style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:'+col.cntBg+';color:'+col.cntColor+'">'+items.length+'</div>'+
        '</div>'+
        '<div style="padding:8px;overflow-y:auto;max-height:520px;display:flex;flex-direction:column;gap:6px">'+
          (items.length===0?'<div style="text-align:center;padding:32px 0;font-size:12px;color:var(--text3)">—</div>':items.map(function(r){return _sgBuildCard(r,zones,col.key);}).join(''))+
        '</div>'+
      '</div>';
    }).join('')+
  '</div>';

  // Detail panel
  var dEl=document.getElementById('sg-detail');
  if(dEl){
    if(_sgSelected&&window._sgRows&&window._sgRows[_sgSelected]){
      dEl.innerHTML=_sgBuildDetail(window._sgRows[_sgSelected],zones,sid||window._sgSid);
    } else {
      dEl.innerHTML='';
    }
  }
}

function _sgBuildCard(r,zones,colKey){
  var accent=colKey==='ouvert'?'var(--rouge)':colKey==='en_cours'?'var(--orange)':'var(--vert)';
  var icon=_SG_ICONS[r.type]||'📝';
  var typeLabel=_SG_TYPES[r.type]||r.type||'Signalement';
  var eqNom=r.equipements&&r.equipements.nom?r.equipements.nom:'';
  var z=r.zone_id?zones.find(function(z){return z.id===r.zone_id;}):null;
  var lieuLabel=z?z.nom:(r.lieu||'');
  var isSel=(_sgSelected===r.id);
  var photoThumb='';
  if(r.photo_url){
    photoThumb='<a href="'+r.photo_url+'" target="_blank" onclick="event.stopPropagation()">'+
      '<img src="'+r.photo_url+'" style="width:100%;height:56px;object-fit:cover;border-radius:6px;margin:5px 0;border:1px solid var(--border)" onerror="this.style.display=\'none\'">'+
    '</a>';
  }
  var quickActions='';
  if(colKey==='ouvert'){
    quickActions='<div style="display:flex;gap:5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)">'+
      '<button onclick="event.stopPropagation();_sgAffecter(\''+r.id+'\')" style="flex:1;padding:5px 0;font-size:11px;font-weight:600;border:1.5px solid var(--amber-border);border-radius:6px;background:var(--amber-pale);color:var(--amber-dark);cursor:pointer;font-family:inherit">👷 Affecter</button>'+
      '<button onclick="event.stopPropagation();_sgPrendreEnCharge(\''+r.id+'\')" style="flex:1;padding:5px 0;font-size:11px;font-weight:600;border:1.5px solid #90caf9;border-radius:6px;background:#e3f0ff;color:#1565c0;cursor:pointer;font-family:inherit">▶ Prendre</button>'+
    '</div>';
  } else if(colKey==='en_cours'){
    var preneur=r.assigne_a||r.pris_en_charge_par||'';
    quickActions='<div style="display:flex;align-items:center;gap:5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)">'+
      (preneur?'<span style="font-size:11px;color:var(--orange);flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">⚡ '+escape_html(preneur)+'</span>':'')+
      '<button onclick="event.stopPropagation();_sgResoudre(\''+r.id+'\')" style="padding:5px 8px;font-size:11px;font-weight:600;border:1.5px solid var(--vert-border);border-radius:6px;background:var(--vert-pale);color:var(--vert);cursor:pointer;white-space:nowrap;font-family:inherit">✅ Résoudre</button>'+
      '<button onclick="event.stopPropagation();_sgAffecter(\''+r.id+'\')" style="padding:5px 8px;font-size:11px;border:1.5px solid var(--border);border-radius:6px;background:white;color:var(--text2);cursor:pointer;font-family:inherit">↩</button>'+
    '</div>';
  }
  return '<div id="sg-card-'+r.id+'" onclick="_sgSelectCard(\''+r.id+'\')" style="border:1.5px solid '+(isSel?'var(--amber)':'var(--border)')+';border-left:4px solid '+accent+';border-radius:8px;padding:10px 11px;cursor:pointer;background:'+(isSel?'var(--amber-pale)':'white')+';transition:border-color .12s">'+
    '<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">'+
      '<span style="font-size:11px">'+icon+'</span>'+
      '<span style="font-size:11px;font-weight:700;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escape_html(typeLabel)+(eqNom?' · '+escape_html(eqNom):'')+'</span>'+
    '</div>'+
    '<div style="font-size:12px;color:var(--dark);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+escape_html(r.description)+'</div>'+
    photoThumb+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center">'+
      (lieuLabel?'<span style="font-size:10px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px">'+escape_html(lieuLabel)+'</span>':'')+
      '<span style="font-size:10px;color:var(--text3);margin-left:auto">'+_sgTimeAgo(r.created_at)+'</span>'+
    '</div>'+
    quickActions+
  '</div>';
}

function _sgBuildDetail(r,zones,sid){
  var icon=_SG_ICONS[r.type]||'📝';
  var typeLabel=_SG_TYPES[r.type]||r.type||'Signalement';
  var eqNom=r.equipements&&r.equipements.nom?r.equipements.nom:'';
  var z=r.zone_id?zones.find(function(z){return z.id===r.zone_id;}):null;
  var lieuLabel=z?z.nom:(r.lieu||'');
  var statut=_SG_STATUTS[r.statut]||{label:r.statut,color:'var(--text3)',bg:'var(--bg)'};
  var mnt=r.maintenances&&r.maintenances[0]?r.maintenances[0]:null;
  var photoApres=mnt&&mnt.photo_url?mnt.photo_url:null;
  var tech=r.resolved_by||(mnt&&mnt.prestataire)||null;
  var dateStr=r.created_at?new Date(r.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  var resolvedStr=r.resolved_at?new Date(r.resolved_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';

  var photosHtml='';
  if(r.photo_url&&photoApres){
    photosHtml='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'+
      '<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:4px">Avant</div><a href="'+r.photo_url+'" target="_blank"><img src="'+r.photo_url+'" style="width:100%;height:100px;object-fit:cover;border-radius:8px;border:1.5px solid var(--border)" onerror="this.style.display=\'none\'"></a></div>'+
      '<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--vert);margin-bottom:4px">Après</div><a href="'+photoApres+'" target="_blank"><img src="'+photoApres+'" style="width:100%;height:100px;object-fit:cover;border-radius:8px;border:1.5px solid var(--vert-border)" onerror="this.style.display=\'none\'"></a></div>'+
    '</div>';
  } else if(r.photo_url){
    photosHtml='<div style="margin-bottom:12px">'+
      '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:4px">Photo signalement</div>'+
      '<a href="'+r.photo_url+'" target="_blank"><img src="'+r.photo_url+'" style="max-width:100%;max-height:180px;object-fit:cover;border-radius:8px;border:1.5px solid var(--border)" onerror="this.style.display=\'none\'"></a>'+
    '</div>';
  } else if(photoApres){
    photosHtml='<div style="margin-bottom:12px">'+
      '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--vert);margin-bottom:4px">Après intervention</div>'+
      '<a href="'+photoApres+'" target="_blank"><img src="'+photoApres+'" style="max-width:100%;max-height:180px;object-fit:cover;border-radius:8px;border:1.5px solid var(--vert-border)" onerror="this.style.display=\'none\'"></a>'+
    '</div>';
  } else if(r.statut!=='resolu'){
    photosHtml='<div style="margin-bottom:12px;border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;font-size:11px;color:var(--text3)">📷 Photos visibles après résolution</div>';
  }

  var resolutionHtml=r.statut==='resolu'?
    '<div style="background:var(--vert-pale);border:1px solid var(--vert-border);border-radius:8px;padding:10px 12px;margin-bottom:12px">'+
      '<div style="font-size:11px;font-weight:700;color:var(--vert);margin-bottom:4px">🔧 Intervention'+(tech?' · '+escape_html(tech):'')+'</div>'+
      (r.note_resolution?'<div style="font-size:12px;color:var(--vert);margin-bottom:4px;line-height:1.5">'+escape_html(r.note_resolution)+'</div>':'')+
      (r.cout_intervention?'<div style="font-size:12px;font-weight:700;color:var(--vert)">'+Number(r.cout_intervention).toLocaleString('fr-FR')+' FCFA</div>':'')+
    '</div>':'';

  var actionsHtml='';
  if(r.statut==='ouvert'){
    actionsHtml='<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<button onclick="_sgAffecter(\''+r.id+'\')" style="flex:1;padding:9px;border:1.5px solid var(--amber-border);border-radius:8px;font-size:12px;font-weight:700;color:var(--amber-dark);background:var(--amber-pale);cursor:pointer;font-family:inherit">👷 Affecter</button>'+
      '<button onclick="_sgPrendreEnCharge(\''+r.id+'\')" style="flex:1;padding:9px;border:1.5px solid #90caf9;border-radius:8px;font-size:12px;font-weight:700;color:#1565c0;background:#e3f0ff;cursor:pointer;font-family:inherit">▶ Prendre en charge</button>'+
      '<button onclick="_sgResoudre(\''+r.id+'\')" style="flex:1;padding:9px;border:1.5px solid var(--vert-border);border-radius:8px;font-size:12px;font-weight:700;color:var(--vert);background:var(--vert-pale);cursor:pointer;font-family:inherit">✅ Résoudre</button>'+
    '</div>';
  } else if(r.statut==='en_cours'){
    actionsHtml='<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<button onclick="_sgAffecter(\''+r.id+'\')" style="flex:1;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--text2);background:white;cursor:pointer;font-family:inherit">↩ Changer</button>'+
      '<button onclick="_sgResoudre(\''+r.id+'\')" style="flex:2;padding:9px;border:1.5px solid var(--vert-border);border-radius:8px;font-size:12px;font-weight:700;color:var(--vert);background:var(--vert-pale);cursor:pointer;font-family:inherit">✅ Marquer résolu</button>'+
    '</div>';
  }

  var metaFields='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">'+

    _sgMetaField('Date',dateStr||'—')+
    _sgMetaField('Zone',lieuLabel||'—')+
    (r.ref_code?_sgMetaField('Référence',r.ref_code):'<div></div>')+
    (r.assigne_a||r.pris_en_charge_par?_sgMetaField('Assigné à',r.assigne_a||r.pris_en_charge_par):'')+
    (resolvedStr?_sgMetaField('Résolu le',resolvedStr):'')+
  '</div>';

  return '<div style="background:white;border:1.5px solid var(--border);border-radius:12px;padding:16px;border-top:4px solid '+statut.color+'">'+
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">'+
      '<div style="flex:1">'+
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">'+
          '<span style="font-size:20px">'+icon+'</span>'+
          '<span style="font-size:14px;font-weight:700;color:var(--dark)">'+escape_html(typeLabel)+(eqNom?' · '+escape_html(eqNom):'')+'</span>'+

      );

async function _sgAffecterDirect(sgId,techNom,techWa,instr){
  var r=window._sgRows&&window._sgRows[sgId];
  var rapportUrl=location.origin+location.pathname.replace('dashboard.html','rapport.html')+'?sg='+sgId;
  var msg=r?_sgAffecterMsg(r,instr||'',rapportUrl):'🔧 Mission assignée — GenTrack\n\nRépondez OK '+sgId+' pour confirmer.'+(instr?'\n\n📋 Instructions :\n'+instr:'');
  await supaPatch('signalements',sgId,{assigne_a:techNom,statut:'en_cours',pris_en_charge_par:techNom,pris_en_charge_at:new Date().toISOString()});
  _closeCfgModal();
  if(techWa){
    var waNum=techWa.replace(/\D/g,'');
    window.open('https://wa.me/'+waNum+'?text='+encodeURIComponent(msg),'_blank');
  }
  if(_session){
    var nav=_pecFromNav||_currentNav||'alertes';
    if(_doCurrentSite)renderDirOpsSite(_session,_doCurrentSite.id,_doCurrentSite.nom,nav);
    else if(_dtCurrentSite)renderDirTechSite(_session,_dtCurrentSite.id,_dtCurrentSite.nom,nav);
    else renderRespTech(_session,nav);
  }
}

async function _rtCommandes(sid,session){

      cuveEquips.forEach(function(eq){

      '</button>';

  // ── Wizard cascade Équipement de zone ──
  if(zones.length&&eqsZone.length){
    window._zwizCurrentSid=sid;
    window._zwizZones=zones;
    window._zwizEqsByZone=eqsByZone;
    window._zwizSigByEqZone=sigByEqZone;
    var _ZWIZ_CAT_ICONS={'chambre':'🛏️','commun':'🏢','technique':'⚙️','restaurant':'🍽️','piscine':'🏊','spa':'💆','parking':'🅿️'};
    var _catOrd=['chambre','commun','technique','restaurant','piscine','spa','parking'];
    var _zbc={};zones.forEach(function(z){var c=z.categorie||'commun';if(!_zbc[c])_zbc[c]=[];_zbc[c].push(z);});
    var _cats=_catOrd.filter(function(c){return _zbc[c]&&_zbc[c].some(function(z){return eqsByZone[z.id]&&eqsByZone[z.id].length;});});
    Object.keys(_zbc).forEach(function(c){if(_cats.indexOf(c)<0&&_zbc[c].some(function(z){return eqsByZone[z.id]&&eqsByZone[z.id].length;}))_cats.push(c);});
    var catTiles=_cats.map(function(cat){

    }).join('');
    h+='<div style="background:white;border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:24px">'+
      '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:10px">Commande · Équipement de zone</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px">'+catTiles+'</div>'+
      '<div id="zwiz-step2" style="display:none;margin-top:12px">'+
        '<input id="zwiz-zone-search" type="text" placeholder="🔍 Rechercher une zone…" oninput="_zwizFilterZones()" style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;outline:none;box-sizing:border-box">'+
        '<div id="zwiz-zone-list" style="max-height:180px;overflow-y:auto;margin-top:6px;border:1px solid var(--border);border-radius:8px"></div>'+
      '</div>'+
      '<div id="zwiz-step3" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">'+
        '<div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px" id="zwiz-zone-label"></div>'+
        '<div id="zwiz-eq-chips" style="display:flex;flex-wrap:wrap;gap:6px"></div>'+
      '</div>'+
    '</div>';
  }

  // ── Historique commandes (classiques + zone) ──
  h+='<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:8px">Historique des commandes</div>';
  if(!demandes.length){
    h+='<div style="text-align:center;padding:32px;color:var(--text3);font-size:13px">Aucune demande envoyée</div>';

    var STATUT_STYLE={en_attente:{label:'En attente',color:'var(--orange)',bg:'var(--orange-pale)'},approuve:{label:'Approuvé',color:'#7c3aed',bg:'#f3e8ff'},livre:{label:'Livré ✅',color:'var(--vert)',bg:'var(--vert-pale)'},annule:{label:'Annulé',color:'var(--text3)',bg:'#f5f5f5'}};

/* ── helpers sélecteurs type/urgence ── */
function _demandeSelectType(t){
  _demandeTypeActuel=t;
  Object.keys(_DEMANDE_TYPES).forEach(function(k){
    var btn=document.getElementById('dm-type-'+k);if(!btn)return;
    var sel=k===t;
    btn.style.borderColor=sel?'var(--amber)':'var(--border)';
    btn.style.background=sel?'var(--amber-pale)':'white';
    btn.style.color=sel?'var(--amber-dark)':'var(--text2)';
    if(sel&&_DEMANDE_TYPES[k].unite){var u=document.getElementById('dm-unite');if(u&&!u.value)u.value=_DEMANDE_TYPES[k].unite;}
  });
  // Afficher la ligne prix adaptée au type
  var rowPL=document.getElementById('dm-row-prixl');
  var rowCout=document.getElementById('dm-row-cout');
  if(rowPL)rowPL.style.display=(t==='carburant'?'block':'none');
  if(rowCout)rowCout.style.display=(t==='carburant'?'none':'block');
  _dmUpdateCoutTotal();
}
function _dmUpdateCoutTotal(){
  var qte=parseFloat((document.getElementById('dm-qte')||{}).value)||0;
  var prix=parseFloat((document.getElementById('dm-prix-l')||{}).value)||0;
  var calc=document.getElementById('dm-cout-calc');
  if(!calc)return;
  if(qte&&prix){
    calc.textContent='= '+(qte*prix).toLocaleString('fr-FR')+' FCFA';
    calc.style.color='var(--vert)';calc.style.fontWeight='700';
  }else{calc.textContent='= —';calc.style.color='var(--text3)';calc.style.fontWeight='400';}
}
function _demandeSelectUrgence(u){
  _demandeUrgenceActuelle=u;
  var COLS={normal:'var(--vert)',urgent:'var(--amber)',critique:'var(--rouge)'};
  var BGES={normal:'var(--vert-pale)',urgent:'var(--amber-pale)',critique:'var(--rouge-pale)'};
  _DEMANDE_URGENCES.forEach(function(k){
    var btn=document.getElementById('dm-urg-'+k);if(!btn)return;
    var sel=k===u;
    btn.style.borderColor=sel?COLS[k]:'var(--border)';
    btn.style.background=sel?BGES[k]:'white';
    btn.style.color=sel?COLS[k]:'var(--text2)';
  });
}

    el.style.background=sel?'var(--amber-pale)':'white';
    el.style.borderColor=sel?'var(--amber)':'var(--border)';
    el.style.color=sel?'var(--amber-dark)':'var(--text2)';
  });

}
function _zwizFilterZones(){
  var q=((document.getElementById('zwiz-zone-search')||{}).value||'').toLowerCase();
  _zwizRenderZoneList(q);
}
function _zwizRenderZoneList(q){
  var cat=_zwizCatActuelle;
  var zones=(window._zwizZones||[]).filter(function(z){
    if((z.categorie||'commun')!==cat)return false;
    var eqs=(window._zwizEqsByZone||{})[z.id]||[];
    if(!eqs.length)return false;
    if(!q)return true;
    return z.nom.toLowerCase().indexOf(q)>=0||(z.etage||'').toLowerCase().indexOf(q)>=0;
  });
  var html='';
  zones.forEach(function(z){
    var eqs=(window._zwizEqsByZone||{})[z.id]||[];
    var openSigs=eqs.reduce(function(acc,eq){return acc+((window._zwizSigByEqZone||{})[eq.id]||[]).filter(function(s){return s.statut!=='resolu';}).length;},0);
    var zIdEsc=z.id.replace(/'/g,"\\'");
    var zNomEsc=escape_html(z.nom).replace(/'/g,"\\'");
    html+='<div onclick="_zwizSelectZone(\''+zIdEsc+'\',\''+zNomEsc+'\')" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;border-radius:8px" onmouseover="this.style.background=\'var(--creme)\'" onmouseout="this.style.background=\'transparent\'">'+
      '<div><div style="font-size:12px;font-weight:600;color:var(--text)">'+escape_html(z.nom)+'</div>'+(z.etage?'<div style="font-size:10px;color:var(--text3)">'+escape_html(z.etage)+'</div>':'')+'</div>'+
      (openSigs>0?'<span style="font-size:10px;font-weight:600;color:var(--orange);background:var(--orange-pale);padding:2px 8px;border-radius:10px">'+openSigs+' sign.</span>':'')+
    '</div>';
  });
  if(!html)html='<div style="text-align:center;padding:12px;color:var(--text3);font-size:12px">Aucune zone trouvée</div>';
  var el=document.getElementById('zwiz-zone-list');if(el)el.innerHTML=html;
}
function _zwizSelectZone(zoneId,zoneNom){
  var eqs=(window._zwizEqsByZone||{})[zoneId]||[];
  var lbl=document.getElementById('zwiz-zone-label');if(lbl)lbl.textContent='📍 '+zoneNom;
  var chipsEl=document.getElementById('zwiz-eq-chips');if(!chipsEl)return;
  var sid=window._zwizCurrentSid;
  var html='';
  eqs.forEach(function(eq){
    var sigs=((window._zwizSigByEqZone||{})[eq.id]||[]).filter(function(s){return s.statut!=='resolu';});
    var eqJs=escape_html(eq.nom).replace(/'/g,"\\'");
    var zNomJs=escape_html(zoneNom).replace(/'/g,"\\'");
    var alert=sigs.length>0;
    html+='<button onclick="_ouvrirNouvelleDemandeZone(\''+sid+'\',\''+eq.id+'\',\''+eqJs+'\',\''+zNomJs+'\')" style="padding:7px 14px;border:1.5px solid '+(alert?'var(--orange)':'var(--border)')+';border-radius:20px;background:'+(alert?'var(--orange-pale)':'white')+';cursor:pointer;font-size:11px;font-weight:600;color:'+(alert?'var(--orange)':'var(--text2)')+'">'+
      escape_html(eq.nom)+(alert?' ⚠ '+sigs.length:'')+
    '</button>';
  });
  if(!html)html='<div style="font-size:12px;color:var(--text3)">Aucun équipement configuré</div>';
  chipsEl.innerHTML=html;
  var s3=document.getElementById('zwiz-step3');if(s3)s3.style.display='';

/* ── contenu onglet rapport ── */
function _buildRapportBody(){
  var cv=_dmCuveInfo;
  var pannes=_dmPannes;
  var now=new Date();
  var j30=new Date(now-30*86400000);
  var recent=pannes.filter(function(p){return new Date(p.created_at)>=j30;});
  var h='';
  if(cv){
    var pct=Math.round(cv.niv/cv.cap*100);
    var col=pct<30?'var(--rouge)':pct<60?'var(--amber)':'var(--vert)';
    h+='<div style="background:var(--creme);border-radius:10px;padding:12px;margin-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
        '<span style="font-size:11px;font-weight:700;color:var(--text2)">🛢️ Niveau cuve</span>'+
        '<span style="font-size:13px;font-weight:700;color:'+col+'">'+cv.niv.toLocaleString('fr-FR')+' L · '+pct+'%</span>'+
      '</div>'+
      '<div style="height:6px;background:var(--border);border-radius:3px"><div style="width:'+pct+'%;height:100%;border-radius:3px;background:'+col+'"></div></div>'+
      '<div style="font-size:11px;color:var(--text2);margin-top:5px">Capacité '+cv.cap.toLocaleString('fr-FR')+' L · Manque <strong>'+cv.manque.toLocaleString('fr-FR')+' L</strong></div>'+
    '</div>';
  }
  // KPIs pannes
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px">'+
    '<div style="background:var(--creme);border-radius:8px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:800;color:'+(recent.length>2?'var(--rouge)':recent.length>0?'var(--amber)':'var(--vert)')+'">'+recent.length+'</div><div style="font-size:10px;color:var(--text3)">pannes 30j</div></div>'+
    '<div style="background:var(--creme);border-radius:8px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--text)">'+pannes.filter(function(p){return p.statut==='en_cours';}).length+'</div><div style="font-size:10px;color:var(--text3)">en cours</div></div>'+
    '<div style="background:var(--creme);border-radius:8px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--text)">'+pannes.filter(function(p){return p.statut==='resolu';}).length+'</div><div style="font-size:10px;color:var(--text3)">résolues</div></div>'+
  '</div>';
  if(!pannes.length){
    h+='<div style="text-align:center;padding:16px;color:var(--text3);font-size:12px">Aucun signalement enregistré</div>';
  } else {
    pannes.forEach(function(p){
      var d=new Date(p.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      var col_s=p.statut==='en_cours'?'var(--orange)':p.statut==='resolu'?'var(--vert)':'var(--text3)';
      h+='<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">'+
        '<div style="width:7px;height:7px;border-radius:50%;background:'+col_s+';flex-shrink:0;margin-top:4px"></div>'+
        '<div style="flex:1;min-width:0"><div style="font-size:12px;color:var(--text)">'+escape_html((p.description||'').substring(0,70))+'</div>'+
          '<div style="font-size:10px;color:var(--text3);margin-top:1px">'+d+(p.ref_code?' · '+p.ref_code:'')+'</div></div>'+
      '</div>';
    });
  }
  return h;
}

function _switchDemandeTab(tab){
  var rap=document.getElementById('dm-pane-rapport');

  var tR=document.getElementById('dm-tab-rapport');
  var tD=document.getElementById('dm-tab-demande');

  }
}

/* ── envoi final ── */
async function _envoyerDemande(){
  var sid=_dmCurrentSid;
  var eqId=_dmCurrentEqId;
  var eqNom=_dmCurrentEqNom;
  var qte=window._dmCurrentQte||null;
  var unite=window._dmCurrentUnite||'';
  var desc=window._dmCurrentDesc||'';
  var ref=window._dmCurrentBcRef||('BC-'+new Date().getFullYear()+'-'+Date.now().toString().slice(-4));
  var typeLabel=_DEMANDE_TYPES[_demandeTypeActuel]?_DEMANDE_TYPES[_demandeTypeActuel].label:_demandeTypeActuel;
  var auteurNom=_session&&_session.contact&&_session.contact.nom?_session.contact.nom:'';
  var auteurRole=_session&&_session.role?_session.role:'';
  var today=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var cv=_dmCuveInfo;
  var pannes=_dmPannes;
  var j30=new Date(new Date()-30*86400000);
  var recent=pannes.filter(function(p){return new Date(p.created_at)>=j30;});

  // Corps email plain text
  var lines=[
    ref+' — Bon de commande GenTrack',
    '═══════════════════════════════',
    '',
    _dmCurrentSiteNom?'HÔTEL : '+_dmCurrentSiteNom:'',
    'TYPE : '+typeLabel.toUpperCase(),
    qte?'QUANTITÉ : '+qte.toLocaleString('fr-FR')+(unite?' '+unite:''):'',
    'URGENCE : '+(_DEMANDE_URGENCE_LABELS[_demandeUrgenceActuelle]||_demandeUrgenceActuelle),
    eqNom?'ÉQUIPEMENT : '+eqNom:(_dmCurrentEqZoneNom?'ÉQUIPEMENT : 📍 '+_dmCurrentEqZoneNom:''),
    '',
    desc?'BESOIN EXPRIMÉ :\n'+desc+'\n':'',
    (pannes.length||cv)?'CONTEXTE ÉQUIPEMENT (30 derniers jours) :':'',
    (pannes.length||cv)?'  - Pannes : '+recent.length:'',
    cv?'  - Niveau cuve : '+Math.round(cv.niv/cv.cap*100)+'% ('+cv.niv.toLocaleString('fr-FR')+' L sur '+cv.cap.toLocaleString('fr-FR')+' L)':'',
    pannes.length?pannes.slice(0,3).map(function(p){return '  · '+new Date(p.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' — '+(p.description||'').substring(0,80);}).join('\n'):'',
    '',
    '───────────────────────────────',
    'Demandé par : '+auteurNom+' ('+roleName(auteurRole)+')',
    'Date : '+today,
    'Réf. : '+ref,
    '───────────────────────────────',
    'GenTrack · '+(_dmCurrentSiteNom||'Azalaï Hotels Group')
  ].filter(function(l){return l!==null&&l!==undefined;}).join('\n');

  var subject=encodeURIComponent('[GenTrack] '+ref+' — '+(_dmCurrentSiteNom?_dmCurrentSiteNom+' — ':'')+typeLabel+(eqNom?' / '+eqNom:''));

  // Enregistrement DB — bloquant avec vérification
  var inserted=await supaPost('demandes',{
    site_id:sid,
    equipement_id:eqId||null,
    equipement_zone_id:_dmCurrentEqZoneId||null,
    auteur_nom:auteurNom,
    auteur_role:auteurRole,
    type:_demandeTypeActuel,
    description:desc||null,
    quantite:qte,
    unite:unite||null,
    urgence:_demandeUrgenceActuelle,
    statut:'en_attente',
    destinataire_nom:null,
    destinataire_mail:null,
    note:ref,
    date_envoi:new Date().toISOString(),
    cout:window._dmCurrentCout||null,
    prix_unitaire:window._dmCurrentPrixL||null
  });
  if(!inserted||!inserted.id){
    alert('❌ Erreur : la demande n\'a pas pu être enregistrée. Vérifiez votre connexion et réessayez.');
    return;
  }

  _closeCfgModal();
  window.location.href='mailto:?subject='+subject+'&body='+encodeURIComponent(lines);
  if(_session)renderRespTech(_session,'commandes');
}

/* ── gestion statut demandes ── */
var _livreDemandeCache=null; // stocke la demande en attente du choix Plein

async function _demandeChangerStatut(id,statut){
  var ok=await supaPatch('demandes',id,{statut:statut});
  if(!ok){alert('Erreur lors de la mise à jour du statut.');return;}

  if(statut==='livre'){
    var rows=await supaGet('demandes','id=eq.'+id+'&select=*');
    var demande=rows&&rows.length?rows[0]:null;
    if(demande&&demande.type==='carburant'&&demande.equipement_id){
      // Option A : proposer de loguer un Plein
      _livreDemandeCache=demande;
      var eqNomDisplay=demande.note?'('+demande.note+')':'';
      _showCfgModal(
        '<div style="text-align:center;padding:8px 0 4px">'+
          '<div style="font-size:28px;margin-bottom:8px">⛽</div>'+
          '<div style="font-size:15px;font-weight:800;color:var(--dark);margin-bottom:6px">Livraison confirmée</div>'+
          '<div style="font-size:12px;color:var(--text2);margin-bottom:20px">Veux-tu loguer le Plein maintenant ?<br><span style="font-size:11px;color:var(--text3)">Cela enregistrera le niveau après livraison et le coût.</span></div>'+
          '<div style="display:flex;gap:10px">'+
            '<button onclick="_demandePleinNon()" style="flex:1;padding:11px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:white;cursor:pointer;color:var(--text2)">Non, plus tard</button>'+
            '<button onclick="_demandePleinOui()" style="flex:1;padding:11px;border:none;border-radius:10px;font-size:13px;font-weight:700;background:var(--amber);color:white;cursor:pointer">⛽ Loguer le Plein</button>'+
          '</div>'+
        '</div>'
      );
      return; // Le refresh se fait après le choix
    }
    // Non-carburant ou sans équipement → maintenance auto
    if(demande)await _demandeCreerMaintenance(demande);
  }

  _dtRefreshCommandes();
}

function _demandePleinNon(){
  // Maintenance simple depuis la demande
  _closeCfgModal();
  if(_livreDemandeCache)_demandeCreerMaintenance(_livreDemandeCache);
  _livreDemandeCache=null;
  _dtRefreshCommandes();
}

async function _demandePleinOui(){
  var d=_livreDemandeCache;
  _closeCfgModal();
  _livreDemandeCache=null;
  if(!d||!d.equipement_id){_dtRefreshCommandes();return;}
  // Récupérer infos équipement pour pré-remplir le modal Plein
  var eqs=await supaGet('equipements','id=eq.'+d.equipement_id+'&select=id,nom,capacite_litres,conso_theorique_lh,types_equipements(nom)');
  var eq=eqs&&eqs.length?eqs[0]:null;
  var eqNom=eq?eq.nom:'Cuve carburant';
  var cap=eq&&eq.capacite_litres?eq.capacite_litres:null;
  // Niveau actuel depuis la dernière réponse question
  var currentNiveau=null;
  var prixLitre=null;
  var qs=await supaGet('questions','equipement_id=eq.'+d.equipement_id+'&actif=eq.true&select=id,texte&order=ordre.asc');
  var niveauQ=qs.find(function(q){return q.texte.toLowerCase().indexOf('niveau')>=0||q.texte.toLowerCase().indexOf('cuve')>=0;});
  if(niveauQ){
    var reps=await supaGet('reponses','question_id=eq.'+niveauQ.id+'&select=valeur,created_at&order=created_at.desc&limit=1');
    if(reps&&reps.length)currentNiveau=parseFloat(reps[0].valeur)||null;
  }
  var auteurNom=_session&&_session.contact&&_session.contact.nom?_session.contact.nom:'';
  // Utiliser le prix/L de la demande s'il existe
  var demandePrixL=d.prix_unitaire||null;
  openDeclarePlein(d.equipement_id,eqNom,cap,currentNiveau,auteurNom,demandePrixL);
  // Pré-remplir le coût si demande a un coût total sans prix/L
  if(d.cout&&!demandePrixL){
    var coutEl=document.getElementById('mp-cout');
    if(coutEl&&!coutEl.value)coutEl.value=d.cout;
  }
  // Refresh commandes après fermeture du modal plein
  // openDeclarePlein gère son propre callback, on force un refresh sur fermeture
  var orig=document.getElementById('mp-confirm');
  if(orig){
    var _origClick=orig.onclick;
    orig.onclick=async function(){await _origClick.call(this);_dtRefreshCommandes();};
  }
}

function _dtRefreshCommandes(){
  if(!_session)return;
  var nav=_currentNav||'commandes';
  if(_doCurrentSite)renderDirOpsSite(_session,_doCurrentSite.id,_doCurrentSite.nom,nav);
  else if(_dtCurrentSite)renderDirTechSite(_session,_dtCurrentSite.id,_dtCurrentSite.nom,nav);
  else if(_session.role==='dir_tech')renderDirTech(_session,'commandes');
  else renderRespTech(_session,'commandes');
}

async function _demandeCreerMaintenance(d){
  // Mapping type demande → type maintenance
  var typeMap={carburant:'ravitaillement',piece:'preventive',materiel:'preventive',autre:'preventive'};
  var mntType=typeMap[d.type]||'preventive';
  var typeLabel=_DEMANDE_TYPES[d.type]?_DEMANDE_TYPES[d.type].label:d.type;
  var titre='Livraison '+typeLabel+(d.equipement_id?' — équipement':'');
  var notes='Créé automatiquement depuis bon de commande '+(d.note||d.id)+'\nDemandé par : '+(d.auteur_nom||'')+' ('+roleName(d.auteur_role||'')+')'+(d.description?'\nBesoin : '+d.description:'');
  await supaPost('maintenances',{
    groupe_id:d.site_id,
    equipement_id:d.equipement_id||null,
    type:mntType,
    titre:titre,
    description:d.description||null,
    quantite:d.quantite||null,
    unite:d.unite||null,
    statut:'realise',
    date_intervention:new Date().toISOString().split('T')[0],
    date_realisee:new Date().toISOString().split('T')[0],
    notes:notes,
    created_by:d.auteur_nom||null,
    cout:d.cout||null
  });
}

/* ── Mon équipe (Resp Tech) ── */
async function _rtMonEquipe(sid,session){
  var dc=document.getElementById('dash-content-main');
  if(dc){dc.style.padding='16px';dc.style.maxWidth='960px';}

  var j30date=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  var j30ts=new Date(Date.now()-30*86400000).toISOString();

  var [contacts,rondes30,signalements30,maintenances30]=await Promise.all([
    supaGet('contacts','site_id=eq.'+sid+'&actif=eq.true&select=id,nom,role&order=nom.asc'),
    supaGet('rondes','site_id=eq.'+sid+'&date_ronde=gte.'+j30date+'&select=id,date_ronde,frequence,technicien_id&order=date_ronde.desc'),
    supaGet('signalements','groupe_id=eq.'+sid+'&statut=eq.resolu&resolved_at=gte.'+j30ts+'&select=id,equipement_id,created_at,resolved_at,resolved_by,assigne_a,pris_en_charge_par,equipements(nom)'),
    supaGet('maintenances','groupe_id=eq.'+sid+'&statut=eq.realise&created_at=gte.'+j30ts+'&select=id,type,created_by,prestataire,cout,duree_valeur,duree_unite')
  ]);

  // Conformité rondes
  var rondesIds=rondes30.map(function(r){return r.id;});
  var rondesEq=rondesIds.length?await supaGet('rondes_equipements','ronde_id=in.('+rondesIds.join(',')+')'+'&select=ronde_id,statut'):[];

  // Index ronde_id → technicien_id
  var rondeToTech={};
  rondes30.forEach(function(r){if(r.technicien_id)rondeToTech[r.id]=r.technicien_id;});

  // Stats par tech (UUID)
  var statsByTech={};
  function ensureTech(tid){if(!statsByTech[tid])statsByTech[tid]={rondes:0,reqTotal:0,reqOk:0,pannes:0,mnt:0};}

  rondes30.forEach(function(r){
    if(!r.technicien_id)return;
    ensureTech(r.technicien_id);
    statsByTech[r.technicien_id].rondes++;
  });
  rondesEq.forEach(function(re){
    var tid=rondeToTech[re.ronde_id];if(!tid)return;
    ensureTech(tid);
    statsByTech[tid].reqTotal++;
    if(re.statut==='valide'||re.statut==='ok')statsByTech[tid].reqOk++;
  });

  // Pannes résolues par resolved_by (text) → match sur contact.nom
  var contactByNom={};
  contacts.forEach(function(c){contactByNom[c.nom.toLowerCase()]=c.id;});
  signalements30.forEach(function(s){
    var byNom=(s.resolved_by||s.assigne_a||s.pris_en_charge_par||'').toLowerCase().trim();
    if(!byNom)return;
    var tid=contactByNom[byNom];
    if(!tid)return;
    ensureTech(tid);
    statsByTech[tid].pannes++;
  });

  // Maintenances par created_by (text)
  maintenances30.forEach(function(m){
    var nom=(m.created_by||m.prestataire||'').toLowerCase();
    var tid=contactByNom[nom];
    if(!tid)return;
    ensureTech(tid);
    statsByTech[tid].mnt++;
  });

  // MTTR par équipement
  var mttrMap={};
  signalements30.forEach(function(s){
    if(!s.resolved_at||!s.created_at)return;
    var h=(new Date(s.resolved_at)-new Date(s.created_at))/3600000;
    var nom=(s.equipements&&s.equipements.nom)||'Inconnu';
    if(!mttrMap[nom])mttrMap[nom]={total:0,count:0};
    mttrMap[nom].total+=h;mttrMap[nom].count++;
  });

  // Global KPIs
  var totalRondes=rondes30.length;
  var totalReqOk=rondesEq.filter(function(r){return r.statut==='valide'||r.statut==='ok';}).length;
  var conformGlob=rondesEq.length?Math.round(totalReqOk/rondesEq.length*100):null;
  var mttrMoyH=signalements30.filter(function(s){return s.resolved_at;}).length?
    signalements30.filter(function(s){return s.resolved_at;})
      .reduce(function(s,r){return s+(new Date(r.resolved_at)-new Date(r.created_at))/3600000;},0)/
    signalements30.filter(function(s){return s.resolved_at;}).length:null;
  // Durée d'intervention moyenne (depuis maintenances)
  var mntAvecDuree=maintenances30.filter(function(m){return m.duree_valeur&&parseFloat(m.duree_valeur)>0;});
  var dureesMoyH=mntAvecDuree.map(function(m){var v=parseFloat(m.duree_valeur);return m.duree_unite==='minutes'?v/60:v;});
  var dureeMoyH=dureesMoyH.length?dureesMoyH.reduce(function(a,b){return a+b;},0)/dureesMoyH.length:null;
  function fmtDuree(h){if(h===null)return'—';if(h<1)return Math.round(h*60)+'min';return h.toFixed(1)+'h';}

  var kpiHtml='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:20px">'+
    [
      {label:'Rondes',val:totalRondes,sub:'30 derniers jours',col:'var(--bleu)'},
      {label:'Conformité',val:conformGlob!=null?conformGlob+'%':'—',sub:'points de contrôle ok',col:conformGlob>=80?'var(--vert)':conformGlob>=60?'var(--amber)':'var(--rouge)'},
      {label:'Pannes résolues',val:signalements30.length,sub:'en 30 jours',col:'var(--vert)'},
      {label:'MTTR moyen',val:mttrMoyH!=null?(mttrMoyH<48?Math.round(mttrMoyH)+'h':Math.round(mttrMoyH/24)+'j'):'—',sub:'temps résolution',col:mttrMoyH&&mttrMoyH<24?'var(--vert)':mttrMoyH&&mttrMoyH<72?'var(--amber)':'var(--rouge)'},
      {label:'Durée intervention',val:fmtDuree(dureeMoyH),sub:'moyenne ('+mntAvecDuree.length+' interventions)',col:dureeMoyH&&dureeMoyH<=4?'var(--vert)':dureeMoyH&&dureeMoyH<=8?'var(--amber)':'var(--text)'}
    ].map(function(k){
      return '<div style="background:white;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px">'+
        '<div style="font-size:11px;color:var(--text2);margin-bottom:2px">'+k.label+'</div>'+
        '<div style="font-size:22px;font-weight:800;color:'+k.col+'">'+k.val+'</div>'+
        '<div style="font-size:10px;color:var(--text3)">'+k.sub+'</div>'+
      '</div>';
    }).join('')+
  '</div>';

  // Cards par technicien
  var techs=contacts.filter(function(c){return c.role==='technicien'||c.role==='resp_tech';});
  var techCards=techs.map(function(c){
    var st=statsByTech[c.id]||{rondes:0,reqTotal:0,reqOk:0,pannes:0,mnt:0};
    var conf=st.reqTotal?Math.round(st.reqOk/st.reqTotal*100):null;
    var confCol=conf===null?'var(--text3)':conf>=80?'var(--vert)':conf>=60?'var(--amber)':'var(--rouge)';
    var initials=c.nom.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
    var isResp=c.role==='resp_tech';
    return '<div style="background:white;border:1.5px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px">'+
      '<div style="width:40px;height:40px;border-radius:50%;background:'+(isResp?'var(--amber-pale)':'var(--bleu-pale)')+';display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:'+(isResp?'var(--amber-dark)':'var(--bleu)')+';flex-shrink:0">'+initials+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">'+
          '<span style="font-size:13px;font-weight:700;color:var(--dark)">'+escape_html(c.nom)+'</span>'+
          (isResp?'<span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;background:var(--amber-pale);color:var(--amber-dark)">Chef</span>':'')+
        '</div>'+
        '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">'+
          '<div style="text-align:center;background:var(--creme);border-radius:8px;padding:8px 4px">'+
            '<div style="font-size:16px;font-weight:800;color:var(--bleu)">'+st.rondes+'</div>'+
            '<div style="font-size:9px;color:var(--text3);margin-top:1px">rondes</div>'+
          '</div>'+
          '<div style="text-align:center;background:var(--creme);border-radius:8px;padding:8px 4px">'+
            '<div style="font-size:16px;font-weight:800;color:'+confCol+'">'+( conf!==null?conf+'%':'—')+'</div>'+
            '<div style="font-size:9px;color:var(--text3);margin-top:1px">conformité</div>'+
          '</div>'+
          '<div style="text-align:center;background:var(--creme);border-radius:8px;padding:8px 4px">'+
            '<div style="font-size:16px;font-weight:800;color:var(--vert)">'+st.pannes+'</div>'+
            '<div style="font-size:9px;color:var(--text3);margin-top:1px">pannes rés.</div>'+
          '</div>'+
          '<div style="text-align:center;background:var(--creme);border-radius:8px;padding:8px 4px">'+
            '<div style="font-size:16px;font-weight:800;color:var(--text)">'+st.mnt+'</div>'+
            '<div style="font-size:9px;color:var(--text3);margin-top:1px">maintenances</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

  if(!techs.length)techCards='<div style="text-align:center;padding:24px;color:var(--text3);font-size:12px">Aucun technicien enregistré pour ce site.</div>';

  // Table MTTR par équipement
  var mttrRows=Object.keys(mttrMap).sort(function(a,b){return mttrMap[b].total/mttrMap[b].count-mttrMap[a].total/mttrMap[a].count;}).map(function(nom){
    var d=mttrMap[nom];
    var moy=d.total/d.count;
    var moyStr=moy<48?Math.round(moy)+'h':(Math.round(moy/24)+'j');
    var col=moy<24?'var(--vert)':moy<72?'var(--amber)':'var(--rouge)';
    return '<tr>'+
      '<td style="padding:8px 10px;font-size:12px;color:var(--text)">'+escape_html(nom)+'</td>'+
      '<td style="padding:8px 10px;font-size:12px;text-align:center;color:var(--text2)">'+d.count+'</td>'+
      '<td style="padding:8px 10px;font-size:13px;font-weight:700;text-align:center;color:'+col+'">'+moyStr+'</td>'+
    '</tr>';
  }).join('');

  var mttrSection=mttrRows?
    '<div style="margin-top:20px">'+
      '<div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px">⏱️ MTTR par équipement — 30j <span style="font-size:10px;font-weight:400;color:var(--text3)">(temps moyen de résolution)</span></div>'+
      '<div style="background:white;border:1.5px solid var(--border);border-radius:12px;overflow:hidden">'+
        '<table style="width:100%;border-collapse:collapse">'+
          '<thead><tr style="background:var(--creme)">'+

async function _rtMaintenances(sid){

  var typeAccents={vidange:'var(--orange)',ravitaillement:'var(--bleu)',preventive:'var(--vert)',panne:'var(--rouge)'};
  var cutoff=new Date();cutoff.setDate(cutoff.getDate()-_rtMntPeriod);

  var baseSelect='id,type,titre,description,date_ref,equipement_nom,cout,statut,intervenant,notes,created_at,source,photo_url';
  var results=await Promise.all([

  var rows=results[0];var upcoming=results[1];

  var coutRavito=rows.filter(function(r){return r.type==='ravitaillement';}).reduce(function(s,r){return s+(parseFloat(r.cout)||0);},0);
  function _rtKpi(lbl,val,sub,col){

      '<div style="font-size:20px;font-weight:800;color:'+(col||'var(--dark)')+'">'+val+'</div>'+

  }
  var kpiHtml='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px">'+

    _rtKpi('Coût interventions',totalCout.toLocaleString('fr-FR')+' FCFA','hors ravitaillement','')+
    _rtKpi('Planifiées à venir',upcoming.length,'interventions programmées',upcoming.length>0?'var(--orange)':'')+
    _rtKpi('Carburant',coutRavito>0?coutRavito.toLocaleString('fr-FR')+' FCFA':'—','suivi dans carburant','var(--bleu)')+
  '</div>';
  /* filters */
  var periodHtml=[7,30,90].map(function(d){
    var a=_rtMntPeriod===d;

  }).join('');
  var allForCount=rows.filter(function(r){return r.type!=='panne';}).concat(upcoming);
  var counts={tous:allForCount.length,vidange:0,ravitaillement:0,preventive:0};
  allForCount.forEach(function(r){if(counts[r.type]!==undefined)counts[r.type]++;});
  var typeHtml=[['tous','Tous types'],['vidange','Vidanges'],['ravitaillement','Ravitaillements'],['preventive','Préventive']].map(function(f){
    var a=_mntFilter===f[0];
    var n=counts[f[0]]||0;

  }).join('');
  var filtersHtml='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px">'+
    periodHtml+
    '<div style="width:1px;height:18px;background:var(--border);margin:0 2px;flex-shrink:0"></div>'+
    typeHtml+
  '</div>';
  /* bandeau planifiées */
  var displayUpcoming=_mntFilter==='tous'||_mntFilter==='preventive'?upcoming:upcoming.filter(function(r){return r.type===_mntFilter;});
  var bannerHtml='';
  if(displayUpcoming.length){
    var snippet=displayUpcoming.slice(0,3).map(function(r){
      var t=typeIcons[r.type]||'🔧';
      var dStr=r.date_ref?new Date(r.date_ref+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
      return '<span style="margin-right:10px">'+t+' '+escape_html(r.titre||r.type)+(dStr?' <span style="opacity:.65">'+dStr+'</span>':'')+'</span>';
    }).join('');
    var extra=displayUpcoming.length>3?'<span style="opacity:.6">+'+( displayUpcoming.length-3)+'</span>':'';

      '<div style="font-size:18px;flex-shrink:0;margin-top:1px">📅</div>'+

      '</div>'+
    '</div>';
  }
  /* cards */
  function renderMntCard(r){
    var src=r.type||r.source||'';
    var icon=typeIcons[src]||'🔧';
    var bg=typeBgs[src]||'var(--bg)';
    var accent=typeAccents[src]||'var(--border)';
    var isPlanifie=r.statut==='planifie';
    var isAnnule=r.statut==='annule';
    var dateStr=r.date_ref?new Date(r.date_ref+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'';
    return '<div style="background:white;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;display:grid;grid-template-columns:4px 1fr"'+(isPlanifie?' style="border-color:var(--amber)"':'')+'>'+
      '<div style="background:'+accent+'"></div>'+
      '<div>'+
        (isPlanifie?
          '<div style="background:var(--amber-pale);border-bottom:1px solid #f5d88e;padding:4px 14px"><span style="font-size:10px;font-weight:700;color:var(--amber-dark)">📅 Planifié pour le '+dateStr+'</span></div>':
          (!isAnnule&&dateStr?'<div style="background:var(--vert-pale);border-bottom:1px solid var(--vert-border,#c3e6c3);padding:4px 14px"><span style="font-size:10px;font-weight:700;color:var(--vert)">✅ Réalisé le '+dateStr+'</span></div>':'')
        )+
        '<div style="padding:12px 14px">'+
          '<div style="display:flex;align-items:flex-start;gap:10px">'+
            '<div style="width:32px;height:32px;border-radius:8px;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">'+icon+'</div>'+
            '<div style="flex:1;min-width:0">'+
              '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px">'+
                '<span style="font-size:13px;font-weight:700;color:var(--dark)">'+escape_html(r.titre||r.type||'Opération')+'</span>'+
                (isAnnule?'<span style="font-size:10px;padding:2px 8px;border-radius:4px;background:var(--border);color:var(--text3)">Annulé</span>':'')+
              '</div>'+
              (r.equipement_nom?'<div style="font-size:11px;color:var(--text2);margin-bottom:4px">🔩 '+escape_html(r.equipement_nom)+'</div>':'')+
              (r.description?'<div style="font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:4px">'+escape_html(r.description)+'</div>':'')+
              '<div style="font-size:11px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap">'+
                (r.intervenant?'<span>👷 '+escape_html(r.intervenant)+'</span>':'')+
                (r.cout?'<span>💰 '+parseFloat(r.cout).toLocaleString('fr-FR')+' FCFA</span>':'')+
              '</div>'+
              (r.photo_url?'<div style="margin-top:8px"><a href="'+r.photo_url+'" target="_blank"><img src="'+r.photo_url+'" style="max-width:100%;max-height:160px;object-fit:cover;border-radius:8px;border:1px solid var(--border)" onerror="this.style.display=\'none\'"></a></div>':'')+
            '</div>'+
          '</div>'+
          '<div style="display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">'+
            (isPlanifie?
              '<button onclick="_mntMarquerRealise(\''+r.id+'\')" style="flex:1;padding:8px;border:1.5px solid var(--vert-border);border-radius:8px;font-size:12px;font-weight:600;color:var(--vert);background:var(--vert-pale);cursor:pointer">✅ Marquer réalisé</button>'+
              '<button onclick="_mntAnnuler(\''+r.id+'\')" style="padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;color:var(--text2);background:white;cursor:pointer">Annuler</button>'
              :
              (!isAnnule?'<button onclick="_mntEditer(\''+r.id+'\',\''+escape_html(r.source||'maintenance')+'\','+(r.cout||0)+',\''+escape_html((r.notes||'').replace(/'/g,'\\\'').replace(/\n/g,' '))+'\')" style="padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;color:var(--text2);background:white;cursor:pointer">✏️ Modifier</button>':'')
            )+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  var displayRows=rows.filter(function(r){
    if(r.type==='panne')return false;
    if(_mntFilter!=='tous'&&r.type!==_mntFilter)return false;
    return true;
  });
  var cardsHtml='';
  if(!displayUpcoming.length&&!displayRows.length){
    cardsHtml='<div style="text-align:center;padding:48px 24px;color:var(--text3)"><div style="font-size:40px;margin-bottom:12px;opacity:.4">🔧</div><div style="font-size:14px">Aucune opération sur cette période.</div></div>';
  }else{
    var sectionPlan=displayUpcoming.length?
      '<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px">À venir</div>'+
      displayUpcoming.map(renderMntCard).join(''):'';
    var sectionReal=displayRows.length?
      (displayUpcoming.length?'<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin:14px 0 8px">Réalisées</div>':'')+
      displayRows.map(renderMntCard).join(''):'';
    cardsHtml=sectionPlan+sectionReal;
  }
  return kpiHtml+filtersHtml+bannerHtml+cardsHtml+
    '<div style="text-align:center;margin-top:12px">'+
      '<button onclick="_mntCreer(\''+sid+'\')" style="padding:9px 18px;border:1.5px solid var(--border);border-radius:8px;background:white;font-size:12px;font-weight:700;color:var(--dark);cursor:pointer">＋ Nouvelle opération</button>'+
    '</div>';
}

async function _mntEditerSauver(id,source){
  var cout=parseFloat(document.getElementById('mnt-e-cout').value)||null;
  var notesEl=document.getElementById('mnt-e-notes');
  var notes=notesEl?notesEl.value.trim()||null:undefined;
  var table=(source==='plein')?'pleins':(source==='vidange'?'vidanges':'maintenances');
  var payload={cout:cout};
  if(notes!==undefined&&(source==='maintenance'||source==='vidange'))payload.notes=notes;
  var ok=await supaPatch(table,id,payload);
  if(!ok){alert('Erreur lors de la mise à jour.');return;}
  _closeCfgModal();
  _mntRefresh();
}

async function _mntMarquerRealiseSubmit(id){
  var date=document.getElementById('mnt-r-date').value||new Date().toISOString().split('T')[0];
  var coutStr=document.getElementById('mnt-r-cout').value;

function _mntEquipFilter(){
  var q=(document.getElementById('mnt-m-equip-search').value||'').toLowerCase().trim();
  var sel=document.getElementById('mnt-m-equip');
  var all=window._mntEquipAll||[];
  var prevVal=sel.value;
  var html='<option value="">— Aucun / Général —</option>';
  var techItems=all.filter(function(e){return e.g==='eq'&&(!q||e.n.toLowerCase().indexOf(q)!==-1);});
  var zoneItems=all.filter(function(e){return e.g==='ez'&&(!q||e.n.toLowerCase().indexOf(q)!==-1);});
  if(techItems.length){
    html+='<optgroup label="Équipements techniques">';
    html+=techItems.map(function(e){return '<option value="eq_'+e.id+'">'+escape_html(e.n)+'</option>';}).join('');
    html+='</optgroup>';
  }
  if(zoneItems.length){
    html+='<optgroup label="Équipements de zone / chambre">';
    html+=zoneItems.map(function(e){return '<option value="ez_'+e.id+'">'+escape_html(e.n)+'</option>';}).join('');
    html+='</optgroup>';
  }
  if(!techItems.length&&!zoneItems.length&&q){
    html+='<option disabled value="">Aucun résultat</option>';
  }
  sel.innerHTML=html;
  // restore previous selection if still present
  if(prevVal){
    for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===prevVal){sel.value=prevVal;break;}}
  }
}

async function _mntCreerSubmit(sid){
  var type=document.getElementById('mnt-m-type').value;
  var equipRaw=document.getElementById('mnt-m-equip').value||'';
  var equipId=null,equipZoneId=null;
  if(equipRaw.indexOf('eq_')===0){equipId=equipRaw.slice(3);}
  else if(equipRaw.indexOf('ez_')===0){equipZoneId=equipRaw.slice(3);}
  var titre=(document.getElementById('mnt-m-titre').value||'').trim();
  var date=document.getElementById('mnt-m-date').value;
  var coutStr=document.getElementById('mnt-m-cout').value;
  var cout=coutStr&&!isNaN(parseFloat(coutStr))?parseFloat(coutStr):null;
  var prest=(document.getElementById('mnt-m-prest').value||'').trim()||null;
  var desc=(document.getElementById('mnt-m-desc').value||'').trim()||null;
  var statut=document.getElementById('mnt-m-statut').value;
  var nom=_session&&_session.contact&&_session.contact.nom?_session.contact.nom:null;
  if(!titre&&type){titre=(_MNT_TYPES[type]&&_MNT_TYPES[type].label)||type;}
  await supaPost('maintenances',{
    groupe_id:sid,equipement_id:equipId,equipement_zone_id:equipZoneId,type:type,titre:titre,
    description:desc,
    date_intervention:date,
    date_planifiee:statut==='planifie'?date:null,
    date_realisee:statut==='realise'?date:null,
    statut:statut,cout:cout,prestataire:prest,created_by:nom
  });
  _closeCfgModal();
  _mntRefresh();
}

/* ── QR codes — génération et téléchargement ── */
function _zonesEnsureQrLib(cb){
  if(window.QRCode){cb();return;}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload=function(){cb();};
  s.onerror=function(){console.warn('QRCode lib failed to load');};
  document.head.appendChild(s);
}

function _zonesRenderQRs(){
  var sid=window._zonesQrSid;
  var zones=window._zonesQrData||[];
  if(!sid)return;
  _zonesEnsureQrLib(function(){
    if(!window.QRCode)return;
    var origin=location.origin;
    // QR général
    var genEl=document.getElementById('zw-qr-general');
    if(genEl&&!genEl.dataset.qrDone){
      genEl.innerHTML='';
      try{new QRCode(genEl,{text:origin+'/signalement.html?site='+sid,width:64,height:64,colorDark:'#12151E',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}catch(e){}
      genEl.dataset.qrDone='1';
    }
    // QR par zone
    zones.forEach(function(z){
      var el=document.getElementById('zw-qr-z-'+z.id);
      if(el&&!el.dataset.qrDone){
        el.innerHTML='';
        try{new QRCode(el,{text:origin+'/signalement.html?site='+sid+'&zone='+z.id,width:80,height:80,colorDark:'#12151E',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}catch(e){}
        el.dataset.qrDone='1';
      }
    });
  });
}

function _zonesDlQR(elId,filename){
  var el=document.getElementById(elId);
  if(!el)return;
  // qrcode.js génère un canvas ET une img (fallback) — on préfère le canvas
  var canvas=el.querySelector('canvas');
  var dataUrl=canvas?canvas.toDataURL('image/png'):null;
  if(!dataUrl){var img=el.querySelector('img');if(img)dataUrl=img.src;}
  if(!dataUrl){alert('QR pas encore généré');return;}
  var a=document.createElement('a');
  a.href=dataUrl;
  a.download=(filename||'qr-code').replace(/[^a-zA-Z0-9_-]/g,'-')+'.png';
  a.click();
}

  // Étape 2 — équipements par catégorie

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+cardsHtml+'</div>';
  }

  // Étape 3 — confirmation
  if(_zonesWizardStep===3){
    var totalZones=_zonesWizardData.length;
    var totalEq=0;
    Object.values(_zonesWizardEqSel).forEach(function(eqs){totalEq+=eqs.length;});

    _zonesWizardData.forEach(function(z){var c=z.categorie||'Autre';if(!cats3[c])cats3[c]=0;cats3[c]++;});

    Object.keys(_zonesWizardEqSel).forEach(function(cat){
      var n=cats3[cat]||1;

      totalEqExpanded+=(_zonesWizardEqSel[cat]||[]).length*(isPerZone?n:1);
    });

    var dedupBanner3=doublons3.length>0
      ?'<div style="background:var(--rouge-pale);border:1.5px solid var(--rouge);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--rouge);margin-bottom:14px">'+
        '⚠️ '+doublons3.length+' doublon'+(doublons3.length>1?'s':'')+' encore présent'+(doublons3.length>1?'s':'')+' — retournez à l\'étape 1 pour les retirer.'+

        '</div>'+
        '<div style="background:white;border:1.5px solid var(--border);border-radius:12px;padding:14px;text-align:center">'+
          '<div style="font-size:26px;font-weight:800;color:'+(doublons3.length?'var(--rouge)':'var(--text3)')+'">'+doublons3.length+'</div>'+

// ── Wizard helpers ──
function _zonesWizardBack(){_zonesWizardStep=Math.max(0,_zonesWizardStep-1);if(_session)renderRespTech(_session,'config');}

function _zonesWizardRemoveRow(i){
  _zonesWizardData.splice(i,1);
  if(_session)renderRespTech(_session,'config');
}

function _zonesApplyBatchEtage(n){
  var inp=document.getElementById('zw-batch-etage');
  var val=inp?(inp.value||'').trim():'';
  if(!val){if(inp){inp.style.borderColor='var(--rouge)';setTimeout(function(){inp.style.borderColor='';},1000);}return;}
  var applied=0;
  _zonesWizardData.forEach(function(z,i){
    if(z.erreur==='etage_manquant'){
      z.etage=val;
      z.erreur=null;
      applied++;
      // Mettre à jour le DOM en place (évite de perdre les autres éditions)
      var etageEl=document.getElementById('zw-etage-'+i);
      if(etageEl) etageEl.value=val;
      var row=document.getElementById('zw-row-'+i);
      if(row) row.style.background='';
      var badge=row?row.querySelector('.zw-etage-badge'):null;
      if(badge) badge.remove();
    }
  });
  // Cacher la section batch
  var section=document.getElementById('zw-batch-etage-section');
  if(section) section.style.display='none';
  // Retirer l'alerte étage manquant si tout est résolu
  if(applied===n){
    var alerts=document.querySelectorAll('[style*="orange"]');
    // Mise à jour propre : re-render léger du header count
  }
}

function _zonesRemoveAllDoublons(){
  _zonesWizardData=_zonesWizardData.filter(function(z){return z.erreur!=='doublon';});
  _zonesWizardDedupCount=0;
  if(_session)renderRespTech(_session,'config');
}

function _zonesWizardToggleEq(cat,eq,on){
  if(!_zonesWizardEqSel[cat])_zonesWizardEqSel[cat]=[];
  var arr=_zonesWizardEqSel[cat];
  var idx=arr.indexOf(eq);
  if(on&&idx<0){
    arr.push(eq);
  } else if(!on&&idx>=0){
    arr.splice(idx,1);
  }
  if(_session)renderRespTech(_session,'config');
}


function _zonesWizardAddCustomEq(cat,inputId){
  var inp=document.getElementById(inputId);
  if(!inp)return;
  var val=(inp.value||'').trim();
  if(!val)return;
  if(!_zonesWizardEqSel[cat])_zonesWizardEqSel[cat]=[];
  if(_zonesWizardEqSel[cat].indexOf(val)<0)_zonesWizardEqSel[cat].push(val);
  var templates=_ZONE_EQ_TEMPLATES[cat]||[];
  if(templates.indexOf(val)<0)templates.push(val);
  inp.value='';
  if(_session)renderRespTech(_session,'config');
}

function _zonesWizardStep2(){
  // Lire les corrections du tableau (step 1 → step 2)
  _zonesWizardData.forEach(function(z,i){
    var etageEl=document.getElementById('zw-etage-'+i);
    var nomEl=document.getElementById('zw-nom-'+i);
    var catEl=document.getElementById('zw-cat-'+i);
    if(etageEl)z.etage=(etageEl.value||'').trim()||null;
    if(nomEl)z.nom=(nomEl.value||'').trim()||z.nom;
    if(catEl)z.categorie=catEl.value||'Autre';
    if(z.erreur==='typo')z.erreur=null; // considéré corrigé
  });
  // Nettoyer les erreurs restantes (doublons déjà retirés à l'import)
  _zonesWizardData=_zonesWizardData.filter(function(z){return z.nom&&z.nom.length>=2;});
  _zonesWizardStep=2;
  if(_session)renderRespTech(_session,'config');
}

function _zonesWizardStep3(){
  _zonesWizardStep=3;
  if(_session)renderRespTech(_session,'config');
}

async function _zonesWizardImport(){
  var sid=_zonesWizardSid;
  if(!sid)return;
  var statusEl=document.getElementById('zones-import-status');
  if(statusEl)statusEl.textContent='Import en cours…';

  var zones=_zonesWizardData.filter(function(z){return z.erreur!=='doublon'&&z.nom;});
  var created=[]; // [{zone_id, zone_nom, categorie}]

  // Batch zones via fetch direct (array insert)
  try{
    var zoneRows=zones.map(function(z,i){
      return {site_id:sid,nom:z.nom,etage:z.etage||null,categorie:z.categorie||'Autre',type:z.type||'espace_commun',actif:true,ordre:i};
    });
    var r=await fetch(window.SUPA_URL+'/rest/v1/zones',{
      method:'POST',
      headers:{'apikey':window.SUPA_KEY,'Authorization':'Bearer '+window.SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
      body:JSON.stringify(zoneRows)
    });
    if(!r.ok){var e=await r.json();if(statusEl)statusEl.textContent='Erreur zones: '+(e.message||r.status);return;}
    created=await r.json();
  }catch(err){if(statusEl)statusEl.textContent='Erreur réseau: '+err.message;return;}

  // Créer les équipements liés dans equipements_zone (signalements uniquement)
  var eqRows=[];
  created.forEach(function(z){
    var eqs=_zonesWizardEqSel[z.categorie]||[];
    eqs.forEach(function(eqNom){
      eqRows.push({site_id:sid,zone_id:z.id,nom:eqNom+' — '+z.nom,actif:true});
    });
  });

  if(eqRows.length){
    try{
      var r2=await fetch(window.SUPA_URL+'/rest/v1/equipements_zone',{
        method:'POST',
        headers:{'apikey':window.SUPA_KEY,'Authorization':'Bearer '+window.SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(eqRows)
      });
      if(!r2.ok&&statusEl){var e2=await r2.json();statusEl.textContent='Zones créées, erreur équipements: '+(e2.message||r2.status);return;}
    }catch(err){if(statusEl)statusEl.textContent='Zones créées, erreur réseau équipements: '+err.message;return;}
  }

  // Succès
  _zonesWizardStep=0;
  _zonesWizardData=[];
  _zonesWizardEqSel={};
  if(_session)renderRespTech(_session,'config');
}

async function _zonesDeleteOne(zoneId){
  await supaDelete('zones','id=eq.'+zoneId);
  if(_session)renderRespTech(_session,'config');
}

async function _zonesDeleteAll(){
  var sid=_zonesWizardSid||(_session&&_session.groupe_id);
  if(!sid)return;
  if(!confirm('Supprimer toutes les zones de ce site ?'))return;
  await supaDelete('zones','site_id=eq.'+sid);
  if(_session)renderRespTech(_session,'config');
}

// ── Parser Excel (SheetJS) ──
function _zonesHandleFile(file,sid){
  if(!file)return;
  var statusEl=document.getElementById('zones-parse-status');
  if(statusEl)statusEl.textContent='Chargement…';
  _zonesWizardSid=sid;

  // Normalise une cellule pour la comparaison : retire accents, espaces, °
  function _normCell(v){
    return (v+'').trim().toUpperCase()
      .replace(/[ÉÈÊË]/g,'E').replace(/[ÀÂÄÁ]/g,'A')
      .replace(/[ÙÛÜÚ]/g,'U').replace(/[ÎÏÍÌ]/g,'I')
      .replace(/[ÔÖÓÒ]/g,'O').replace(/[Ç]/g,'C')
      .replace(/[°°\s]+/g,'');
  }

  function doparse(XLSX){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(e.target.result,{type:'array',cellText:false,cellDates:true});
        var allZones=[];

        wb.SheetNames.forEach(function(sheetName){
          var ws=wb.Sheets[sheetName];
          var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
          var isChambre=/chambre/i.test(sheetName);
          var type=isChambre?'chambre':'espace_commun';

          // Trouver la ligne d'en-tête — cherche celle qui contient DESIGNATION ou CHAMBRE (nom)
          // L'en-tête ETAGE peut être dans la même ligne ou dans une ligne adjacente (cellules fusionnées)
          var headerRow=-1;
          var etageCol=-1,nameCol=-1;

          for(var ri=0;ri<Math.min(rows.length,18);ri++){
            var row=rows[ri];
            var foundE=-1,foundN=-1;
            for(var ci=0;ci<Math.min(row.length,30);ci++){
              var cn=_normCell(row[ci]);
              if(cn.length===0) continue;
              // Colonne ETAGE : contient 'ETAGE' et assez courte
              if(cn.indexOf('ETAGE')>=0&&cn.length<=20) foundE=ci;
              // Colonne NOM/CHAMBRE/DESIGNATION — accepte toute variante
              // ex: "DESIGNATION", "N° DE CHAMBRE" → "NDECHAMBRE", "NOM", etc.
              if(cn.indexOf('DESIGNATION')>=0||cn.indexOf('CHAMBRE')>=0||cn==='NOM') foundN=ci;
            }
            if(foundN>=0){
              nameCol=foundN;
              headerRow=ri;
              if(foundE>=0) etageCol=foundE;
              break;
            }
          }
          if(headerRow<0||nameCol<0)return; // onglet non reconnu

          // Si ETAGE pas trouvé dans la ligne d'en-tête, chercher dans les ±3 lignes voisines
          // (cas cellules fusionnées où l'en-tête est dans une ligne séparée)
          if(etageCol<0){
            for(var rr=Math.max(0,headerRow-3);rr<=Math.min(rows.length-1,headerRow+1);rr++){
              if(rr===headerRow) continue;
              for(var cc=0;cc<Math.min(rows[rr].length,30);cc++){
                var cnn=_normCell(rows[rr][cc]);
                if(cnn.indexOf('ETAGE')>=0&&cnn.length<=20){etageCol=cc;break;}
              }
              if(etageCol>=0) break;
            }
          }

          // Si toujours pas trouvé, essayer de détecter ETAGE dans les premières cellules de données
          // en cherchant la colonne qui a des valeurs ressemblant à un étage (RDC, 1, 2, "1er", etc.)
          if(etageCol<0&&headerRow>=0){
            var etagePattern=/^(rdc|rez|rdc?|[0-9]{1,2}(er|ème|e)?\.?|sous.sol|ss|rez.de.chaussee|etage\s*[0-9])$/i;
            for(var cc2=0;cc2<Math.min((rows[headerRow+1]||[]).length,nameCol);cc2++){
              var sampleVals=[];
              for(var rs=headerRow+1;rs<Math.min(rows.length,headerRow+8);rs++){
                var sv=(rows[rs][cc2]+'').trim();
                if(sv) sampleVals.push(sv);
              }
              // Au moins 1 valeur sur les premières lignes ressemble à un étage
              if(sampleVals.length>0&&sampleVals.some(function(v){return etagePattern.test(v)||/^[A-Z0-9 ]{1,10}$/.test(v);})){
                etageCol=cc2; break;
              }
            }
          }

          // Lire les données en dessous
          var lastEtage=null;
          var seen={};
          for(var di=headerRow+1;di<rows.length;di++){
            var drow=rows[di];
            var etageVal=(etageCol>=0?(drow[etageCol]+'').trim():'')||null;
            var nameVal=(nameCol<drow.length?(drow[nameCol]+'').trim():'');
            if(etageVal)lastEtage=etageVal;
            if(!nameVal||nameVal.length<2)continue;

            // Détecter doublon
            var key=(lastEtage||'')+'|'+nameVal.toLowerCase();
            var isDup=!!seen[key];
            seen[key]=true;

            // Détecter typo simple
            var hasTypo=/ELCETRO|GUERRITE|ADMINIT|LOCL\b/i.test(nameVal);

            // Deviner catégorie
            var cat='Autre';
            if(isChambre)cat='Hébergement';
            else if(/restaurant|bar|cuisine|snack|banquet|room.?serv/i.test(nameVal))cat='Restauration';
            else if(/technique|electr|pompe|buanderie|groupe|tableau|chaufferie|onduleur/i.test(nameVal))cat='Technique';
            else if(/piscine|fitness|sport|spa|sauna|massage|loisir|jacuzzi/i.test(nameVal))cat='Loisirs';
            else if(/casino|jeu|machine/i.test(nameVal))cat='Casino';
            else if(/reception|accueil|lobby|hall|concierg/i.test(nameVal))cat='Accueil';
            else if(/boutique|commerce|galerie|pressing/i.test(nameVal))cat='Commerce';
            else if(/bureau|direction|admin|rh\b|meeting|salle de conf/i.test(nameVal))cat='Bureaux';
            else if(/couloir|ascenseur|escalier|parking|corridor/i.test(nameVal))cat='Circulation';

            allZones.push({
              nom:nameVal,
              etage:lastEtage,
              categorie:cat,
              type:type,
              erreur:isDup?'doublon':(lastEtage===null&&di>headerRow+2?'etage_manquant':(hasTypo?'typo':null))
            });
          }
        });

        if(!allZones.length){if(statusEl)statusEl.textContent='Aucune zone trouvée. Vérifiez le format du fichier.';return;}
        _zonesWizardDedupCount=allZones.filter(function(z){return z.erreur==='doublon';}).length;
        _zonesWizardData=allZones;
        _zonesWizardStep=1;
        _zonesWizardEqSel={};
        if(_session)renderRespTech(_session,'config');
      }catch(err){if(statusEl)statusEl.textContent='Erreur lecture fichier: '+err.message;console.error('zones parse error',err);}
    };
    reader.readAsArrayBuffer(file);
  }

  // Charger SheetJS si nécessaire
  if(window.XLSX){doparse(window.XLSX);}
  else{
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=function(){doparse(window.XLSX);};
    s.onerror=function(){if(statusEl)statusEl.textContent='Impossible de charger SheetJS. Vérifiez votre connexion.';};
    document.head.appendChild(s);
  }
}

function _eqImportStart(sid){

  if(_session)renderRespTech(_session,'config');
}

function _eqImportBack(){
  _eqImportStep=Math.max(0,_eqImportStep-1);
  if(_eqImportStep===0){_eqImportByCat={};_eqImportBlocZones=[];_eqImportIndivZones={};_eqImportActiveIndivKey=null;_eqImportAssignMode='bloc';}
  if(_session)renderRespTech(_session,'config');
}

function _eqImportRenderStep(zones,sid){
  if(_eqImportStep===1)return _eqImportRenderUpload(zones,sid);
  if(_eqImportStep===2)return _eqImportRenderPreview(zones,sid);
  if(_eqImportStep===3)return _eqImportRenderAssign(zones,sid);
  return '';
}

      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
        '<span style="font-size:18px">'+icon+'</span>'+
        '<div style="flex:1">'+
          '<div style="font-size:13px;font-weight:700;color:var(--dark)">'+escape_html(cat)+'</div>'+
          '<div style="font-size:11px;color:'+matchColor+';margin-top:1px">'+matchInfo+'</div>'+
        '</div>'+
        '<span style="font-size:11px;font-weight:700;background:var(--amber-pale);color:var(--amber-dark);padding:2px 8px;border-radius:10px">'+eqs.length+' équipement'+(eqs.length!==1?'s':'')+'</span>'+

      '</div>'+
    '</div>';
  }).join('');
  return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">'+
    '<button onclick="_eqImportBack()" style="padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;background:white;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">← Retour</button>'+

  '</div>'+
