        '<div style="background:'+sInfo.col+'"></div>'+
        '<div style="padding:12px 14px">'+
          '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px">'+
            '<div>'+
              '<div style="font-size:13px;font-weight:700;color:var(--dark)">'+t.icon+' '+escape_html(r.titre||t.label)+'</div>'+
              '<div style="display:flex;align-items:center;gap:5px;margin-top:3px">'+
                '<span style="width:7px;height:7px;border-radius:50%;background:'+sInfo.col+';display:inline-block;flex-shrink:0"></span>'+
                '<span style="font-size:11px;color:var(--text3)">'+escape_html(sInfo.nom)+'</span>'+
                (eqNom?'<span style="font-size:11px;color:var(--text3)">· '+escape_html(eqNom)+'</span>':'')+
              '</div>'+
            '</div>'+
            '<div style="flex-shrink:0">'+statutBadge+'</div>'+
          '</div>'+
          '<div style="font-size:11px;color:var(--text3);display:flex;flex-wrap:wrap;gap:10px">'+
            (dateStr?'<span>📅 '+dateStr+'</span>':'')+
            (r.prestataire?'<span>👷 '+escape_html(r.prestataire)+'</span>':'')+
            (r.quantite?'<span>📦 '+r.quantite+(r.unite?' '+r.unite:'')+'</span>':'')+

    }).join('');
  }
  return kpiHtml+filtersHtml+recapHtml+bannerHtml+listTitle+cards;
}

/* ── DIR TECH : rapport conso (tab landing page) ── */

async function _dtEnObjSave(siteId){
  var fluides=(window._dtEnFluides||[]).filter(function(f){return f.site_id===siteId;});
  var objs=window._dtEnObjs||[];
  var today=todayStr();
  var moisDebut=new Date().toISOString().split('T')[0].substring(0,7)+'-01';
  var msgEl=document.getElementById('dt-en-save-msg');
  if(msgEl)msgEl.textContent='Enregistrement…';

  var errors=[];var saved=0;

  for(var i=0;i<fluides.length;i++){
    var f=fluides[i];
    var valInput=document.getElementById('dt-en-val-'+f.id);
    var debInput=document.getElementById('dt-en-deb-'+f.id);
    var finInput=document.getElementById('dt-en-fin-'+f.id);
    var noteInput=document.getElementById('dt-en-note-'+f.id);
    if(!valInput||!valInput.value)continue; // skip if empty — no change
    var valeur=parseFloat(valInput.value);
    if(isNaN(valeur)||valeur<0){errors.push(f.nom+' : valeur invalide');continue;}
    var dateDebut=debInput&&debInput.value?debInput.value:moisDebut;
    var dateFin=finInput&&finInput.value?finInput.value:null;
    var note=noteInput&&noteInput.value?noteInput.value.trim():null;

    // Find active objective to close (date_debut <= today, date_fin null or >= dateDebut)
    var prevObj=null;
    objs.forEach(function(o){
      if(o.fluide_id!==f.id)return;
      if(!o.id)return; // skip synthetic fallbacks
      if(!o.date_debut||o.date_debut>today)return;
      if(o.date_fin&&o.date_fin<dateDebut)return;
      if(!prevObj||o.date_debut>prevObj.date_debut)prevObj=o;
    });

    // PATCH previous objective: set date_fin = dateDebut - 1 day
    if(prevObj&&prevObj.id){
      var dPrev=new Date(dateDebut);
      dPrev.setDate(dPrev.getDate()-1);
      var closingDate=dPrev.toISOString().split('T')[0];
      var ok=await supaPatch('objectifs_energie',prevObj.id,{date_fin:closingDate});
      if(!ok)errors.push(f.nom+' : impossible de fermer l\'objectif précédent');
    }

    // INSERT new objective
    var newObj={site_id:siteId,fluide_id:f.id,valeur:valeur,date_debut:dateDebut};
    if(dateFin)newObj.date_fin=dateFin;
    if(note)newObj.note=note;
    var res=await supaPost('objectifs_energie',newObj);
    if(res){saved++;} else {errors.push(f.nom+' : échec de l\'enregistrement');}
  }

  if(errors.length){
    if(msgEl)msgEl.style.color='var(--rouge)';
    if(msgEl)msgEl.textContent='⚠ '+errors.join(' · ');
  } else if(saved===0){
    if(msgEl)msgEl.style.color='var(--text3)';
    if(msgEl)msgEl.textContent='Aucune modification (laissez une valeur vide pour ne pas changer)';
  } else {
    if(msgEl)msgEl.style.color='var(--vert)';
    if(msgEl)msgEl.textContent='✓ '+saved+' objectif'+(saved>1?'s':'')+ ' enregistré'+(saved>1?'s':'');
    // Refresh the view after 1.2s
    setTimeout(function(){renderDirTech(_session,'energie');},1200);
  }
}

var _fiabPeriod=90;
async function _dtFiabilite(sid){
  var period=_fiabPeriod||90;
  var cutoffTs=new Date(Date.now()-period*86400000).toISOString();
  var[signalements,equipements]=await Promise.all([
    supaGet('signalements','groupe_id=eq.'+sid+'&statut=eq.resolu&resolved_at=gte.'+cutoffTs+'&select=id,equipement_id,created_at,resolved_at,equipements(nom)&order=created_at.desc'),
    supaGet('equipements','site_id=eq.'+sid+'&actif=eq.true&select=id,nom,type&order=nom.asc')
  ]);
  var eqMap={};equipements.forEach(function(e){eqMap[e.id]=e;});
  var statsById={};
  signalements.forEach(function(s){
    var eid=s.equipement_id;if(!eid)return;
    if(!statsById[eid])statsById[eid]={nb_pannes:0,ttrs:[],last_at:null,nom:null};
    if(!statsById[eid].nom&&s.equipements&&s.equipements.nom)statsById[eid].nom=s.equipements.nom;
    statsById[eid].nb_pannes++;
    if(s.created_at&&s.resolved_at){var ttr=(new Date(s.resolved_at)-new Date(s.created_at))/3600000;if(ttr>=0)statsById[eid].ttrs.push(ttr);}
    if(!statsById[eid].last_at||s.created_at>statsById[eid].last_at)statsById[eid].last_at=s.created_at;
  });
  var rows=[];
  Object.keys(statsById).forEach(function(eid){
    var st=statsById[eid];var eq=eqMap[eid];
    var nom=st.nom||(eq?eq.nom:'Équipement #'+eid.substring(0,8));
    var mttr=st.ttrs.length?st.ttrs.reduce(function(a,b){return a+b;},0)/st.ttrs.length:null;
    rows.push({eid:eid,nom:nom,nb_pannes:st.nb_pannes,mttr:mttr,mtbf:period/st.nb_pannes,last_at:st.last_at});
  });
  equipements.forEach(function(e){if(!statsById[e.id])rows.push({eid:e.id,nom:e.nom,nb_pannes:0,mttr:null,mtbf:null,last_at:null});});
  rows.sort(function(a,b){return b.nb_pannes-a.nb_pannes;});
  var totalPannes=signalements.length;
  var allTtrs=signalements.filter(function(s){return s.created_at&&s.resolved_at;}).map(function(s){return(new Date(s.resolved_at)-new Date(s.created_at))/3600000;});
  var avgMttr=allTtrs.length?allTtrs.reduce(function(a,b){return a+b;},0)/allTtrs.length:null;
  var eqSains=rows.filter(function(r){return r.nb_pannes===0;}).length;
  var eqTouches=rows.filter(function(r){return r.nb_pannes>0;}).length;
  function fmtDur(h){if(h===null||h===undefined)return '—';if(h<1)return Math.round(h*60)+'min';if(h<48)return h.toFixed(1)+'h';return(h/24).toFixed(1)+'j';}
  function fmtD(iso){if(!iso)return'—';return new Date(iso+'').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
  function scoreCol(nb){if(nb===0)return'var(--vert)';if(nb<=1)return'#b45309';if(nb<=3)return'var(--orange)';return'var(--rouge)';}
  var periodBtns=[30,90,180,365].map(function(p){return'<button onclick="_fiabSetPeriod('+p+')" style="padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid '+(p===period?'var(--dark)':'var(--border)')+';background:'+(p===period?'var(--dark)':'transparent')+';color:'+(p===period?'var(--creme)':'var(--text2)')+'">'+p+'j</button>';}).join('');
  var kpiCss='background:var(--creme);border:1px solid var(--border);border-radius:10px;padding:14px 16px;flex:1;min-width:120px;';
  var kpiHtml='<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px">'+
    [{icon:'🔴',label:'Pannes ('+period+'j)',val:totalPannes,sub:'signalements résolus'},
     {icon:'⚠️',label:'Équipements touchés',val:eqTouches,sub:'sur '+equipements.length+' actifs'},
     {icon:'⏱️',label:'MTTR moyen',val:fmtDur(avgMttr),sub:'temps de résolution'},
     {icon:'✅',label:'Sans incident',val:eqSains,sub:'équipements fiables'}
    ].map(function(k){return'<div style="'+kpiCss+'"><div style="font-size:18px;margin-bottom:4px">'+k.icon+'</div><div style="font-size:20px;font-weight:800;color:var(--dark);margin-bottom:2px">'+k.val+'</div><div style="font-size:10px;font-weight:600;color:var(--text2)">'+k.label+'</div><div style="font-size:10px;color:var(--text3)">'+k.sub+'</div></div>';}).join('')+'</div>';
  var tableRows=rows.map(function(r){
    var mtbfStr=r.mtbf?Math.round(r.mtbf)+'j':'—';
    var mtbfCol=r.mtbf?(r.mtbf<15?'var(--rouge)':r.mtbf<30?'var(--orange)':'var(--vert)'):'var(--text3)';

      '<td style="padding:10px 12px;text-align:center;font-size:13px;color:var(--text2)">'+fmtDur(r.mttr)+'</td>'+
      '<td style="padding:10px 12px;text-align:center;font-size:12px;color:var(--text3)">'+fmtD(r.last_at)+'</td>'+
    '</tr>';
  }).join('');
  return'<div style="max-width:900px;margin:0 auto">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">'+
      '<div><div style="font-size:17px;font-weight:800;color:var(--dark)">📊 Fiabilité équipements</div>'+
      '<div style="font-size:12px;color:var(--text3);margin-top:2px">MTBF · MTTR · Pannes sur la période sélectionnée</div></div>'+
      '<div style="display:flex;gap:4px;align-items:center;background:var(--creme);border:1px solid var(--border);border-radius:8px;padding:4px">'+periodBtns+'</div>'+
    '</div>'+
    kpiHtml+
    '<div style="background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden">'+
      '<table style="width:100%;border-collapse:collapse">'+
        '<thead><tr style="background:var(--creme)">'+
          '<th style="text-align:left;padding:8px 12px;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase">Équipement</th>'+
          '<th style="text-align:center;padding:8px 12px;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase">Pannes</th>'+

        '</tr></thead>'+

    '</div>'+

}

/* ── DIR TECH : vue équipe ── */
async function _dtEquipe(sids,session){
  if(!sids.length)return'<div class="placeholder-card"><div class="placeholder-icon">👷</div>Aucun site configuré</div>';
  var sidStr=sids.join(',');
  var cutoff=dateNJours(30);
  var[contacts,signalements,sites]=await Promise.all([
    supaGet('contacts','site_id=in.('+sidStr+')&role=eq.technicien&actif=eq.true&select=id,nom,site_id,whatsapp'),
    supaGet('signalements','groupe_id=in.('+sidStr+')&created_at=gte.'+cutoff+'T00:00:00&select=id,groupe_id,statut,assigne_a,pris_en_charge_par,created_at,resolved_at,cout_intervention&order=created_at.desc&limit=300'),
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});

  // Stats par tech
  var techStats={};
  contacts.forEach(function(c){
    if(!techStats[c.nom])techStats[c.nom]={nom:c.nom,site:siteMap[c.site_id]||'—',total:0,resolus:0,enCours:0,ttrs:[],cout:0};
  });
  signalements.forEach(function(s){
    var t=s.assigne_a||s.pris_en_charge_par;if(!t)return;
    if(!techStats[t])techStats[t]={nom:t,site:siteMap[s.groupe_id]||'—',total:0,resolus:0,enCours:0,ttrs:[],cout:0};
    techStats[t].total++;
    techStats[t].cout+=Number(s.cout_intervention)||0;
    if(s.statut==='resolu'){
      techStats[t].resolus++;
      if(s.created_at&&s.resolved_at){var ttr=(new Date(s.resolved_at)-new Date(s.created_at))/3600000;if(ttr>=0)techStats[t].ttrs.push(ttr);}
    }else{techStats[t].enCours++;}
  });

  var rows=Object.values(techStats).sort(function(a,b){return b.total-a.total;});
  var totalAssignes=signalements.filter(function(s){return s.assigne_a||s.pris_en_charge_par;}).length;
  var nonAssignes=signalements.filter(function(s){return !s.assigne_a&&!s.pris_en_charge_par&&s.statut!=='resolu';}).length;
  function fmtH(h){if(h===null||h===undefined)return'—';if(h<1)return Math.round(h*60)+'min';if(h<48)return h.toFixed(1)+'h';return(h/24).toFixed(1)+'j';}

  var kpis='<div class="kpi-grid" style="margin-bottom:20px">'+
    '<div class="kpi"><div class="kpi-label">Techniciens actifs</div><div class="kpi-value">'+contacts.length+'</div><div class="kpi-trend">Tous sites</div></div>'+
    '<div class="kpi"><div class="kpi-label">Interventions assignées</div><div class="kpi-value">'+totalAssignes+'</div><div class="kpi-trend">30 derniers jours</div></div>'+
    '<div class="kpi"><div class="kpi-label">Non assignées</div><div class="kpi-value" style="color:'+(nonAssignes>0?'var(--rouge)':'var(--vert)')+'">'+nonAssignes+'</div><div class="kpi-trend">Pannes sans affectation</div></div>'+
  '</div>';

  if(!rows.length)return kpis+'<div class="placeholder-card"><div class="placeholder-icon">👷</div>Aucun technicien trouvé</div>';

  var table='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'+
    '<thead><tr>'+
      '<th style="text-align:left;padding:10px 12px;background:var(--creme);color:var(--text2);font-weight:600;font-size:11px">Technicien</th>'+
      '<th style="padding:10px 12px;background:var(--creme);color:var(--text2);font-weight:600;font-size:11px">Hôtel</th>'+
      '<th style="padding:10px 12px;background:var(--creme);color:var(--text2);font-weight:600;font-size:11px;text-align:center">Total</th>'+
      '<th style="padding:10px 12px;background:var(--creme);color:var(--text2);font-weight:600;font-size:11px;text-align:center">En cours</th>'+
      '<th style="padding:10px 12px;background:var(--creme);color:var(--text2);font-weight:600;font-size:11px;text-align:center">Résolues</th>'+
      '<th style="padding:10px 12px;background:var(--creme);color:var(--text2);font-weight:600;font-size:11px;text-align:center">MTTR</th>'+
      '<th style="padding:10px 12px;background:var(--creme);color:var(--text2);font-weight:600;font-size:11px;text-align:right">Coût géré</th>'+
    '</tr></thead><tbody>'+
    rows.map(function(r,i){
      var mttr=r.ttrs.length?r.ttrs.reduce(function(a,b){return a+b;},0)/r.ttrs.length:null;
      var mttrCol=mttr===null?'var(--text3)':mttr<24?'var(--vert)':mttr<72?'var(--amber)':'var(--rouge)';
      var enCoursCol=r.enCours===0?'var(--vert)':r.enCours<=2?'var(--amber)':'var(--rouge)';
      var taux=r.total>0?Math.round(r.resolus/r.total*100):null;
      return'<tr style="background:'+(i%2?'var(--creme)':'white')+';border-bottom:1px solid var(--border)">'+
        '<td style="padding:10px 12px;font-weight:700;color:var(--dark)">'+escape_html(r.nom)+'</td>'+
        '<td style="padding:10px 12px;font-size:12px;color:var(--text2)">'+escape_html(r.site)+'</td>'+
        '<td style="padding:10px 12px;text-align:center;font-weight:800;font-size:16px">'+r.total+'</td>'+
        '<td style="padding:10px 12px;text-align:center;font-weight:700;color:'+enCoursCol+'">'+r.enCours+'</td>'+
        '<td style="padding:10px 12px;text-align:center;color:var(--vert);font-weight:600">'+r.resolus+(taux!==null?' <span style="font-size:10px;color:var(--text3)">('+taux+'%)</span>':'')+'</td>'+
        '<td style="padding:10px 12px;text-align:center;font-weight:700;color:'+mttrCol+'">'+fmtH(mttr)+'</td>'+
        '<td style="padding:10px 12px;text-align:right;font-size:12px;color:var(--text2)">'+(r.cout>0?r.cout.toLocaleString('fr-FR')+' FCFA':'—')+'</td>'+
      '</tr>';
    }).join('')+
  '</tbody></table></div>';

  return'<div style="max-width:900px">'+
    '<div style="font-size:18px;font-weight:800;color:var(--dark);margin-bottom:4px">👷 Vue équipe</div>'+
    '<div style="font-size:12px;color:var(--text2);margin-bottom:20px">Performances des techniciens — 30 derniers jours</div>'+
    kpis+
    '<div class="section-title" style="margin-bottom:12px">Tableau de performance</div>'+
    table+
  '</div>';
}

async function _doAccueil(session,sids,cid){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">🏨</div>Aucun site configuré pour ce compte</div>';
  var sidStr=sids.join(',');
  var since7=dateNJours(7);
  var since14=dateNJours(14);
  var threeDaysAgo=dateNJours(3);

  var[sites,alertes,pannes,rondes7,pannes14]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('alertes','client_id=eq.'+cid+'&resolue=eq.false&select=id,type,severite,message,created_at&order=created_at.desc&limit=50'),
    supaGet('pannes','site_id=in.('+sidStr+')&resolue=eq.false&select=id,site_id,type,description,date_panne,equipements(nom)&order=date_panne.asc&limit=50'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since7+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=200'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since14+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=60')
  ]);

  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});

  // Rondes 7j → conformité globale + par site
  var rIds7=rondes7.map(function(r){return r.id;});
  var rondesEq7=rIds7.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds7.join(',')+')'+'&select=ronde_id,statut'):[];
  // attach site_id to rondesEq via rondes7 map
  var rondeToSite={};
  rondes7.forEach(function(r){rondeToSite[r.id]=r.site_id;});
  var reByRonde7={};
  rondesEq7.forEach(function(re){
    if(!reByRonde7[re.ronde_id])reByRonde7[re.ronde_id]=[];
    reByRonde7[re.ronde_id].push(re);
  });

  var totalVal7=0,totalTot7=0;
  rondes7.forEach(function(r){
    var eq=reByRonde7[r.id]||[];
    totalTot7+=eq.length;
    totalVal7+=eq.filter(function(re){return re.statut==='valide';}).length;
  });
  var confGlobal7=totalTot7>0?Math.round(totalVal7/totalTot7*100):null;
  var totalAlertes=alertes.length+pannes.length;

  // Banner
  var banner=totalAlertes>0
    ?'<div class="alert-banner"><div class="ab-icon">🚨</div><div class="ab-body"><div class="ab-title">'+totalAlertes+' action'+(totalAlertes>1?'s':'')+' requise'+(totalAlertes>1?'s':'')+'</div><div class="ab-sub">Pannes ou alertes nécessitant votre attention</div></div></div>'
    :'<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Tous les sites opérationnels</div><div class="ab-sub">Aucune alerte active'+(confGlobal7!==null?' · '+confGlobal7+'% de conformité sur 7 jours':'')+'</div></div></div>';

  // KPIs
  var kpis='<div class="kpi-grid">'+
    '<div class="kpi"><div class="kpi-label">Hôtels suivis</div><div class="kpi-value">'+sites.length+'</div><div class="kpi-trend">Portefeuille Azalaï</div></div>'+
    '<div class="kpi"><div class="kpi-label">Actions requises</div><div class="kpi-value" style="color:'+(totalAlertes>0?'var(--rouge)':'var(--vert)')+'">'+totalAlertes+'</div><div class="kpi-trend">'+(totalAlertes>0?'À traiter':'RAS')+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Conformité 7 jours</div><div class="kpi-value" style="color:'+(confGlobal7===null?'var(--text2)':confGlobal7===100?'var(--vert)':confGlobal7>=70?'var(--amber)':'var(--rouge)')+'">'+( confGlobal7!==null?confGlobal7+'%':'—')+'</div><div class="kpi-trend">Rondes tous sites</div></div>'+

            :'<span style="font-size:10px;font-weight:600;color:var(--vert)">RAS</span>')+
          '<span style="font-size:16px;color:var(--text3)">›</span>'+
        '</div>'+
      '</div>'+
      (sPct7!==null?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+sPct7+'%;background:'+(sPct7===100?'var(--vert)':sPct7>=70?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
    '</div>';
  });
  bloc1+='</div>';

  // Bloc 2 — Actions requises
  var bloc2='<div class="section-title">Actions requises</div>';
  var pannesRetard=pannes.filter(function(p){return p.date_panne&&p.date_panne<=threeDaysAgo;});
  var alertesCritiques=alertes.filter(function(a){return a.severite==='critical';});
  var pannesNormales=pannes.filter(function(p){return !p.date_panne||p.date_panne>threeDaysAgo;});
  var alertesNormales=alertes.filter(function(a){return a.severite!=='critical';});

  if(totalAlertes===0){
    bloc2+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune action requise</div><div class="ab-sub">Tous les délais sont respectés</div></div></div>';
  }else{
    var items='<div style="display:flex;flex-direction:column;gap:8px">';
    // Pannes en retard (> 3j) — priorité max
    pannesRetard.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var daysDiff=p.date_panne?Math.floor((new Date()-new Date(p.date_panne))/(1000*60*60*24)):0;
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';

        '<span style="font-size:16px;margin-top:1px">⏰</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--rouge)">Panne en retard · '+escape_html(sNom)+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(eqNom)+(p.description||p.type?' — '+escape_html(p.description||p.type):'')+'</div>'+
          '<div style="font-size:10px;color:var(--rouge);margin-top:4px;font-weight:600">'+daysDiff+' jour'+(daysDiff>1?'s':'')+' sans résolution · Signalé le '+ts+'</div>'+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'pannes\',\''+p.id+'\',\'accueil\')">✓ Résolu</button>'+
      '</div>';
    });
    // Alertes critiques
    alertesCritiques.forEach(function(a){
      var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      items+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
        '<span style="font-size:16px;margin-top:1px">🔴</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--rouge)">'+escape_html(a.type||'Alerte critique')+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
          (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'alertes\',\''+a.id+'\',\'accueil\')">✓ Traité</button>'+
      '</div>';
    });
    // Pannes récentes (< 3j)
    pannesNormales.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      items+='<div class="alerte-card" style="background:var(--orange-pale);border:1px solid var(--orange-border);border-left:3px solid var(--orange)">'+
        '<span style="font-size:16px;margin-top:1px">🟡</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--orange)">Panne · '+escape_html(sNom)+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(eqNom)+(p.description||p.type?' — '+escape_html(p.description||p.type):'')+'</div>'+
          (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'pannes\',\''+p.id+'\',\'accueil\')">✓ Résolu</button>'+
      '</div>';
    });
    // Alertes non-critiques
    alertesNormales.forEach(function(a){
      var ts=a.created_at?new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      items+='<div class="alerte-card" style="background:var(--amber-pale);border:1px solid var(--amber-border);border-left:3px solid var(--amber)">'+
        '<span style="font-size:16px;margin-top:1px">🟡</span>'+
        '<div style="flex:1">'+
          '<div class="alerte-card-titre" style="color:var(--amber)">'+escape_html(a.type||'Alerte')+'</div>'+
          '<div class="alerte-card-msg">'+escape_html(a.message||'')+'</div>'+
          (ts?'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+ts+'</div>':'')+
        '</div>'+
        '<button class="btn-traite" onclick="_marquerTraiteDO(\'alertes\',\''+a.id+'\',\'accueil\')">✓ Traité</button>'+
      '</div>';
    });
    bloc2+=items+'</div>';
  }

  // Bloc 3 — Activité récente 14j
  var bloc3='<div class="section-title">Activité récente <span style="font-size:12px;font-weight:400;color:var(--text3)">— 14 jours</span></div>';
  if(pannes14.length===0){
    bloc3+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur 14 jours</div><div class="ab-sub">Tous les sites sont stables</div></div></div>';
  }else{
    bloc3+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannes14.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      bloc3+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+

  var recos=await _buildRecommandations(sids,siteMap);

async function _marquerTraiteDO(table,id,fromNav){
  var btn=event&&event.target;
  if(btn){btn.disabled=true;btn.textContent='...';}
  await supaPatch(table,id,{resolue:true});
  if(_session)renderDirOps(_session,fromNav||'alertes');
}

async function _doHistorique(sids){
  if(!sids.length)return '<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucun site configuré</div>';
  var sidStr=sids.join(',');
  var period=_histPeriod||30;
  var since30=dateNJours(30);
  var cutoff=dateNJours(period);
  var[sites,rondes,pannes]=await Promise.all([
    supaGet('sites','id=in.('+sidStr+')&select=id,nom'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since30+'&select=id,site_id,date_ronde,frequence&order=date_ronde.desc&limit=300'),
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since30+'&select=id,site_id,type,description,date_panne,resolue,equipements(nom)&order=date_panne.desc&limit=120')
  ]);
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});
  var rondesFilt=rondes.filter(function(r){return r.date_ronde>=cutoff;});
  var pannesFilt=pannes.filter(function(p){return!p.date_panne||p.date_panne>=cutoff;});
  var h=_buildPeriodSelector(period);
  if(rondesFilt.length===0&&pannesFilt.length===0){
    return h+'<div class="placeholder-card"><div class="placeholder-icon">📊</div>Aucune donnée sur les '+period+' derniers jours</div>';
  }
  // Rondes groupées par date → par site
  if(rondesFilt.length>0){
    var rIds=rondesFilt.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=ronde_id,statut');
    var reByRonde={};
    rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});
    var byDate={};
    rondesFilt.forEach(function(ro){var d=ro.date_ronde;if(!byDate[d])byDate[d]=[];byDate[d].push(ro);});
    var dates=Object.keys(byDate).sort(function(a,b){return b>a?1:-1;});
    h+='<div class="section-title" style="margin-top:4px">Rondes</div><div style="display:flex;flex-direction:column;gap:10px">';
    dates.forEach(function(d){
      var dateDisp=new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      var isToday=d===todayStr();
      h+='<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:8px;margin-bottom:2px">'+(isToday?'Aujourd\'hui — ':'')+dateDisp+'</div>';
      var bySite={};
      byDate[d].forEach(function(ro){if(!bySite[ro.site_id])bySite[ro.site_id]=[];bySite[ro.site_id].push(ro);});
      Object.keys(bySite).forEach(function(sid){
        var sNom=siteMap[sid]||'Site';
        var sRondes=bySite[sid];
        var allEq=[];
        sRondes.forEach(function(ro){allEq=allEq.concat(reByRonde[ro.id]||[]);});
        var val=allEq.filter(function(re){return re.statut==='valide';}).length;
        var tot=allEq.length;
        var pct=tot>0?Math.round(val/tot*100):0;
        var ok=val===tot&&tot>0;
        h+='<div class="ronde-card">'+
          '<div style="display:flex;align-items:center;gap:12px'+(tot>0?';margin-bottom:10px':'')+'">'+
            '<span style="font-size:20px">'+(ok?'✅':tot===0?'📋':pct>0?'🔄':'❌')+'</span>'+
            '<div style="flex:1">'+
              '<div style="font-size:13px;font-weight:600">'+escape_html(sNom)+'</div>'+
              '<div style="font-size:11px;color:var(--text2);margin-top:2px">'+(tot>0?val+'/'+tot+' équipements · '+sRondes.length+' ronde'+(sRondes.length>1?'s':''):'Aucune donnée')+'</div>'+
            '</div>'+
            '<span style="font-family:\'Cormorant Garamond\',serif;font-size:22px;font-weight:600;color:'+(ok?'var(--vert)':tot===0?'var(--text3)':'var(--amber)')+'">'+( tot>0?pct+'%':'—')+'</span>'+
          '</div>'+
          (tot>0?'<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:'+(ok?'var(--vert)':pct>0?'var(--amber)':'var(--rouge)')+'"></div></div>':'')+
        '</div>';
      });
    });
    h+='</div>';
  }
  // Pannes
  h+='<div class="section-title">Pannes <span style="font-size:12px;font-weight:400;color:var(--text3)">— '+period+' jours</span></div>';
  if(pannesFilt.length===0){
    h+='<div class="alert-banner ok"><div class="ab-icon">✅</div><div class="ab-body"><div class="ab-title">Aucune panne sur cette période</div></div></div>';
  }else{
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    pannesFilt.forEach(function(p){
      var eqNom=p.equipements&&p.equipements.nom?p.equipements.nom:'Équipement';
      var sNom=siteMap[p.site_id]||'Site';
      var ts=p.date_panne?new Date(p.date_panne).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      var resolved=p.resolue;
      h+='<div class="eq-card" style="padding:12px 14px'+(resolved?';opacity:0.65':'')+'">'+
        '<span style="font-size:16px">'+(resolved?'✅':'🔴')+'</span>'+
        '<div style="flex:1">'+
          '<div class="eq-card-nom">'+escape_html(eqNom)+' <span style="font-weight:400;color:var(--text2)">· '+escape_html(sNom)+'</span></div>'+
          '<div class="eq-card-type">'+(p.type?escape_html(p.type)+' — ':'')+escape_html(p.description||'')+(ts?' · '+ts:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;font-weight:600;color:'+(resolved?'var(--vert)':'var(--rouge)')+'">'+( resolved?'Résolu':'En cours')+'</span>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

/* ── DIR OPS : détail site ── */
function renderDirOpsSite(session,sid,siteNom,nav){
  nav=nav||'accueil';
  _doCurrentSite={id:sid,nom:siteNom};
  var skeleton='<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px"><span class="spinner"></span>Chargement...</div>';
  app().innerHTML=buildLayout(session,nav,skeleton);
  var tb=document.querySelector('.dash-topbar-title');
  if(tb)tb.textContent=siteNom;
  _loadDOSite(session,sid,siteNom,nav);
}

async function _loadDOSite(session,sid,siteNom,nav){
  var cid=session.client_id;
  var el=document.querySelector('.dash-content');
  if(!el)return;
  try{
    var back='<button onclick="_exitDOSiteDetail()" style="display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:7px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;margin-bottom:8px;transition:background 0.12s" onmouseover="this.style.background=\'var(--creme)\'" onmouseout="this.style.background=\'none\'">← Tous les hôtels</button>';
    var html=back;
    if(nav==='accueil')html+=await _rtAccueil(session,sid,cid);
    else if(nav==='alertes')html+=await _rtAlertes(sid,cid);
    else if(nav==='historique')html+=await _rtHistorique(sid);
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="alert-banner" style="margin-top:12px"><div class="ab-icon">⚠️</div><div class="ab-body"><div class="ab-title">Erreur de chargement</div><div class="ab-sub">'+(e.message||'Vérifiez votre connexion')+'</div></div></div>';
  }
}

function _exitDOSiteDetail(){
  _doCurrentSite=null;
  renderDirOps(_session,'accueil');
}

function _timeAgo(isoStr){
  if(!isoStr)return'';
  var diff=Math.round((Date.now()-new Date(isoStr))/60000);
  if(diff<1)return'à l\'instant';
  if(diff<60)return'il y a '+diff+' min';
  if(diff<1440)return'il y a '+Math.round(diff/60)+'h';
  return'il y a '+Math.round(diff/1440)+'j';
}

// Store reco data for action buttons (keyed by eqId+index to avoid JSON in onclick)
var _recoCache={};

function _buildRecoTag(reco,eqId,eqNom,sid){
  var cfgs={
    immediate:{bg:'var(--rouge-pale)',border:'var(--rouge-border)',color:'var(--rouge)',icon:'🔴',btnLabel:'Créer un signalement',btnFn:'_recoSignaler'},
    preventive:{bg:'var(--orange-pale)',border:'var(--orange-border)',color:'var(--orange)',icon:'🟡',btnLabel:'Planifier une maintenance',btnFn:'_recoPlanifier'},
    operationnelle:{bg:'var(--amber-pale)',border:'var(--amber-border)',color:'var(--amber)',icon:'🔧',btnLabel:'Signaler vétusté',btnFn:'_recoVetuste'}
  };
  var cfg=cfgs[reco.type]||cfgs.operationnelle;
  var cacheKey=(eqId||'x')+'_'+reco.type;
  _recoCache[cacheKey]={reco:reco,eqId:eqId,eqNom:eqNom,sid:sid};
  var btnHtml=eqId&&sid?
    '<button onclick="'+cfg.btnFn+'(\''+cacheKey+'\')" style="margin-top:6px;padding:5px 10px;border:1px solid '+cfg.border+';border-radius:6px;background:white;font-size:11px;font-weight:700;color:'+cfg.color+';cursor:pointer;width:100%">'+cfg.btnLabel+' →</button>':'';
  return '<div style="background:'+cfg.bg+';border:1px solid '+cfg.border+';border-radius:6px;padding:6px 10px">'+
    '<div style="display:flex;align-items:flex-start;gap:6px">'+
      '<span style="font-size:13px;flex-shrink:0;margin-top:1px">'+cfg.icon+'</span>'+
      '<span style="font-size:11px;color:'+cfg.color+';line-height:1.4">'+escape_html(reco.message)+'</span>'+
    '</div>'+
    btnHtml+
  '</div>';
}

async function _recoSignaler(cacheKey){
  var d=_recoCache[cacheKey];if(!d)return;
  await supaPost('signalements',{groupe_id:d.sid,equipement_id:d.eqId,type:'panne',description:d.reco.message,signale_par:(_session&&_session.contact&&_session.contact.nom)||null,statut:'ouvert',source:'manuel'});
  navTo('signalements');
}

async function _recoPlanifier(cacheKey){
  var d=_recoCache[cacheKey];if(!d)return;
  var date=prompt('Date planifiée (AAAA-MM-JJ) :',new Date(Date.now()+7*86400000).toISOString().split('T')[0]);
  if(!date)return;
  await supaPost('maintenances',{groupe_id:d.sid,equipement_id:d.eqId,type:'preventive',titre:'Maintenance préventive — '+escape_html(d.eqNom||''),description:d.reco.message,date_planifiee:date,statut:'planifie',created_by:(_session&&_session.contact&&_session.contact.nom)||null});
  navTo('maintenances');
}

async function _recoVetuste(cacheKey){
  var d=_recoCache[cacheKey];if(!d)return;
  await supaPost('signalements',{groupe_id:d.sid,equipement_id:d.eqId,type:'autre',description:'Vétusté — '+d.reco.message,signale_par:(_session&&_session.contact&&_session.contact.nom)||null,statut:'ouvert',source:'manuel'});
  navTo('signalements');
}

async function _fetchRecoEquipements(sid){
  var since7=dateNJours(7);
  var since90=dateNJours(90);
  // --- Rondes (7 derniers jours) ---
  var reToEq={};
  var reponses=[];
  var rondes7=await supaGet('rondes','site_id=eq.'+sid+'&date_ronde=gte.'+since7+'&select=id&limit=100');
  if(rondes7.length){
    var rIds=rondes7.map(function(r){return r.id;});
    var rondesEq=await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=id,equipement_id&limit=500');
    if(rondesEq.length){
      var reIds=rondesEq.map(function(re){return re.id;});
      rondesEq.forEach(function(re){reToEq[re.id]=re.equipement_id;});
      reponses=await supaGet('reponses','ronde_equipement_id=in.('+reIds.join(',')+')'+'&select=valeur,created_at,ronde_equipement_id,question_id,questions(texte,type_reponse,unite,seuil_min,seuil_max)'+'&order=created_at.desc&limit=600');
    }
  }
  var pannes90=await supaGet('pannes','site_id=eq.'+sid+'&date_panne=gte.'+since90+'&select=id,equipement_id&limit=200');
  var pannesByEq={};
  pannes90.forEach(function(p){pannesByEq[p.equipement_id]=(pannesByEq[p.equipement_id]||0)+1;});
  // Group reponses numériques (avec seuils) par équipement → question
  var repByEqQ={};
  var lastSaisieByEq={};
  reponses.forEach(function(r){
    var eqId=reToEq[r.ronde_equipement_id];
    if(!eqId)return;
    var q=r.questions;
    // Dernière saisie numérique (toutes questions)
    if(q&&q.type_reponse==='numerique'){
      if(!lastSaisieByEq[eqId]||r.created_at>lastSaisieByEq[eqId].t){
        lastSaisieByEq[eqId]={v:parseFloat(r.valeur),t:r.created_at,unite:q.unite||''};
      }
    }
    // Pour les recos : numérique + seuils définis
    if(!q||q.type_reponse!=='numerique'||(q.seuil_min===null&&q.seuil_max===null))return;
    if(!repByEqQ[eqId])repByEqQ[eqId]={};
    if(!repByEqQ[eqId][r.question_id])repByEqQ[eqId][r.question_id]=[];
    repByEqQ[eqId][r.question_id].push({v:parseFloat(r.valeur),t:r.created_at,q:q});
  });
  // --- Relevés horaires validés (7 derniers jours) ---
  var relevesRecent=await supaGet('releves_horaires','site_id=eq.'+sid+'&statut=eq.validé&created_at=gte.'+since7+'T00:00:00Z&select=id&limit=50');
  if(relevesRecent.length){
    var relIds=relevesRecent.map(function(r){return r.id;});
    var releveReps=await supaGet('reponses','releve_id=in.('+relIds.join(',')+')'+'&select=valeur,created_at,question_id,questions(texte,type_reponse,unite,seuil_min,seuil_max,equipement_id)'+'&order=created_at.desc&limit=400');
    releveReps.forEach(function(r){
      var q=r.questions;if(!q)return;
      var eqId=q.equipement_id;if(!eqId)return;
      if(q.type_reponse==='numerique'){
        if(!lastSaisieByEq[eqId]||r.created_at>lastSaisieByEq[eqId].t){
          lastSaisieByEq[eqId]={v:parseFloat(r.valeur),t:r.created_at,unite:q.unite||''};
        }
        if(q.seuil_min!==null||q.seuil_max!==null){
          if(!repByEqQ[eqId])repByEqQ[eqId]={};
          if(!repByEqQ[eqId][r.question_id])repByEqQ[eqId][r.question_id]=[];
          repByEqQ[eqId][r.question_id].push({v:parseFloat(r.valeur),t:r.created_at,q:q});
        }
      }
    });
  }
  var result={};
  var allEqIds=Object.keys(Object.assign({},repByEqQ,pannesByEq));
  allEqIds.forEach(function(eqId){
    var recos=[];
    var qMap=repByEqQ[eqId]||{};
    Object.keys(qMap).forEach(function(qId){
      var vals=qMap[qId].slice().sort(function(a,b){return b.t.localeCompare(a.t);});
      var q=vals[0].q;
      var last=vals[0].v;
      var sMin=q.seuil_min!==null?parseFloat(q.seuil_min):null;
      var sMax=q.seuil_max!==null?parseFloat(q.seuil_max):null;
      var u=q.unite?' '+q.unite:'';
      // Immédiate : seuil dépassé à la dernière saisie
      if((sMax!==null&&last>sMax)||(sMin!==null&&last<sMin)){
        var dir=sMax!==null&&last>sMax?'max':'min';
        var seuil=dir==='max'?sMax:sMin;
        recos.push({type:'immediate',message:last+u+' — seuil '+dir+' : '+seuil+u+'. Vérifier l\'équipement.',severite:1});
      }else{
        // Préventive approche seuil min (ex: cuve carburant proche de 1500L)
        if(sMin!==null&&sMin>0&&last>sMin&&last<sMin*1.3){
          recos.push({type:'preventive',message:'Niveau à '+last+u+' — approche du seuil minimum ('+sMin+u+'). Planifier le ravitaillement.',severite:2});
        }
        // Préventive approche seuil max (ex: CF proche de 5°C)
        if(sMax!==null&&sMax>0&&last<sMax&&last>sMax*0.8){
          recos.push({type:'preventive',message:'Valeur à '+last+u+' — approche du seuil maximum ('+sMax+u+'). Surveiller.',severite:2});
        }
        // Préventive : tendance dégradée sur 4+ relevés
        if(vals.length>=4){
          var n=Math.min(3,Math.floor(vals.length/2));
          var avgOld=vals.slice(-n).reduce(function(s,x){return s+x.v;},0)/n;
          var avgNew=vals.slice(0,n).reduce(function(s,x){return s+x.v;},0)/n;
          var delta=avgNew-avgOld;
          var pct=avgOld!==0?Math.abs(delta/avgOld*100):0;
          var degrading=(sMax!==null&&delta>0&&pct>15)||(sMin!==null&&delta<0&&pct>15);
          if(degrading){
            var sign=delta>0?'+':'';
            recos.push({type:'preventive',message:'Dérive '+sign+delta.toFixed(1)+u+' sur '+vals.length+' relevés. Prévoir un contrôle.',severite:2});
          }
        }
      }
    });
    // Opérationnelle : récurrence pannes 90j
    var nb=pannesByEq[eqId]||0;
    if(nb>3)recos.push({type:'operationnelle',message:nb+' interventions en 90 jours. Remplacement à envisager.',severite:3});
    recos.sort(function(a,b){return a.severite-b.severite;});
    result[eqId]={recos:recos,lastSaisie:lastSaisieByEq[eqId]||null};
  });
  // Équipements avec saisie numérique mais sans seuils ni pannes (ex: GE compteur horaire)
  Object.keys(lastSaisieByEq).forEach(function(eqId){
    if(!result[eqId])result[eqId]={recos:[],lastSaisie:lastSaisieByEq[eqId]};
  });
  return result;
}

function _buildRapportDirTech(period,periodeStr,session,sites,pleins,maintenances,signalements,rondes,rondesEq,energieFluidesDT,relevesEnergieDT){
  var HCOLS=['#C49A1C','#2D7A4F','#3498DB','#D4761E','#8E44AD','#E74C3C'];
  var HCOLS_PALE=['#FDF3E3','#E8F5EE','#EBF5FB','#FDF0E6','#F5EEF8','#FDEDEC'];
  var dirNom=(session.contact&&session.contact.nom)||'Directeur technique';
  var genDate=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var siteMap={};sites.forEach(function(s){siteMap[s.id]=s.nom;});

              :s.lieu||'—';
            return '<tr>'+
              '<td style="font-weight:500">'+escape_html(eqNom)+'</td>'+
              '<td style="max-width:220px;color:var(--text2)">'+escape_html((s.description||'').substring(0,70))+'</td>'+
              '<td style="white-space:nowrap;font-size:11px;color:var(--text2)">'+ts+'</td>'+
              '<td>'+(resolu?'<span class="badge badge-ok">Résolu</span>':'<span class="badge badge-ko">En cours</span>')+'</td>'+
              '<td style="font-size:11px">'+(s.cout_intervention?Number(s.cout_intervention).toLocaleString('fr-FR')+' FCFA':'—')+'</td>'+
            '</tr>';
          }).join('')+
          '</tbody></table></div>':'')+
        (siteMaintenances.length>0?
          '<div style="margin-top:14px"><div style="font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px">Interventions maintenance</div>'+
          '<table><thead><tr><th>Intervention</th><th>Type</th><th>Intervenant</th><th>Date</th><th>Coût</th></tr></thead><tbody>'+
          siteMaintenances.slice(0,15).map(function(m){
            var ts=m.date_intervention?new Date(m.date_intervention).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'—';
            var eqNom=m.equipements&&m.equipements.nom?' · '+m.equipements.nom:'';
            return '<tr>'+
              '<td><strong>'+escape_html(m.titre||'Intervention')+'</strong>'+escape_html(eqNom)+'</td>'+
              '<td style="font-size:11px;color:var(--text2)">'+escape_html(m.type||'—')+'</td>'+
              '<td style="font-size:11px">'+escape_html(m.prestataire||'—')+'</td>'+
              '<td style="white-space:nowrap;font-size:11px;color:var(--text2)">'+ts+'</td>'+
              '<td style="font-size:11px">'+(m.cout?(Number(m.cout)||0).toLocaleString('fr-FR')+' FCFA':'—')+'</td>'+
            '</tr>';
          }).join('')+
          '</tbody></table></div>':'')+
      '</div>'+
    '</div>';
  });

  // Signature
  h+='<div class="sig-row">'+
    '<div class="sig-block">Fait à ________________, le '+new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'<br><br><br>'+escape_html(dirNom)+'<br><span style="font-size:10px;color:var(--text3)">Directeur Technique</span></div>'+
    '<div class="sig-block">Visa direction générale<br><br><br>____________________</div>'+
  '</div>';
  h+='<div class="footer-doc"><span>GenTrack · Pilotage technique hôtelier</span><span>Rapport généré le '+new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'</span></div>';

  return _reportShell('Rapport DT — '+period+' jours',h,false);
}

async function _openRapportHebdo(period){
  period=period||7;
  var m=document.getElementById('rapport-menu');if(m)m.style.display='none';
  var btn=document.getElementById('rapport-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Chargement...';}
  try{
    var sid=_session.site_ids&&_session.site_ids[0];
    if(!sid){alert('Aucun site configuré.');return;}
    var cutoff=dateNJours(period);
    var dateDebut=new Date();dateDebut.setDate(dateDebut.getDate()-period);
    var dateFin=new Date();
    var periodeStr=dateDebut.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+' – '+dateFin.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

    var[siteRow,equips,rondes,signalements,maintenances]=await Promise.all([
      supaGet('sites','id=eq.'+sid+'&select=nom,nb_chambres&limit=1'),
      supaGet('equipements','site_id=eq.'+sid+'&actif=eq.true&select=id,nom,capacite_litres,conso_theorique_lh,types_equipements(nom)&order=ordre_ronde.asc'),
      supaGet('rondes','site_id=eq.'+sid+'&date_ronde=gte.'+cutoff+'&select=id,date_ronde,frequence&order=date_ronde.asc&limit=200'),
      supaGet('signalements','groupe_id=eq.'+sid+'&created_at=gte.'+cutoff+'T00:00:00&select=id,type,description,statut,signale_par,equipement_id,equipement_zone_id,cout_intervention,created_at,resolved_at,equipements(nom),equipements_zone(nom)&order=created_at.desc&limit=60'),
      supaGet('maintenances','groupe_id=eq.'+sid+'&date_intervention=gte.'+cutoff+'&select=id,titre,type,statut,cout,prestataire,date_intervention,equipement_id,equipements(nom)&order=date_intervention.desc&limit=40')
    ]);
    var siteNom=siteRow.length?siteRow[0].nom:'Mon site';
    var rIds=rondes.map(function(r){return r.id;});
    var rondesEq=rIds.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds.join(',')+')'+'&select=id,ronde_id,equipement_id,statut'):[];

    var eqIds=equips.map(function(e){return e.id;});
    // questions dict (used for both rondes + relevés)
    var questions=eqIds.length?await supaGet('questions','equipement_id=in.('+eqIds.join(',')+')'+'&actif=eq.true&select=id,equipement_id,texte,unite'):[];
    var qMap={};questions.forEach(function(q){qMap[q.id]=q;});
    var eqMap={};equips.forEach(function(e){eqMap[e.id]=e;});

    var lastRepsByEq={};

    // ── Source 1 : rondes (ronde_equipement_id) ──
    if(eqIds.length){
      var allLastRE=await supaGet('rondes_equipements','equipement_id=in.('+eqIds.join(',')+')'+'&statut=eq.valide&valide_at=not.is.null&select=id,equipement_id,valide_at&order=valide_at.desc&limit='+eqIds.length*5);
      var seenEq=new Set();var topREIds=[];
      allLastRE.forEach(function(re){if(!seenEq.has(re.equipement_id)){seenEq.add(re.equipement_id);topREIds.push(re.id);lastRepsByEq[re.equipement_id]={valide_at:re.valide_at,re_id:re.id,vals:[]};}});
      if(topREIds.length){
        var repsRonde=await supaGet('reponses','ronde_equipement_id=in.('+topREIds.join(',')+')'+'&select=ronde_equipement_id,question_id,valeur');
        repsRonde.forEach(function(r){
          var q=qMap[r.question_id];if(!q)return;
          var eqId=q.equipement_id;
          if(!lastRepsByEq[eqId]||lastRepsByEq[eqId].re_id!==r.ronde_equipement_id)return;
          lastRepsByEq[eqId].vals.push({texte:q.texte,valeur:r.valeur,unite:q.unite||''});
        });
      }
    }

    // ── Source 2 : relevés horaires (releve_id) ──
    var cuveHistory={};// {eqId:{nom,cap,points:[{t,v}]}}
    var releveExportRows=[];// pour CSV
    var relevesH=await supaGet('releves_horaires','site_id=eq.'+sid+'&created_at=gte.'+cutoff+'T00:00:00&select=id,created_at&order=created_at.asc&limit=500');
    if(relevesH.length){
      var relDateMap={};relevesH.forEach(function(r){relDateMap[r.id]=r.created_at;});
      var relIds=relevesH.map(function(r){return r.id;});
      var repsReleve=await supaGet('reponses','releve_id=in.('+relIds.join(',')+')'+'&select=releve_id,question_id,valeur,created_at&order=created_at.asc');

      // groupe par releve_id+equipement → dernière lecture par équipement
      var latestRelByEq={};// {eqId: releve_id avec ts le plus récent}
      repsReleve.forEach(function(r){
        var q=qMap[r.question_id];if(!q)return;
        var eqId=q.equipement_id;if(!eqId)return;
        var ts=relDateMap[r.releve_id]||r.created_at||'';
        if(!latestRelByEq[eqId]||ts>(relDateMap[latestRelByEq[eqId]]||'')){latestRelByEq[eqId]=r.releve_id;}
      });
      // collecte vals pour le dernier relevé de chaque équipement
      var releveVals={};// {eqId:[{texte,valeur,unite}]}
      repsReleve.forEach(function(r){
        var q=qMap[r.question_id];if(!q)return;
        var eqId=q.equipement_id;if(!eqId)return;
        if(r.releve_id!==latestRelByEq[eqId])return;
        if(!releveVals[eqId])releveVals[eqId]=[];
        releveVals[eqId].push({texte:q.texte,valeur:r.valeur,unite:q.unite||''});
      });
      // Merge : remplace lastRepsByEq si plus récent
      Object.keys(latestRelByEq).forEach(function(eqId){
        var ts=relDateMap[latestRelByEq[eqId]]||'';
        if(!lastRepsByEq[eqId]||(ts&&ts>(lastRepsByEq[eqId].valide_at||''))){
          lastRepsByEq[eqId]={valide_at:ts,vals:releveVals[eqId]||[]};
        }
      });

      // historique cuve : toutes les lectures niveau dans la période
      repsReleve.forEach(function(r){
        var q=qMap[r.question_id];if(!q)return;
        if(!q.texte.toLowerCase().includes('niveau'))return;
        var eqId=q.equipement_id;if(!eqId)return;
        var eq=eqMap[eqId];if(!eq||!eq.capacite_litres)return;
        var niveau=parseFloat(r.valeur);if(isNaN(niveau))return;
        var ts=relDateMap[r.releve_id]||r.created_at||'';
        if(!cuveHistory[eqId])cuveHistory[eqId]={nom:eq.nom,cap:parseFloat(eq.capacite_litres),points:[]};
        if(!cuveHistory[eqId].points.some(function(p){return p.t===ts;}))
          cuveHistory[eqId].points.push({t:ts,v:niveau});
      });
      Object.values(cuveHistory).forEach(function(h){h.points.sort(function(a,b){return a.t<b.t?-1:1;});});

      // prépare export CSV relevés
      repsReleve.forEach(function(r){
        var q=qMap[r.question_id];if(!q)return;
        var ts=relDateMap[r.releve_id]||r.created_at||'';
        var eq=eqMap[q.equipement_id];
        releveExportRows.push([
          ts.replace('T',' ').substring(0,16),
          eq?eq.nom:'',
          q.texte,
          r.valeur,
          q.unite||''
        ]);
      });
    }

    // prépare export CSV rondes — détaillé (une ligne par réponse)
    var rondeExportRows=[];
    var reIds=rondesEq.map(function(re){return re.id;}).filter(Boolean);
    if(reIds.length){
      var rondeMap={};rondes.forEach(function(ro){rondeMap[ro.id]=ro;});
      var reMap={};rondesEq.forEach(function(re){reMap[re.id]=re;});
      var repsRondeExp=await supaGet('reponses','ronde_equipement_id=in.('+reIds.join(',')+')'+'&select=ronde_equipement_id,question_id,valeur&order=ronde_equipement_id.asc');
      repsRondeExp.forEach(function(r){
        var re=reMap[r.ronde_equipement_id];if(!re)return;
        var ro=rondeMap[re.ronde_id];if(!ro)return;
        var q=qMap[r.question_id];if(!q)return;
        var eq=eqMap[re.equipement_id];
        rondeExportRows.push([
          ro.date_ronde,
          _FREQ_LABELS[ro.frequence]||ro.frequence,
          eq?eq.nom:'',
          q.texte,
          r.valeur,
          q.unite||'',
          re.statut||''
        ]);
        // historique cuve depuis rondes
        if(eq&&eq.capacite_litres&&q.texte.toLowerCase().indexOf('niveau')>=0){
          var niv=parseFloat(r.valeur);
          if(!isNaN(niv)){
            var ts=ro.date_ronde+'T06:00:00Z';
            var eqId=re.equipement_id;
            if(!cuveHistory[eqId])cuveHistory[eqId]={nom:eq.nom,cap:parseFloat(eq.capacite_litres),points:[]};
            if(!cuveHistory[eqId].points.some(function(p){return p.t.startsWith(ro.date_ronde);}))
              cuveHistory[eqId].points.push({t:ts,v:niv});
          }
        }
      });
      Object.values(cuveHistory).forEach(function(h){h.points.sort(function(a,b){return a.t<b.t?-1:1;});});
    }

    // Énergie
    var[energieFluides,relevesEnergiePeriode,pleinsPeriode]=await Promise.all([
      supaGet('energie_config','site_id=eq.'+sid+'&actif=eq.true&select=id,nom,unite,type_valeur,tarif,budget_par_chambre,objectif_mensuel,capacite,devise&order=ordre.asc'),
      supaGet('releves_energie','site_id=eq.'+sid+'&date_releve=gte.'+cutoff+'&select=date_releve,valeurs,saisi_par,to_percent&order=date_releve.asc&limit=100'),
      supaGet('pleins','site_id=eq.'+sid+'&date=gte.'+cutoff+'&select=date,litres_ajoutes&order=date.asc&limit=50')
    ]);

    var _nbCh=siteRow.length&&siteRow[0].nb_chambres?parseInt(siteRow[0].nb_chambres):null;
    var html=_buildRapportPro(siteNom,periodeStr,period,_session,equips,rondes,rondesEq,signalements,maintenances,lastRepsByEq,cuveHistory,rondeExportRows,releveExportRows,energieFluides||[],relevesEnergiePeriode||[],pleinsPeriode||[],_nbCh);
    var w=window.open('','_blank');
    if(!w){alert('Autorisez les popups pour générer le rapport.');return;}
    w.document.write(html);w.document.close();
  }catch(e){console.error(e);alert('Erreur : '+(e.message||e));}
  finally{if(btn){btn.disabled=false;btn.textContent='📄 Rapport ▾';}}
}


function _buildRapportEnergieMensuel_REMOVED(moisLabel,daysInMonth,fluides,releves,siteRow){
  var siteNom=siteRow?siteRow.nom:'';
  var nbChambres=siteRow&&siteRow.nb_chambres?parseInt(siteRow.nb_chambres):null;
  var genDate=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var relevesAsc=releves.slice().sort(function(a,b){return a.date_releve.localeCompare(b.date_releve);});
  var firstReleve=relevesAsc.length?relevesAsc[0]:null;
  var lastReleve=relevesAsc.length?relevesAsc[relevesAsc.length-1]:null;
  var toVals=relevesAsc.map(function(r){return r.to_percent!=null?parseFloat(r.to_percent):null;}).filter(function(v){return v!=null;});
  var toMoy=toVals.length?toVals.reduce(function(a,b){return a+b;},0)/toVals.length:null;
  var chambresOcc=nbChambres&&toMoy?Math.round(nbChambres*toMoy/100):null;
  var lignes=fluides.map(function(f){
    var conso=null;
    if(f.type_valeur==='index'){
      var vF=firstReleve&&firstReleve.valeurs&&firstReleve.valeurs[f.id];
      var vL=lastReleve&&lastReleve.valeurs&&lastReleve.valeurs[f.id];
      if(vF!=null&&vL!=null)conso=Math.max(0,parseFloat(vL)-parseFloat(vF));
    }else{
      var vL2=lastReleve&&lastReleve.valeurs&&lastReleve.valeurs[f.id];
      if(vL2!=null)conso=parseFloat(vL2);
    }
    var obj=f.objectif_mensuel?parseFloat(f.objectif_mensuel):null;
    var tarif=f.tarif?parseFloat(f.tarif):null;
    var bpc=f.budget_par_chambre?parseFloat(f.budget_par_chambre):null;
    var coutReel=(conso!=null&&tarif&&f.type_valeur==='index')?Math.round(conso*tarif):null;
    var budgetDyn=bpc&&chambresOcc?Math.round(bpc*chambresOcc*daysInMonth):null;
    var budget=budgetDyn||(obj&&tarif?Math.round(obj*tarif):null);
    var ecartCout=(coutReel!=null&&budget)?coutReel-budget:null;
    var ecartPct=(ecartCout!=null&&budget)?Math.round(ecartCout/budget*100):null;
    var ecartConso=(conso!=null&&obj)?Math.round((conso-obj)/obj*100):null;
    return{f:f,conso:conso,obj:obj,tarif:tarif,bpc:bpc,coutReel:coutReel,budget:budget,budgetDyn:budgetDyn,ecartCout:ecartCout,ecartPct:ecartPct,ecartConso:ecartConso};
  });
  var coutTotal=0,budgetTotal=0,hasCout=false;
  lignes.forEach(function(l){if(l.coutReel!=null){coutTotal+=l.coutReel;hasCout=true;}if(l.budget)budgetTotal+=l.budget;});
  var ecartTotal=hasCout&&budgetTotal?coutTotal-budgetTotal:null;
  var ecartTotalPct=ecartTotal!=null&&budgetTotal?Math.round(ecartTotal/budgetTotal*100):null;
  var fcfaParCh=hasCout&&chambresOcc?Math.round(coutTotal/chambresOcc):null;
  var fcfaParChBudget=budgetTotal&&chambresOcc?Math.round(budgetTotal/chambresOcc):null;
  function fmtN(n){return n!=null?Math.round(n).toLocaleString('fr-FR'):'—';}
  function fmtPct(p){if(p==null)return'—';return(p>0?'+':'')+p+'%';}
  function pctCol(p){if(p==null)return'#888';if(p<=0)return'#2D7A4F';if(p<=10)return'#C49A1C';return'#C0392B';}
  var h='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapport Énergie — '+escape_html(moisLabel)+'</title><style>';
  h+='*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f0;color:#1A1411;padding:24px;}';
  h+='.page{max-width:840px;margin:0 auto;}h2{font-size:11px;font-weight:700;color:#888;margin:24px 0 10px;text-transform:uppercase;letter-spacing:.06em;}';
  h+='.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}';
  h+='.kpi{background:white;border:1px solid #e5e0d8;border-radius:10px;padding:14px 16px;}';
  h+='.kpi-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}';
  h+='.kpi-val{font-size:18px;font-weight:700;line-height:1.2;}';
  h+='.kpi-sub{font-size:10px;color:#aaa;margin-top:3px;}';
  h+='table{width:100%;border-collapse:collapse;font-size:12px;background:white;border-radius:10px;overflow:hidden;border:1px solid #e5e0d8;margin-bottom:24px;}';
  h+='thead tr{background:#1A1411;color:white;}th{padding:10px 12px;text-align:right;font-size:10px;font-weight:600;letter-spacing:.04em;}th:first-child{text-align:left;}';
  h+='td{padding:9px 12px;text-align:right;border-bottom:1px solid #f0ebe4;}td:first-child{text-align:left;font-weight:500;}tr:last-child td{border-bottom:none;}';
  h+='.tr-total td{font-weight:700;background:#faf8f5;border-top:2px solid #e5e0d8;}';
  h+='.print-bar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:20px;}';
  h+='.btn-print{background:#1A1411;color:white;border:none;border-radius:7px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;}';
  h+='.btn-close{background:white;color:#1A1411;border:1px solid #e5e0d8;border-radius:7px;padding:8px 14px;font-size:12px;cursor:pointer;}';
  h+='.note-area{width:100%;min-height:72px;border:1px solid #e5e0d8;border-radius:8px;padding:12px;font-size:12px;font-family:inherit;resize:vertical;background:white;}';
  h+='@media print{.print-bar{display:none!important;}body{background:white;padding:0;}textarea{border:none!important;resize:none!important;}}';
  h+='</style></head><body><div class="page">';
  h+='<div class="print-bar"><button class="btn-print" onclick="window.print()">🖨 Imprimer / PDF</button><button class="btn-close" onclick="window.close()">Fermer</button></div>';
  h+='<div style="background:#1A1411;border-radius:10px;padding:28px 32px;margin-bottom:24px">';
  h+='<div style="font-size:11px;font-weight:800;color:#E8C87A;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px">GenTrack</div>';
  h+='<div style="font-size:10px;color:rgba(255,255,255,0.45);margin-bottom:14px">Rapport Énergie Mensuel</div>';
  h+='<div style="font-size:20px;font-weight:700;color:white;margin-bottom:3px">'+escape_html(siteNom)+'</div>';
  h+='<div style="font-size:14px;color:rgba(255,255,255,0.65);text-transform:capitalize;margin-bottom:2px">'+escape_html(moisLabel)+'</div>';
  h+='<div style="font-size:10px;color:rgba(255,255,255,0.35)">Généré le '+genDate+'</div>';
  if(toMoy||chambresOcc){
    h+='<div style="display:flex;gap:20px;margin-top:14px">';
    if(toMoy)h+='<div style="font-size:11px;color:rgba(255,255,255,0.6)">TO moyen <strong style="color:white">'+Math.round(toMoy)+'%</strong></div>';
    if(chambresOcc&&nbChambres)h+='<div style="font-size:11px;color:rgba(255,255,255,0.6)">Chambres occ. (moy.) <strong style="color:white">'+chambresOcc+' / '+nbChambres+'</strong></div>';
    h+='</div>';
  }
  h+='</div>';
  if(hasCout){
    h+='<div class="kpi-row">';
    h+='<div class="kpi"><div class="kpi-lbl">Coût total</div><div class="kpi-val">'+fmtN(coutTotal)+'</div><div class="kpi-sub">XOF HT</div></div>';
    h+='<div class="kpi"><div class="kpi-lbl">Budget</div><div class="kpi-val">'+fmtN(budgetTotal||null)+'</div><div class="kpi-sub">XOF HT</div></div>';
    h+='<div class="kpi"><div class="kpi-lbl">Écart</div><div class="kpi-val" style="color:'+pctCol(ecartTotalPct)+'">'+fmtPct(ecartTotalPct)+'</div><div class="kpi-sub">'+(ecartTotal!=null?(ecartTotal>0?'+':'')+fmtN(ecartTotal)+' XOF':'—')+'</div></div>';
    h+='<div class="kpi"><div class="kpi-lbl">FCFA / ch. occ.</div><div class="kpi-val">'+fmtN(fcfaParCh)+'</div><div class="kpi-sub">'+(fcfaParChBudget?'Budget : '+fmtN(fcfaParChBudget):'Budget non défini')+'</div></div>';
    h+='</div>';
  }
  h+='<h2>Détail par fluide</h2>';
  h+='<table><thead><tr><th>Fluide</th><th>Conso réelle</th><th>Objectif</th><th>Écart conso</th><th>Coût FCFA</th><th>Budget FCFA</th><th>Écart coût</th></tr></thead><tbody>';
  lignes.forEach(function(l){
    var ecC=l.ecartConso!=null?(l.ecartConso<=0?'#2D7A4F':l.ecartConso<=10?'#C49A1C':'#C0392B'):'#888';
    h+='<tr>';
    h+='<td>'+escape_html(l.f.nom)+'</td>';
    h+='<td>'+(l.conso!=null?Math.round(l.conso).toLocaleString('fr-FR')+' '+escape_html(l.f.unite||''):'—')+'</td>';
    h+='<td>'+(l.obj?Math.round(l.obj).toLocaleString('fr-FR')+' '+escape_html(l.f.unite||''):'—')+'</td>';
    h+='<td><span style="color:'+ecC+';font-weight:600">'+fmtPct(l.ecartConso)+'</span></td>';
    h+='<td>'+(l.coutReel!=null?fmtN(l.coutReel)+' XOF':'—')+'</td>';
    h+='<td>'+(l.budget?fmtN(l.budget)+' XOF'+(l.budgetDyn?' <span style="font-size:9px;color:#aaa">dyn.</span>':''):'—')+'</td>';
    h+='<td>'+(l.ecartPct!=null?'<span style="color:'+pctCol(l.ecartPct)+';font-weight:600">'+fmtPct(l.ecartPct)+'</span>':'—')+'</td>';
    h+='</tr>';
  });
  if(hasCout){
    h+='<tr class="tr-total"><td>Total</td><td>—</td><td>—</td><td>—</td>';
    h+='<td>'+fmtN(coutTotal)+' XOF</td>';
    h+='<td>'+(budgetTotal?fmtN(budgetTotal)+' XOF':'—')+'</td>';
    h+='<td>'+(ecartTotalPct!=null?'<span style="color:'+pctCol(ecartTotalPct)+';font-weight:600">'+fmtPct(ecartTotalPct)+'</span>':'—')+'</td>';
    h+='</tr>';
  }
  h+='</tbody></table>';
  if(fcfaParCh&&chambresOcc){
    h+='<h2>Ratio FCFA / chambre</h2>';
    h+='<div style="background:white;border:1px solid #e5e0d8;border-radius:10px;padding:16px 20px;display:flex;gap:32px;flex-wrap:wrap;margin-bottom:24px">';
    h+='<div><div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Réel</div><div style="font-size:22px;font-weight:700">'+fmtN(fcfaParCh)+'</div><div style="font-size:10px;color:#aaa">XOF / ch. occupée / mois</div></div>';
    if(fcfaParChBudget){
      h+='<div><div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Budget</div><div style="font-size:22px;font-weight:700;color:#aaa">'+fmtN(fcfaParChBudget)+'</div><div style="font-size:10px;color:#aaa">XOF / ch. occupée / mois</div></div>';
      var ecFcfa=fcfaParCh-fcfaParChBudget;
      var ecFcfaPct=Math.round(ecFcfa/fcfaParChBudget*100);
      h+='<div><div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Écart</div>';
      h+='<div style="font-size:22px;font-weight:700;color:'+pctCol(ecFcfaPct)+'">'+(ecFcfa>0?'+':'')+fmtN(ecFcfa)+'</div>';
      h+='<div style="font-size:10px;color:'+pctCol(ecFcfaPct)+';font-weight:600">'+fmtPct(ecFcfaPct)+'</div></div>';
    }
    h+='</div>';
  }
  h+='<h2>Commentaire</h2>';
  h+='<textarea class="note-area" placeholder="Ajoutez un commentaire avant impression..."></textarea>';
  h+='</div></body></html>';
  return h;
}

function _buildRapportPro(siteNom,periodeStr,period,session,equips,rondes,rondesEq,signalements,maintenances,lastRepsByEq,cuveHistory,rondeExportRows,releveExportRows,energieFluides,relevesEnergie,pleinsSite,nbChambres){
  var respNom=(session.contact&&session.contact.nom)||'Responsable technique';
  var genDate=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  // ── Calculs ──
  var reByRonde={};
  rondesEq.forEach(function(re){if(!reByRonde[re.ronde_id])reByRonde[re.ronde_id]=[];reByRonde[re.ronde_id].push(re);});
  var rondesJ=rondes.filter(function(r){return r.frequence==='journalier';});
  var rondesH=rondes.filter(function(r){return r.frequence==='hebdo';});
  var rondesM=rondes.filter(function(r){return r.frequence==='mensuel';});
  var totalVal=0,totalTot=0;
  rondes.forEach(function(r){var eq=reByRonde[r.id]||[];totalTot+=eq.length;totalVal+=eq.filter(function(re){return re.statut==='valide';}).length;});
  var tauxRondes=totalTot>0?Math.round(totalVal/totalTot*100):null;
  var nbSgOuverts=signalements.filter(function(s){return s.statut!=='resolu';}).length;
  var nbSgResolus=signalements.filter(function(s){return s.statut==='resolu';}).length;
  var coutTotal=maintenances.filter(function(m){return m.type!=='ravitaillement';}).reduce(function(s,m){return s+(parseFloat(m.cout)||0);},0);
  var nbMaintenances=maintenances.length;
  var cuves=equips.filter(function(e){return e.capacite_litres!=null;});
  var ges=equips.filter(function(e){return e.conso_theorique_lh!=null&&e.capacite_litres==null;});

  // ── MTTR & niveaux cuves ──
  var sgsResolus=signalements.filter(function(s){return s.statut==='resolu'&&s.resolved_at&&s.created_at;});
  var mttrH=sgsResolus.length?sgsResolus.reduce(function(sum,s){return sum+(new Date(s.resolved_at)-new Date(s.created_at))/3600000;},0)/sgsResolus.length:null;
  function fmtDur(h){if(h===null||h===undefined)return'—';if(h<1)return Math.round(h*60)+'min';if(h<48)return h.toFixed(1)+'h';return(h/24).toFixed(1)+'j';}
  var niveauCuveMin=null;
  cuves.forEach(function(c){var lr=lastRepsByEq[c.id];if(!lr||!lr.vals)return;var niveauEntry=lr.vals.find(function(v){return v.texte.toLowerCase().includes('niveau');});if(!niveauEntry)return;var pct=Math.round(parseFloat(niveauEntry.valeur)/parseFloat(c.capacite_litres)*100);if(niveauCuveMin===null||pct<niveauCuveMin)niveauCuveMin=pct;});

  // ── Narratives auto-générées ──
  // Résumé global
  var narResume=(period===7?'Semaine':period===14?'Quinzaine':'Mois')+' du '+periodeStr+'. ';
  if(tauxRondes!==null)narResume+='Taux de conformité des rondes : '+tauxRondes+'%. ';
  if(signalements.length===0)narResume+='Aucun signalement enregistré sur la période. ';
  else narResume+=(signalements.length)+' signalement'+(signalements.length>1?'s':'')+' enregistré'+(signalements.length>1?'s':'')+' dont '+nbSgOuverts+' en cours et '+nbSgResolus+' résolu'+(nbSgResolus>1?'s':'')+'. ';
  if(coutTotal>0)narResume+='Coût total des interventions : '+coutTotal.toLocaleString('fr-FR')+' FCFA.';

  // Équipements — narrative GE uniquement (niveaux cuves dans section Énergie)
  var narEquip='';
  ges.forEach(function(g){
    var lr=lastRepsByEq[g.id];
    if(!lr||!lr.vals)return;
    var cptEntry=lr.vals.find(function(v){return v.texte.toLowerCase().includes('compteur');});
    if(cptEntry)narEquip+=(g.nom||'Le groupe')+' affiche '+cptEntry.valeur+' heures au compteur. ';
  });
  if(cuves.length&&!narEquip)narEquip='';
  if(!narEquip){
    if(cuves.length)narEquip='Les niveaux des cuves sont détaillés dans la section Énergie & Fluides ci-dessous.';
    else narEquip='Aucune donnée de relevé disponible sur la période pour évaluer l\'état des équipements.';
  }else if(cuves.length){
    narEquip+='Les niveaux des cuves sont détaillés dans la section Énergie & Fluides ci-dessous.';
  }

  // Rondes
  var narRondes='';
  if(rondes.length===0){narRondes='Aucune ronde enregistrée sur la semaine.';}
  else{
    if(rondesJ.length>0){
      var jVal=0,jTot=0;
      rondesJ.forEach(function(r){var eq=reByRonde[r.id]||[];jTot+=eq.length;jVal+=eq.filter(function(re){return re.statut==='valide';}).length;});
      var jPct=jTot>0?Math.round(jVal/jTot*100):null;
      narRondes+=rondesJ.length+' ronde'+(rondesJ.length>1?'s journalières':' journalière')+' effectuée'+(rondesJ.length>1?'s':'')+' sur 7 jours'+(jPct!==null?' ('+jPct+'% de conformité)':'')+'. ';
    }
    if(rondesH.length>0)narRondes+='Ronde hebdomadaire effectuée. ';
    if(rondesM.length>0)narRondes+='Ronde mensuelle effectuée. ';
  }

  // Signalements
  var narSg='';
  if(signalements.length===0){narSg='Aucun signalement ou incident enregistré sur la semaine.';}
  else{
    var pannes=signalements.filter(function(s){return s.type==='panne';});
    var anomalies=signalements.filter(function(s){return s.type==='anomalie';});
    if(pannes.length>0)narSg+=pannes.length+' panne'+(pannes.length>1?'s':'')+' signalée'+(pannes.length>1?'s':'')+', dont '+pannes.filter(function(p){return p.statut==='resolu';}).length+' résolue'+(pannes.length>1?'s':'')+'. ';
    if(anomalies.length>0)narSg+=anomalies.length+' anomalie'+(anomalies.length>1?'s':'')+' détectée'+(anomalies.length>1?'s':'')+' lors des rondes. ';
    if(nbSgOuverts>0)narSg+=nbSgOuverts+' signalement'+(nbSgOuverts>1?'s':'')+' en attente de traitement.';
  }

  // Maintenances
  var narMaint='';
  if(maintenances.length===0){narMaint='Aucune intervention de maintenance enregistrée sur la semaine.';}
  else{
    var realises=maintenances.filter(function(m){return m.statut==='realise';});
    narMaint+=realises.length+' intervention'+(realises.length>1?'s':'')+(realises.length>1?' réalisées':' réalisée')+' sur la période. ';
    if(coutTotal>0)narMaint+='Coût total : '+coutTotal.toLocaleString('fr-FR')+' FCFA.';
  }

  // ── KPI couleurs ──
  function kpiCol(val,seuil1,seuil2,invert){
    if(val===null||val===undefined)return 'var(--text3)';
    if(invert){return val<=seuil1?'var(--vert)':val<=seuil2?'var(--amber)':'var(--rouge)';}
    return val>=seuil2?'var(--vert)':val>=seuil1?'var(--amber)':'var(--rouge)';
  }

  // ── SVG cuve chart ──
  function svgCuveChart(points,cap){
    if(!points||points.length<2)return '';
    var W=500,H=90,PL=8,PR=8,PT=8,PB=20;
    var xMin=new Date(points[0].t).getTime();
    var xMax=new Date(points[points.length-1].t).getTime();
    var xR=xMax-xMin||1;
    function px(t){return PL+(new Date(t).getTime()-xMin)/xR*(W-PL-PR);}
    function py(v){return PT+(1-v/cap)*(H-PT-PB);}
    var y20=py(cap*0.2),y40=py(cap*0.4);
    var pathD=points.map(function(p,i){return (i?'L':'M')+px(p.t).toFixed(1)+','+py(p.v).toFixed(1);}).join(' ');
    var areaD=pathD+' L'+px(points[points.length-1].t).toFixed(1)+','+(H-PB)+' L'+PL+','+(H-PB)+' Z';
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-height:110px;margin:6px 0 2px" xmlns="http://www.w3.org/2000/svg">'+
      '<rect x="'+PL+'" y="'+y20.toFixed(1)+'" width="'+(W-PL-PR)+'" height="'+(H-PB-y20).toFixed(1)+'" fill="#FDECEA" opacity="0.45"/>'+
      '<rect x="'+PL+'" y="'+y40.toFixed(1)+'" width="'+(W-PL-PR)+'" height="'+(y20-y40).toFixed(1)+'" fill="#FEF3E2" opacity="0.45"/>'+
      '<rect x="'+PL+'" y="'+PT+'" width="'+(W-PL-PR)+'" height="'+(y40-PT).toFixed(1)+'" fill="#E8F5EE" opacity="0.45"/>'+
      '<line x1="'+PL+'" y1="'+y20.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y20.toFixed(1)+'" stroke="#C0392B" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.6"/>'+
      '<line x1="'+PL+'" y1="'+y40.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y40.toFixed(1)+'" stroke="#D4761E" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.6"/>'+
      '<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C49A1C" stop-opacity="0.25"/><stop offset="100%" stop-color="#C49A1C" stop-opacity="0.02"/></linearGradient></defs>'+
      '<path d="'+areaD+'" fill="url(#cg)"/>'+
      '<path d="'+pathD+'" fill="none" stroke="#C49A1C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
      points.map(function(p){var col=p.v/cap<0.2?'#C0392B':p.v/cap<0.4?'#D4761E':'#2D7A4F';return '<circle cx="'+px(p.t).toFixed(1)+'" cy="'+py(p.v).toFixed(1)+'" r="3" fill="'+col+'" stroke="white" stroke-width="1"/>';}).join('')+
      '<text x="'+PL+'" y="'+(H-4)+'" font-size="8" fill="#A8957E" font-family="Inter,sans-serif">'+new Date(points[0].t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</text>'+
      '<text x="'+(W-PR)+'" y="'+(H-4)+'" font-size="8" fill="#A8957E" font-family="Inter,sans-serif" text-anchor="end">'+new Date(points[points.length-1].t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</text>'+
      '<text x="'+(PL+2)+'" y="'+(y20-2).toFixed(1)+'" font-size="7.5" fill="#C0392B" font-family="Inter,sans-serif" opacity="0.8">20%</text>'+
      '<text x="'+(PL+2)+'" y="'+(y40-2).toFixed(1)+'" font-size="7.5" fill="#D4761E" font-family="Inter,sans-serif" opacity="0.8">40%</text>'+
    '</svg>';
  }

  // ── Énergie : calculs ──
  energieFluides=energieFluides||[];relevesEnergie=relevesEnergie||[];
  var energieData=[];
  pleinsSite=pleinsSite||[];
  var _toValsP=relevesEnergie.map(function(r){return r.to_percent!=null?parseFloat(r.to_percent):null;}).filter(function(v){return v!=null;});
  var _toMoyP=_toValsP.length?_toValsP.reduce(function(a,b){return a+b;},0)/_toValsP.length:null;
  var chambresOccP=nbChambres&&_toMoyP?Math.round(nbChambres*_toMoyP/100):null;
  if(energieFluides.length&&relevesEnergie.length){
    energieFluides.forEach(function(f){
      var pts=relevesEnergie.map(function(r){
        var v=r.valeurs&&r.valeurs[f.id]!=null?parseFloat(r.valeurs[f.id]):null;
        return{date:r.date_releve,val:v};
      }).filter(function(p){return p.val!=null&&!isNaN(p.val);});
      var isInstant=f.type_valeur==='instantane';
      var cap=f.capacite!=null?parseFloat(f.capacite):null;
      var tarif=f.tarif!=null?parseFloat(f.tarif):null;
      var obj=f.objectif_mensuel!=null?parseFloat(f.objectif_mensuel):null;
      var lastVal=pts.length?pts[pts.length-1].val:null;
      var conso=null,cout=null;
      if(isInstant&&cap!=null&&pts.length>=2){
        var drops=0,_prevRaw2=null;
        pts.forEach(function(p){
          if(_prevRaw2!=null){
            var _dL2=p.val>100?p.val:p.val/100*cap;
            var _pL2=_prevRaw2>100?_prevRaw2:_prevRaw2/100*cap;
            if(_dL2<_pL2)drops+=(_pL2-_dL2);
          }
          _prevRaw2=p.val;
        });
        conso=Math.round(drops);
      }else if(!isInstant&&pts.length>=2){
        conso=Math.round(pts[pts.length-1].val-pts[0].val);
      }
      if(conso!=null&&tarif!=null)cout=Math.round(conso*tarif);
      var _rLastIsL=lastVal!=null&&lastVal>100;
      var restants=isInstant&&cap!=null&&lastVal!=null?(_rLastIsL?Math.round(lastVal):Math.round(lastVal/100*cap)):null;
      var lastValPctR=isInstant&&cap!=null&&lastVal!=null?(_rLastIsL?Math.min(100,Math.round(lastVal/cap*100)):Math.min(100,Math.round(lastVal))):null;
      var bpcF=f.budget_par_chambre!=null?parseFloat(f.budget_par_chambre):null;
      var budget=bpcF&&chambresOccP?Math.round(bpcF*chambresOccP*period):obj!=null&&tarif!=null?Math.round(obj*tarif*period/30):null;
      var vs=cout!=null&&budget!=null?cout-budget:null;
      energieData.push({f:f,pts:pts,isInstant:isInstant,cap:cap,tarif:tarif,obj:obj,lastVal:lastVal,lastValPct:lastValPctR,conso:conso,cout:cout,restants:restants,budget:budget,vs:vs,pleins:isInstant?pleinsSite:[]});
    });
  }

  function fmtCout(v,devise){
    if(v==null||isNaN(v))return'—';
    var d=devise||'XOF';
    var abs=Math.abs(v),s=v<0?'-':'';
    if(abs>=1000000)return s+(abs/1000000).toFixed(1).replace('.',',')+' M '+d;
    if(abs>=1000)return s+Math.round(abs/1000).toLocaleString('fr-FR')+' k '+d;
    return s+Math.round(abs).toLocaleString('fr-FR')+' '+d;
  }
  function fmtConso(d){
    if(d.conso==null)return'—';
    return d.isInstant?d.conso.toLocaleString('fr-FR')+' L':d.conso.toLocaleString('fr-FR')+(d.f.unite?' '+d.f.unite:'');
  }

  function svgEnergieMultiChart(indexData){
    if(!indexData.length||!indexData.some(function(d){return d.pts.length>=2;}))return'';
    var COLORS=['#2D7A4F','#1E6FA0','#C49A1C','#C0392B','#7B4EA6'];
    var W=640,H=100,PL=10,PR=10,PT=12,PB=22;
    var allDates=[];
    indexData.forEach(function(d){d.pts.forEach(function(p){if(allDates.indexOf(p.date)<0)allDates.push(p.date);});});
    allDates.sort();
    if(allDates.length<2)return'';
    var xMin=new Date(allDates[0]+'T12:00:00').getTime();
    var xMax=new Date(allDates[allDates.length-1]+'T12:00:00').getTime();
    var xR=xMax-xMin||1;
    function pxx(date){return PL+(new Date(date+'T12:00:00').getTime()-xMin)/xR*(W-PL-PR);}
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-height:110px;margin:8px 0 4px" xmlns="http://www.w3.org/2000/svg">';
    var step=Math.max(1,Math.ceil(allDates.length/6));
    var dLabeledIdx=[];
    for(var di=0;di<allDates.length;di+=step){dLabeledIdx.push(di);}
    var dLastIdx=allDates.length-1;
    if(dLabeledIdx.indexOf(dLastIdx)<0){
      var dPrevX=pxx(allDates[dLabeledIdx[dLabeledIdx.length-1]]);
      var dLastX=pxx(allDates[dLastIdx]);
      if(dLastX-dPrevX>(W-PL-PR)*0.08)dLabeledIdx.push(dLastIdx);
    }
    dLabeledIdx.forEach(function(di){
      var xp=pxx(allDates[di]);
      svg+='<text x="'+xp.toFixed(1)+'" y="'+(H-5)+'" font-size="8" fill="#A8957E" font-family="Inter,sans-serif" text-anchor="middle">'+new Date(allDates[di]+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</text>';
    });
    var lx=PL;
    indexData.forEach(function(d,ci){
      if(d.pts.length<2)return;
      var col=COLORS[ci%COLORS.length];
      var minV=Math.min.apply(null,d.pts.map(function(p){return p.val;}));
      var maxV=Math.max.apply(null,d.pts.map(function(p){return p.val;}));
      var range=maxV-minV||1;
      var pts2=d.pts.map(function(p){return pxx(p.date).toFixed(1)+','+(PT+(1-(p.val-minV)/range)*(H-PT-PB)).toFixed(1);});
      svg+='<polyline points="'+pts2.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      svg+='<rect x="'+lx+'" y="'+(PT-2)+'" width="10" height="3" fill="'+col+'" rx="1"/>'+
           '<text x="'+(lx+13)+'" y="'+PT+'" font-size="8.5" fill="#6B5E4A" font-family="Inter,sans-serif">'+escape_html(d.f.nom)+'</text>';
      lx+=escape_html(d.f.nom).length*5+28;
    });
    return svg+'</svg>';
  }

  function svgGasoilChart(d){
    if(!d||!d.pts||d.pts.length<2)return'';
    var cap=d.cap||null;
    // Normaliser toutes les valeurs en L via heuristique
    var ptsL=d.pts.map(function(p){
      if(p.val==null)return{date:p.date,v:null};
      var v=cap!=null?(p.val>100?p.val:Math.round(p.val/100*cap)):p.val;
      return{date:p.date,v:v};
    }).filter(function(p){return p.v!=null;});
    if(ptsL.length<2)return'';

    function pyg(v){return PT+(1-v/maxV)*(H-PT-PB);}
    var pathD=ptsL.map(function(p,i){return(i?'L':'M')+pxg(p.date).toFixed(1)+','+pyg(p.v).toFixed(1);}).join(' ');

      svg+='<line x1="'+PL+'" y1="'+ys.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+ys.toFixed(1)+'" stroke="#C0392B" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.7"/>';
      svg+='<text x="'+(PL+2)+'" y="'+(ys-2).toFixed(1)+'" font-size="8" fill="#C0392B" font-family="Inter,sans-serif" opacity="0.8">alerte &lt; '+seuil.toLocaleString('fr-FR')+' L</text>';
    }

    svg+='<path d="'+areaD+'" fill="url(#gg)"/>';
    svg+='<path d="'+pathD+'" fill="none" stroke="#D4761E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
