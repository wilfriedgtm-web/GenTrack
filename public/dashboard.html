async function _buildRecommandations(sids,siteMap){
  if(!sids||!sids.length)return'';
  var sidStr=sids.join(',');
  var since30=dateNJours(30);
  var since7=dateNJours(7);
  var[pannes30,rondes7]=await Promise.all([
    supaGet('pannes','site_id=in.('+sidStr+')&date_panne=gte.'+since30+'&select=id,site_id,equipement_id,equipements(nom)&limit=300'),
    supaGet('rondes','site_id=in.('+sidStr+')&date_ronde=gte.'+since7+'&select=id,site_id&limit=300')
  ]);
  // Pannes récurrentes : >2 pannes/30j sur même équipement
  var byEq={};
  pannes30.forEach(function(p){
    var k=p.equipement_id;
    if(!byEq[k])byEq[k]={nom:(p.equipements&&p.equipements.nom)||'Équipement',site_id:p.site_id,count:0};
    byEq[k].count++;
  });
  var recurrents=Object.values(byEq).filter(function(e){return e.count>2;});
  // Conformité rondes 7j par site
  var rIds7=rondes7.map(function(r){return r.id;});
  var rondeToSite={};rondes7.forEach(function(r){rondeToSite[r.id]=r.site_id;});
  var rondesEq7=rIds7.length?await supaGet('rondes_equipements','ronde_id=in.('+rIds7.join(',')+')'+'&select=ronde_id,statut'):[];
  var confBySite={};
  rondes7.forEach(function(r){if(!confBySite[r.site_id])confBySite[r.site_id]={val:0,tot:0};});
  rondesEq7.forEach(function(re){
    var sid=rondeToSite[re.ronde_id];
    if(!sid||!confBySite[sid])return;
    confBySite[sid].tot++;
    if(re.statut==='valide')confBySite[sid].val++;
  });
  var lowConf=Object.keys(confBySite).filter(function(sid){var c=confBySite[sid];return c.tot>0&&Math.round(c.val/c.tot*100)<70;});
  if(!recurrents.length&&!lowConf.length)return'';
  var h='<div class="section-title">Recommandations <span style="font-size:12px;font-weight:400;color:var(--text3)">— automatiques</span></div>'+
    '<div style="display:flex;flex-direction:column;gap:8px">';
  recurrents.forEach(function(eq){
    h+='<div class="alerte-card" style="background:var(--orange-pale);border:1px solid var(--orange-border);border-left:3px solid var(--orange)">'+
      '<span style="font-size:16px;margin-top:1px">🔧</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:var(--orange)">Équipement récurrent · '+escape_html(siteMap[eq.site_id]||'Site')+'</div>'+
        '<div class="alerte-card-msg">'+escape_html(eq.nom)+' — '+eq.count+' pannes sur 30 jours. Inspection préventive recommandée.</div>'+
      '</div></div>';
  });
  lowConf.forEach(function(sid){
    var c=confBySite[sid];
    var pct=Math.round(c.val/c.tot*100);
    h+='<div class="alerte-card" style="background:var(--rouge-pale);border:1px solid var(--rouge-border);border-left:3px solid var(--rouge)">'+
      '<span style="font-size:16px;margin-top:1px">📉</span>'+
      '<div style="flex:1">'+
        '<div class="alerte-card-titre" style="color:var(--rouge)">Conformité faible · '+escape_html(siteMap[sid]||'Site')+'</div>'+
        '<div class="alerte-card-msg">'+pct+'% de conformité rondes sur 7 jours (seuil : 70%). Revoir la planification des rondes.</div>'+
      '</div></div>';
  });
  return h+'</div>';
}

var _energieCurrentFluide=null;
var _energieBarData={};   // {fid: {days:[], vals:[], objJour:number}}

function _calcEnergieStatut(releve,fluides,prevReleve){
  var worst='ok';
  fluides.forEach(function(f){
    var v=releve.valeurs&&releve.valeurs[f.id];
    if(v==null)return;
    v=parseFloat(v);
    if(f.type_valeur==='instantane'){
      if(f.seuil_alerte_bas!=null){
        // Normaliser en L si cuve (capacité connue)
        var _cap=f.capacite?parseFloat(f.capacite):null;
        var _vCmp=_cap!=null?(v>100?v:Math.round(v/100*_cap)):v;
        if(_vCmp<f.seuil_alerte_bas)worst='depassement';
        else if(_vCmp<f.seuil_alerte_bas*1.15&&worst==='ok')worst='surveiller';
      }
    }else{
      var pv=prevReleve&&prevReleve.valeurs&&prevReleve.valeurs[f.id];
      var _fObjV=(window._energieObjActif&&window._energieObjActif[f.id]&&window._energieObjActif[f.id].valeur!=null)?parseFloat(window._energieObjActif[f.id].valeur):null;
      if(pv!=null&&_fObjV){
        var delta=v-parseFloat(pv);
        var objJ=_fObjV/new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
        if(delta>objJ*1.2)worst='depassement';
        else if(delta>objJ&&worst==='ok')worst='surveiller';
      }
    }
  });
  return worst;
}

function _renderEnergieChart(fid){
  _energieCurrentFluide=fid;
  var d=_energieBarData[fid];if(!d)return;
  var el=document.getElementById('energie-chart-svg');if(!el)return;
  // Update tab buttons
  _energieFluides.forEach(function(f){
    var btn=document.getElementById('echart-tab-'+f.id);
    if(btn){
      var active=f.id===fid;
      btn.style.fontWeight=active?'700':'500';
      btn.style.borderColor=active?'var(--amber)':'var(--border)';
      btn.style.background=active?'var(--amber-pale)':'white';
      btn.style.color=active?'var(--amber-dark)':'var(--text2)';
    }
  });
  // Build SVG
  var days=d.days,vals=d.vals,objJ=d.objJour;
  var N=days.length;if(!N){el.innerHTML='';return;}
  var W=560,H=130,PL=38,PR=12,PT=10,PB=28;
  var chartW=W-PL-PR,chartH=H-PT-PB;
  var maxV=Math.max.apply(null,vals.filter(function(v){return v!=null;}));
  if(objJ)maxV=Math.max(maxV,objJ*1.1);
  if(!maxV||maxV===0)maxV=1;
  var BW=Math.max(4,Math.floor(chartW/N)-2);
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%" xmlns="http://www.w3.org/2000/svg">';
  // Grid line at objective
  if(objJ){
    var objY=PT+chartH-(objJ/maxV)*chartH;
    svg+='<line x1="'+PL+'" y1="'+objY.toFixed(1)+'" x2="'+(PL+chartW)+'" y2="'+objY.toFixed(1)+'" stroke="#E8841A" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.7"/>';
  }
  // Axes
  svg+='<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+chartH)+'" stroke="#e8e0d5" stroke-width="1"/>';
  svg+='<line x1="'+PL+'" y1="'+(PT+chartH)+'" x2="'+(PL+chartW)+'" y2="'+(PT+chartH)+'" stroke="#e8e0d5" stroke-width="1"/>';
  // Y labels
  svg+='<text x="'+(PL-3)+'" y="'+(PT+5)+'" text-anchor="end" font-size="7" fill="#b0a090" font-family="Inter,sans-serif">'+Math.round(maxV).toLocaleString('fr-FR')+'</text>';
  svg+='<text x="'+(PL-3)+'" y="'+(PT+chartH)+'" text-anchor="end" font-size="7" fill="#b0a090" font-family="Inter,sans-serif">0</text>';
  // Bars + X labels
  vals.forEach(function(v,i){
    var x=PL+i*(chartW/N)+(chartW/N-BW)/2;
    var barH=v!=null&&maxV>0?Math.max(2,(v/maxV)*chartH):0;
    var y=PT+chartH-barH;
    var isHigh=objJ&&v!=null&&v>objJ*1.2;
    svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+BW+'" height="'+barH.toFixed(1)+'" rx="2" fill="'+(isHigh?'#E8841A':'#3B82F6')+'"/>';
    // X label every 5 days or first/last
    if(i===0||i===N-1||(i+1)%5===0){
      svg+='<text x="'+(x+BW/2).toFixed(1)+'" y="'+(PT+chartH+11)+'" text-anchor="middle" font-size="6.5" fill="#b0a090" font-family="Inter,sans-serif">'+days[i].substring(8)+'</text>';
    }
  });
  svg+='</svg>';
  el.innerHTML=svg;
  // Legend
  var legEl=document.getElementById('energie-chart-legend');
  if(legEl){
    var f=_energieFluides.find(function(fl){return fl.id===fid;})||{};
    legEl.innerHTML='<span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--text2)"><span style="width:12px;height:4px;border-radius:2px;background:#3B82F6;display:inline-block"></span>Réel'+(f.unite?' ('+escape_html(f.unite)+')':'')+'</span>'+
      (objJ?'<span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--text2)"><span style="width:12px;height:0;border:1.5px dashed #E8841A;display:inline-block"></span>Objectif/jour</span>':'');
  }
}

function _exportEnergieCSV(){

  var headers=['Date','Saisi par'].concat(fluides.map(function(f){return f.nom+(f.unite?' ('+f.unite+')':'');})).concat(['Note','Statut']);
  var rows=releves.map(function(r,i){

    var statutLabel={ok:'OK',surveiller:'À surveiller',depassement:'Dépassement'}[statut];
    var cols=[r.date_releve,r.saisi_par||''];
    fluides.forEach(function(f){

      cols.push(v!=null?parseFloat(v):'');
    });
    cols.push(r.note||'');
    cols.push(statutLabel);
    return cols;
  });
  var csv=[headers].concat(rows).map(function(row){
    return row.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');
  }).join('\n');
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});

  a.href=url;a.download='energie_'+(_energieSidGlobal||'export')+'_'+todayStr()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

   ⚡ ÉNERGIE — Vue principale resp_tech

async function _rtEnergie(sid){
  var dc=document.getElementById('dash-content-main');
  if(dc){dc.style.padding='24px';dc.style.maxWidth='980px';}

  var today=todayStr();
  var now=new Date();
  var offset=_rtEnergieMoisOffset||0;
  var tgt=new Date(now.getFullYear(),now.getMonth()+offset,1);
  var moisDebut=tgt.toISOString().split('T')[0];
  var moisFin=new Date(tgt.getFullYear(),tgt.getMonth()+1,0).toISOString().split('T')[0];
  var daysInMonth=new Date(tgt.getFullYear(),tgt.getMonth()+1,0).getDate();
  var since60=dateNJours(60);

  _energieSidGlobal=sid;

  var[fluides,relevesRows,siteRows,objsRows]=await Promise.all([
    supaGet('energie_config','site_id=eq.'+sid+'&actif=eq.true&select=id,nom,unite,type_valeur,tarif,budget_par_chambre,seuil_alerte_bas,objectif_mensuel,capacite,ordre,devise&order=ordre.asc'),
    supaGet('releves_energie','site_id=eq.'+sid+'&date_releve=gte.'+moisDebut+'&date_releve=lte.'+moisFin+'&select=id,date_releve,valeurs,saisi_par,note,to_percent&order=date_releve.asc&limit=62'),
    supaGet('sites','id=eq.'+sid+'&select=nom,nb_chambres&limit=1'),
    supaGet('objectifs_energie','site_id=eq.'+sid+'&select=id,fluide_id,valeur,date_debut,date_fin,note&order=date_debut.desc&limit=200')
  ]);

  // Index objectifs actifs par fluide (le plus récent dont date_debut <= aujourd'hui et non expiré avant ce mois)
  var _objActif={};
  (objsRows||[]).forEach(function(o){
    if(!o.date_debut||o.date_debut>today)return;
    if(o.date_fin&&o.date_fin<moisDebut)return;
    if(!_objActif[o.fluide_id])_objActif[o.fluide_id]=o;
  });
  // Fallback vers objectif_mensuel hérité si pas de versioned
  (fluides||[]).forEach(function(f){
    if(!_objActif[f.id]&&f.objectif_mensuel!=null)
      _objActif[f.id]={id:null,valeur:f.objectif_mensuel,date_debut:null,date_fin:null,note:'Hérité'};
  });
  window._energieObjActif=_objActif;
  window._energieObjsRows=objsRows||[];

  var siteNom=siteRows&&siteRows.length?siteRows[0].nom:'';
  var nbChambres=siteRows&&siteRows.length&&siteRows[0].nb_chambres?parseInt(siteRows[0].nb_chambres):null;
  _energieFluides=fluides||[];
  _energieReleves=(relevesRows||[]);

  if(!fluides||!fluides.length){
    return '<div class="placeholder-card" style="margin-top:16px">'+
      '<div class="placeholder-icon">⚡</div>'+
      'Aucun fluide configuré pour ce site.<br>'+
      '<span style="font-size:11px;color:var(--text3)">Ajoutez des fluides dans l\'onglet Configuration → Énergie.</span>'+
    '</div>';
  }

  // ── Index relevés (triés asc pour calcul delta) ──
  var relevesAsc=(relevesRows||[]).slice().sort(function(a,b){return a.date_releve.localeCompare(b.date_releve);});
  var relevesDesc=relevesAsc.slice().reverse();
  var releveByDate={};
  relevesAsc.forEach(function(r){releveByDate[r.date_releve]=r;});

  var firstReleve=relevesAsc.length?relevesAsc[0]:null;
  var lastReleve=relevesDesc.length?relevesDesc[0]:null;

  // ── Pré-calcul des deltas journaliers par fluide ──
  // Pour index: delta = valeur[j] - valeur[j-1]; pour instantané: valeur brute
  var deltasByFluide={};
  fluides.forEach(function(f){
    deltasByFluide[f.id]=[];
    relevesAsc.forEach(function(r,i){
      var v=r.valeurs&&r.valeurs[f.id];
      if(v==null){deltasByFluide[f.id].push(null);return;}
      v=parseFloat(v);
      if(f.type_valeur==='index'){
        var prev=null;
        for(var k=i-1;k>=0;k--){
          var pv=relevesAsc[k].valeurs&&relevesAsc[k].valeurs[f.id];
          if(pv!=null){prev=parseFloat(pv);break;}
        }
        deltasByFluide[f.id].push(prev!=null?Math.max(0,v-prev):null);
      }else{
        deltasByFluide[f.id].push(v);
      }
    });
  });

  // ── Conso mois ──
  var consoMoisByFluide={};
  fluides.forEach(function(f){
    if(f.type_valeur==='index'){

function _energieCfgWizardToggleSousFluide(idx,checked){
  var sf=_ENERGIE_SOUSFLUIDES[idx];

  if(checked){
    var already=_energieCfgWizardSousFluides.some(function(x){return x.nom===sf.nom;});
    if(!already)_energieCfgWizardSousFluides.push(sf);
  }else{
    _energieCfgWizardSousFluides=_energieCfgWizardSousFluides.filter(function(x){return x.nom!==sf.nom;});
  }
}

async function _energieCfgWizardSaveAll(sid){
  // Lire les valeurs depuis le DOM
  var rows=_energieCfgWizardRows;
  var toSave=[];
  for(var i=0;i<rows.length;i++){
    var nomEl=document.getElementById('ewiz-nom-'+i);
    var uniteEl=document.getElementById('ewiz-unite-'+i);
    var typeEl=document.getElementById('ewiz-type-'+i);
    var seuilEl=document.getElementById('ewiz-seuil-'+i);
    var objEl=document.getElementById('ewiz-obj-'+i);
    var nom=nomEl?nomEl.value.trim():'';
    if(!nom||!rows[i].actif)continue;
    toSave.push({
      site_id:sid,
      nom:nom,
      unite:uniteEl&&uniteEl.value.trim()?uniteEl.value.trim():null,
      type_valeur:typeEl?typeEl.value:'index',
      seuil_alerte_bas:seuilEl&&seuilEl.value!==''?parseFloat(seuilEl.value):null,
      objectif_mensuel:objEl&&objEl.value!==''?parseFloat(objEl.value):null,
      actif:true,
      ordre:toSave.length+1
    });
  }
  // Ajouter les sous-compteurs sélectionnés
  _energieCfgWizardSousFluides.forEach(function(sf){
    toSave.push({
      site_id:sid,
      nom:sf.nom,
      unite:sf.unite||null,
      type_valeur:sf.type_valeur||'index',
      seuil_alerte_bas:null,
      objectif_mensuel:null,
      actif:true,
      ordre:toSave.length+1
    });
  });

  if(!toSave.length){alert('Aucun fluide actif à enregistrer.');return;}
  var btn=document.getElementById('ewiz-save-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Enregistrement…';}
  // INSERT séquentiellement
  var errors=0;
  for(var j=0;j<toSave.length;j++){
    var ok=await supaPost('energie_config',toSave[j]);
    if(!ok)errors++;
  }
  if(errors>0){
    alert(errors+' erreur(s) lors de l\'enregistrement. Vérifiez les données.');
    if(btn){btn.disabled=false;btn.textContent='Enregistrer et activer';}
    return;
  }
  _energieCfgWizardStep=0;
  _energieCfgWizardTemplate=null;
  _energieCfgWizardRows=[];
  _energieCfgWizardSousFluides=[];
  if(_session)renderRespTech(_session,'config');
}

  var suggestions=allSuggestions.filter(function(s){return configured.indexOf(s.nom.toLowerCase())===-1;});
  var suggestHtml='';
  if(suggestions.length){
    suggestHtml='<div style="margin-bottom:14px">'+
      '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px">Suggestions rapides</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px">'+
      suggestions.map(function(s){
        var esc=escape_html(s.nom).replace(/'/g,"\\'");
        var uniteEsc=escape_html(s.unite||'').replace(/'/g,"\\'");
        var seuil=s.seuil_alerte_bas!=null?s.seuil_alerte_bas:'';
        var cap=s.capacite!=null?s.capacite:'';
        var bpc=s.budget_par_chambre!=null?s.budget_par_chambre:'';
        return '<button onclick="_energieCfgSuggestion(\''+esc+'\',\''+uniteEsc+'\',\''+s.type_valeur+'\','+seuil+','+cap+','+bpc+')" '+
          'style="font-size:11px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;background:var(--bg2);cursor:pointer;color:var(--text2)">'+
          escape_html(s.nom)+(s.unite?' <span style="color:var(--text3)">'+escape_html(s.unite)+'</span>':'')+
        '</button>';
      }).join('')+
      '</div>'+
    '</div>';
  }
  _showCfgModal(
    '<div class="cfg-modal-title">➕ Ajouter un fluide</div>'+
    suggestHtml+
    _energieCfgFormHtml({})+
    '<div style="display:flex;gap:10px;margin-top:6px">'+
      '<button class="cfg-btn cfg-btn-amber" onclick="_energieCfgSaveFluid()">💾 Créer le fluide</button>'+
      '<button class="cfg-btn" onclick="_closeCfgModal()" style="background:var(--bg2);color:var(--text2);border:none">Annuler</button>'+
    '</div>'
  );
  var nomEl=document.getElementById('ecfg-edit-nom');
  if(nomEl)setTimeout(function(){nomEl.focus();},50);
}

function _energieCfgSuggestion(nom,unite,type_valeur,seuil,capacite,bpc){
  var nomEl=document.getElementById('ecfg-edit-nom');
  var uniteEl=document.getElementById('ecfg-edit-unite');
  var typeEl=document.getElementById('ecfg-edit-type');
  var seuilEl=document.getElementById('ecfg-edit-seuil');
  var capEl=document.getElementById('ecfg-edit-cap');
  var bpcEl=document.getElementById('ecfg-edit-bpc');
  if(nomEl)nomEl.value=nom;
  if(uniteEl)uniteEl.value=unite;
  if(typeEl)typeEl.value=type_valeur;
  if(seuilEl&&seuil!==undefined&&seuil!=='')seuilEl.value=seuil;
  if(capEl&&capacite!==undefined&&capacite!=='')capEl.value=capacite;
  if(bpcEl&&bpc!==undefined&&bpc!=='')bpcEl.value=bpc;
  if(nomEl)nomEl.focus();
}

function _energieCfgSousCompteursModal(sid){
  var configured=(window._energieCfgFluides||[]).map(function(f){return f.nom.toLowerCase();});
  var groupes={};
  _ENERGIE_SOUSFLUIDES.forEach(function(sf){
    if(!groupes[sf.groupe])groupes[sf.groupe]=[];
    groupes[sf.groupe].push(sf);
  });
  var icons={'Buanderie':'🧺','Spa':'💧','Cuisine':'🍳','Piscine':'🏊','Jardins':'🌿'};
  var groupeKeys=Object.keys(groupes);
  var bodyHtml=groupeKeys.map(function(gKey){
    var sfHtml=groupes[gKey].map(function(sf){
      var alreadyIn=configured.indexOf(sf.nom.toLowerCase())!==-1;
      var cbId='sc-cb-'+sf.nom.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      return '<label style="display:flex;align-items:center;gap:7px;cursor:'+(alreadyIn?'default':'pointer')+';padding:4px 0;'+(alreadyIn?'opacity:0.5':'')+'">'+
        '<input type="checkbox" id="'+cbId+'" '+(alreadyIn?'checked disabled':'')+' style="cursor:'+(alreadyIn?'default':'pointer')+'"/>'+
        '<span style="font-size:12px;color:var(--text)">'+(alreadyIn?'<span style="color:var(--vert)">✓</span> ':'')+escape_html(sf.nom)+
          '<span style="color:var(--text3);font-size:11px"> '+escape_html(sf.unite||'')+'</span>'+
        '</span>'+
      '</label>';
    }).join('');
    return '<div style="margin-bottom:16px">'+
      '<div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px">'+(icons[gKey]||'📊')+' '+escape_html(gKey)+'</div>'+
      sfHtml+
    '</div>';
  }).join('');
  _showCfgModal(
    '<div class="cfg-modal-title">🏗 Sous-compteurs — Ajouter des départements</div>'+
    '<div style="font-size:12px;color:var(--text2);margin-bottom:14px">Les cases grisées (✓) sont déjà configurées sur ce site.</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 20px;margin-bottom:16px">'+bodyHtml+'</div>'+
    '<div style="display:flex;gap:10px;margin-top:4px">'+
      '<button class="cfg-btn cfg-btn-amber" onclick="_energieCfgSousCompteursAddSelected(\''+sid+'\')">💾 Ajouter la sélection</button>'+
      '<button class="cfg-btn" onclick="_closeCfgModal()" style="background:var(--bg2);color:var(--text2);border:none">Annuler</button>'+
    '</div>'
  );
}

async function _energieCfgSousCompteursAddSelected(sid){
  var configured=(window._energieCfgFluides||[]).map(function(f){return f.nom.toLowerCase();});
  var toAdd=[];
  _ENERGIE_SOUSFLUIDES.forEach(function(sf){
    if(configured.indexOf(sf.nom.toLowerCase())!==-1)return;
    var cbId='sc-cb-'+sf.nom.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
    var cb=document.getElementById(cbId);
    if(cb&&cb.checked)toAdd.push(sf);
  });
  if(!toAdd.length){alert('Aucun sous-compteur sélectionné.');return;}
  var currentMax=(window._energieCfgFluides||[]).reduce(function(m,f){return Math.max(m,f.ordre||0);},0);
  var errors=0;
  for(var i=0;i<toAdd.length;i++){
    var sf=toAdd[i];
    var ok=await supaPost('energie_config',{
      site_id:sid,nom:sf.nom,unite:sf.unite||null,
      type_valeur:sf.type_valeur||'index',
      seuil_alerte_bas:null,objectif_mensuel:null,actif:true,
      ordre:currentMax+i+1
    });
    if(!ok)errors++;
  }
  _closeCfgModal();
  if(errors)alert(errors+' erreur(s) lors de l\'ajout.');
  if(_session)renderRespTech(_session,'config');
}

function _energieCfgEditFluidModal(sid,fid){
  _ecfgEditFluidId=fid; _ecfgEditSid=sid;
  var f=(window._energieCfgFluides||[]).find(function(x){return x.id===fid;})||{};
  _showCfgModal(
    '<div class="cfg-modal-title">✏️ Modifier — '+escape_html(f.nom||'Fluide')+'</div>'+
    _energieCfgFormHtml(f)+
    '<div style="display:flex;gap:10px;margin-top:6px">'+
      '<button class="cfg-btn cfg-btn-amber" onclick="_energieCfgSaveFluid()">💾 Enregistrer</button>'+
      '<button class="cfg-btn" onclick="_closeCfgModal()" style="background:var(--bg2);color:var(--text2);border:none">Annuler</button>'+
    '</div>'
  );
}

async function _energieCfgSaveFluid(){
  var sid=_ecfgEditSid; var fid=_ecfgEditFluidId;
  var nomEl=document.getElementById('ecfg-edit-nom');
  if(!nomEl||!nomEl.value.trim()){if(nomEl)nomEl.focus();return;}
  var g=function(id){return document.getElementById(id);};
  var payload={
    nom:nomEl.value.trim(),
    unite:(function(){var e=g('ecfg-edit-unite');return e&&e.value.trim()?e.value.trim():null;})(),
    type_valeur:(function(){var e=g('ecfg-edit-type');return e?e.value:'index';})(),
    devise:(function(){var e=g('ecfg-edit-devise');return e?e.value:'XOF';})(),
    tarif:(function(){var e=g('ecfg-edit-tarif');return e&&e.value!==''?parseFloat(e.value):null;})(),
    budget_par_chambre:(function(){var e=g('ecfg-edit-bpc');return e&&e.value!==''?parseFloat(e.value):null;})(),
    seuil_alerte_bas:(function(){var e=g('ecfg-edit-seuil');return e&&e.value!==''?parseFloat(e.value):null;})(),
    capacite:(function(){var e=g('ecfg-edit-cap');return e&&e.value!==''?parseFloat(e.value):null;})(),
    updated_at:new Date().toISOString()
  };
  var saveBtn=document.querySelector('#cfg-modal .cfg-btn-amber');
  if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='⏳…';}
  if(fid){
    await supaPatch('energie_config',fid,payload);
  }else{
    var existing=await supaGet('energie_config','site_id=eq.'+sid+'&select=ordre&order=ordre.desc&limit=1');
    var nextOrdre=(existing&&existing.length?existing[0].ordre:0)+1;
    var ok=await supaPost('energie_config',Object.assign({site_id:sid,actif:true,ordre:nextOrdre},payload));
    if(!ok){
      alert('Erreur lors de l\'ajout.');
      if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='💾 Créer le fluide';}
      return;
    }
  }
  _closeCfgModal();
  if(_session)renderRespTech(_session,'config');
}

async function _energieToggleActif(sid,fid,actif){
  await supaPatch('energie_config',fid,{actif:actif,updated_at:new Date().toISOString()});
  if(_session)renderRespTech(_session,'config');
}

function _energieDemanderSuppression(sid,fid,nom){
  if(!window.confirm('Supprimer "'+nom+'" ? Cette action est irréversible.'))return;
  var sql='DELETE FROM energie_config WHERE id = \''+fid+'\';';
  alert('Exécutez ce SQL dans Supabase :\n\n'+sql);
}

init();
</script>

  <div class="cfg-modal-box" style="background:var(--creme);max-width:420px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div id="pec-title" style="font-size:14px;font-weight:700;color:var(--text)">Prendre en charge</div>
      <button onclick="_closePEC()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);line-height:1;padding:2px 6px">✕</button>
    </div>
    <div id="pec-tech-list"></div>
  </div>
</div>
</body>
