<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>GenTrack · Ronde de zones</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --dark:#12151E;--dark2:#1E2332;--dark3:#2A2F42;
  --text:#1A1D28;--text2:#5A5F78;--text3:#9AA0B8;
  --border:#E4E6EF;--bg:#F4F5FA;--white:#FFFFFF;
  --amber:#E8A020;--amber-dark:#B87A10;--amber-pale:#FFF6E0;--amber-border:#F5D080;
  --vert:#1B7A4A;--vert-pale:#E8F7EE;--vert-border:#A8DEC0;--vert-text:#155F39;
  --rouge:#C0392B;--rouge-pale:#FDF0EE;--rouge-border:#F0B8B2;--rouge-text:#9B2D22;
  --orange:#D46B0A;--orange-pale:#FEF3E5;--orange-border:#F5C87A;
  --bleu:#2B5BA8;--bleu-pale:#EEF2FB;--bleu-border:#AFC7F0;
  --radius:16px;--radius-sm:10px;
  --shadow:0 2px 12px rgba(18,21,30,.07);
}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
.rz-header{
  background:linear-gradient(145deg,var(--dark) 0%,var(--dark2) 100%);
  padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 20px rgba(0,0,0,.25);
}
.rz-header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.rz-logo{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--amber);text-transform:uppercase}
.rz-badge{
  background:rgba(232,160,32,.15);border:1px solid rgba(232,160,32,.35);
  border-radius:20px;padding:4px 10px;
  font-size:13px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;
}
.rz-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:4px}
.rz-meta-row{display:flex;justify-content:space-between;align-items:center}
.rz-site-name{font-size:13px;color:rgba(255,255,255,.55);font-weight:500}
.rz-contact-chip{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.08);border-radius:20px;
  padding:3px 10px;font-size:12px;color:rgba(255,255,255,.6);
}
.rz-progress-wrap{margin-top:14px}
.rz-progress-labels{display:flex;justify-content:space-between;margin-bottom:5px}
.rz-progress-label{font-size:11px;color:rgba(255,255,255,.4)}
.rz-progress-label.active{color:rgba(255,255,255,.8);font-weight:700}
.rz-progress{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.rz-progress-bar{height:100%;background:linear-gradient(90deg,var(--amber),#F5C040);border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ── CONTENT ── */
.rz-content{padding:20px 16px 140px}

/* ── GROUP BÂTIMENT ── */
.rz-group{margin-bottom:28px}
.rz-group-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;padding:0 4px;display:flex;align-items:center;gap:8px}
.rz-group-title span{font-size:11px;font-weight:500;color:var(--text3)}

/* ── ÉTAGE ── */
.rz-etage{margin-bottom:10px}
.rz-etage-label{
  font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text3);margin-bottom:6px;padding:0 2px;
}

/* ── ZONE CARD ── */
.rz-zone-card{
  background:var(--white);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:6px;
  transition:border-color .2s,box-shadow .2s;
}
.rz-zone-card.ok{border-color:var(--vert-border);background:var(--vert-pale)}
.rz-zone-card.incident{border-color:var(--rouge-border);background:var(--rouge-pale)}
.rz-zone-top{display:flex;align-items:center;gap:10px}
.rz-zone-icon{font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--bg);flex-shrink:0}
.rz-zone-card.ok .rz-zone-icon{background:rgba(27,122,74,.12)}
.rz-zone-card.incident .rz-zone-icon{background:rgba(192,57,43,.1)}
.rz-zone-info{flex:1;min-width:0}
.rz-zone-nom{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rz-zone-sub{font-size:11px;color:var(--text3);margin-top:1px}
.rz-zone-btns{display:flex;gap:6px;flex-shrink:0}

/* ── TOGGLE BUTTONS ── */
.rz-btn{
  height:34px;padding:0 12px;border-radius:8px;
  font-size:12px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--border);background:var(--white);color:var(--text2);
  transition:all .15s;white-space:nowrap;
}
.rz-btn-ok.active{background:var(--vert);border-color:var(--vert);color:#fff}
.rz-btn-ok:not(.active):hover{border-color:var(--vert);color:var(--vert)}
.rz-btn-incident.active{background:var(--rouge);border-color:var(--rouge);color:#fff}
.rz-btn-incident:not(.active):hover{border-color:var(--rouge);color:var(--rouge)}

/* ── ANOMALY INPUT ── */
.rz-anomaly-wrap{overflow:hidden;max-height:0;transition:max-height .25s ease,margin-top .25s ease;margin-top:0}
.rz-anomaly-wrap.open{max-height:120px;margin-top:10px}
.rz-anomaly-inp{
  width:100%;padding:9px 12px;font-size:13px;font-family:inherit;
  border:1.5px solid var(--rouge-border);border-radius:8px;
  background:var(--white);color:var(--text);resize:none;
  outline:none;line-height:1.4;
}
.rz-anomaly-inp:focus{border-color:var(--rouge);box-shadow:0 0 0 3px rgba(192,57,43,.1)}
.rz-anomaly-inp::placeholder{color:var(--text3)}

/* ── FOOTER ── */
.rz-footer{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--white);border-top:1.5px solid var(--border);
  padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);
  box-shadow:0 -4px 24px rgba(18,21,30,.1);
  z-index:40;
}
.rz-footer-info{font-size:12px;color:var(--text2);margin-bottom:10px;text-align:center;font-weight:500}
.rz-submit{
  width:100%;height:52px;border-radius:14px;
  background:linear-gradient(135deg,#1B7A4A,#24A060);
  border:none;color:#fff;font-size:16px;font-weight:800;
  cursor:pointer;letter-spacing:-.01em;
  box-shadow:0 4px 20px rgba(27,122,74,.35);
  transition:opacity .15s,transform .1s;
}
.rz-submit:disabled{background:var(--dark3);box-shadow:none;opacity:.55;cursor:default}
.rz-submit:not(:disabled):active{transform:scale(.98)}

/* ── EMPTY / STATE ── */
.rz-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 24px;text-align:center;
}
.rz-state-emoji{font-size:48px;margin-bottom:16px}
.rz-state-title{font-size:20px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.rz-state-sub{font-size:14px;color:var(--text2);line-height:1.5;max-width:280px}
.rz-pill{
  display:inline-block;border-radius:20px;padding:6px 16px;
  font-size:13px;font-weight:700;margin-top:10px;
}
.rz-pill-ok{background:var(--vert-pale);color:var(--vert-text);border:1px solid var(--vert-border)}
.rz-pill-warn{background:var(--orange-pale);color:var(--orange);border:1px solid var(--orange-border)}
.rz-confirm-time{font-size:12px;color:var(--text3);margin-top:12px}

/* ── SPINNER ── */
.rz-spinner{
  width:44px;height:44px;border:3px solid var(--border);
  border-top-color:var(--amber);border-radius:50%;
  animation:spin .7s linear infinite;margin-bottom:24px;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var SUPA_URL='https://zbpoxjlkqxnqjzxohasq.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicG94amxrcXhucWp6eG9oYXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjM3ODAsImV4cCI6MjA5NzA5OTc4MH0.9-QyWgon93jGDo5QKMIh_-QbQZ_P9rQrYJnVxegJe7M';

var _site=null,_contact=null,_zones=[],_checks={},_notes={};

function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function zoneIcon(z){
  var t=(z.type_zone||z.categorie||'').toLowerCase();
  if(t.includes('chambre'))return '🛏️';
  if(t.includes('salon')||t.includes('commun'))return '🛋️';
  if(t.includes('piscine'))return '🏊';
  if(t.includes('gym')||t.includes('sport'))return '🏋️';
  if(t.includes('cuisine'))return '🍽️';
  if(t.includes('parking'))return '🚗';
  if(t.includes('bureau'))return '💼';
  if(t.includes('hall')||t.includes('lobby'))return '🏛️';
  if(t.includes('terrasse'))return '🌿';
  return '📍';
}

async function supaGet(table,filter){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?'+filter,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  });
  return r.json();
}
async function supaPost(table,data){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table,{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(data)
  });
  if(!r.ok){var err=await r.text();throw new Error('POST /'+table+' → '+r.status+': '+err);}
  var rows=await r.json();
  return Array.isArray(rows)?rows[0]:rows;
}

function showLoading(){
  document.getElementById('app').innerHTML=
    '<div class="rz-header"><div class="rz-header-top"><div class="rz-logo">GenTrack ✦</div></div></div>'+
    '<div class="rz-state"><div class="rz-spinner"></div><div class="rz-state-sub">Chargement des zones…</div></div>';
}
function showState(icon,title,sub,extra){
  document.getElementById('app').innerHTML=
    '<div class="rz-header"><div class="rz-header-top"><div class="rz-logo">GenTrack ✦</div></div></div>'+
    '<div class="rz-state">'+
      '<div class="rz-state-emoji">'+icon+'</div>'+
      '<div class="rz-state-title">'+title+'</div>'+
      '<div class="rz-state-sub">'+sub+'</div>'+
      (extra||'')+
    '</div>';
}

function updateProgress(){
  var total=_zones.length;
  var done=Object.keys(_checks).filter(function(k){return _checks[k];}).length;
  var pct=total>0?Math.round(done/total*100):0;
  var bar=document.getElementById('rz-progress');if(bar)bar.style.width=pct+'%';
  var lbl=document.getElementById('rz-prog-lbl');if(lbl)lbl.textContent=done+' / '+total+' zone'+(total>1?'s':'')+' contrôlée'+(done>1?'s':'');
  var pctEl=document.getElementById('rz-prog-pct');if(pctEl){pctEl.textContent=pct+'%';pctEl.className='rz-progress-label'+(pct>0?' active':'');}
  var fi=document.getElementById('rz-footer-info');if(fi)fi.textContent=done+' / '+total+' zone'+(total>1?'s':'')+' contrôlée'+(done>1?'s':'');
  var btn=document.getElementById('rz-submit');if(btn)btn.disabled=done<total;
  var badge=document.getElementById('rz-badge');if(badge)badge.textContent=pct+'%';
}

function setCheck(zoneId,val){
  _checks[zoneId]=val;
  var card=document.getElementById('zc-'+zoneId);
  if(card){
    card.className='rz-zone-card'+(val==='ok'?' ok':val==='incident'?' incident':'');
  }
  var btnOk=document.getElementById('bok-'+zoneId);
  var btnInc=document.getElementById('binc-'+zoneId);
  if(btnOk)btnOk.className='rz-btn rz-btn-ok'+(val==='ok'?' active':'');
  if(btnInc)btnInc.className='rz-btn rz-btn-incident'+(val==='incident'?' active':'');
  // Toggle anomaly field
  var aw=document.getElementById('anom-'+zoneId);
  if(aw)aw.className='rz-anomaly-wrap'+(val==='incident'?' open':'');
  updateProgress();
}

function renderRonde(){
  var grouped={};
  _zones.forEach(function(z){
    var bat=z.batiment||'Résidence';
    var et=z.etage||'—';
    if(!grouped[bat])grouped[bat]={};
    if(!grouped[bat][et])grouped[bat][et]=[];
    grouped[bat][et].push(z);
  });

  var html='<div class="rz-header">'+
    '<div class="rz-header-top">'+
      '<div class="rz-logo">GenTrack ✦</div>'+
      '<div class="rz-badge" id="rz-badge">0%</div>'+
    '</div>'+
    '<div class="rz-title">🏠 Ronde de zones</div>'+
    '<div class="rz-meta-row">'+
      '<div class="rz-site-name">'+h(_site.nom)+'</div>'+
      '<div class="rz-contact-chip">👤 '+h(_contact.nom)+'</div>'+
    '</div>'+
    '<div class="rz-progress-wrap">'+
      '<div class="rz-progress-labels">'+
        '<span class="rz-progress-label" id="rz-prog-lbl">0 / '+_zones.length+' zone'+(_zones.length>1?'s':'')+' contrôlée'+'</span>'+
        '<span class="rz-progress-label" id="rz-prog-pct">0%</span>'+
      '</div>'+
      '<div class="rz-progress"><div class="rz-progress-bar" id="rz-progress" style="width:0%"></div></div>'+
    '</div>'+
  '</div>'+
  '<div class="rz-content">';

  Object.keys(grouped).sort().forEach(function(bat){
    var bData=grouped[bat];
    var batTotal=0;Object.keys(bData).forEach(function(e){batTotal+=bData[e].length;});
    html+='<div class="rz-group">'+
      '<div class="rz-group-title">🏢 '+h(bat)+' <span>'+batTotal+' zone'+(batTotal>1?'s':'')+'</span></div>';
    Object.keys(bData).sort().forEach(function(et){
      var zones=bData[et];
      html+='<div class="rz-etage">'+
        '<div class="rz-etage-label">Étage '+h(et)+'</div>';
      zones.forEach(function(z){
        var sub=(z.type_zone||'Zone');
        html+='<div class="rz-zone-card" id="zc-'+h(z.id)+'">'+
          '<div class="rz-zone-top">'+
            '<div class="rz-zone-icon">'+zoneIcon(z)+'</div>'+
            '<div class="rz-zone-info">'+
              '<div class="rz-zone-nom">'+h(z.nom)+'</div>'+
              '<div class="rz-zone-sub">'+h(sub)+'</div>'+
            '</div>'+
            '<div class="rz-zone-btns">'+
              '<button class="rz-btn rz-btn-ok" id="bok-'+h(z.id)+'" onclick="setCheck(\''+h(z.id)+'\',\'ok\')">✅ OK</button>'+
              '<button class="rz-btn rz-btn-incident" id="binc-'+h(z.id)+'" onclick="setCheck(\''+h(z.id)+'\',\'incident\')">⚠️ Incident</button>'+
            '</div>'+
          '</div>'+
          '<div class="rz-anomaly-wrap" id="anom-'+h(z.id)+'">'+
            '<textarea class="rz-anomaly-inp" id="note-'+h(z.id)+'" rows="2" placeholder="Décrivez l\'incident…" oninput="_notes[\''+h(z.id)+'\']=this.value"></textarea>'+
          '</div>'+
        '</div>';
      });
      html+='</div>';
    });
    html+='</div>';
  });

  html+='</div>';// rz-content

  html+='<div class="rz-footer">'+
    '<div class="rz-footer-info" id="rz-footer-info">0 / '+_zones.length+' zones contrôlées</div>'+
    '<button class="rz-submit" id="rz-submit" disabled onclick="submitRonde()">Valider la ronde →</button>'+
  '</div>';

  document.getElementById('app').innerHTML=html;
}

async function submitRonde(){
  var btn=document.getElementById('rz-submit');
  if(btn){btn.disabled=true;btn.textContent='Envoi en cours…';}
  try{
    var today=new Date().toISOString().split('T')[0];
    var incidents=_zones.filter(function(z){return _checks[z.id]==='incident';});
    var posts=_zones.map(function(z){
      var isInc=_checks[z.id]==='incident';
      return supaPost('releves_zones',{
        zone_id:z.id,
        site_id:_site.id,
        date:today,
        technicien:_contact.nom,
        statut:isInc?'incident':'ok',
        nb_anomalies:isInc?1:0
      });
    });
    await Promise.all(posts);

    // Signalements pour les incidents
    if(incidents.length){
      var sigPosts=incidents.map(function(z){
        var note=(_notes[z.id]||'').trim()||('Incident signalé lors de la ronde de zones : '+z.nom);
        return supaPost('signalements',{
          groupe_id:_site.id,
          description:note,
          signale_par:_contact.nom,
          statut:'ouvert',
          source:'ronde_zones',
          type:'anomalie_zone'
        });
      });
      await Promise.all(sigPosts);
    }

    // Confirmation
    var now=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('app').innerHTML=
      '<div class="rz-header"><div class="rz-header-top"><div class="rz-logo">GenTrack ✦</div></div></div>'+
      '<div class="rz-state">'+
        '<div class="rz-state-emoji">🎉</div>'+
        '<div class="rz-state-title">Ronde terminée !</div>'+
        '<div class="rz-state-sub">Toutes les zones ont bien été enregistrées.</div>'+
        '<div class="rz-pill rz-pill-ok">✓ '+_zones.length+' zone'+(_zones.length>1?'s':'')+' validée'+(_zones.length>1?'s':'')+'</div>'+
        (incidents.length>0?
          '<div class="rz-pill rz-pill-warn">⚠️ '+incidents.length+' incident'+(incidents.length>1?'s':'')+' signalé'+(incidents.length>1?'s':'')+'</div>':
          '<div class="rz-pill rz-pill-ok">✓ Aucun incident</div>'
        )+
        '<div class="rz-confirm-time">Validé à '+now+'</div>'+
      '</div>';

  }catch(err){
    console.error('Submit error:',err);
    if(btn){btn.disabled=false;btn.textContent='Valider la ronde →';}
    var existing=document.getElementById('rz-err');if(existing)existing.remove();
    var errDiv=document.createElement('div');
    errDiv.id='rz-err';
    errDiv.style.cssText='background:#FDF0EE;border:1.5px solid #F0B8B2;border-radius:10px;padding:10px 14px;margin:10px 16px;font-size:12px;color:#9B2D22;font-weight:600;line-height:1.5';
    errDiv.textContent='❌ Erreur lors de l\'envoi. Vérifiez votre connexion. ('+String(err).slice(0,120)+')';
    var footer=document.querySelector('.rz-footer');
    if(footer)footer.parentNode.insertBefore(errDiv,footer);
  }
}

async function init(){
  showLoading();
  try{
    var params=new URLSearchParams(window.location.search);
    var siteId=params.get('site');
    var contactId=params.get('contact');
    if(!siteId||!contactId){
      return showState('⚠️','Lien invalide','Paramètres manquants. Utilisez le lien envoyé par WhatsApp.');
    }

    var[sites,contacts,zones]=await Promise.all([
      supaGet('sites','id=eq.'+siteId+'&select=id,nom&limit=1'),
      supaGet('contacts','id=eq.'+contactId+'&select=id,nom&limit=1'),
      supaGet('zones','site_id=eq.'+siteId+'&actif=eq.true&select=id,nom,etage,batiment,type_zone,categorie&order=batiment.asc,etage.asc,nom.asc')
    ]);

    _site=Array.isArray(sites)?sites[0]:null;
    _contact=Array.isArray(contacts)?contacts[0]:null;
    _zones=Array.isArray(zones)?zones:[];

    if(!_site){return showState('🔒','Site introuvable','Ce site n\'existe pas ou n\'est plus actif.');}
    if(!_contact){return showState('🔒','Accès refusé','Contact introuvable. Contactez votre responsable.');}
    if(!_zones.length){return showState('📋','Aucune zone','Aucune zone active configurée pour ce site.');}

    renderRonde();
  }catch(err){
    console.error('Init error:',err);
    showState('❌','Erreur de chargement','Vérifiez votre connexion et réessayez.<br><br><small>'+String(err).slice(0,120)+'</small>');
  }
}

init();
</script>
</body>
</html>
