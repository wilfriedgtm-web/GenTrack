<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Mission de maintenance · GenTrack</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;}
    .header{background:#0f172a;color:white;padding:16px 18px;position:sticky;top:0;z-index:10;}
    .header-brand{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
    .header-title{font-size:17px;font-weight:700;}
    .header-sub{font-size:11px;color:#94a3b8;margin-top:2px;}
    .content{padding:16px;max-width:600px;margin:0 auto;}
    .card{background:white;border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
    .card-head{padding:12px 14px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:8px;}
    .card-head-label{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.7px;flex:1;}
    .task-row{padding:14px;border-bottom:1px solid #f1f5f9;}
    .task-row:last-child{border-bottom:none;}
    .task-name{font-size:14px;font-weight:700;color:#1e293b;margin-bottom:3px;}
    .task-freq{font-size:11px;color:#64748b;margin-bottom:12px;}
    .btn-group{display:flex;gap:8px;margin-bottom:10px;}
    .btn-status{flex:1;padding:9px;border-radius:9px;border:2px solid #e2e8f0;background:white;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
    .btn-status.ok{border-color:#22c55e;background:#f0fdf4;color:#16a34a;}
    .btn-status.ko{border-color:#ef4444;background:#fef2f2;color:#ef4444;}
    .field-label{font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
    .field-input{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:9px 11px;font-size:12px;outline:none;font-family:inherit;resize:vertical;}
    .field-input:focus{border-color:#3b82f6;}
    .counter-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .counter-input{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:9px 11px;font-size:14px;font-weight:600;outline:none;text-align:center;}
    .counter-input:focus{border-color:#3b82f6;}
    .photo-label{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:8px;font-size:11px;font-weight:600;color:#64748b;cursor:pointer;transition:all .15s;width:100%;justify-content:center;}
    .photo-label:hover{border-color:#3b82f6;color:#3b82f6;background:#eff6ff;}
    .photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
    .photo-preview img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;}
    .submit-btn{width:100%;padding:16px;background:#0f172a;color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
    .badge-ok{background:#f0fdf4;color:#16a34a;}
    .badge-ko{background:#fef2f2;color:#ef4444;}
    .badge-todo{background:#fffbeb;color:#d97706;}
    .loading{text-align:center;padding:60px 20px;color:#94a3b8;}
    .loading-spinner{font-size:32px;margin-bottom:12px;animation:spin 1s linear infinite;display:block;}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .error-box{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:20px;text-align:center;color:#ef4444;font-weight:600;}
    .success-screen{text-align:center;padding:60px 20px;}
    .success-icon{font-size:56px;margin-bottom:16px;}
    .success-title{font-size:20px;font-weight:800;color:#1e293b;margin-bottom:8px;}
    .success-sub{font-size:13px;color:#64748b;}
  </style>
</head>
<body>
<div class="header">
  <div class="header-brand">GenTrack · GMAO</div>
  <div class="header-title" id="hdr-title">Mission de maintenance</div>
  <div class="header-sub" id="hdr-sub">Chargement...</div>
</div>
<div class="content" id="app">
  <div class="loading"><span class="loading-spinner">⟳</span>Chargement de la mission...</div>
</div>

<script>
var SUPA_URL='https://zbpoxjlkqxnqjzxohasq.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicG94amxrcXhucWp6eG9oYXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjM3ODAsImV4cCI6MjA5NzA5OTc4MH0.9-QyWgon93jGDo5QKMIh_-QbQZ_P9rQrYJnVxegJe7M';

var _mission=null;
var _missionPlans=[];
var _taskStates={}; // planId → {statut, commentaire, heures, photoFiles, motifBlocage, checklistCompletee}
var _respTel='';

async function sbGet(table,qs){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?'+qs,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Accept':'application/json'}
  });
  if(!r.ok)return[];
  return await r.json();
}
async function sbPost(table,data){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table,{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(data)
  });
  if(!r.ok){var e=await r.text();console.error('POST error',e);}
  return r.ok;
}
async function sbPatch(table,id,data){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id,{
    method:'PATCH',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify(data)
  });
  return r.ok;
}
async function sbUploadPhoto(missionId,file){
  var ext=file.name.split('.').pop();
  var path='missions/'+missionId+'/'+Date.now()+'.'+ext;
  var r=await fetch(SUPA_URL+'/storage/v1/object/maintenance-photos/'+path,{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':file.type},
    body:file
  });
  if(!r.ok)return null;
  return SUPA_URL+'/storage/v1/object/public/maintenance-photos/'+path;
}

function freqLabel(freq){
  if(!freq)return '';
  var m=freq.match(/^(\d+(?:\.\d+)?)\s*(\w+)/);
  if(!m)return freq;
  var n=m[1],u=m[2].toLowerCase();
  if(u.startsWith('heure'))return 'Tous les '+n+'h compteur';
  if(u.startsWith('sem'))return 'Toutes les '+n+' semaine'+(n>1?'s':'');
  if(u.startsWith('mois'))return 'Tous les '+n+' mois';
  if(u.startsWith('jour'))return 'Tous les '+n+' jour'+(n>1?'s':'');
  if(u.startsWith('an'))return 'Tous les '+n+' an'+(n>1?'s':'');
  return freq;
}

function nextDateFromFreq(freq){
  if(!freq)return null;
  var today=new Date();today.setHours(0,0,0,0);
  var m=freq.match(/^(\d+(?:\.\d+)?)\s*(\w+)/);
  if(!m)return null;
  var n=parseFloat(m[1]),u=m[2].toLowerCase();
  var d=new Date(today);
  if(u.startsWith('heure'))return null; // compteur-based, skip
  if(u.startsWith('jour'))d.setDate(d.getDate()+n);
  else if(u.startsWith('sem'))d.setDate(d.getDate()+n*7);
  else if(u.startsWith('mois'))d.setMonth(d.getMonth()+n);
  else if(u.startsWith('an'))d.setFullYear(d.getFullYear()+n);
  else return null;
  return d.toISOString().slice(0,10);
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function init(){
  var params=new URLSearchParams(window.location.search);
  var token=params.get('token');
  if(!token){renderError('Lien invalide — token manquant.');return;}
  _respTel=params.get('resp_tel')||'';

  // Fetch mission par token
  var missions=await sbGet('missions','token=eq.'+token+'&select=*,equipements(nom,types_equipements(nom)),sites(nom)');
  if(!missions||!missions.length){renderError('Mission introuvable ou expirée.');return;}
  _mission=missions[0];
  if(!_respTel&&_mission.resp_tel)_respTel=_mission.resp_tel;

  // Fetch mission_plans dans tous les cas (mode actif ET mode lecture rapport)
  var mps=await sbGet('mission_plans','mission_id=eq.'+_mission.id+'&select=*,plans_maintenance(id,titre,frequence,checklist)');
  _missionPlans=mps||[];

  // Init states
  _missionPlans.forEach(function(mp){
    var checklist=Array.isArray((mp.plans_maintenance||{}).checklist)?(mp.plans_maintenance.checklist):[];
    _taskStates[mp.id]={
      statut:'a_faire',commentaire:'',recommandation:'',heures:null,
      photoFiles:[],photoUrls:[],
      motifBlocage:'',
      checklistCompletee:checklist.map(function(){return false;})
    };
  });

  var eqNom=(_mission.equipements&&_mission.equipements.nom)||'Équipement';
  var siteNom=(_mission.sites&&_mission.sites.nom)||'';
  document.getElementById('hdr-title').textContent=eqNom;
  document.getElementById('hdr-sub').textContent=(siteNom?siteNom+' · ':'')+_missionPlans.length+' tâche'+(_missionPlans.length>1?'s':'');

  if(_mission.statut==='realisee'||_mission.statut==='echec'){renderRapport();return;}
  renderApp();
}

function renderApp(){
  var app=document.getElementById('app');
  if(!_missionPlans.length){
    app.innerHTML='<div class="card"><div style="padding:24px;text-align:center;color:#94a3b8">Aucune tâche dans cette mission.</div></div>';
    return;
  }
  var html='';
  _missionPlans.forEach(function(mp,i){
    var plan=mp.plans_maintenance||{};
    var st=_taskStates[mp.id];
    var isOk=st.statut==='realise',isKo=st.statut==='bloque';
    var hasCounter=plan.frequence&&plan.frequence.toLowerCase().includes('heure');
    var checklist=Array.isArray(plan.checklist)?plan.checklist:[];
    html+='<div class="card" id="task-card-'+mp.id+'">';
    html+='<div class="card-head">';
    html+='<div class="card-head-label">Tâche '+(i+1)+' / '+_missionPlans.length+'</div>';
    if(isOk)html+='<span class="badge badge-ok">✅ Réalisé</span>';
    else if(isKo)html+='<span class="badge badge-ko">🔴 Bloqué</span>';
    else html+='<span class="badge badge-todo">À faire</span>';
    html+='</div>';
    html+='<div class="task-row">';
    html+='<div class="task-name">'+esc(plan.titre||plan.frequence||'Tâche')+'</div>';
    if(plan.frequence)html+='<div class="task-freq">'+esc(freqLabel(plan.frequence))+'</div>';
    // Checklist points à vérifier
    if(checklist.length){
      html+='<div style="margin-bottom:12px">';
      html+='<div class="field-label" style="margin-bottom:6px">Points à vérifier</div>';
      checklist.forEach(function(item,ci){
        var checked=st.checklistCompletee[ci];
        html+='<label style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;cursor:pointer">';
        html+='<input type="checkbox" '+(checked?'checked':'')+' onchange="_toggleCheck(\''+mp.id+'\','+ci+',this.checked)" '+
          'style="width:16px;height:16px;accent-color:#22c55e;cursor:pointer">';
        html+='<span style="font-size:13px;color:#374151'+(checked?';text-decoration:line-through;color:#94a3b8':'')+'" id="cl-text-'+mp.id+'-'+ci+'">'+esc(typeof item==='string'?item:(item.label||item.text||item.tache||item.titre||item.nom||''))+'</span>';
        html+='</label>';
      });
      html+='</div>';
    }
    // Boutons statut
    html+='<div class="btn-group">';
    html+='<button class="btn-status'+(isOk?' ok':'')+'" onclick="_setStatut(\''+mp.id+'\',\'realise\')">✅ Réalisé</button>';
    html+='<button class="btn-status'+(isKo?' ko':'')+'" onclick="_setStatut(\''+mp.id+'\',\'bloque\')">🔴 Bloqué</button>';
    html+='</div>';
    // Motif blocage (affiché seulement si bloqué)
    html+='<div id="motif-wrap-'+mp.id+'" style="'+(isKo?'':'display:none;')+'margin-bottom:10px">';
    html+='<div class="field-label">Motif du blocage *</div>';
    html+='<textarea class="field-input" rows="2" placeholder="Expliquez pourquoi cette tâche est bloquée…" onchange="_setMotif(\''+mp.id+'\',this.value)">'+esc(st.motifBlocage)+'</textarea>';
    html+='</div>';
    // Compteur heures
    if(hasCounter){
      html+='<div class="field-label">Heures compteur actuel</div>';
      html+='<div class="counter-row"><input class="counter-input" type="number" placeholder="ex: 1250" value="'+(st.heures!==null?st.heures:'')+'" onchange="_setHeures(\''+mp.id+'\',this.value)"></div>';
    }
    // Commentaire
    html+='<div class="field-label" style="margin-top:8px">Commentaire</div>';
    html+='<textarea class="field-input" rows="2" placeholder="Notes sur cette tâche..." onchange="_setComment(\''+mp.id+'\',this.value)">'+esc(st.commentaire)+'</textarea>';
    // Recommandation
    html+='<div class="field-label" style="margin-top:8px">💡 Recommandation (optionnel)</div>';
    html+='<textarea class="field-input" rows="2" placeholder="Actions à prévoir, pièces à commander..." onchange="_setRecommandation(\''+mp.id+'\',this.value)">'+esc(st.recommandation||'')+'</textarea>';
    // Photo
    html+='<div style="margin-top:10px">';
    html+='<div class="field-label">Photo</div>';
    html+='<label class="photo-label" for="photo-'+mp.id+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Ajouter une photo</label>';
    html+='<input type="file" id="photo-'+mp.id+'" accept="image/*" capture="environment" style="display:none" onchange="_addPhoto(\''+mp.id+'\',this)">';
    html+='<div class="photo-preview" id="photos-'+mp.id+'">';
    st.photoUrls.forEach(function(u){html+='<img src="'+esc(u)+'">';});
    html+='</div>';
    html+='</div>';
    html+='</div></div>';
  });
  // Submit button
  html+='<button class="submit-btn" id="submit-btn" onclick="_submitMission()">'+
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Soumettre la mission</button>';
  html+='<div style="height:32px"></div>';
  app.innerHTML=html;
}

function _setStatut(mpId,statut){
  _taskStates[mpId].statut=statut;
  var card=document.getElementById('task-card-'+mpId);
  if(!card)return;
  var badge=card.querySelector('.badge');
  if(badge){
    badge.className='badge '+(statut==='realise'?'badge-ok':statut==='bloque'?'badge-ko':'badge-todo');
    badge.textContent=statut==='realise'?'✅ Réalisé':statut==='bloque'?'🔴 Bloqué':'À faire';
  }
  var btns=card.querySelectorAll('.btn-status');
  btns.forEach(function(b){
    b.className='btn-status';
    if(b.textContent.includes('Réalisé')&&statut==='realise')b.className='btn-status ok';
    if(b.textContent.includes('Bloqué')&&statut==='bloque')b.className='btn-status ko';
  });
  // Afficher/masquer champ motif
  var motifWrap=document.getElementById('motif-wrap-'+mpId);
  if(motifWrap)motifWrap.style.display=statut==='bloque'?'':'none';
}
function _setComment(mpId,val){_taskStates[mpId].commentaire=val;}
function _setRecommandation(mpId,val){_taskStates[mpId].recommandation=val;}
function _setMotif(mpId,val){_taskStates[mpId].motifBlocage=val;}
function _setHeures(mpId,val){_taskStates[mpId].heures=val?parseFloat(val):null;}
function _toggleCheck(mpId,ci,checked){
  _taskStates[mpId].checklistCompletee[ci]=checked;
  var txt=document.getElementById('cl-text-'+mpId+'-'+ci);
  if(txt){txt.style.textDecoration=checked?'line-through':'';txt.style.color=checked?'#94a3b8':'';}
}
function _addPhoto(mpId,input){
  var file=input.files[0];
  if(!file)return;
  _taskStates[mpId].photoFiles.push(file);
  var reader=new FileReader();
  reader.onload=function(e){
    var preview=document.getElementById('photos-'+mpId);
    if(preview){var img=document.createElement('img');img.src=e.target.result;preview.appendChild(img);}
    // Store as local preview (actual upload happens on submit)
    _taskStates[mpId].photoUrls.push(e.target.result);
  };
  reader.readAsDataURL(file);
  input.value='';
}

async function _submitMission(){
  var allSet=_missionPlans.every(function(mp){return _taskStates[mp.id].statut!=='a_faire';});
  if(!allSet){
    if(!confirm('Certaines tâches ne sont pas encore marquées. Soumettre quand même ?'))return;
  }
  var btn=document.getElementById('submit-btn');
  if(btn){btn.disabled=true;btn.textContent='Envoi en cours...';}

  for(var i=0;i<_missionPlans.length;i++){
    var mp=_missionPlans[i];
    var st=_taskStates[mp.id];
    var plan=mp.plans_maintenance||{};
    var checklist=Array.isArray(plan.checklist)?plan.checklist:[];
    // Upload photos
    var photoUrl=null;
    if(st.photoFiles&&st.photoFiles.length){
      var url=await sbUploadPhoto(_mission.id,st.photoFiles[0]);
      if(url)photoUrl=url;
    }
    // Update mission_plan
    var mpPatch={statut:st.statut,commentaire:st.commentaire||null,recommandation:st.recommandation||null};
    if(photoUrl)mpPatch.photo_url=photoUrl;
    if(st.heures!==null)mpPatch.heures_compteur=st.heures;
    if(st.statut==='bloque'&&st.motifBlocage)mpPatch.motif_blocage=st.motifBlocage;
    // Checklist complétée — [{text, done}]
    if(checklist.length){
      mpPatch.checklist_completee=checklist.map(function(item,ci){
        return{text:typeof item==='string'?item:(item.label||item.text||item.tache||item.titre||item.nom||''),done:!!st.checklistCompletee[ci]};
      });
    }
    await sbPatch('mission_plans',mp.id,mpPatch);
    // Si réalisé : mettre à jour plans_maintenance prochaine_date
    if(st.statut==='realise'&&plan.frequence){
      var nextDate=nextDateFromFreq(plan.frequence);
      var planPatch={};
      if(nextDate)planPatch.prochaine_date=nextDate;
      if(st.heures!==null&&plan.frequence.toLowerCase().includes('heure'))planPatch.prochaine_date=null;
      if(Object.keys(planPatch).length)await sbPatch('plans_maintenance',plan.id,planPatch);
    }
    // La mission elle-même est la source de vérité pour l'historique prestataire
    // (Option B : pas de doublon maintenances pour les missions prestataire)
  }
  // Marquer mission comme réalisée
  var allRealise=_missionPlans.every(function(mp){return _taskStates[mp.id].statut==='realise';});
  var anyRealise=_missionPlans.some(function(mp){return _taskStates[mp.id].statut==='realise';});
  var missionStatut=allRealise?'realisee':anyRealise?'realisee':'echec';
  await sbPatch('missions',_mission.id,{statut:missionStatut,completed_at:new Date().toISOString()});

  // Construire le résumé pour WhatsApp resp
  var eqNom=(_mission.equipements&&_mission.equipements.nom)||'Équipement';
  var siteNom=(_mission.sites&&_mission.sites.nom)||'';
  var lines=['📋 Rapport mission · '+eqNom+(siteNom?' ('+siteNom+')':'')];
  lines.push('Tech: '+(_mission.technicien_nom||'—'));
  lines.push('Date: '+new Date().toLocaleDateString('fr-FR'));
  lines.push('');
  _missionPlans.forEach(function(mp,i){
    var plan=mp.plans_maintenance||{};
    var st=_taskStates[mp.id];
    var ico=st.statut==='realise'?'✅':st.statut==='bloque'?'🔴':'⬜';
    lines.push(ico+' '+(plan.titre||'Tâche '+(i+1)));
    if(st.statut==='bloque'&&st.motifBlocage)lines.push('   Motif: '+st.motifBlocage);
    if(st.commentaire)lines.push('   '+st.commentaire);
  });
  _waRapportMsg=lines.join('\n');

  renderSuccess();
}

var _waRapportMsg='';

function renderRapport(){
  var eqNom=(_mission.equipements&&_mission.equipements.nom)||'Équipement';
  var siteNom=(_mission.sites&&_mission.sites.nom)||'';
  var dateComp=_mission.completed_at?new Date(_mission.completed_at).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
  var app=document.getElementById('app');
  document.getElementById('hdr-sub').textContent='Rapport · '+(dateComp||'Mission réalisée');
  var html='<div class="card" style="margin-bottom:12px;padding:14px 16px">';
  html+='<div style="display:flex;align-items:center;gap:10px">';
  html+='<span style="font-size:28px">✅</span>';
  html+='<div style="flex:1"><div style="font-size:14px;font-weight:700;color:#1e293b">Mission réalisée</div>';
  if(_mission.technicien_nom)html+='<div style="font-size:11px;color:#64748b;margin-top:1px">Tech : '+esc(_mission.technicien_nom)+(dateComp?' · '+dateComp:'')+'</div>';
  html+='</div></div>';
  // Durée + coût si renseignés
  var mInfoParts=[];
  if(_mission.duree_heures!=null){var _dh=parseFloat(_mission.duree_heures);mInfoParts.push('⏱ '+_dh.toFixed(_dh%1===0?0:1)+' h');}
  if(_mission.cout!=null){var _dev=_mission.devise||'FCFA';mInfoParts.push('💰 '+parseFloat(_mission.cout).toLocaleString('fr-FR')+' '+_dev);}
  if(mInfoParts.length){html+='<div style="display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9">'+mInfoParts.map(function(p){return'<span style="font-size:12px;font-weight:600;color:#1e293b;background:#f8fafc;padding:4px 10px;border-radius:6px;border:1px solid #e2e8f0">'+p+'</span>';}).join('')+'</div>';}
  html+='</div>';

  _missionPlans.forEach(function(mp,i){
    var plan=mp.plans_maintenance||{};
    var statut=mp.statut||'a_faire';
    var isOk=statut==='realise',isKo=statut==='bloque';
    var clDef=Array.isArray(plan.checklist)?plan.checklist:[];
    var clComp=Array.isArray(mp.checklist_completee)?mp.checklist_completee:[];
    var nbComp=clComp.filter(function(c){return c===true||(c&&c.done===true);}).length;
    var nbTotal=clDef.length||clComp.length;

    html+='<div class="card" id="task-card-'+mp.id+'">';
    html+='<div class="card-head">';
    html+='<div class="card-head-label">Tâche '+(i+1)+' / '+_missionPlans.length+'</div>';
    if(isOk)html+='<span class="badge badge-ok">✅ Réalisé</span>';
    else if(isKo)html+='<span class="badge badge-ko">🔴 Bloqué</span>';
    else html+='<span class="badge badge-todo">Non traité</span>';
    html+='</div>';
    html+='<div class="task-row">';
    html+='<div class="task-name">'+esc(plan.titre||plan.frequence||'Tâche')+'</div>';
    if(plan.frequence)html+='<div class="task-freq">'+esc(freqLabel(plan.frequence))+'</div>';

    // Checklist complétée
    if(clComp.length){
      html+='<div style="margin-bottom:10px">';
      html+='<div class="field-label" style="margin-bottom:5px">Points vérifiés ('+nbComp+'/'+nbTotal+')</div>';
      clComp.forEach(function(c,ci){
        var done,txt;
        if(typeof c==='boolean'){
          // Format booléen [true,false,...] — texte dans clDef
          done=c;
          var di=clDef[ci];
          txt=!di?('Point '+(ci+1)):typeof di==='string'?di:(di.text||di.label||di.tache||di.titre||di.nom||('Point '+(ci+1)));
        }else{
          // Format objet {done,text}
          done=!!(c&&c.done);
          txt=(c&&(c.text||c.label||c.tache||c.titre||c.nom))||('Point '+(ci+1));
        }
        html+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f1f5f9">';
        html+='<span style="font-size:14px">'+(done?'✅':'⬜')+'</span>';
        html+='<span style="font-size:12px;color:'+(done?'#94a3b8':'#374151')+';'+(done?'text-decoration:line-through':'')+'">'+esc(txt)+'</span>';
        html+='</div>';
      });
      html+='</div>';
    } else if(clDef.length){
      // Checklist définie sur le plan mais pas de résultats sauvegardés
      html+='<div style="margin-bottom:10px">';
      html+='<div class="field-label" style="margin-bottom:5px">Points à vérifier</div>';
      clDef.forEach(function(item){
        html+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f1f5f9">';
        html+='<span style="font-size:14px">⬜</span>';
        html+='<span style="font-size:12px;color:#374151">'+esc(typeof item==='string'?item:(item.label||item.text||item.tache||item.titre||item.nom||''))+'</span>';
        html+='</div>';
      });
      html+='</div>';
    }

    if(mp.motif_blocage&&isKo){
      html+='<div style="background:#fef2f2;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12px;color:#dc2626"><strong>Motif :</strong> '+esc(mp.motif_blocage)+'</div>';
    }
    if(mp.commentaire){
      html+='<div style="background:#f8fafc;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12px;color:#374151">'+esc(mp.commentaire)+'</div>';
    }
    if(mp.recommandation){
      html+='<div style="background:#eff6ff;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12px;color:#1e40af"><strong>💡 Recommandation :</strong> '+esc(mp.recommandation)+'</div>';
    }
    if(mp.photo_url){
      html+='<div style="margin-top:6px"><img src="'+esc(mp.photo_url)+'" style="width:100%;max-width:280px;border-radius:10px;border:1px solid #e2e8f0"/></div>';
    }
    html+='</div></div>';
  });

  // Bouton WA — seulement si ouvert par le tech (resp_tel présent dans l'URL)
  if(_respTel){
    // Construire le message résumé depuis les données chargées
    var eqNomWa=(_mission.equipements&&_mission.equipements.nom)||'Équipement';
    var siteNomWa=(_mission.sites&&_mission.sites.nom)||'';
    var lines=['📋 Rapport mission · '+eqNomWa+(siteNomWa?' ('+siteNomWa+')':'')];
    lines.push('Tech: '+(_mission.technicien_nom||'—'));
    lines.push('Date: '+new Date(_mission.completed_at||Date.now()).toLocaleDateString('fr-FR'));
    lines.push('');
    _missionPlans.forEach(function(mp,idx){
      var plan=mp.plans_maintenance||{};
      var ico=mp.statut==='realise'?'✅':mp.statut==='bloque'?'🔴':'⬜';
      lines.push(ico+' '+(plan.titre||'Tâche '+(idx+1)));
      if(mp.statut==='bloque'&&mp.motif_blocage)lines.push('   Motif: '+mp.motif_blocage);
      if(mp.commentaire)lines.push('   '+mp.commentaire);
    });
    var waMsg=lines.join('\n');
    var telClean=_respTel.replace(/^\+/,'').replace(/\s+/g,'');
    var waUrl='https://wa.me/'+telClean+'?text='+encodeURIComponent(waMsg);
    html+='<a href="'+waUrl+'" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;margin-bottom:16px;padding:14px;background:#22c55e;color:white;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none">'+
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.374 0 0 5.373 0 12c0 2.136.564 4.133 1.546 5.861L0 24l6.336-1.521A11.914 11.914 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.797 9.797 0 01-5.023-1.381l-.36-.214-3.729.896.927-3.635-.236-.374A9.771 9.771 0 012.182 12C2.182 6.577 6.577 2.182 12 2.182S21.818 6.577 21.818 12 17.423 21.818 12 21.818z"/></svg>'+
      ' Envoyer au responsable</a>';
  }
  app.innerHTML=html;
}

function renderSuccess(){
  document.getElementById('hdr-sub').textContent='Mission soumise';
  // Toujours afficher le bouton — si pas de numéro, wa.me sans destinataire ouvre le sélecteur de contact
  var telClean=_respTel?_respTel.replace(/^\+/,'').replace(/\s+/g,''):'';
  var waUrl='https://wa.me/'+(telClean?telClean:'')+'?text='+encodeURIComponent(_waRapportMsg||'Mission terminée.');
  var waBtn='<a href="'+waUrl+'" target="_blank" style="display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:13px 24px;background:#22c55e;color:white;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none">'+
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.374 0 0 5.373 0 12c0 2.136.564 4.133 1.546 5.861L0 24l6.336-1.521A11.914 11.914 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.797 9.797 0 01-5.023-1.381l-.36-.214-3.729.896.927-3.635-.236-.374A9.771 9.771 0 012.182 12C2.182 6.577 6.577 2.182 12 2.182S21.818 6.577 21.818 12 17.423 21.818 12 21.818z"/></svg>'+
    ' Envoyer le rapport au responsable</a>';
  document.getElementById('app').innerHTML=
    '<div class="success-screen">'+
      '<div class="success-icon">✅</div>'+
      '<div class="success-title">Mission soumise !</div>'+
      '<div class="success-sub">Vos données ont bien été enregistrées.</div>'+
      waBtn+
    '</div>';
}
function renderError(msg){
  document.getElementById('app').innerHTML='<div class="error-box">'+esc(msg)+'</div>';
}

init();
</script>
