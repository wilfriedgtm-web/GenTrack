<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>GenTrack · Suivi de demande</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --dark:#12151E;--dark2:#1E2332;
  --text:#1A1D28;--text2:#5A5F78;--text3:#9AA0B8;
  --border:#E4E6EF;--bg:#F4F5FA;--white:#FFFFFF;
  --amber:#E8A020;--amber-pale:#FFF6E0;--amber-border:#F5D080;--amber-dark:#B87A10;
  --vert:#1B7A4A;--vert-pale:#E8F7EE;--vert-border:#A8DEC0;--vert-text:#155F39;
  --rouge:#C0392B;--rouge-pale:#FDF0EE;--rouge-border:#F0B8B2;--rouge-text:#9B2D22;
  --orange:#D46B0A;--orange-pale:#FEF3E5;--orange-border:#F5C87A;
}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;color:var(--text);min-height:100vh}
.sv-header{background:linear-gradient(145deg,var(--dark) 0%,var(--dark2) 100%);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 22px;box-shadow:0 2px 20px rgba(0,0,0,.25)}
.sv-logo{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--amber);text-transform:uppercase;margin-bottom:14px}
.sv-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:4px}
.sv-ref{font-size:13px;color:rgba(255,255,255,.55)}
.sv-body{padding:20px 16px;max-width:480px;margin:0 auto}
.sv-card{background:var(--white);border-radius:16px;padding:18px 16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(18,21,30,.07)}
.sv-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px}
.sv-value{font-size:15px;font-weight:500;color:var(--text);line-height:1.5}
.sv-status-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:800}
.sv-status-badge.ouvert{background:var(--orange-pale);border:1.5px solid var(--orange-border);color:var(--orange)}
.sv-status-badge.en_cours{background:var(--amber-pale);border:1.5px solid var(--amber-border);color:var(--amber-dark)}
.sv-status-badge.resolu{background:var(--vert-pale);border:1.5px solid var(--vert-border);color:var(--vert-text)}
.sv-timeline{display:flex;flex-direction:column;gap:0}
.sv-step{display:flex;gap:14px;padding-bottom:16px;position:relative}
.sv-step:last-child{padding-bottom:0}
.sv-step::before{content:'';position:absolute;left:10px;top:24px;bottom:0;width:2px;background:var(--border)}
.sv-step:last-child::before{display:none}
.sv-step-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px;z-index:1}
.sv-step-dot.done{background:var(--vert);color:#fff}
.sv-step-dot.active{background:var(--amber);color:#fff}
.sv-step-dot.pending{background:var(--border);color:var(--text3)}
.sv-step-text{flex:1}
.sv-step-label{font-size:13px;font-weight:700;color:var(--text)}
.sv-step-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sv-state{display:flex;flex-direction:column;align-items:center;padding:60px 24px;text-align:center}
.sv-state-emoji{font-size:48px;margin-bottom:16px}
.sv-state-title{font-size:20px;font-weight:800;margin-bottom:8px}
.sv-state-sub{font-size:14px;color:var(--text2);line-height:1.5}
.sv-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="sv-header">
  <div class="sv-logo">GenTrack ✦</div>
  <div class="sv-title">📋 Suivi de demande</div>
  <div class="sv-ref" id="sv-ref-hdr">Chargement…</div>
</div>
<div id="sv-app"><div class="sv-state"><div class="sv-spinner"></div><div style="font-size:14px;color:var(--text2)">Chargement…</div></div></div>

<script>
var SUPA_URL='https://zbpoxjlkqxnqjzxohasq.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicG94amxrcXhucWp6eG9oYXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjM3ODAsImV4cCI6MjA5NzA5OTc4MH0.9-QyWgon93jGDo5QKMIh_-QbQZ_P9rQrYJnVxegJe7M';

function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function fmtDate(d){
  if(!d)return '—';
  return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

var STATUS_LABELS={ouvert:'En attente',en_cours:'En cours de traitement',resolu:'Résolu ✓'};
var STATUS_EMOJIS={ouvert:'🕐',en_cours:'🔧',resolu:'✅'};

async function init(){
  var params=new URLSearchParams(location.search);
  var ref=params.get('ref');
  if(!ref){
    document.getElementById('sv-app').innerHTML='<div class="sv-state"><div class="sv-state-emoji">⚠️</div><div class="sv-state-title">Lien invalide</div><div class="sv-state-sub">Ce lien de suivi n\'est pas valide.</div></div>';
    return;
  }

  document.getElementById('sv-ref-hdr').textContent='Réf. '+ref;

  var r=await fetch(SUPA_URL+'/rest/v1/signalements?ref_code=eq.'+encodeURIComponent(ref)+'&select=id,ref_code,statut,type,description,lieu,signale_par,created_at,resolved_at,note_resolution,resolved_by,zones(nom)&limit=1',{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  });

  var rows=await r.json();
  var sg=Array.isArray(rows)?rows[0]:null;

  if(!sg){
    document.getElementById('sv-app').innerHTML='<div class="sv-state"><div class="sv-state-emoji">🔍</div><div class="sv-state-title">Demande introuvable</div><div class="sv-state-sub">La référence <strong>'+h(ref)+'</strong> ne correspond à aucune demande.<br>Vérifiez le lien reçu.</div></div>';
    return;
  }

  var st=sg.statut||'ouvert';
  var stLabel=STATUS_LABELS[st]||st;
  var stEmoji=STATUS_EMOJIS[st]||'📋';
  var zoneName=sg.zones&&sg.zones.nom?sg.zones.nom:null;
  var lieuFinal=[zoneName,sg.lieu].filter(Boolean).join(' — ');

  var typeLabels={panne:'⚡ Panne',anomalie:'👁 Anomalie visuelle',bruit:'🔊 Bruit anormal',odeur:'💨 Odeur suspecte',fuite:'💧 Fuite',autre:'📝 Autre',anomalie_zone:'⚠️ Anomalie zone'};
  var typeLabel=typeLabels[sg.type]||sg.type||'Signalement';

  // Timeline steps
  var steps=[
    {label:'Demande reçue',sub:fmtDate(sg.created_at),state:'done'},
    {label:'Prise en charge',sub:st==='ouvert'?'En attente…':'',state:st==='ouvert'?'pending':'done'},
    {label:'Résolution',sub:sg.resolved_at?fmtDate(sg.resolved_at):(st==='resolu'?'':st==='en_cours'?'En cours…':'En attente…'),state:st==='resolu'?'done':st==='en_cours'?'active':'pending'}
  ];

  var stepsHtml=steps.map(function(s){
    return '<div class="sv-step">'+
      '<div class="sv-step-dot '+s.state+'">'+(s.state==='done'?'✓':s.state==='active'?'●':'○')+'</div>'+
      '<div class="sv-step-text">'+
        '<div class="sv-step-label">'+h(s.label)+'</div>'+
        (s.sub?'<div class="sv-step-sub">'+h(s.sub)+'</div>':'')+
      '</div>'+
    '</div>';
  }).join('');

  var html=
    '<div class="sv-body">'+

      '<div class="sv-card">'+
        '<div class="sv-label">Statut</div>'+
        '<div class="sv-status-badge '+st+'">'+stEmoji+' '+h(stLabel)+'</div>'+
      '</div>'+

      '<div class="sv-card">'+
        '<div class="sv-label">Votre demande</div>'+
        '<div class="sv-value">'+h(typeLabel)+(lieuFinal?'<br><span style="font-size:12px;color:var(--text3)">📍 '+h(lieuFinal)+'</span>':'')+'</div>'+
        '<div style="margin-top:10px;font-size:13px;color:var(--text2);line-height:1.5">'+h(sg.description||'')+'</div>'+
        (sg.signale_par?'<div style="margin-top:8px;font-size:11px;color:var(--text3)">Par '+h(sg.signale_par)+' · '+fmtDate(sg.created_at)+'</div>':'')+
      '</div>'+

      '<div class="sv-card">'+
        '<div class="sv-label">Avancement</div>'+
        '<div class="sv-timeline">'+stepsHtml+'</div>'+
      '</div>'+

      (sg.note_resolution?
        '<div class="sv-card" style="border:1.5px solid var(--vert-border);background:var(--vert-pale)">'+
          '<div class="sv-label" style="color:var(--vert-text)">Note de résolution</div>'+
          '<div class="sv-value" style="color:var(--vert-text)">'+h(sg.note_resolution)+'</div>'+
          (sg.resolved_by?'<div style="margin-top:6px;font-size:11px;color:var(--vert)">Résolu par '+h(sg.resolved_by)+(sg.resolved_at?' · '+fmtDate(sg.resolved_at):'')+'</div>':'')+
        '</div>':'')

    +'</div>';

  document.getElementById('sv-app').innerHTML=html;
}

init();
</script>
</body>
</html>
